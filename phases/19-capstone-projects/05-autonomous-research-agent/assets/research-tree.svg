<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#555;stroke-width:1.2;fill:none}</style></defs><text x="480" y="24" class="title" text-anchor="middle">autonomous research agent — best-first experiment tree</text><rect width="640" height="460" x="40" y="50" class="box"/><text x="360" y="72" class="head" text-anchor="middle">tree search (budget $30)</text><rect width="120" height="38" x="300" y="92" class="cool"/><text x="360" y="114" class="step" text-anchor="middle">seed / root</text><text x="360" y="126" class="small" text-anchor="middle">hypothesis + config</text><rect width="120" height="38" x="80" y="170" class="cold"/><text x="140" y="192" class="step" text-anchor="middle">sp top-4</text><rect width="120" height="38" x="220" y="170" class="cold"/><text x="280" y="192" class="step" text-anchor="middle">sp top-8 (*)</text><rect width="120" height="38" x="360" y="170" class="cold"/><text x="420" y="192" class="step" text-anchor="middle">sp top-16</text><rect width="120" height="38" x="500" y="170" class="cold"/><text x="560" y="192" class="step" text-anchor="middle">lr=3e-4</text><path d="M360,130 L140,170" class="edge"/><path d="M360,130 L280,170" class="edge"/><path d="M360,130 L420,170" class="edge"/><path d="M360,130 L560,170" class="edge"/><rect width="120" height="38" x="220" y="240" class="dsk"/><text x="280" y="262" class="step" text-anchor="middle">sp8 + lr=1e-3</text><rect width="120" height="38" x="360" y="240" class="dsk"/><text x="420" y="262" class="step" text-anchor="middle">sp8 + dropout</text><rect width="120" height="38" x="500" y="240" class="dsk"/><text x="560" y="262" class="step" text-anchor="middle">sp8 + layer-drop</text><path d="M280,208 L280,240" class="edge"/><path d="M280,208 L420,240" class="edge"/><path d="M280,208 L560,240" class="edge"/><rect width="120" height="38" x="360" y="310" class="hot"/><text x="420" y="332" class="step" text-anchor="middle">chosen branch</text><text x="420" y="344" class="small" text-anchor="middle">novelty x quality</text><path d="M420,278 L420,310" class="edge"/><text x="80" y="398" class="small">expand() proposes k children by small-edit variation</text><text x="80" y="416" class="small">each child runs in a sandboxed container:</text><text x="80" y="432" class="small">docker run --network=none --memory=8g --cpus=2 --read-only</text><text x="80" y="450" class="small">verify() checks: loss converged? baselines ran? seed set?</text><text x="80" y="468" class="small">score() = 0.4*novelty + 0.5*quality + 0.1*remaining_budget</text><text x="80" y="486" class="small">frontier is a max-heap; pop highest score each step</text><rect width="220" height="230" x="700" y="50" class="box"/><text x="810" y="72" class="head" text-anchor="middle">writer loop</text><rect width="180" height="34" x="720" y="90" class="cool"/><text x="810" y="110" class="step" text-anchor="middle">LaTeX draft v1</text><rect width="180" height="34" x="720" y="130" class="hot"/><text x="810" y="150" class="step" text-anchor="middle">vision critique</text><text x="810" y="168" class="small" text-anchor="middle">Opus 4.7 reads PDF</text><rect width="180" height="34" x="720" y="180" class="cool"/><text x="810" y="200" class="step" text-anchor="middle">draft v2, v3...</text><rect width="180" height="34" x="720" y="220" class="dsk"/><text x="810" y="240" class="step" text-anchor="middle">reviewer ensemble</text><text x="810" y="258" class="small" text-anchor="middle">5 judges, NeurIPS rubric</text><rect width="220" height="212" x="700" y="298" class="box"/><text x="810" y="318" class="head" text-anchor="middle">safety</text><text x="810" y="340" class="small" text-anchor="middle">sandbox per experiment</text><text x="810" y="356" class="small" text-anchor="middle">no network egress</text><text x="810" y="372" class="small" text-anchor="middle">bounded wall-clock</text><text x="810" y="388" class="small" text-anchor="middle">deterministic seeds</text><text x="810" y="406" class="small" text-anchor="middle">cgroup memory + pids caps</text><text x="810" y="424" class="small" text-anchor="middle">$30 hard budget / paper</text><text x="810" y="442" class="small" text-anchor="middle">red-team: fork bombs,</text><text x="810" y="458" class="small" text-anchor="middle">filesystem escape,</text><text x="810" y="474" class="small" text-anchor="middle">LLM shell-metachar injection</text><text x="810" y="498" class="caption" text-anchor="middle">Sakana v2 documented attack surface</text></svg>