<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">code RAG — hybrid retrieval with AST chunking + rerank</text><rect width="230" height="460" x="40" y="50" class="box"/><text x="155" y="72" class="head" text-anchor="middle">ingest</text><rect width="190" height="44" x="60" y="90" class="cool"/><text x="155" y="108" class="step" text-anchor="middle">git push webhook</text><text x="155" y="124" class="small" text-anchor="middle">diff changed files</text><rect width="190" height="44" x="60" y="148" class="cool"/><text x="155" y="166" class="step" text-anchor="middle">tree-sitter parse</text><text x="155" y="182" class="small" text-anchor="middle">17 language grammars</text><rect width="190" height="44" x="60" y="206" class="cool"/><text x="155" y="224" class="step" text-anchor="middle">function/class chunk</text><text x="155" y="240" class="small" text-anchor="middle">AST node boundaries</text><rect width="190" height="44" x="60" y="264" class="dsk"/><text x="155" y="282" class="step" text-anchor="middle">LLM summary</text><text x="155" y="298" class="small" text-anchor="middle">Haiku 4.5 prompt cache</text><rect width="190" height="44" x="60" y="322" class="cold"/><text x="155" y="340" class="step" text-anchor="middle">symbol graph edges</text><text x="155" y="356" class="small" text-anchor="middle">imports / calls (kuzu)</text><rect width="190" height="100" x="60" y="380" class="box"/><text x="155" y="402" class="small" text-anchor="middle">incremental:</text><text x="155" y="420" class="small" text-anchor="middle">re-embed only changed</text><text x="155" y="438" class="small" text-anchor="middle">chunks; push-to-search</text><text x="155" y="456" class="small" text-anchor="middle">&lt; 60s on 2M LOC fleet</text><rect width="310" height="230" x="300" y="50" class="box"/><text x="455" y="72" class="head" text-anchor="middle">indexes</text><rect width="130" height="80" x="320" y="90" class="cool"/><text x="385" y="110" class="step" text-anchor="middle">dense</text><text x="385" y="128" class="small" text-anchor="middle">Voyage-code-3</text><text x="385" y="144" class="small" text-anchor="middle">Qdrant 1.12 hybrid</text><text x="385" y="160" class="small" text-anchor="middle">payload: repo+span</text><rect width="130" height="80" x="460" y="90" class="hot"/><text x="525" y="110" class="step" text-anchor="middle">BM25</text><text x="525" y="128" class="small" text-anchor="middle">Tantivy (Rust)</text><text x="525" y="144" class="small" text-anchor="middle">field-weighted</text><text x="525" y="160" class="small" text-anchor="middle">symbol x4 / body x1</text><rect width="270" height="90" x="320" y="182" class="cold"/><text x="455" y="200" class="step" text-anchor="middle">symbol graph (kuzu)</text><text x="455" y="218" class="small" text-anchor="middle">import edges, call edges, inheritance</text><text x="455" y="236" class="small" text-anchor="middle">used at query-time for cross-repo expansion</text><text x="455" y="254" class="small" text-anchor="middle">&quot;symbol X from repo A used in repo B&quot;</text><rect width="310" height="214" x="300" y="296" class="box"/><text x="455" y="318" class="head" text-anchor="middle">query (LangGraph)</text><rect width="270" height="36" x="320" y="336" class="cool"/><text x="455" y="358" class="step" text-anchor="middle">retrieve: dense || BM25 top-10</text><rect width="270" height="36" x="320" y="378" class="hot"/><text x="455" y="400" class="step" text-anchor="middle">fuse: reciprocal rank fusion</text><rect width="270" height="36" x="320" y="420" class="dsk"/><text x="455" y="442" class="step" text-anchor="middle">rerank: cross-encoder top-5</text><rect width="270" height="36" x="320" y="462" class="cold"/><text x="455" y="484" class="step" text-anchor="middle">synth: Claude Sonnet 4.7 1M</text><rect width="280" height="460" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">answer gate</text><rect width="240" height="44" x="660" y="90" class="cool"/><text x="780" y="108" class="step" text-anchor="middle">citation parse</text><text x="780" y="124" class="small" text-anchor="middle">(repo/path:start-end) anchors</text><rect width="240" height="44" x="660" y="148" class="hot"/><text x="780" y="166" class="step" text-anchor="middle">reject uncited claims</text><text x="780" y="182" class="small" text-anchor="middle">re-ask or drop</text><rect width="240" height="44" x="660" y="206" class="cold"/><text x="780" y="224" class="step" text-anchor="middle">prompt cache</text><text x="780" y="240" class="small" text-anchor="middle">system + reranked context</text><rect width="240" height="240" x="660" y="264" class="box"/><text x="780" y="286" class="head" text-anchor="middle">eval</text><text x="780" y="306" class="small" text-anchor="middle">100 labeled cross-repo Qs</text><text x="780" y="324" class="small" text-anchor="middle">MRR@10, nDCG@10</text><text x="780" y="342" class="small" text-anchor="middle">citation faithfulness rate</text><text x="780" y="360" class="small" text-anchor="middle">p50 &lt; 1.5s, p99 &lt; 4s</text><text x="780" y="378" class="small" text-anchor="middle">10k QPS index size</text><text x="780" y="400" class="small" text-anchor="middle">incremental push-to-search &lt; 60s</text><text x="780" y="428" class="small" text-anchor="middle">weekly drift rerun</text><text x="780" y="446" class="small" text-anchor="middle">alert MRR drop &gt; 5%</text><text x="780" y="476" class="caption" text-anchor="middle">2M LOC, 10 repos target</text></svg>