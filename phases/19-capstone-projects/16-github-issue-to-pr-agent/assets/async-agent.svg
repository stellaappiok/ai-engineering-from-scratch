<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#555;stroke-width:1.2;fill:none}</style></defs><text x="480" y="24" class="title" text-anchor="middle">async cloud coding agent — label to PR workflow</text><rect width="190" height="80" x="40" y="60" class="cool"/><text x="135" y="82" class="step" text-anchor="middle">GitHub issue label</text><text x="135" y="100" class="small" text-anchor="middle">@agent fix this</text><text x="135" y="118" class="small" text-anchor="middle">PR comment trigger</text><rect width="190" height="80" x="260" y="60" class="cold"/><text x="355" y="82" class="step" text-anchor="middle">webhook receiver</text><text x="355" y="100" class="small" text-anchor="middle">Lambda / Fly.io</text><text x="355" y="118" class="small" text-anchor="middle">enqueue to SQS</text><rect width="190" height="80" x="480" y="60" class="dsk"/><text x="575" y="82" class="step" text-anchor="middle">dispatcher</text><text x="575" y="100" class="small" text-anchor="middle">budget ledger</text><text x="575" y="118" class="small" text-anchor="middle">per-repo caps</text><rect width="220" height="80" x="700" y="60" class="hot"/><text x="810" y="82" class="step" text-anchor="middle">ECS Fargate task</text><text x="810" y="100" class="small" text-anchor="middle">Daytona sandbox</text><text x="810" y="118" class="small" text-anchor="middle">per-task isolation</text><path d="M230,100 L260,100" class="edge"/><path d="M450,100 L480,100" class="edge"/><path d="M670,100 L700,100" class="edge"/><rect width="880" height="200" x="40" y="170" class="box"/><text x="480" y="192" class="head" text-anchor="middle">sandbox state machine</text><rect width="140" height="46" x="60" y="208" class="cool"/><text x="130" y="228" class="step" text-anchor="middle">CLONE</text><text x="130" y="244" class="small" text-anchor="middle">fine-grained token</text><rect width="140" height="46" x="220" y="208" class="cool"/><text x="290" y="228" class="step" text-anchor="middle">INFER</text><text x="290" y="244" class="small" text-anchor="middle">Dockerfile synth</text><rect width="180" height="46" x="380" y="208" class="dsk"/><text x="470" y="228" class="step" text-anchor="middle">AGENT loop</text><text x="470" y="244" class="small" text-anchor="middle">mini-swe-agent + Opus 4.7</text><rect width="140" height="46" x="580" y="208" class="hot"/><text x="650" y="228" class="step" text-anchor="middle">VERIFY</text><text x="650" y="244" class="small" text-anchor="middle">CI + coverage delta</text><rect width="160" height="46" x="740" y="208" class="cool"/><text x="820" y="228" class="step" text-anchor="middle">PR open</text><text x="820" y="244" class="small" text-anchor="middle">label: needs-review</text><path d="M200,230 L220,230" class="edge"/><path d="M360,230 L380,230" class="edge"/><path d="M560,230 L580,230" class="edge"/><path d="M720,230 L740,230" class="edge"/><text x="80" y="296" class="small">budget caps enforced per task:</text><text x="80" y="314" class="small">$20 / turn cap 30 / 30 min wall-clock</text><text x="80" y="332" class="small">coverage delta &lt; -2% -&gt; label `needs-review` but still open PR</text><text x="80" y="350" class="small">CI red or cap hit -&gt; no PR, failure log with rationale</text><rect width="440" height="120" x="40" y="390" class="box"/><text x="260" y="412" class="head" text-anchor="middle">safety</text><text x="260" y="432" class="small" text-anchor="middle">GitHub App: fine-grained token, expires 1h</text><text x="260" y="450" class="small" text-anchor="middle">no force-push, no write on main</text><text x="260" y="468" class="small" text-anchor="middle">branch protection on main enforced</text><text x="260" y="486" class="small" text-anchor="middle">log scrub for secrets before archival</text><text x="260" y="504" class="caption" text-anchor="middle">per-repo daily $ + PR count ceilings</text><rect width="420" height="120" x="500" y="390" class="box"/><text x="710" y="412" class="head" text-anchor="middle">compare-vs-hosted</text><text x="710" y="432" class="small" text-anchor="middle">30 seeded internal issues</text><text x="710" y="450" class="small" text-anchor="middle">pass@1 / $ / latency vs:</text><text x="710" y="468" class="small" text-anchor="middle">Cursor Background Agents</text><text x="710" y="486" class="small" text-anchor="middle">AWS Remote SWE Agents</text><text x="710" y="504" class="caption" text-anchor="middle">publish side-by-side matrix</text></svg>