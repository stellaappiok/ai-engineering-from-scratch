<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">layered safety harness + red-team range</text><rect width="560" height="460" x="40" y="50" class="box"/><text x="320" y="72" class="head" text-anchor="middle">defense in depth (5 layers)</text><rect width="520" height="40" x="60" y="90" class="cool"/><text x="320" y="114" class="step" text-anchor="middle">1 / input sanitize</text><text x="320" y="128" class="small" text-anchor="middle">strip zero-widths, decode base64/rot13, normalize</text><rect width="520" height="40" x="60" y="140" class="cool"/><text x="320" y="164" class="step" text-anchor="middle">2 / NeMo Guardrails rails</text><text x="320" y="178" class="small" text-anchor="middle">off-domain, role, policy-forbidden</text><rect width="520" height="40" x="60" y="190" class="hot"/><text x="320" y="214" class="step" text-anchor="middle">3 / classifier gate</text><text x="320" y="228" class="small" text-anchor="middle">Llama Guard 4 + X-Guard + ShieldGemma-2 + Nemotron 3</text><rect width="520" height="40" x="60" y="240" class="dsk"/><text x="320" y="264" class="step" text-anchor="middle">4 / target model</text><text x="320" y="278" class="small" text-anchor="middle">the application being protected</text><rect width="520" height="40" x="60" y="290" class="hot"/><text x="320" y="314" class="step" text-anchor="middle">5 / output filter</text><text x="320" y="328" class="small" text-anchor="middle">Llama Guard 4 + Presidio PII + citation check</text><rect width="520" height="40" x="60" y="340" class="cold"/><text x="320" y="364" class="step" text-anchor="middle">6 / HITL tier</text><text x="320" y="378" class="small" text-anchor="middle">flagged outputs -&gt; Slack queue</text><text x="320" y="420" class="small" text-anchor="middle">every layer emits a span;</text><text x="320" y="438" class="small" text-anchor="middle">block at any layer halts and attributes</text><text x="320" y="456" class="small" text-anchor="middle">XSTest benign rate measured continuously</text><text x="320" y="484" class="caption" text-anchor="middle">over-refusal vs jailbreak: the Pareto curve</text><rect width="280" height="220" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">red-team range</text><rect width="240" height="30" x="660" y="90" class="hot"/><text x="780" y="110" class="step" text-anchor="middle">PAIR + TAP autonomous</text><rect width="240" height="30" x="660" y="124" class="hot"/><text x="780" y="144" class="step" text-anchor="middle">GCG suffix</text><rect width="240" height="30" x="660" y="158" class="hot"/><text x="780" y="178" class="step" text-anchor="middle">encoding (ASCII / base64)</text><rect width="240" height="30" x="660" y="192" class="hot"/><text x="780" y="212" class="step" text-anchor="middle">multi-turn persona</text><rect width="240" height="30" x="660" y="226" class="hot"/><text x="780" y="246" class="step" text-anchor="middle">code-switch multilingual</text><rect width="280" height="220" x="640" y="290" class="box"/><text x="780" y="312" class="head" text-anchor="middle">outputs</text><text x="780" y="334" class="small" text-anchor="middle">CVSS 4.0 per finding</text><text x="780" y="352" class="small" text-anchor="middle">disclosure timeline</text><text x="780" y="370" class="small" text-anchor="middle">before / after harmlessness delta</text><text x="780" y="388" class="small" text-anchor="middle">per-family success rate</text><text x="780" y="406" class="small" text-anchor="middle">XSTest benign pass rate trend</text><text x="780" y="424" class="small" text-anchor="middle">constitutional self-critique run</text><text x="780" y="442" class="small" text-anchor="middle">cron scheduler + Slack alerts</text><text x="780" y="472" class="caption" text-anchor="middle">garak + PyRIT + NVIDIA Aegis shape</text></svg>