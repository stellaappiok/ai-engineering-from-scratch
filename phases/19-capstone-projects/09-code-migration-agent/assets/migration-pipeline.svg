<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#555;stroke-width:1.2;fill:none}</style></defs><text x="480" y="24" class="title" text-anchor="middle">migration pipeline — deterministic recipes + agent fallback</text><rect width="220" height="100" x="40" y="60" class="cool"/><text x="150" y="86" class="step" text-anchor="middle">deterministic pass</text><text x="150" y="106" class="small" text-anchor="middle">OpenRewrite (Java)</text><text x="150" y="122" class="small" text-anchor="middle">libcst (Python)</text><text x="150" y="142" class="small" text-anchor="middle">70-80% of rewrites</text><rect width="220" height="100" x="300" y="60" class="cold"/><text x="410" y="86" class="step" text-anchor="middle">Daytona sandbox</text><text x="410" y="106" class="small" text-anchor="middle">target runtime preinstalled</text><text x="410" y="122" class="small" text-anchor="middle">branch-scoped, read-only input</text><text x="410" y="142" class="small" text-anchor="middle">per-branch build</text><rect width="360" height="100" x="560" y="60" class="dsk"/><text x="740" y="86" class="step" text-anchor="middle">agent loop</text><text x="740" y="106" class="small" text-anchor="middle">Claude Opus 4.7 + GPT-5.4-Codex</text><text x="740" y="122" class="small" text-anchor="middle">classify failure -&gt; patch -&gt; rerun</text><text x="740" y="142" class="small" text-anchor="middle">budget: 30min / $8 / 20 turns</text><path d="M260,110 L300,110" class="edge"/><path d="M520,110 L560,110" class="edge"/><rect width="440" height="310" x="40" y="200" class="box"/><text x="260" y="222" class="head" text-anchor="middle">failure taxonomy (across 50 repos)</text><rect width="400" height="28" x="60" y="244" class="hot"/><text x="80" y="263" class="small">dep_upgrade_required 30%</text><rect width="400" height="28" x="60" y="276" class="hot"/><text x="80" y="295" class="small">build_tool_drift 20%</text><rect width="400" height="28" x="60" y="308" class="hot"/><text x="80" y="327" class="small">custom_annotation 18%</text><rect width="400" height="28" x="60" y="340" class="cool"/><text x="80" y="359" class="small">syntax_edge_case 17%</text><rect width="400" height="28" x="60" y="372" class="cool"/><text x="80" y="391" class="small">test_flake 15%</text><rect width="400" height="90" x="60" y="410" class="box"/><text x="260" y="432" class="head" text-anchor="middle">what the taxonomy unlocks</text><text x="260" y="452" class="small" text-anchor="middle">top 3 classes become the next recipe target</text><text x="260" y="470" class="small" text-anchor="middle">agent stops relearning mechanical patterns</text><text x="260" y="488" class="small" text-anchor="middle">per-class pass rate drives Moderne-style policy</text><rect width="410" height="310" x="510" y="200" class="box"/><text x="715" y="222" class="head" text-anchor="middle">metrics (pass set)</text><rect width="380" height="32" x="530" y="244" class="cool"/><text x="720" y="265" class="step" text-anchor="middle">MigrationBench pass@1: 60-70% target</text><rect width="380" height="32" x="530" y="284" class="cool"/><text x="720" y="305" class="step" text-anchor="middle">mean $/repo: $2-4 at 50-repo scale</text><rect width="380" height="32" x="530" y="324" class="cool"/><text x="720" y="345" class="step" text-anchor="middle">coverage delta: within +/- 1% of base</text><rect width="380" height="32" x="530" y="364" class="cool"/><text x="720" y="385" class="step" text-anchor="middle">time-to-green p50: &lt; 10 min</text><rect width="380" height="96" x="530" y="404" class="dsk"/><text x="720" y="426" class="head" text-anchor="middle">compare-to-baseline</text><text x="720" y="446" class="small" text-anchor="middle">deterministic-only: 35-45% pass rate</text><text x="720" y="464" class="small" text-anchor="middle">the agent layer is where the delta lives</text><text x="720" y="486" class="caption" text-anchor="middle">publish side-by-side, by failure class</text></svg>