<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">MCP 2026 — StreamableHTTP + scopes + OPA + registry</text><rect width="260" height="80" x="40" y="50" class="cool"/><text x="170" y="72" class="head" text-anchor="middle">MCP clients</text><text x="170" y="94" class="small" text-anchor="middle">Claude Code, Cursor 3, Amp,</text><text x="170" y="112" class="small" text-anchor="middle">OpenCode, Gemini CLI</text><rect width="260" height="80" x="340" y="50" class="dsk"/><text x="470" y="72" class="head" text-anchor="middle">StreamableHTTP</text><text x="470" y="94" class="small" text-anchor="middle">JSON-RPC + streaming</text><text x="470" y="112" class="small" text-anchor="middle">stateless, horizontally scalable</text><rect width="280" height="80" x="640" y="50" class="cold"/><text x="780" y="72" class="head" text-anchor="middle">OAuth 2.1 scopes</text><text x="780" y="94" class="small" text-anchor="middle">SPIFFE workload identity</text><text x="780" y="112" class="small" text-anchor="middle">per-tool scope enforcement</text><rect width="560" height="200" x="40" y="160" class="box"/><text x="320" y="182" class="head" text-anchor="middle">read-only MCP server (FastMCP)</text><rect width="170" height="40" x="60" y="200" class="cool"/><text x="145" y="220" class="step" text-anchor="middle">postgres.readonly</text><text x="145" y="234" class="small" text-anchor="middle">scope: postgres:query:readonly</text><rect width="170" height="40" x="240" y="200" class="cool"/><text x="325" y="220" class="step" text-anchor="middle">s3.list</text><text x="325" y="234" class="small" text-anchor="middle">scope: s3:list</text><rect width="170" height="40" x="420" y="200" class="cool"/><text x="505" y="220" class="step" text-anchor="middle">jira.search</text><text x="505" y="234" class="small" text-anchor="middle">scope: jira:read</text><rect width="530" height="40" x="60" y="252" class="cool"/><text x="325" y="272" class="step" text-anchor="middle">linear / datadog / pagerduty / github / notion / slack / salesforce</text><text x="325" y="286" class="small" text-anchor="middle">10 internal tools total</text><rect width="530" height="44" x="60" y="304" class="dsk"/><text x="325" y="326" class="step" text-anchor="middle">OPA policy decision (per call)</text><text x="325" y="342" class="small" text-anchor="middle">Rego: allowed scopes + PII redact + payload caps</text><rect width="280" height="200" x="640" y="160" class="box"/><text x="780" y="182" class="head" text-anchor="middle">destructive MCP server</text><rect width="240" height="44" x="660" y="200" class="hot"/><text x="780" y="220" class="step" text-anchor="middle">jira.create / linear.create</text><text x="780" y="234" class="small" text-anchor="middle">scope: +approved:by:human</text><rect width="240" height="44" x="660" y="254" class="hot"/><text x="780" y="274" class="step" text-anchor="middle">postgres.write</text><text x="780" y="288" class="small" text-anchor="middle">fresh Slack approval required</text><rect width="240" height="40" x="660" y="310" class="dsk"/><text x="780" y="330" class="step" text-anchor="middle">Slack approval card</text><text x="780" y="344" class="small" text-anchor="middle">elevates scope for 15 min</text><rect width="420" height="130" x="40" y="380" class="box"/><text x="250" y="402" class="head" text-anchor="middle">registry service</text><text x="250" y="422" class="small" text-anchor="middle">polls .well-known/mcp-capabilities</text><text x="250" y="440" class="small" text-anchor="middle">validates JSON Schema</text><text x="250" y="458" class="small" text-anchor="middle">UI: list / search / validate / enable</text><text x="250" y="476" class="small" text-anchor="middle">team ownership + SLO per server</text><text x="250" y="498" class="caption" text-anchor="middle">AAIF Registry spec</text><rect width="420" height="130" x="500" y="380" class="box"/><text x="710" y="402" class="head" text-anchor="middle">audit + load</text><text x="710" y="422" class="small" text-anchor="middle">per-tenant JSONL audit log</text><text x="710" y="440" class="small" text-anchor="middle">Presidio PII redaction before write</text><text x="710" y="458" class="small" text-anchor="middle">load test: 100 concurrent clients</text><text x="710" y="476" class="small" text-anchor="middle">horizontal scale via LB</text><text x="710" y="498" class="caption" text-anchor="middle">MCP conformance tests green</text></svg>