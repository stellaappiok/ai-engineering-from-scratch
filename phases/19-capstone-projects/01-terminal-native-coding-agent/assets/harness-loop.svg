<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">terminal-native coding agent — plan/act/observe loop</text><rect width="200" height="460" x="40" y="50" class="box"/><text x="140" y="72" class="head" text-anchor="middle">turn lifecycle</text><rect width="160" height="44" x="60" y="90" class="cool"/><text x="140" y="108" class="step" text-anchor="middle">plan</text><text x="140" y="126" class="small" text-anchor="middle">TodoWrite rewrite</text><rect width="160" height="44" x="60" y="148" class="hot"/><text x="140" y="166" class="step" text-anchor="middle">act</text><text x="140" y="184" class="small" text-anchor="middle">dispatch tool call</text><rect width="160" height="44" x="60" y="206" class="cold"/><text x="140" y="224" class="step" text-anchor="middle">observe</text><text x="140" y="242" class="small" text-anchor="middle">truncate + feed back</text><rect width="160" height="44" x="60" y="264" class="dsk"/><text x="140" y="282" class="step" text-anchor="middle">recover</text><text x="140" y="300" class="small" text-anchor="middle">retry / compact / stop</text><rect width="160" height="150" x="60" y="340" class="box"/><text x="140" y="360" class="head" text-anchor="middle">budgets</text><text x="140" y="382" class="small" text-anchor="middle">max_turns = 50</text><text x="140" y="400" class="small" text-anchor="middle">max_tokens = 200k</text><text x="140" y="418" class="small" text-anchor="middle">max_dollars = $5</text><text x="140" y="446" class="small" text-anchor="middle">PreCompact at 150k</text><text x="140" y="464" class="small" text-anchor="middle">Stop on any breach</text><rect width="310" height="230" x="270" y="50" class="box"/><text x="425" y="72" class="head" text-anchor="middle">tools (MCP StreamableHTTP)</text><rect width="270" height="30" x="290" y="88" class="cool"/><text x="425" y="108" class="step" text-anchor="middle">read_file / edit_file</text><rect width="270" height="30" x="290" y="124" class="cool"/><text x="425" y="144" class="step" text-anchor="middle">ripgrep / tree_sitter_symbols</text><rect width="270" height="30" x="290" y="160" class="hot"/><text x="425" y="180" class="step" text-anchor="middle">run_shell (timeout)</text><rect width="270" height="30" x="290" y="196" class="cold"/><text x="425" y="216" class="step" text-anchor="middle">git (status / diff / commit / push)</text><text x="425" y="254" class="small" text-anchor="middle">every call returns at most 4k tokens</text><text x="425" y="270" class="small" text-anchor="middle">every call runs inside the sandbox</text><rect width="310" height="216" x="270" y="294" class="box"/><text x="425" y="316" class="head" text-anchor="middle">sandbox (E2B / Daytona)</text><text x="425" y="336" class="small" text-anchor="middle">fresh devcontainer per task</text><text x="425" y="352" class="small" text-anchor="middle">git worktree add agent/TASK_ID</text><text x="425" y="368" class="small" text-anchor="middle">read-write inside tree only</text><text x="425" y="384" class="small" text-anchor="middle">no network unless allowlisted</text><rect width="270" height="40" x="290" y="398" class="dsk"/><text x="425" y="418" class="step" text-anchor="middle">worktree cleanup on Stop</text><text x="425" y="430" class="small" text-anchor="middle">success or failure, always</text><text x="425" y="464" class="small" text-anchor="middle">host filesystem stays untouched</text><text x="425" y="482" class="small" text-anchor="middle">credentials scoped by GitHub App</text><text x="425" y="500" class="small" text-anchor="middle">destructive commands blocked by hook</text><rect width="310" height="460" x="610" y="50" class="box"/><text x="765" y="72" class="head" text-anchor="middle">hook surface (2026 shape)</text><rect width="270" height="30" x="630" y="88" class="cool"/><text x="765" y="108" class="step" text-anchor="middle">SessionStart / SessionEnd</text><rect width="270" height="30" x="630" y="124" class="hot"/><text x="765" y="144" class="step" text-anchor="middle">PreToolUse / PostToolUse</text><rect width="270" height="30" x="630" y="160" class="cold"/><text x="765" y="180" class="step" text-anchor="middle">UserPromptSubmit / Notification</text><rect width="270" height="30" x="630" y="196" class="dsk"/><text x="765" y="216" class="step" text-anchor="middle">Stop / PreCompact</text><text x="765" y="256" class="small" text-anchor="middle">reference user hooks:</text><text x="765" y="274" class="small" text-anchor="middle">· destructive-command guard</text><text x="765" y="290" class="small" text-anchor="middle">· token + dollar accounting</text><text x="765" y="306" class="small" text-anchor="middle">· OTel span emitter per tool call</text><text x="765" y="322" class="small" text-anchor="middle">· trace bundle writer on Stop</text><rect width="270" height="150" x="630" y="340" class="box"/><text x="765" y="362" class="head" text-anchor="middle">observability</text><text x="765" y="384" class="small" text-anchor="middle">OpenTelemetry GenAI semconv</text><text x="765" y="402" class="small" text-anchor="middle">one span per tool call</text><text x="765" y="420" class="small" text-anchor="middle">tokens + $ attached as attributes</text><text x="765" y="438" class="small" text-anchor="middle">Langfuse self-hosted sink</text><text x="765" y="468" class="small" text-anchor="middle">trace bundle ships with PR body</text><text x="480" y="540" class="caption" text-anchor="middle">SWE-bench Pro target: pass@1 at or above mini-swe-agent baseline, under $5 per task</text></svg>