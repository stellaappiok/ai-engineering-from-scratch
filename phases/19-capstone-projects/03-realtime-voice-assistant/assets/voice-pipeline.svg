<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">voice pipeline — target p50 first-audio-out &lt; 800ms</text><rect width="880" height="90" x="40" y="50" class="box"/><text x="480" y="70" class="head" text-anchor="middle">streaming stages (all pipelined)</text><rect width="150" height="48" x="60" y="84" class="cool"/><text x="135" y="104" class="step" text-anchor="middle">audio in (WebRTC)</text><text x="135" y="122" class="small" text-anchor="middle">20ms PCM frames</text><rect width="150" height="48" x="220" y="84" class="cool"/><text x="295" y="104" class="step" text-anchor="middle">ASR streaming</text><text x="295" y="122" class="small" text-anchor="middle">Deepgram Nova-3</text><rect width="150" height="48" x="380" y="84" class="hot"/><text x="455" y="104" class="step" text-anchor="middle">VAD + turn-detect</text><text x="455" y="122" class="small" text-anchor="middle">Silero v5 + LK detector</text><rect width="150" height="48" x="540" y="84" class="cold"/><text x="615" y="104" class="step" text-anchor="middle">LLM streaming</text><text x="615" y="122" class="small" text-anchor="middle">GPT-4o-realtime</text><rect width="150" height="48" x="700" y="84" class="dsk"/><text x="775" y="104" class="step" text-anchor="middle">TTS streaming</text><text x="775" y="122" class="small" text-anchor="middle">Cartesia Sonic-2</text><rect width="880" height="180" x="40" y="160" class="box"/><text x="480" y="180" class="head" text-anchor="middle">latency budget (800ms total)</text><rect width="830" height="40" x="60" y="200" class="cool"/><text x="80" y="220" class="step">ASR partial + VAD silence detect: ~320ms</text><text x="80" y="236" class="small">Silero runs per 20ms frame; turn-detector reads partial when silence &gt;= 500ms</text><rect width="830" height="40" x="60" y="246" class="hot"/><text x="80" y="266" class="step">turn completion decision: 40ms</text><text x="80" y="282" class="small">completion score from partial transcript, threshold 0.6; else keep listening</text><rect width="830" height="40" x="60" y="292" class="cold"/><text x="80" y="312" class="step">LLM time-to-first-token: 140ms</text><text x="80" y="328" class="small">streaming completion; 1M context supported; short system prompt cached</text><rect width="830" height="40" x="60" y="338" class="dsk"/><rect width="440" height="180" x="40" y="360" class="box"/><text x="260" y="382" class="head" text-anchor="middle">barge-in arbitration</text><rect width="400" height="36" x="60" y="394" class="hot"/><text x="260" y="416" class="step" text-anchor="middle">VAD speech-on during TTS -&gt; cancel</text><text x="260" y="440" class="small" text-anchor="middle">drop remaining LLM output, clear TTS buffer</text><text x="260" y="456" class="small" text-anchor="middle">re-arm ASR for new turn</text><text x="260" y="480" class="small" text-anchor="middle">publish tts_canceled span (OpenTelemetry)</text><text x="260" y="504" class="small" text-anchor="middle">false-cutoff rate target &lt; 3%</text><text x="260" y="524" class="caption" text-anchor="middle">Hamming VAD benchmark measures this</text><rect width="420" height="180" x="500" y="360" class="box"/><text x="710" y="382" class="head" text-anchor="middle">tool side channel</text><rect width="380" height="36" x="520" y="394" class="cold"/><text x="710" y="416" class="step" text-anchor="middle">mid-conversation call (weather, calendar)</text><text x="710" y="440" class="small" text-anchor="middle">runs concurrent to LLM stream</text><text x="710" y="456" class="small" text-anchor="middle">if &gt; 300ms: emit filler &quot;one second, let me check&quot;</text><text x="710" y="480" class="small" text-anchor="middle">resume LLM on tool return, splice result into prompt</text><text x="710" y="504" class="small" text-anchor="middle">FastMCP transport, per-tool timeout</text><text x="710" y="524" class="caption" text-anchor="middle">never stall the audio stream</text></svg>