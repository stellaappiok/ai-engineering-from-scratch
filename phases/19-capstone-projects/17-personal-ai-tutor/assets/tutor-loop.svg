<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">personal AI tutor — multimodal input + learner model + safety</text><rect width="220" height="160" x="40" y="50" class="cool"/><text x="150" y="72" class="head" text-anchor="middle">multimodal input</text><rect width="180" height="30" x="60" y="90" class="cool"/><text x="150" y="110" class="step" text-anchor="middle">text (web chat)</text><rect width="180" height="30" x="60" y="126" class="cool"/><text x="150" y="146" class="step" text-anchor="middle">voice (LiveKit + Whisper)</text><rect width="180" height="30" x="60" y="162" class="cool"/><text x="150" y="182" class="step" text-anchor="middle">photo math (dots.ocr)</text><rect width="320" height="160" x="300" y="50" class="dsk"/><text x="460" y="72" class="head" text-anchor="middle">tutor policy (LangGraph)</text><rect width="280" height="28" x="320" y="90" class="cool"/><text x="460" y="110" class="step" text-anchor="middle">read signal (correct / partial / stuck)</text><rect width="280" height="28" x="320" y="124" class="cool"/><text x="460" y="144" class="step" text-anchor="middle">select next concept (graph walk)</text><rect width="280" height="28" x="320" y="158" class="cool"/><text x="460" y="178" class="step" text-anchor="middle">scaffold / hint / celebrate</text><rect width="260" height="160" x="660" y="50" class="cold"/><text x="790" y="72" class="head" text-anchor="middle">learner model</text><text x="790" y="94" class="small" text-anchor="middle">Bayesian knowledge tracing</text><text x="790" y="112" class="small" text-anchor="middle">per-concept mastery</text><text x="790" y="130" class="small" text-anchor="middle">spaced-repetition (FSRS)</text><text x="790" y="148" class="small" text-anchor="middle">update after each interaction</text><text x="790" y="166" class="small" text-anchor="middle">weekly progress report</text><text x="790" y="186" class="small" text-anchor="middle">parental dashboard</text><rect width="420" height="270" x="40" y="240" class="box"/><text x="250" y="262" class="head" text-anchor="middle">curriculum graph</text><text x="250" y="282" class="small" text-anchor="middle">Neo4j of 50-150 concepts</text><text x="250" y="300" class="small" text-anchor="middle">prerequisite edges</text><text x="250" y="318" class="small" text-anchor="middle">OER content attached</text><rect width="380" height="40" x="60" y="336" class="cool"/><text x="250" y="356" class="step" text-anchor="middle">K-12 algebra OR intro Python</text><text x="250" y="370" class="small" text-anchor="middle">pick one for depth</text><text x="250" y="396" class="small" text-anchor="middle">walk algorithm:</text><text x="250" y="414" class="small" text-anchor="middle">pick lowest-mastery concept</text><text x="250" y="432" class="small" text-anchor="middle">whose prereqs are mastered</text><text x="250" y="454" class="small" text-anchor="middle">OER sources:</text><text x="250" y="472" class="small" text-anchor="middle">OpenStax, Open Textbook,</text><text x="250" y="490" class="small" text-anchor="middle">Khan Academy lite</text><rect width="420" height="270" x="500" y="240" class="box"/><text x="710" y="262" class="head" text-anchor="middle">safety + memory</text><rect width="380" height="30" x="520" y="280" class="hot"/><text x="710" y="300" class="step" text-anchor="middle">Llama Guard 4 + age filter</text><rect width="380" height="30" x="520" y="316" class="hot"/><text x="710" y="336" class="step" text-anchor="middle">COPPA-aware retention (1y)</text><rect width="380" height="30" x="520" y="352" class="dsk"/><text x="710" y="372" class="step" text-anchor="middle">memory: episodic + semantic</text><text x="710" y="396" class="small" text-anchor="middle">parent-accessible deletion</text><text x="710" y="414" class="small" text-anchor="middle">learner-scoped isolation</text><text x="710" y="442" class="small" text-anchor="middle">efficacy study (2 weeks, 10 learners):</text><text x="710" y="460" class="small" text-anchor="middle">pre-test + 6 sessions + post-test</text><text x="710" y="478" class="small" text-anchor="middle">adaptive cohort vs linear baseline</text><text x="710" y="498" class="caption" text-anchor="middle">Khanmigo / Duolingo Max / LearnLM shape</text></svg>