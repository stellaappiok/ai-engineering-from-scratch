<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.alert,.edge{fill:none}.edge{stroke:#555;stroke-width:1.2}.alert{stroke:#c0392b;stroke-width:2;stroke-dasharray:4,2}</style></defs><text x="480" y="24" class="title" text-anchor="middle">K8s root-cause graph + HITL remediation gate</text><rect width="560" height="370" x="40" y="50" class="box"/><text x="320" y="72" class="head" text-anchor="middle">knowledge graph walk</text><rect width="140" height="34" x="260" y="100" class="hot"/><text x="330" y="122" class="step" text-anchor="middle">Deployment (alert)</text><rect width="140" height="54" x="260" y="90" fill="none" class="alert"/><rect width="130" height="34" x="100" y="170" class="cool"/><text x="165" y="192" class="step" text-anchor="middle">Prom series</text><rect width="140" height="34" x="260" y="170" class="cool"/><text x="330" y="192" class="step" text-anchor="middle">ReplicaSet</text><rect width="130" height="34" x="430" y="170" class="cool"/><text x="495" y="192" class="step" text-anchor="middle">Loki stream</text><path d="M330,134 L165,170" class="edge"/><path d="M330,134 L330,170" class="edge"/><path d="M330,134 L495,170" class="edge"/><rect width="100" height="30" x="130" y="240" class="cold"/><text x="180" y="260" class="step" text-anchor="middle">Pod 1</text><rect width="100" height="30" x="260" y="240" class="cold"/><text x="310" y="260" class="step" text-anchor="middle">Pod 2</text><rect width=