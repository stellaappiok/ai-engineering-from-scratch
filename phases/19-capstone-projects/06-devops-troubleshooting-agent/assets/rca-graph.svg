ext><text x="770" y="368" class="small" text-anchor="middle">separate token, separate RBAC</text><rect width="260" height="38" x="640" y="376" class="cool"/><text x="770" y="396" class="step" text-anchor="middle">audit log (append-only)</text><text x="770" y="414" class="small" text-anchor="middle">considered + executed + approver</text><text x="770" y="440" class="small" text-anchor="middle">read-only tools:</text><text x="770" y="456" class="small" text-anchor="middle">kubectl get/describe, promql,</text><text x="770" y="472" class="small" text-anchor="middle">logql, traceql -- no approval</text><text x="770" y="498" class="caption" text-anchor="middle">20-scenario eval target: 80% RCA</text></svg>