<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#555;stroke-width:1.2;fill:none}</style></defs><text x="480" y="24" class="title" text-anchor="middle">fine-tuning DAG — one YAML reproduces everything</text><rect width="180" height="60" x="40" y="60" class="cool"/><text x="130" y="84" class="step" text-anchor="middle">data</text><text x="130" y="102" class="small" text-anchor="middle">Datatrove dedup</text><text x="130" y="116" class="small" text-anchor="middle">Nemotron-CC + Presidio</text><rect width="180" height="60" x="260" y="60" class="hot"/><text x="350" y="84" class="step" text-anchor="middle">contamination</text><text x="350" y="102" class="small" text-anchor="middle">MinHashLSH vs</text><text x="350" y="116" class="small" text-anchor="middle">MMLU-Pro / MT-Bench</text><rect width="180" height="60" x="480" y="60" class="cool"/><text x="570" y="84" class="step" text-anchor="middle">SFT</text><text x="570" y="102" class="small" text-anchor="middle">Axolotl v0.8 + ZeRO-3</text><text x="570" y="116" class="small" text-anchor="middle">2-3 epochs 8xH100</text><rect width="180" height="60" x="700" y="60" class="cool"/><text x="790" y="84" class="step" text-anchor="middle">DPO / GRPO</text><text x="790" y="102" class="small" text-anchor="middle">TRL 0.15</text><text x="790" y="116" class="small" text-anchor="middle">1 epoch, beta sweep</text><path marker-end="url(#arrow)" d="M220,90 L260,90" class="edge"/><path marker-end="url(#arrow)" d="M440,90 L480,90" class="edge"/><path marker-end="url(#arrow)" d="M660,90 L700,90" class="edge"/><rect width="200" height="60" x="150" y="170" class="cold"/><text x="250" y="194" class="step" text-anchor="middle">quantize</text><text x="250" y="212" class="small" text-anchor="middle">GPTQ + AWQ + GGUF</text><text x="250" y="226" class="small" text-anchor="middle">Marlin INT4</text><rect width="200" height="60" x="390" y="170" class="dsk"/><text x="490" y="194" class="step" text-anchor="middle">serve</text><text x="490" y="212" class="small" text-anchor="middle">vLLM 0.7 + EAGLE-3</text><text x="490" y="226" class="small" text-anchor="middle">K8s HPA on queue-wait</text><rect width="200" height="60" x="630" y="170" class="cool"/><text x="730" y="194" class="step" text-anchor="middle">eval</text><text x="730" y="212" class="small" text-anchor="middle">lm-eval + MT-Bench v2</text><text x="730" y="226" class="small" text-anchor="middle">RewardBench-2 + MMLU-Pro</text><path marker-end="url(#arrow)" d="M790,120 L490,170" class="edge"/><path marker-end="url(#arrow)" d="M590,200 L630,200" class="edge"/><path marker-end="url(#arrow)" d="M350,200 L390,200" class="edge"/><rect width="440" height="60" x="260" y="280" class="hot"/><text x="480" y="304" class="step" text-anchor="middle">safety eval + model card</text><text x="480" y="322" class="small" text-anchor="middle">Llama Guard 4 + ShieldGemma-2 + MOF 2026 template</text><path marker-end="url(#arrow)" d="M480,230 L480,280" class="edge"/><rect width="880" height="140" x="40" y="380" class="box"/><text x="480" y="400" class="head" text-anchor="middle">content-hashed manifest + reproducibility contract</text><text x="60" y="422" class="small">every stage consumes and produces a content-hashed artifact</text><text x="60" y="440" class="small">re-running with the same YAML + seed yields identical hashes end to end</text><text x="60" y="458" class="small">one command: ./pipeline.sh config/llama3.3-8b-domainX.yaml</text><text x="60" y="476" class="small">Langfuse traces training+inference; W&amp;B run links in model card</text><text x="60" y="496" class="small">ablation table baked in: base / SFT-only / SFT+DPO / SFT+GRPO</text><text x="60" y="514" class="caption">serving target: 2.5x+ throughput vs baseline with EAGLE-3; $/1M tokens reported vs hosted APIs</text></svg>