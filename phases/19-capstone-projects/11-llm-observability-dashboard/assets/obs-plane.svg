<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">self-hosted LLM observability plane — OTel GenAI semconv</text><rect width="260" height="160" x="40" y="50" class="cool"/><text x="170" y="72" class="head" text-anchor="middle">instrumented apps</text><text x="170" y="94" class="small" text-anchor="middle">OpenAI SDK Anthropic SDK</text><text x="170" y="112" class="small" text-anchor="middle">Google GenAI LangChain</text><text x="170" y="130" class="small" text-anchor="middle">LlamaIndex vLLM</text><text x="170" y="152" class="small" text-anchor="middle">OpenLLMetry auto-instrument</text><text x="170" y="170" class="small" text-anchor="middle">OTLP HTTP -&gt; collector</text><text x="170" y="192" class="caption" text-anchor="middle">six SDK families covered</text><rect width="260" height="160" x="340" y="50" class="dsk"/><text x="470" y="72" class="head" text-anchor="middle">collector</text><text x="470" y="94" class="small" text-anchor="middle">OTLP HTTP receiver</text><text x="470" y="112" class="small" text-anchor="middle">tail-sampling processor</text><text x="470" y="130" class="small" text-anchor="middle">keep all errors</text><text x="470" y="148" class="small" text-anchor="middle">keep toxicity / PII spikes</text><text x="470" y="166" class="small" text-anchor="middle">10% stratified success sample</text><text x="470" y="184" class="small" text-anchor="middle">exporter: ClickHouse + S3</text><rect width="280" height="160" x="640" y="50" class="cold"/><text x="780" y="72" class="head" text-anchor="middle">storage</text><text x="780" y="94" class="small" text-anchor="middle">ClickHouse: spans (columnar)</text><text x="780" y="112" class="small" text-anchor="middle">Postgres: metadata</text><text x="780" y="130" class="small" text-anchor="middle">S3: raw event archive</text><text x="780" y="148" class="small" text-anchor="middle">schema mirrors GenAI semconv</text><text x="780" y="166" class="small" text-anchor="middle">gen_ai.system, request.model</text><text x="780" y="184" class="small" text-anchor="middle">usage.input_tokens, output_tokens</text><rect width="400" height="270" x="40" y="240" class="box"/><text x="240" y="262" class="head" text-anchor="middle">evals + drift (child spans)</text><rect width="360" height="40" x="60" y="280" class="cool"/><text x="240" y="304" class="step" text-anchor="middle">DeepEval / RAGAS scheduled jobs</text><rect width="360" height="40" x="60" y="326" class="cool"/><text x="240" y="350" class="step" text-anchor="middle">custom LLM-judges (PII, off-policy)</text><rect width="360" height="40" x="60" y="372" class="hot"/><text x="240" y="396" class="step" text-anchor="middle">drift detector (weekly PSI / KL)</text><text x="240" y="436" class="small" text-anchor="middle">eval outputs become linked child spans</text><text x="240" y="454" class="small" text-anchor="middle">stored in same ClickHouse, join by parent</text><text x="240" y="472" class="small" text-anchor="middle">tail-sampler keeps all high-eval-score traces</text><text x="240" y="494" class="caption" text-anchor="middle">MTTR on injected regression target: &lt; 5 min</text><rect width="440" height="270" x="480" y="240" class="box"/><text x="700" y="262" class="head" text-anchor="middle">alerting + UI</text><rect width="400" height="40" x="500" y="280" class="hot"/><text x="700" y="304" class="step" text-anchor="middle">Prometheus Alertmanager</text><rect width="400" height="40" x="500" y="326" class="dsk"/><text x="700" y="350" class="step" text-anchor="middle">Slack (warning) + PagerDuty (critical)</text><rect width="400" height="40" x="500" y="372" class="cool"/><text x="700" y="396" class="step" text-anchor="middle">Next.js 15 + Recharts dashboard</text><text x="700" y="436" class="small" text-anchor="middle">pages: overview / traces / evals / drift</text><text x="700" y="454" class="small" text-anchor="middle">cost per user, span waterfall, eval trends</text><text x="700" y="472" class="small" text-anchor="middle">Langfuse / Phoenix / OpenLLMetry shape</text><text x="700" y="494" class="caption" text-anchor="middle">open-core self-hosted reference</text></svg>