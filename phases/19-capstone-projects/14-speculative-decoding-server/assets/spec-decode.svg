<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.dsk,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">speculative decoding — draft proposes, target verifies</text><rect width="300" height="260" x="40" y="60" class="box"/><text x="190" y="82" class="head" text-anchor="middle">draft model (cheap)</text><rect width="260" height="36" x="60" y="100" class="cool"/><text x="190" y="122" class="step" text-anchor="middle">EAGLE-3 head</text><rect width="260" height="36" x="60" y="142" class="cool"/><text x="190" y="164" class="step" text-anchor="middle">P-EAGLE parallel tree</text><rect width="260" height="36" x="60" y="184" class="cool"/><text x="190" y="206" class="step" text-anchor="middle">ngram fallback</text><text x="190" y="244" class="small" text-anchor="middle">proposes k tokens per step</text><text x="190" y="262" class="small" text-anchor="middle">trained on target hidden states</text><text x="190" y="280" class="small" text-anchor="middle">via SpecForge / Speculators</text><text x="190" y="300" class="caption" text-anchor="middle">alignment = acceptance knob</text><rect width="540" height="260" x="380" y="60" class="box"/><text x="650" y="82" class="head" text-anchor="middle">target model (expensive)</text><rect width="260" height="44" x="400" y="100" class="dsk"/><text x="530" y="120" class="step" text-anchor="middle">batched verify pass</text><text x="530" y="138" class="small" text-anchor="middle">one forward through k positions</text><rect width="220" height="44" x="680" y="100" class="dsk"/><text x="790" y="120" class="step" text-anchor="middle">accept prefix</text><text x="790" y="138" class="small" text-anchor="middle">until first rejection</text><rect width="500" height="44" x="400" y="152" class="hot"/><text x="650" y="172" class="step" text-anchor="middle">resample rejected position from target</text><text x="650" y="190" class="small" text-anchor="middle">commit accepted + 1 new -&gt; stream</text><rect width="500" height="100" x="400" y="208" class="cool"/><text x="650" y="228" class="step" text-anchor="middle">target quantization</text><text x="650" y="248" class="small" text-anchor="middle">FP8 Marlin or INT4 AWQ</text><text x="650" y="266" class="small" text-anchor="middle">Llama 3.3 70B, Qwen3-Coder-30B MoE, GPT-OSS-120B</text><text x="650" y="284" class="small" text-anchor="middle">one replica per H100/H200 shard</text><text x="650" y="300" class="caption" text-anchor="middle">vLLM 0.7 / SGLang 0.4</text><rect width="440" height="170" x="40" y="340" class="box"/><text x="260" y="362" class="head" text-anchor="middle">metrics that must be reported</text><text x="60" y="384" class="small">throughput bs=1 / bs=8 / bs=32 with + without spec</text><text x="60" y="402" class="small">p50, p99 latency at each batch size</text><text x="60" y="420" class="small">acceptance rate per distribution:</text><text x="60" y="438" class="small">ShareGPT, HumanEval, domain data</text><text x="60" y="456" class="small">draft/target alignment drift alert</text><text x="60" y="476" class="small">$ per 1M output tokens sustained</text><text x="60" y="498" class="small">comparison vs Anthropic / OpenAI API on same eval</text><rect width="420" height="170" x="500" y="340" class="box"/><text x="710" y="362" class="head" text-anchor="middle">operations</text><text x="520" y="384" class="small">Kubernetes deployment</text><text x="520" y="402" class="small">NVIDIA device plugin</text><text x="520" y="420" class="small">HPA metric: queue_wait_ms (not CPU)</text><text x="520" y="438" class="small">rolling upgrade: drain queue first</text><text x="520" y="456" class="small">ngram fallback if EAGLE acceptance drops</text><text x="520" y="476" class="small">Prometheus exporter + Langfuse trace</text><text x="520" y="498" class="small">target: 2.5x+ throughput at matched quality</text></svg>