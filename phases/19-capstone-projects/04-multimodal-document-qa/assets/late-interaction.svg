<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">ColPali / ColQwen late-interaction retrieval</text><rect width="290" height="460" x="40" y="50" class="box"/><text x="185" y="72" class="head" text-anchor="middle">query side</text><rect width="250" height="40" x="60" y="90" class="cool"/><text x="185" y="116" class="step" text-anchor="middle">tokenize query</text><rect width="250" height="40" x="60" y="140" class="cool"/><text x="185" y="166" class="step" text-anchor="middle">embed each token</text><text x="185" y="190" class="small" text-anchor="middle">n query tokens -&gt; n vectors</text><rect width="250" height="220" x="60" y="210" class="cold"/><text x="185" y="232" class="step" text-anchor="middle">MaxSim per query token</text><text x="185" y="252" class="small" text-anchor="middle">for each q_i:</text><text x="185" y="270" class="small" text-anchor="middle">max over doc patches (q_i . p_j)</text><text x="185" y="288" class="small" text-anchor="middle">sum all q_i max scores</text><text x="185" y="310" class="small" text-anchor="middle">-&gt; page score</text><text x="185" y="336" class="small" text-anchor="middle">O(|q| * |patches|) per page</text><text x="185" y="354" class="small" text-anchor="middle">but vectorized on GPU</text><text x="185" y="378" class="small" text-anchor="middle">multi-vector index stores</text><text x="185" y="396" class="small" text-anchor="middle">patches + MaxSim ranks</text><text x="185" y="418" class="caption" text-anchor="middle">Vespa / Qdrant multi-vector / AstraDB</text><rect width="290" height="460" x="360" y="50" class="box"/><text x="505" y="72" class="head" text-anchor="middle">document side</text><rect width="250" height="40" x="380" y="90" class="cool"/><text x="505" y="116" class="step" text-anchor="middle">render page (180 DPI)</text><rect width="250" height="40" x="380" y="140" class="cool"/><text x="505" y="166" class="step" text-anchor="middle">ColQwen2.5-v0.2</text><text x="505" y="190" class="small" text-anchor="middle">patch tokenizer + LM head</text><rect width="250" height="220" x="380" y="210" class="dsk"/><text x="505" y="232" class="step" text-anchor="middle">patch embeddings</text><text x="505" y="252" class="small" text-anchor="middle">~2048 patches per page</text><text x="505" y="270" class="small" text-anchor="middle">dim 128 each</text><text x="505" y="288" class="small" text-anchor="middle">no pooling: preserve locality</text><text x="505" y="310" class="small" text-anchor="middle">DocPruner: keep 50%</text><text x="505" y="328" class="small" text-anchor="middle">accuracy drop &lt; 0.5%</text><text x="505" y="350" class="small" text-anchor="middle">storage halved</text><text x="505" y="378" class="small" text-anchor="middle">per-patch bounding box kept</text><text x="505" y="396" class="small" text-anchor="middle">for evidence highlighting</text><text x="505" y="418" class="caption" text-anchor="middle">Illuin Tech ColPali + 2026 DocPruner</text><rect width="240" height="460" x="680" y="50" class="box"/><text x="800" y="72" class="head" text-anchor="middle">synthesis + eval</text><rect width="200" height="40" x="700" y="90" class="cool"/><text x="800" y="116" class="step" text-anchor="middle">top-5 pages</text><rect width="200" height="40" x="700" y="140" class="hot"/><text x="800" y="166" class="step" text-anchor="middle">Qwen3-VL-30B</text><text x="800" y="190" class="small" text-anchor="middle">vision + text context</text><rect width="200" height="40" x="700" y="210" class="cold"/><text x="800" y="236" class="step" text-anchor="middle">cited regions</text><rect width="200" height="40" x="700" y="260" class="dsk"/><text x="800" y="286" class="step" text-anchor="middle">viewer overlay</text><rect width="200" height="200" x="700" y="310" class="box"/><text x="800" y="332" class="head" text-anchor="middle">evaluation</text><text x="800" y="352" class="small" text-anchor="middle">ViDoRe v3 (retrieval)</text><text x="800" y="370" class="small" text-anchor="middle">M3DocVQA (multi-page QA)</text><text x="800" y="388" class="small" text-anchor="middle">content-class x approach</text><text x="800" y="406" class="small" text-anchor="middle">matrix: text / table / chart /</text><text x="800" y="424" class="small" text-anchor="middle">handwriting / equation</text><text x="800" y="444" class="small" text-anchor="middle">vs OCR-then-text baseline</text><text x="800" y="472" class="caption" text-anchor="middle">publish side-by-side delta</text></svg>