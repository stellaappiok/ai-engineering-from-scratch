<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#555;stroke-width:1.2;fill:none}</style></defs><text x="480" y="24" class="title" text-anchor="middle">multi-agent factory — architect / coders / reviewer / tester</text><rect width="200" height="44" x="380" y="50" class="dsk"/><text x="480" y="70" class="step" text-anchor="middle">Architect (Opus 4.7)</text><text x="480" y="86" class="small" text-anchor="middle">plan + subtasks + interfaces</text><rect width="180" height="70" x="40" y="130" class="cool"/><text x="130" y="150" class="step" text-anchor="middle">Coder A (Sonnet 4.7)</text><text x="130" y="168" class="small" text-anchor="middle">worktree A + Daytona</text><text x="130" y="186" class="small" text-anchor="middle">subtask: parser</text><rect width="180" height="70" x="240" y="130" class="cool"/><text x="330" y="150" class="step" text-anchor="middle">Coder B</text><text x="330" y="168" class="small" text-anchor="middle">worktree B</text><text x="330" y="186" class="small" text-anchor="middle">subtask: cache</text><rect width="180" height="70" x="440" y="130" class="cool"/><text x="530" y="150" class="step" text-anchor="middle">Coder C</text><text x="530" y="168" class="small" text-anchor="middle">worktree C</text><text x="530" y="186" class="small" text-anchor="middle">subtask: api</text><rect width="180" height="70" x="640" y="130" class="cool"/><text x="730" y="150" class="step" text-anchor="middle">Coder D</text><text x="730" y="168" class="small" text-anchor="middle">worktree D</text><text x="730" y="186" class="small" text-anchor="middle">subtask: migration</text><path d="M480,94 L130,130" class="edge"/><path d="M480,94 L330,130" class="edge"/><path d="M480,94 L530,130" class="edge"/><path d="M480,94 L730,130" class="edge"/><rect width="280" height="54" x="340" y="240" class="cold"/><text x="480" y="262" class="step" text-anchor="middle">merge coordinator</text><text x="480" y="280" class="small" text-anchor="middle">3-way merge + LLM conflict resolver</text><path d="M130,200 L440,240" class="edge"/><path d="M330,200 L460,240" class="edge"/><path d="M530,200 L500,240" class="edge"/><path d="M730,200 L540,240" class="edge"/><rect width="280" height="54" x="340" y="320" class="hot"/><text x="480" y="342" class="step" text-anchor="middle">Reviewer (GPT-5.4)</text><text x="480" y="360" class="small" text-anchor="middle">cannot approve diffs it authored</text><path d="M480,294 L480,320" class="edge"/><rect width="280" height="54" x="340" y="400" class="dsk"/><text x="480" y="422" class="step" text-anchor="middle">Tester (Gemini 2.5 Pro)</text><text x="480" y="440" class="small" text-anchor="middle">run suite in clean sandbox</text><path d="M480,374 L480,400" class="edge"/><rect width="280" height="40" x="340" y="480" class="cool"/><text x="480" y="504" class="step" text-anchor="middle">PR open</text><path d="M480,454 L480,480" class="edge"/><rect width="260" height="240" x="40" y="300" class="box"/><text x="170" y="322" class="head" text-anchor="middle">metrics</text><text x="170" y="344" class="small" text-anchor="middle">SWE-bench Pro pass@1</text><text x="170" y="362" class="small" text-anchor="middle">wall-clock vs single-agent</text><text x="170" y="380" class="small" text-anchor="middle">false-approval on bug probe</text><text x="170" y="398" class="small" text-anchor="middle">token amplification ratio</text><text x="170" y="416" class="small" text-anchor="middle">merge conflict rate</text><text x="170" y="440" class="small" text-anchor="middle">target:</text><text x="170" y="456" class="small" text-anchor="middle">pass@1 &gt; single-agent</text><text x="170" y="472" class="small" text-anchor="middle">speedup 2-3x on parallel tasks</text><text x="170" y="490" class="small" text-anchor="middle">token amp &lt; 2x</text><text x="170" y="508" class="small" text-anchor="middle">false-approve &lt; 5%</text><text x="170" y="528" class="caption" text-anchor="middle">SWE-AF / MetaGPT / AutoGen shape</text><rect width="260" height="240" x="660" y="300" class="box"/><text x="790" y="322" class="head" text-anchor="middle">handoff accounting</text><text x="790" y="344" class="small" text-anchor="middle">every role boundary = span</text><text x="790" y="362" class="small" text-anchor="middle">A2A-typed messages</text><text x="790" y="380" class="small" text-anchor="middle">file-backed task board</text><text x="790" y="398" class="small" text-anchor="middle">Langfuse role tag + token</text><text x="790" y="422" class="small" text-anchor="middle">post-mortem histograms:</text><text x="790" y="438" class="small" text-anchor="middle">plan vague / merge conflict /</text><text x="790" y="454" class="small" text-anchor="middle">reviewer false-approve /</text><text x="790" y="470" class="small" text-anchor="middle">tester flake</text><text x="790" y="496" class="small" text-anchor="middle">shipped with every failed run</text><text x="790" y="516" class="caption" text-anchor="middle">handoffs are the failure surface</text></svg>