<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.read,.write{stroke-width:1.5}.write{fill:#ffe0cc;stroke:#c0392b}.read{fill:#e0f2e0;stroke:#2d7a2d}.miss{fill:#eee;stroke:#666;stroke-width:1.2}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.sub{font-size:12px;fill:#333}.mono,.tag{font-size:11px}.mono{fill:#333;font-family:&apos;Menlo&apos;,monospace}.tag{fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}.dash{stroke:#666;stroke-width:1;fill:none;stroke-dasharray:4 3}</style></defs><text x="450" y="30" class="title" text-anchor="middle">prompt caching: one write, many reads</text><text x="60" y="80" class="label">Request 1</text><rect width="500" height="40" x="60" y="95" class="write"/><text x="310" y="120" class="sub" text-anchor="middle">[system + tools + few-shot] 15,000 tok (CACHE WRITE)</text><rect width="140" height="40" x="560" y="95" class="box"/><text x="630" y="120" class="sub" text-anchor="middle">[user msg] 400 tok</text><text x="720" y="120" class="mono">bill: 15,000 * 1.25x + 400 * 1x</text><text x="60" y="170" class="label">Request 2</text><rect width="500" height="40" x="60" y="185" class="read"/><text x="310" y="210" class="sub" text-anchor="middle">[same prefix] 15,000 tok (CACHE READ)</text><rect width="140" height="40" x="560" y="185" class="box"/><text x="630" y="210" class="sub" text-anchor="middle">[user msg] 400 tok</text><text x="720" y="210" class="mono">bill: 15,000 * 0.1x + 400 * 1x</text><text x="60" y="260" class="label">Request N</text><rect width="500" height="40" x="60" y="275" class="read"/><text x="310" y="300" class="sub" text-anchor="middle">[same prefix] 15,000 tok (CACHE READ)</text><rect width="140" height="40" x="560" y="275" class="box"/><text x="630" y="300" class="sub" text-anchor="middle">[user msg] 400 tok</text><text x="720" y="300" class="mono">bill: 15,000 * 0.1x + 400 * 1x</text><path d="M60 340 L840 340" class="dash"/><text x="60" y="370" class="label">Anti-pattern: timestamp at the top</text><rect width="140" height="40" x="60" y="385" class="miss"/><text x="130" y="410" class="mono" text-anchor="middle">&quot;15:30:02&quot;</text><rect width="360" height="40" x="200" y="385" class="miss"/><text x="380" y="410" class="sub" text-anchor="middle">[rest of prefix] still 15,000 tok</text><rect width="140" height="40" x="560" y="385" class="box"/><text x="630" y="410" class="sub" text-anchor="middle">[user msg]</text><text x="720" y="410" class="mono">every request MISSES: no shared prefix</text><text x="450" y="460" class="tag" text-anchor="middle">break-even: Anthropic pays back after the 2nd read; 1h TTL costs 2x write but reuses 12x longer.</text></svg>