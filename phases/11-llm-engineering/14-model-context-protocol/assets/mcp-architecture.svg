<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.host,.server{stroke-width:1.5}.host{fill:#e8f0ff;stroke:#0f3460}.server{fill:#fff1d6;stroke:#c0392b}.primitive{fill:#e8f7e8;stroke:#2d7a2d;stroke-width:1.2}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.sub{font-size:12px;fill:#333}.tag{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}.line{stroke:#1a1a1a;stroke-width:1.3;fill:none}</style></defs><text x="450" y="30" class="title" text-anchor="middle">one host, one JSON-RPC session, three primitives</text><rect width="240" height="300" x="40" y="70" class="host"/><text x="160" y="95" class="label" text-anchor="middle">Host (LLM app)</text><text x="160" y="113" class="tag" text-anchor="middle">Claude Desktop / Claude Code / ChatGPT</text><rect width="180" height="55" x="70" y="135" class="box"/><text x="160" y="155" class="sub" text-anchor="middle">LLM runtime</text><text x="160" y="175" class="tag" text-anchor="middle">model + prompt + context</text><rect width="180" height="55" x="70" y="205" class="box"/><text x="160" y="225" class="sub" text-anchor="middle">MCP client</text><text x="160" y="245" class="tag" text-anchor="middle">one per server mounted</text><rect width="180" height="55" x="70" y="275" class="box"/><text x="160" y="295" class="sub" text-anchor="middle">user UI / approval</text><text x="160" y="315" class="tag" text-anchor="middle">slash commands, confirms</text><path marker-end="url(#arrow)" d="M280 235 L500 235" class="line"/><text x="390" y="220" class="tag" text-anchor="middle">JSON-RPC 2.0 (stdio / HTTP)</text><text x="390" y="252" class="tag" text-anchor="middle">initialize → list → call</text><rect width="360" height="300" x="500" y="70" class="server"/><text x="680" y="95" class="label" text-anchor="middle">Server</text><text x="680" y="113" class="tag" text-anchor="middle">your code: FastMCP / SDK / custom</text><rect width="310" height="60" x="525" y="140" class="primitive"/><text x="680" y="161" class="sub" text-anchor="middle">Tools</text><text x="680" y="181" class="tag" text-anchor="middle">functions the model calls; JSON Schema input</text><rect width="310" height="60" x="525" y="215" class="primitive"/><text x="680" y="236" class="sub" text-anchor="middle">Resources</text><text x="680" y="256" class="tag" text-anchor="middle">URI-addressed read-only content</text><rect width="310" height="60" x="525" y="290" class="primitive"/><text x="680" y="311" class="sub" text-anchor="middle">Prompts</text><text x="680" y="331" class="tag" text-anchor="middle">user-invoked templates (slash commands)</text><text x="450" y="410" class="tag" text-anchor="middle">spec revision 2025-06-18 adds streamable HTTP transport; every host/server pins a protocol version in initialize.</text><text x="450" y="435" class="tag" text-anchor="middle">destructive tools set destructiveHint: true so the host can gate on human approval.</text></svg>