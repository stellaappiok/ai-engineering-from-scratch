ct · Coder · QA</text><text x="480" y="152" class="small" text-anchor="middle">Code = SOP(Team)</text><text x="480" y="172" class="small" text-anchor="middle">structured artifact handoffs</text><text x="480" y="200" class="step" text-anchor="middle">communicative</text><text x="480" y="218" class="step" text-anchor="middle">dehallucination</text><text x="480" y="238" class="small" text-anchor="middle">MacNet: 1000+ agents via DAG</text><text x="480" y="268" class="caption" text-anchor="middle">use for: engineering workflows</text><rect width="280" height="230" x="640" y="60" class="hot"/><text x="780" y="84" class="head" text-anchor="middle">OpenClaw / Moltbook</text><text x="780" y="104" class="step" text-anchor="middle">population-scale substrate</text><text x="780" y="134" class="small" text-anchor="middle">Clawdbot Nov 2025 → 247k ⭐</text><text x="780" y="152" class="small" text-anchor="middle">Moltbook 2.3M agents</text><text x="780" y="172" class="small" text-anchor="middle">Meta acquisition Mar 2026</text><text x="780" y="200" class="step" text-anchor="middle">emergent economy</text><text x="780" y="218" class="step" text-anchor="middle">prompt-injection at scale</text><text x="780" y="238" class="small" text-anchor="middle">state-level regulation response</text><text x="780" y="268" class="caption" text-anchor="middle">use for: social / network products</text><rect width="880" height="190" x="40" y="310" class="box"/><text x="480" y="334" class="head" text-anchor="middle">framework landscape — April 2026</text><text x="60" y="368" class="step">LangGraph</text><text x="260" y="368" class="small">production leader · graph + checkpointing + HITL</text><text x="60" y="394" class="step">CrewAI</text><text x="260" y="394" class="small">production leader · role-based crews (Sequential / Hierarchical)</text><text x="60" y="420" class="step">OpenAI Agents SDK</text><text x="260" y="420" class="small">production · Swarm successor · tool-return handoffs</text><text x="