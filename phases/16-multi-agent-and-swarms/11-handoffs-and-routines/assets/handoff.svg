<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.caption{font-size:11px;fill:#555;font-style:italic}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="450" y="28" class="title" text-anchor="middle">Swarm — routines + handoffs (OpenAI, 2024; Agents SDK 2025)</text><rect width="260" height="100" x="320" y="60" class="hot"/><text x="450" y="82" class="head" text-anchor="middle">Triage Agent</text><text x="450" y="104" class="small" text-anchor="middle">instructions:</text><text x="450" y="120" class="small" text-anchor="middle">&quot;route user to the right specialist&quot;</text><text x="450" y="140" class="small" text-anchor="middle">functions: transfer_to_refunds, sales, support</text><line x1="380" x2="200" y1="160" y2="220" marker-end="url(#arrow)" class="edge"/><text x="260" y="195" class="small">tool returns refund_agent</text><line x1="450" x2="450" y1="160" y2="220" marker-end="url(#arrow)" class="edge"/><text x="460" y="195" class="small">tool returns sales_agent</text><line x1="520" x2="700" y1="160" y2="220" marker-end="url(#arrow)" class="edge"/><text x="620" y="195" class="small">tool returns support_agent</text><rect width="200" height="80" x="100" y="220" class="cool"/><text x="200" y="242" class="head" text-anchor="middle">Refund Agent</text><text x="200" y="262" class="small" text-anchor="middle">process_refund(order_id)</text><text x="200" y="282" class="small" text-anchor="middle">&quot;refund processed for order 77&quot;</text><rect width="200" height="80" x="350" y="220" class="cool"/><text x="450" y="242" class="head" text-anchor="middle">Sales Agent</text><text x="450" y="262" class="small" text-anchor="middle">quote_product(product)</text><text x="450" y="282" class="small" text-anchor="middle">&quot;quote: $99/mo&quot;</text><rect width="200" height="80" x="600" y="220" class="cool"/><text x="700" y="242" class="head" text-anchor="middle">Support Agent</text><text x="700" y="262" class="small" text-anchor="middle">open_ticket(issue)</text><text x="700" y="282" class="small" text-anchor="middle">&quot;ticket opened&quot;</text><rect width="380" height="150" x="60" y="340" class="box"/><text x="250" y="362" class="head" text-anchor="middle">how the primitives work</text><text x="250" y="384" class="small" text-anchor="middle">agent = (instructions, tools)</text><text x="250" y="404" class="small" text-anchor="middle">handoff = tool that returns Agent</text><text x="250" y="424" class="small" text-anchor="middle">runtime detects Agent-valued return</text><text x="250" y="444" class="small" text-anchor="middle">switches active agent for next turn</text><text x="250" y="470" class="caption" text-anchor="middle">no state machine, no DSL, just tool calls</text><rect width="380" height="150" x="460" y="340" class="box"/><text x="650" y="362" class="head" text-anchor="middle">stateless tradeoff</text><text x="650" y="384" class="small" text-anchor="middle">Swarm persists nothing between runs</text><text x="650" y="404" class="small" text-anchor="middle">memory is the caller&apos;s problem</text><text x="650" y="424" class="small" text-anchor="middle">Agents SDK (2025) adds: sessions, tracing</text><text x="650" y="444" class="small" text-anchor="middle">guardrails, handoff filters on top</text><text x="650" y="470" class="caption" text-anchor="middle">handoff primitive survives; production ergonomics added</text></svg>