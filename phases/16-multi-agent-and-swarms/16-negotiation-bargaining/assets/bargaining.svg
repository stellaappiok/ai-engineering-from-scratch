<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="28" class="title" text-anchor="middle">OG-Narrator decomposition and Contract Net task market</text><rect width="420" height="200" x="40" y="60" class="cool"/><text x="250" y="82" class="head" text-anchor="middle">OG-Narrator (arXiv:2402.15813)</text><rect width="150" height="70" x="70" y="110" class="box"/><text x="145" y="134" class="step" text-anchor="middle">offer generator</text><text x="145" y="152" class="small" text-anchor="middle">deterministic</text><text x="145" y="168" class="small" text-anchor="middle">Zeuthen / Rubinstein</text><rect width="150" height="70" x="280" y="110" class="box"/><text x="355" y="134" class="step" text-anchor="middle">LLM narrator</text><text x="355" y="152" class="small" text-anchor="middle">framing only</text><text x="355" y="168" class="small" text-anchor="middle">no numeric decisions</text><line x1="220" x2="276" y1="145" y2="145" stroke="#1a1a1a" marker-end="url(#arrow)"/><text x="250" y="140" class="small" text-anchor="middle">price</text><text x="250" y="210" class="step" text-anchor="middle">deal rate: 26.67% -&gt; 88.88%</text><text x="250" y="230" class="caption" text-anchor="middle">prices stay in the ZOPA; anchors are strategic</text><rect width="420" height="200" x="500" y="60" class="hot"/><text x="710" y="82" class="head" text-anchor="middle">anti-pattern: LLM decides the price</text><rect width="340" height="70" x="540" y="110" class="box"/><text x="710" y="134" class="step" text-anchor="middle">single LLM call</text><text x="710" y="152" class="small" text-anchor="middle">generates both offer and framing</text><text x="710" y="168" class="small" text-anchor="middle">reveals reasoning in the output</text><text x="710" y="210" class="step" text-anchor="middle">deal rate: ~27%</text><text x="710" y="230" class="caption" text-anchor="middle">prices drift; counterpart reads the reservation price</text><rect width="880" height="210" x="40" y="290" class="cold"/><text x="480" y="314" class="head" text-anchor="middle">Contract Net Protocol (Smith 1980 / FIPA 1996)</text><rect width="140" height="50" x="80" y="340" class="box"/><text x="150" y="370" class="step" text-anchor="middle">manager</text><circle cx="400" cy="365" r="24" class="box"/><text x="400" y="370" class="step" text-anchor="middle">bidders</text><rect width="140" height="50" x="550" y="340" class="box"/><text x="620" y="370" class="step" text-anchor="middle">winner</text><rect width="160" height="50" x="730" y="340" class="box"/><text x="810" y="370" class="step" text-anchor="middle">losers (reject)</text><line x1="220" x2="376" y1="365" y2="365" stroke="#1a1a1a" marker-end="url(#arrow)"/><text x="295" y="355" class="small" text-anchor="middle">cfp</text><line x1="424" x2="546" y1="365" y2="365" stroke="#1a1a1a" marker-end="url(#arrow)"/><text x="485" y="355" class="small" text-anchor="middle">propose · accept</text><line x1="424" x2="726" y1="380" y2="380" stroke="#1a1a1a" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="575" y="400" class="small" text-anchor="middle">reject-proposal</text><text x="480" y="440" class="caption" text-anchor="middle">scales: broadcast + collect + award; no synchronous chat</text><text x="480" y="460" class="caption" text-anchor="middle">adopted in production task markets (Microsoft Agent Framework, some LangGraph implementations)</text><text x="480" y="480" class="caption" text-anchor="middle">FIPA performative mapping: cfp -&gt; propose -&gt; accept-proposal / reject-proposal</text></svg>