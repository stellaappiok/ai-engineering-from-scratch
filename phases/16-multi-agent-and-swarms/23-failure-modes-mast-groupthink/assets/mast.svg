<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="28" class="title" text-anchor="middle">MAST taxonomy — the 2026 reference for multi-agent failure modes</text><rect width="880" height="200" x="40" y="60" class="box"/><text x="480" y="84" class="head" text-anchor="middle">three MAST categories (Cemri 2025, NeurIPS) — 41-86.7% failure rate on real MAS</text><rect width="270" height="130" x="60" y="110" class="hot"/><text x="195" y="134" class="head" text-anchor="middle">Specification</text><text x="195" y="154" class="step" text-anchor="middle">41.77%</text><text x="195" y="180" class="small" text-anchor="middle">role ambiguity</text><text x="195" y="196" class="small" text-anchor="middle">unclear task definition</text><text x="195" y="212" class="small" text-anchor="middle">implicit success criteria</text><text x="195" y="232" class="caption" text-anchor="middle">fix: explicit role contracts</text><rect width="270" height="130" x="345" y="110" class="cool"/><text x="480" y="134" class="head" text-anchor="middle">Coordination</text><text x="480" y="154" class="step" text-anchor="middle">36.94%</text><text x="480" y="180" class="small" text-anchor="middle">state desync</text><text x="480" y="196" class="small" text-anchor="middle">message loss / timeout</text><text x="480" y="212" class="small" text-anchor="middle">concurrent writes</text><text x="480" y="232" class="caption" text-anchor="middle">fix: versioned state + acks</text><rect width="270" height="130" x="630" y="110" class="cold"/><text x="765" y="134" class="head" text-anchor="middle">Verification</text><text x="765" y="154" class="step" text-anchor="middle">21.30%</text><text x="765" y="180" class="small" text-anchor="middle">no independent checker</text><text x="765" y="196" class="small" text-anchor="middle">chain of trust</text><text x="765" y="212" class="small" text-anchor="middle">silent wrong outputs</text><text x="765" y="232" class="caption" text-anchor="middle">fix: unwritable verifier</text><rect width="880" height="230" x="40" y="270" class="cool"/><text x="480" y="294" class="head" text-anchor="middle">Groupthink family (arXiv:2508.05687)</text><text x="60" y="326" class="step">monoculture</text><text x="220" y="326" class="small">same base model → correlated hallucinations</text><text x="60" y="352" class="step">conformity</text><text x="220" y="352" class="small">agents align with loudest peer; rewards sycophancy</text><text x="60" y="378" class="step">deficient ToM</text><text x="220" y="378" class="small">fails to model each other (Lesson 18); long-horizon break</text><text x="60" y="404" class="step">mixed-motive</text><text x="220" y="404" class="small">partial-incentive alignment → compromise-middle outputs</text><text x="60" y="430" class="step">cascading</text><text x="220" y="430" class="small">retry storms; one failure amplifies through dependencies</text><text x="60" y="466" class="step">fix: STRATUS</text><text x="220" y="466" class="small">detection + diagnosis + validation agents → 1.5x mitigation success</text><text x="60" y="486" class="step">+ breakers</text><text x="220" y="486" class="small">circuit breakers on every outbound call; capped retries</text></svg>