<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.caption{font-size:11px;fill:#555;font-style:italic}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="450" y="28" class="title" text-anchor="middle">Group chat — shared pool + speaker selector (AutoGen / AG2)</text><rect width="460" height="80" x="220" y="60" class="cold"/><text x="450" y="82" class="head" text-anchor="middle">shared message pool</text><text x="450" y="104" class="small" text-anchor="middle">m1 [coder]: initial code ... | m2 [reviewer]: bug detected ... | m3 [coder]: revised ... | m4 [reviewer]: approved</text><text x="450" y="122" class="small" text-anchor="middle">every agent reads every message</text><rect width="140" height="80" x="40" y="180" class="hot"/><text x="110" y="202" class="head" text-anchor="middle">Coder</text><text x="110" y="222" class="small" text-anchor="middle">writes code</text><text x="110" y="240" class="small" text-anchor="middle">revises on review</text><rect width="140" height="80" x="220" y="180" class="cool"/><text x="290" y="202" class="head" text-anchor="middle">Reviewer</text><text x="290" y="222" class="small" text-anchor="middle">critiques code</text><text x="290" y="240" class="small" text-anchor="middle">returns approved / rejected</text><rect width="140" height="80" x="400" y="180" class="dsk"/><text x="470" y="202" class="head" text-anchor="middle">Manager</text><text x="470" y="222" class="small" text-anchor="middle">drives termination</text><text x="470" y="240" class="small" text-anchor="middle">emits TERMINATE</text><rect width="260" height="80" x="580" y="180" class="box"/><text x="710" y="202" class="head" text-anchor="middle">Selector</text><text x="710" y="222" class="small" text-anchor="middle">round-robin (fixed cycle)</text><text x="710" y="240" class="small" text-anchor="middle">LLM-selected (context-aware)</text><text x="710" y="256" class="small" text-anchor="middle">custom (rule-based fallback)</text><line x1="110" x2="350" y1="180" y2="140" marker-end="url(#arrow)" class="edge"/><line x1="290" x2="440" y1="180" y2="140" marker-end="url(#arrow)" class="edge"/><line x1="470" x2="520" y1="180" y2="140" marker-end="url(#arrow)" class="edge"/><line x1="450" x2="580" y1="140" y2="200" marker-end="url(#arrow)" class="edge"/><text x="555" y="168" class="small">selector reads pool</text><path fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)" d="M 710 260 Q 710 320 470 300" class="edge"/><text x="580" y="300" class="small">selector returns: next speaker = manager</text><rect width="380" height="150" x="40" y="340" class="box"/><text x="230" y="362" class="head" text-anchor="middle">when group chat fits</text><text x="230" y="384" class="small" text-anchor="middle">emergent conversations, role-mixing</text><text x="230" y="402" class="small" text-anchor="middle">exploratory problem-solving</text><text x="230" y="420" class="small" text-anchor="middle">pre-wiring every handoff is wrong</text><text x="230" y="440" class="small" text-anchor="middle">&quot;brainstorm meeting&quot; not &quot;assembly line&quot;</text><text x="230" y="468" class="caption" text-anchor="middle">selector replaces explicit graph edges</text><rect width="380" height="150" x="460" y="340" class="box"/><text x="650" y="362" class="head" text-anchor="middle">failure modes</text><text x="650" y="384" class="small" text-anchor="middle">hot speaker (one agent dominates)</text><text x="650" y="402" class="small" text-anchor="middle">sycophancy cascade (defer to loud)</text><text x="650" y="420" class="small" text-anchor="middle">context bloat (pool grows unbounded)</text><text x="650" y="440" class="small" text-anchor="middle">selector inconsistency (LLM non-determinism)</text><text x="650" y="468" class="caption" text-anchor="middle">cap rounds · track balance · scope views</text></svg>