<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="450" y="28" class="title" text-anchor="middle">Swarm / parallel / networked architecture — no orchestrator</text><rect width="540" height="60" x="180" y="70" class="cold"/><text x="450" y="90" class="head" text-anchor="middle">shared queue (durable event bus in production)</text><text x="450" y="110" class="small" text-anchor="middle">T1 (slow) · T2 (fast) · T3 (slow) · T4 (fast) · T5 (fast) · ...</text><line x1="250" x2="180" y1="130" y2="170" marker-end="url(#arrow)" class="edge"/><line x1="350" x2="340" y1="130" y2="170" marker-end="url(#arrow)" class="edge"/><line x1="550" x2="560" y1="130" y2="170" marker-end="url(#arrow)" class="edge"/><line x1="650" x2="720" y1="130" y2="170" marker-end="url(#arrow)" class="edge"/><rect width="150" height="90" x="100" y="170" class="cool"/><text x="175" y="192" class="head" text-anchor="middle">Worker A</text><text x="175" y="212" class="small" text-anchor="middle">pull task</text><text x="175" y="228" class="small" text-anchor="middle">process</text><text x="175" y="244" class="small" text-anchor="middle">write result</text><rect width="150" height="90" x="280" y="170" class="cool"/><text x="355" y="192" class="head" text-anchor="middle">Worker B</text><text x="355" y="212" class="small" text-anchor="middle">pull task</text><text x="355" y="228" class="small" text-anchor="middle">process</text><text x="355" y="244" class="small" text-anchor="middle">write result</text><rect width="150" height="90" x="470" y="170" class="cool"/><text x="545" y="192" class="head" text-anchor="middle">Worker C</text><text x="545" y="212" class="small" text-anchor="middle">pull task</text><text x="545" y="228" class="small" text-anchor="middle">process</text><text x="545" y="244" class="small" text-anchor="middle">write result</text><rect width="150" height="90" x="650" y="170" class="cool"/><text x="725" y="192" class="head" text-anchor="middle">Worker D</text><text x="725" y="212" class="small" text-anchor="middle">pull task</text><text x="725" y="228" class="small" text-anchor="middle">process</text><text x="725" y="244" class="small" text-anchor="middle">write result</text><line x1="175" x2="350" y1="260" y2="320" class="edge"/><line x1="355" x2="400" y1="260" y2="320" class="edge"/><line x1="545" x2="500" y1="260" y2="320" class="edge"/><line x1="725" x2="550" y1="260" y2="320" class="edge"/><rect width="300" height="50" x="300" y="320" class="hot"/><text x="450" y="340" class="head" text-anchor="middle">results pool</text><text x="450" y="358" class="small" text-anchor="middle">idempotent, durable, per-task trace IDs</text><rect width="780" height="100" x="60" y="400" class="box"/><text x="450" y="422" class="head" text-anchor="middle">tradeoffs</text><text x="450" y="442" class="small" text-anchor="middle">✓ variable-duration balancing · ✓ scales to thousands · ✓ fault-tolerant with durable queue</text><text x="450" y="460" class="small" text-anchor="middle">✗ no central trace · ✗ ordered workflows break · ✗ debugging needs per-task IDs</text><text x="450" y="478" class="small" text-anchor="middle">failure modes: starvation (aging queue), hot-spotting (worker specialization), back-pressure (bounded queue)</text></svg>