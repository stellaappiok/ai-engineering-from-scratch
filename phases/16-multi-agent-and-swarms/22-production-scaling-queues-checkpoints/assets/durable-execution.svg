<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="28" class="title" text-anchor="middle">Durable execution for multi-agent systems</text><rect width="880" height="180" x="40" y="60" class="cool"/><text x="480" y="84" class="head" text-anchor="middle">super-step + checkpoint pattern (LangGraph, Temporal, Restate)</text><rect width="110" height="100" x="60" y="110" class="box"/><text x="115" y="135" class="step" text-anchor="middle">super-step 1</text><text x="115" y="158" class="small" text-anchor="middle">plan</text><line x1="115" x2="115" y1="175" y2="195" stroke="#1a1a1a" marker-end="url(#arrow)"/><text x="115" y="220" class="caption" text-anchor="middle">write ckpt</text><rect width="110" height="100" x="200" y="110" class="box"/><text x="255" y="135" class="step" text-anchor="middle">super-step 2</text><text x="255" y="158" class="small" text-anchor="middle">research</text><line x1="255" x2="255" y1="175" y2="195" stroke="#1a1a1a" marker-end="url(#arrow)"/><text x="255" y="220" class="caption" text-anchor="middle">write ckpt</text><rect width="110" height="100" x="340" y="110" class="hot"/><text x="395" y="135" class="step" text-anchor="middle">super-step 3</text><text x="395" y="158" class="small" text-anchor="middle">CRASH</text><line x1="395" x2="395" y1="175" y2="195" stroke="#c0392b"/><rect width="110" height="100" x="480" y="110" class="cold"/><text x="535" y="135" class="step" text-anchor="middle">resume</text><text x="535" y="158" class="small" text-anchor="middle">from ckpt 2</text><line x1="535" x2="535" y1="175" y2="195" stroke="#1a1a1a" marker-end="url(#arrow)"/><text x="535" y="220" class="caption" text-anchor="middle">another worker</text><rect width="110" height="100" x="620" y="110" class="box"/><text x="675" y="135" class="step" text-anchor="middle">super-step 3&apos;</text><text x="675" y="158" class="small" text-anchor="middle">research (re-done)</text><text x="675" y="220" class="caption" text-anchor="middle">idempotent tool calls</text><rect width="140" height="100" x="760" y="110" class="box"/><text x="830" y="135" class="step" text-anchor="middle">super-step 4</text><text x="830" y="158" class="small" text-anchor="middle">synthesize + reply</text><line x1="170" x2="196" y1="160" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/><line x1="310" x2="336" y1="160" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/><line x1="590" x2="616" y1="160" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/><line x1="730" x2="756" y1="160" y2="160" stroke="#1a1a1a" marker-end="url(#arrow)"/><rect width="420" height="230" x="40" y="270" class="cold"/><text x="250" y="294" class="head" text-anchor="middle">tier the choice to the load</text><text x="60" y="326" class="step">Tier 1 (Bedi&apos;s rule)</text><text x="60" y="346" class="small">FastAPI + Postgres + outbox</text><text x="60" y="364" class="small">&lt; 100 concurrent runs, sub-hour tasks</text><text x="60" y="396" class="step">Tier 2</text><text x="60" y="416" class="small">LangGraph runtime or Temporal</text><text x="60" y="434" class="small">hour-long runs, interrupt/resume, retries</text><text x="60" y="466" class="step">Tier 3</text><text x="60" y="486" class="small">custom outbox + event sourcing, specialized</text><rect width="420" height="230" x="500" y="270" class="cool"/><text x="710" y="294" class="head" text-anchor="middle">async vs threads for I/O-bound LLM calls</text><rect width="180" height="80" x="520" y="320" class="box"/><text x="610" y="344" class="step" text-anchor="middle">asyncio / fibers</text><text x="610" y="366" class="small" text-anchor="middle">cooperative yield on I/O</text><text x="610" y="386" class="small" text-anchor="middle">10k concurrent: fine</text><rect width="180" height="80" x="720" y="320" class="hot"/><text x="810" y="344" class="step" text-anchor="middle">thread-per-call</text><text x="810" y="366" class="small" text-anchor="middle">~1MB stack each</text><text x="810" y="386" class="small" text-anchor="middle">10k concurrent: ~10GB</text><text x="710" y="430" class="caption" text-anchor="middle">LLM calls idle 99% of wall-clock on I/O; threads pay memory for no gain</text><text x="710" y="450" class="caption" text-anchor="middle">CPU-bound post-processing stays on threads / processes</text><text x="710" y="475" class="caption" text-anchor="middle">rainbow deployments keep long-running agents alive across code pushes</text></svg>