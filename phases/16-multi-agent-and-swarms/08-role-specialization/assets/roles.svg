<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="450" y="28" class="title" text-anchor="middle">Role specialization — planner, executor, critic, verifier</text><rect width="170" height="100" x="40" y="60" class="cool"/><text x="125" y="82" class="head" text-anchor="middle">Planner</text><text x="125" y="104" class="small" text-anchor="middle">reads goal</text><text x="125" y="120" class="small" text-anchor="middle">produces spec</text><text x="125" y="138" class="small" text-anchor="middle">(signature, tests, I/O)</text><text x="125" y="154" class="small" text-anchor="middle">MetaGPT: PM + Architect</text><line x1="210" x2="250" y1="110" y2="110" marker-end="url(#arrow)" class="edge"/><rect width="170" height="100" x="250" y="60" class="hot"/><text x="335" y="82" class="head" text-anchor="middle">Executor</text><text x="335" y="104" class="small" text-anchor="middle">reads one step</text><text x="335" y="120" class="small" text-anchor="middle">produces artifact</text><text x="335" y="138" class="small" text-anchor="middle">has the real tools</text><text x="335" y="154" class="small" text-anchor="middle">ChatDev: asks if unclear</text><line x1="420" x2="460" y1="110" y2="110" marker-end="url(#arrow)" class="edge"/><rect width="170" height="100" x="460" y="60" class="dsk"/><text x="545" y="82" class="head" text-anchor="middle">Critic</text><text x="545" y="104" class="small" text-anchor="middle">subjective review</text><text x="545" y="120" class="small" text-anchor="middle">catches taste issues</text><text x="545" y="138" class="small" text-anchor="middle">fooled by plausible prose</text><text x="545" y="154" class="small" text-anchor="middle">(LLM-based)</text><line x1="630" x2="670" y1="110" y2="110" marker-end="url(#arrow)" class="edge"/><rect width="200" height="100" x="670" y="60" class="cold"/><text x="770" y="82" class="head" text-anchor="middle">Verifier</text><text x="770" y="104" class="small" text-anchor="middle">deterministic check</text><text x="770" y="120" class="small" text-anchor="middle">tests, type, schema</text><text x="770" y="138" class="small" text-anchor="middle">cannot be fooled</text><text x="770" y="154" class="small" text-anchor="middle">(code, not LLM)</text><line x1="335" x2="335" y1="160" y2="200" class="edge"/><path fill="none" stroke-dasharray="3 3" d="M 335 200 Q 300 220 265 200" class="edge"/><text x="295" y="195" class="small">communicative dehallucination (ChatDev)</text><rect width="830" height="110" x="40" y="240" class="box"/><text x="450" y="262" class="head" text-anchor="middle">why verifier is load-bearing</text><text x="450" y="284" class="small" text-anchor="middle">MAST taxonomy (Cemri et al. 2025): 21.3% of 1642 multi-agent failures are verification gaps</text><text x="450" y="304" class="small" text-anchor="middle">PwC 2025: structured validation loop in CrewAI moved accuracy 10% -&gt; 70% (7× gain)</text><text x="450" y="324" class="small" text-anchor="middle">anti-pattern: every role is an LLM that says &quot;looks good to me&quot; — classic MAST failure</text><text x="450" y="342" class="small" text-anchor="middle">always pair critic (subjective) with verifier (deterministic); they catch different bugs</text><rect width="830" height="110" x="40" y="370" class="box"/><text x="450" y="392" class="head" text-anchor="middle">MetaGPT&apos;s SOP pattern</text><text x="450" y="412" class="small" text-anchor="middle">Code = SOP(Team): Product Manager, Architect, Project Manager, Engineer, QA Engineer</text><text x="450" y="430" class="small" text-anchor="middle">each role has strict input/output schema · pipeline becomes deterministic</text><text x="450" y="450" class="small" text-anchor="middle">CrewAI Agent(role, goal, backstory) is the modern ergonomic surface</text><text x="450" y="470" class="small" text-anchor="middle">LangGraph encodes roles as graph nodes with specialized prompts</text></svg>