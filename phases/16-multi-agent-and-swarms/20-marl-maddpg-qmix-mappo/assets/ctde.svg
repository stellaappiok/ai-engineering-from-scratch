<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="28" class="title" text-anchor="middle">CTDE and the three MARL baselines</text><rect width="440" height="200" x="40" y="60" class="cold"/><text x="260" y="84" class="head" text-anchor="middle">Training time — centralized</text><rect width="360" height="100" x="70" y="110" class="box"/><text x="250" y="134" class="step" text-anchor="middle">critic / mixer / value</text><text x="250" y="158" class="small" text-anchor="middle">sees all agents&apos; observations + actions</text><text x="250" y="176" class="small" text-anchor="middle">stationary target for each actor update</text><text x="250" y="196" class="small" text-anchor="middle">addresses non-stationarity of multi-learner settings</text><text x="260" y="234" class="caption" text-anchor="middle">MADDPG critic · QMIX mixer · MAPPO centralized V</text><rect width="420" height="200" x="500" y="60" class="cool"/><text x="710" y="84" class="head" text-anchor="middle">Deploy time — decentralized</text><rect width="110" height="100" x="530" y="110" class="box"/><text x="585" y="140" class="step" text-anchor="middle">actor 0</text><text x="585" y="160" class="small" text-anchor="middle">sees o_0 only</text><text x="585" y="180" class="small" text-anchor="middle">local action</text><rect width="110" height="100" x="655" y="110" class="box"/><text x="710" y="140" class="step" text-anchor="middle">actor 1</text><text x="710" y="160" class="small" text-anchor="middle">sees o_1 only</text><text x="710" y="180" class="small" text-anchor="middle">local action</text><rect width="110" height="100" x="780" y="110" class="box"/><text x="835" y="140" class="step" text-anchor="middle">actor N</text><text x="835" y="160" class="small" text-anchor="middle">sees o_N only</text><text x="835" y="180" class="small" text-anchor="middle">local action</text><text x="710" y="234" class="caption" text-anchor="middle">no critic at runtime; only local policy call</text><rect width="880" height="200" x="40" y="290" class="box"/><text x="480" y="314" class="head" text-anchor="middle">three baselines, three specializations</text><text x="60" y="348" class="step">MADDPG (2017)</text><text x="260" y="348" class="small">per-agent critic · continuous actions · mixed cooperative/competitive · scales ~10 agents</text><text x="60" y="378" class="step">QMIX (2018)</text><text x="260" y="378" class="small">value decomposition · monotone mixer · cooperative · discrete · dominant on SMAC</text><text x="60" y="408" class="step">MAPPO (2022)</text><text x="260" y="408" class="small">PPO with centralized V · minimal tuning · cooperative · robust across benchmarks</text><text x="60" y="438" class="step">production note</text><text x="260" y="438" class="small">start with MAPPO; escalate to MADDPG for mixed settings, QMIX for sparse cooperative</text><text x="60" y="468" class="caption">For LLM-agent systems: CTDE is a design pattern; training end-to-end is optional.</text></svg>