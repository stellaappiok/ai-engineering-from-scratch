<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="28" class="title" text-anchor="middle">Theory of Mind orders and the coordination illusion</text><rect width="280" height="200" x="40" y="60" class="hot"/><text x="180" y="84" class="head" text-anchor="middle">zeroth-order</text><text x="180" y="108" class="step" text-anchor="middle">no model of others</text><text x="180" y="138" class="small" text-anchor="middle">agent acts on own observations only</text><text x="180" y="156" class="small" text-anchor="middle">collides with other agents</text><text x="180" y="174" class="small" text-anchor="middle">duplicates effort on shared resources</text><text x="180" y="206" class="caption" text-anchor="middle">measured: ~0.96 collisions / trial</text><text x="180" y="224" class="caption" text-anchor="middle">(3 agents, 3 boxes, no ToM)</text><rect width="280" height="200" x="340" y="60" class="cool"/><text x="480" y="84" class="head" text-anchor="middle">first-order</text><text x="480" y="108" class="step" text-anchor="middle">&quot;A believes X&quot;</text><text x="480" y="138" class="small" text-anchor="middle">agent tracks each other&apos;s beliefs</text><text x="480" y="156" class="small" text-anchor="middle">predicts action from modeled beliefs</text><text x="480" y="174" class="small" text-anchor="middle">avoids redundancy + anticipates need</text><text x="480" y="206" class="caption" text-anchor="middle">measured: ~0.00 collisions / trial</text><text x="480" y="224" class="caption" text-anchor="middle">(with preference prime)</text><rect width="280" height="200" x="640" y="60" class="cold"/><text x="780" y="84" class="head" text-anchor="middle">second-order</text><text x="780" y="108" class="step" text-anchor="middle">&quot;A believes B believes X&quot;</text><text x="780" y="138" class="small" text-anchor="middle">recursive belief modeling</text><text x="780" y="156" class="small" text-anchor="middle">emerges in cooperative games</text><text x="780" y="174" class="small" text-anchor="middle">degrades on long horizons</text><text x="780" y="206" class="caption" text-anchor="middle">Li et al. 2023 context failure mode:</text><text x="780" y="224" class="caption" text-anchor="middle">identity-belief binding drops over turns</text><rect width="880" height="200" x="40" y="290" class="box"/><text x="480" y="314" class="head" text-anchor="middle">the coordination illusion (Riedl 2025, arXiv:2510.05174)</text><text x="70" y="346" class="step">claim</text><text x="140" y="346" class="small">&quot;our agents coordinate emergently&quot;</text><text x="70" y="372" class="step">failure</text><text x="140" y="372" class="small">coordination is prompt-dressed; strip &quot;work together&quot; from system prompt, effect vanishes</text><text x="70" y="398" class="step">audit</text><text x="140" y="398" class="small">require control condition, statistical test, complementarity metric, capacity-check</text><text x="70" y="424" class="step">real</text><text x="140" y="424" class="small">identity-linked differentiation + goal-directed complementarity + higher-order synergy</text><text x="70" y="450" class="step">only</text><text x="140" y="450" class="small">the ToM-prompted condition produces all three above chance in Riedl&apos;s population experiment</text><text x="70" y="476" class="caption">larger models show some coordination without ToM prompting, but the effect is smaller</text></svg>