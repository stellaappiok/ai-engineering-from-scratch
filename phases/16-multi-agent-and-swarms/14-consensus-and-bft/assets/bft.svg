<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="28" class="title" text-anchor="middle">BFT for LLM agents — three attacks, three aggregators</text><rect width="880" height="200" x="40" y="60" class="box"/><text x="480" y="84" class="head" text-anchor="middle">the three LLM-agent-specific attacks</text><rect width="270" height="140" x="60" y="100" class="hot"/><text x="195" y="122" class="head" text-anchor="middle">byzantine lie</text><text x="195" y="146" class="step" text-anchor="middle">one agent outputs wrong</text><text x="195" y="164" class="step" text-anchor="middle">with high confidence</text><text x="195" y="188" class="small" text-anchor="middle">classical BFT handles if f &lt; n/3</text><text x="195" y="212" class="caption" text-anchor="middle">mitigation: any majority-based vote</text><rect width="270" height="140" x="340" y="100" class="hot"/><text x="475" y="122" class="head" text-anchor="middle">sycophantic conformity</text><text x="475" y="146" class="step" text-anchor="middle">an agent copies whoever</text><text x="475" y="164" class="step" text-anchor="middle">spoke first, low confidence</text><text x="475" y="188" class="small" text-anchor="middle">classical BFT does not detect</text><text x="475" y="212" class="caption" text-anchor="middle">mitigation: confidence-weighted (CP-WBFT)</text><rect width="280" height="140" x="620" y="100" class="hot"/><text x="760" y="122" class="head" text-anchor="middle">monoculture (correlated errors)</text><text x="760" y="146" class="step" text-anchor="middle">three agents share a base</text><text x="760" y="164" class="step" text-anchor="middle">model; same hallucination</text><text x="760" y="188" class="small" text-anchor="middle">classical BFT fails: all look honest</text><text x="760" y="212" class="caption" text-anchor="middle">mitigation: model diversity + verifier</text><rect width="880" height="210" x="40" y="290" class="cool"/><text x="480" y="314" class="head" text-anchor="middle">2025-2026 aggregator variants</text><rect width="270" height="150" x="60" y="330" class="cold"/><text x="195" y="352" class="head" text-anchor="middle">CP-WBFT</text><text x="195" y="372" class="step" text-anchor="middle">confidence-probe weighted</text><text x="195" y="392" class="small" text-anchor="middle">w(cluster) = sum(c_i)</text><text x="195" y="410" class="small" text-anchor="middle">winner if w/total &gt; threshold</text><text x="195" y="432" class="caption" text-anchor="middle">arXiv:2511.10400</text><text x="195" y="452" class="small" text-anchor="middle">+85.71% BFT on complete graphs</text><rect width="270" height="150" x="340" y="330" class="cold"/><text x="475" y="352" class="head" text-anchor="middle">DecentLLMs</text><text x="475" y="372" class="step" text-anchor="middle">leaderless, geometric median</text><text x="475" y="392" class="small" text-anchor="middle">workers propose in parallel</text><text x="475" y="410" class="small" text-anchor="middle">evaluator agents score</text><text x="475" y="432" class="caption" text-anchor="middle">arXiv:2507.14928</text><text x="475" y="452" class="small" text-anchor="middle">robust when f &lt; n/2</text><rect width="280" height="150" x="620" y="330" class="cold"/><text x="760" y="352" class="head" text-anchor="middle">WBFT + Hierarchical Clustering</text><text x="760" y="372" class="step" text-anchor="middle">Core + Edge split</text><text x="760" y="392" class="small" text-anchor="middle">weight = quality * trust(history)</text><text x="760" y="410" class="small" text-anchor="middle">Core consensus first, Edge follows</text><text x="760" y="432" class="caption" text-anchor="middle">arXiv:2505.05103</text><text x="760" y="452" class="small" text-anchor="middle">bounds consensus latency</text></svg>