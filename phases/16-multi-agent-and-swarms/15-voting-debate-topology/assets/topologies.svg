<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.cool{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.caption{font-size:11px;fill:#555;font-style:italic}.node{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hub{fill:#fff1d6;stroke:#c0392b;stroke-width:1.8}.edge{stroke:#1a1a1a;stroke-width:1;fill:none}</style></defs><text x="480" y="28" class="title" text-anchor="middle">Multi-agent debate topologies — MultiAgentBench (ACL 2025)</text><rect width="210" height="220" x="40" y="60" class="box"/><text x="145" y="84" class="head" text-anchor="middle">star</text><circle cx="145" cy="140" r="24" class="hub"/><text x="145" y="144" class="small" text-anchor="middle">hub</text><circle cx="80" cy="200" r="20" class="node"/><circle cx="145" cy="220" r="20" class="node"/><circle cx="210" cy="200" r="20" class="node"/><line x1="145" x2="85" y1="164" y2="185" class="edge"/><line x1="145" x2="145" y1="164" y2="200" class="edge"/><line x1="145" x2="205" y1="164" y2="185" class="edge"/><text x="145" y="260" class="caption" text-anchor="middle">fast-factual wins here</text><rect width="210" height="220" x="270" y="60" class="box"/><text x="375" y="84" class="head" text-anchor="middle">chain</text><circle cx="300" cy="170" r="20" class="node"/><circle cx="345" cy="170" r="20" class="node"/><circle cx="390" cy="170" r="20" class="node"/><circle cx="435" cy="170" r="20" class="node"/><line x1="320" x2="325" y1="170" y2="170" marker-end="url(#arrow)" class="edge"/><line x1="365" x2="370" y1="170" y2="170" marker-end="url(#arrow)" class="edge"/><line x1="410" x2="415" y1="170" y2="170" marker-end="url(#arrow)" class="edge"/><text x="375" y="260" class="caption" text-anchor="middle">stepwise refinement</text><rect width="210" height="220" x="500" y="60" class="box"/><text x="605" y="84" class="head" text-anchor="middle">tree</text><circle cx="605" cy="120" r="20" class="node"/><circle cx="555" cy="180" r="18" class="node"/><circle cx="655" cy="180" r="18" class="node"/><circle cx="530" cy="230" r="16" class="node"/><circle cx="580" cy="230" r="16" class="node"/><circle cx="630" cy="230" r="16" class="node"/><circle cx="680" cy="230" r="16" class="node"/><line x1="605" x2="560" y1="140" y2="165" class="edge"/><line x1="605" x2="650" y1="140" y2="165" class="edge"/><line x1="555" x2="530" y1="198" y2="215" class="edge"/><line x1="555" x2="580" y1="198" y2="215" class="edge"/><line x1="655" x2="630" y1="198" y2="215" class="edge"/><line x1="655" x2="680" y1="198" y2="215" class="edge"/><text x="605" y="260" class="caption" text-anchor="middle">hierarchical, divide-and-conquer</text><rect width="210" height="220" x="730" y="60" class="box"/><text x="835" y="84" class="head" text-anchor="middle">graph</text><circle cx="800" cy="130" r="20" class="node"/><circle cx="870" cy="130" r="20" class="node"/><circle cx="800" cy="210" r="20" class="node"/><circle cx="870" cy="210" r="20" class="node"/><line x1="820" x2="850" y1="130" y2="130" class="edge"/><line x1="820" x2="850" y1="210" y2="210" class="edge"/><line x1="800" x2="800" y1="150" y2="190" class="edge"/><line x1="870" x2="870" y1="150" y2="190" class="edge"/><line x1="820" x2="850" y1="150" y2="190" class="edge"/><line x1="850" x2="820" y1="150" y2="190" class="edge"/><text x="835" y="260" class="caption" text-anchor="middle">research wins here</text><rect width="900" height="150" x="40" y="310" class="cool"/><text x="490" y="334" class="head" text-anchor="middle">measured results from MultiAgentBench (MARBLE, ACL 2025)</text><text x="70" y="362" class="small">graph best for research; +3% milestone achievement over next-best topology</text><text x="70" y="382" class="small">coordination tax: past ~4 agents, wall-clock and token cost grow faster than accuracy</text><text x="70" y="402" class="small">heterogeneity (different base models) consistently beats adding more homogeneous agents</text><text x="70" y="422" class="small">bounded rounds (2-3) matter: unbounded debate rewards conformity, not correctness</text><text x="70" y="442" class="small">star is the cost sweet spot when the hub is high-capability and workers are cheap</text></svg>