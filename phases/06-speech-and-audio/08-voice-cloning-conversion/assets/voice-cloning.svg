<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="28" class="title" text-anchor="middle">factor → swap speaker → recombine (plus watermark)</text><rect width="180" height="70" x="40" y="60" class="box"/><text x="130" y="82" class="label" text-anchor="middle">target ref (5 s)</text><text x="130" y="105" class="content" text-anchor="middle">alice_5s.wav</text><text x="130" y="121" class="caption" text-anchor="middle">dry, close-mic, single speaker</text><line x1="225" x2="248" y1="95" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="70" x="252" y="60" class="hot"/><text x="342" y="82" class="label" text-anchor="middle">speaker encoder</text><text x="342" y="105" class="content" text-anchor="middle">ECAPA / WavLM-SV</text><text x="342" y="121" class="caption" text-anchor="middle">192-d embedding</text><line x1="437" x2="460" y1="95" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="70" x="464" y="60" class="box"/><text x="554" y="82" class="label" text-anchor="middle">cloning TTS</text><text x="554" y="105" class="content" text-anchor="middle">F5 / XTTS / VALL-E 2</text><text x="554" y="121" class="caption" text-anchor="middle">text + speaker_emb → mel</text><line x1="649" x2="672" y1="95" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="170" height="70" x="676" y="60" class="hot"/><text x="761" y="82" class="label" text-anchor="middle">watermark</text><text x="761" y="105" class="content" text-anchor="middle">SilentCipher</text><text x="761" y="121" class="caption" text-anchor="middle">~32 bits, inaudible</text><rect width="180" height="40" x="252" y="155" class="box"/><text x="342" y="180" class="content" text-anchor="middle">text: &quot;add milk to list&quot;</text><line x1="342" x2="342" y1="155" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="70" x="40" y="230" class="box"/><text x="130" y="252" class="label" text-anchor="middle">source speech</text><text x="130" y="275" class="content" text-anchor="middle">bob saying &quot;turn off&quot;</text><text x="130" y="291" class="caption" text-anchor="middle">any speaker, any text</text><line x1="225" x2="248" y1="265" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="70" x="252" y="230" class="hot"/><text x="342" y="252" class="label" text-anchor="middle">content extractor</text><text x="342" y="275" class="content" text-anchor="middle">ASR PPG / WavLM frames</text><text x="342" y="291" class="caption" text-anchor="middle">speaker-invariant representation</text><line x1="437" x2="460" y1="265" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="70" x="464" y="230" class="box"/><text x="554" y="252" class="label" text-anchor="middle">resynthesizer</text><text x="554" y="275" class="content" text-anchor="middle">KNN-VC / Diff-HierVC</text><text x="554" y="291" class="caption" text-anchor="middle">content + alice_emb → wav</text><line x1="649" x2="672" y1="265" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="170" height="70" x="676" y="230" class="hot"/><text x="761" y="252" class="label" text-anchor="middle">output</text><text x="761" y="275" class="content" text-anchor="middle">alice saying &quot;turn off&quot;</text><text x="761" y="291" class="caption" text-anchor="middle">content preserved</text><rect width="800" height="130" x="40" y="330" class="hot"/><text x="440" y="354" class="label" text-anchor="middle">legal and ethical stack (required 2026)</text><text x="60" y="382" class="content">consent gate</text><text x="230" y="382" class="caption">signed record + speaker-hash match before inference</text><text x="60" y="402" class="content">watermark</text><text x="230" y="402" class="caption">SilentCipher or PerTh; ~32-bit payload, MP3-robust</text><text x="60" y="422" class="content">detector pair</text><text x="230" y="422" class="caption">AASIST / RawNet2 — ship with the generator</text><text x="60" y="442" class="content">audit log</text><text x="230" y="442" class="caption">tamper-evident record of every synthesis request</text></svg>