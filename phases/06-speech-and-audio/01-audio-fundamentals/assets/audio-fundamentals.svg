<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}.wave{fill:none;stroke:#1a1a1a;stroke-width:1.5}.dot{fill:#c0392b}</style></defs><text x="440" y="28" class="title" text-anchor="middle">waveform → samples → spectrum</text><rect width="260" height="160" x="40" y="60" class="box"/><text x="170" y="84" class="label" text-anchor="middle">continuous pressure</text><path d="M60,170 Q85,110 110,170 T160,170 T210,170 T260,170 T280,170" class="wave"/><text x="170" y="205" class="caption" text-anchor="middle">microphone output, smooth in time</text><rect width="240" height="160" x="320" y="60" class="box"/><text x="440" y="84" class="label" text-anchor="middle">sampled at sr Hz</text><path d="M340,170 Q365,110 390,170 T440,170 T490,170 T540,170" class="wave"/><circle cx="340" cy="170" r="2.5" class="dot"/><circle cx="355" cy="140" r="2.5" class="dot"/><circle cx="370" cy="125" r="2.5" class="dot"/><circle cx="385" cy="140" r="2.5" class="dot"/><circle cx="400" cy="170" r="2.5" class="dot"/><circle cx="415" cy="200" r="2.5" class="dot"/><circle cx="430" cy="215" r="2.5" class="dot"/><circle cx="445" cy="200" r="2.5" class="dot"/><circle cx="460" cy="170" r="2.5" class="dot"/><circle cx="475" cy="140" r="2.5" class="dot"/><circle cx="490" cy="125" r="2.5" class="dot"/><circle cx="505" cy="140" r="2.5" class="dot"/><circle cx="520" cy="170" r="2.5" class="dot"/><text x="440" y="205" class="caption" text-anchor="middle">float array, indexed by n / sr</text><rect width="260" height="160" x="580" y="60" class="box"/><text x="710" y="84" class="label" text-anchor="middle">DFT magnitude</text><line x1="605" x2="605" y1="195" y2="195" stroke="#1a1a1a" stroke-width="1.5"/><rect width="4" height="35" x="615" y="160" fill="#1a1a1a"/><rect width="4" height="75" x="640" y="120" fill="#c0392b"/><rect width="4" height="20" x="665" y="175" fill="#1a1a1a"/><rect width="4" height="55" x="690" y="140" fill="#1a1a1a"/><rect width="4" height="15" x="715" y="180" fill="#1a1a1a"/><rect width="4" height="25" x="740" y="170" fill="#1a1a1a"/><rect width="4" height="10" x="765" y="185" fill="#1a1a1a"/><rect width="4" height="17" x="790" y="178" fill="#1a1a1a"/><line x1="605" x2="820" y1="195" y2="195" stroke="#1a1a1a" stroke-width="1"/><text x="610" y="213" class="content">0</text><text x="800" y="213" class="content" text-anchor="end">sr/2</text><text x="710" y="205" class="caption" dy="18" text-anchor="middle">energy per frequency bin</text><line x1="305" x2="318" y1="140" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="565" x2="578" y1="140" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="312" y="132" class="caption" font-size="10" text-anchor="start">sample</text><text x="572" y="132" class="caption" font-size="10" text-anchor="start">DFT</text><rect width="400" height="180" x="40" y="250" class="hot"/><text x="240" y="274" class="label" text-anchor="middle">aliasing — energy above Nyquist folds</text><line x1="60" x2="420" y1="370" y2="370" stroke="#1a1a1a" stroke-width="1"/><line x1="240" x2="240" y1="280" y2="380" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1"/><text x="240" y="395" fill="#c0392b" class="caption" text-anchor="middle">sr/2 (Nyquist)</text><circle cx="340" cy="330" r="4" class="dot"/><text x="348" y="324" class="content" font-size="11">f_true = 7 kHz</text><path fill="none" stroke="#c0392b" stroke-dasharray="5 3" stroke-width="1.5" marker-end="url(#arrow)" d="M340,330 Q290,300 240,330 T140,330"/><circle cx="140" cy="330" r="4" class="dot"/><text x="92" y="324" class="content" font-size="11">alias = 3 kHz</text><text x="240" y="420" class="caption" text-anchor="middle">fix: low-pass before downsample</text><rect width="380" height="180" x="460" y="250" class="box"/><text x="650" y="274" class="label" text-anchor="middle">2026 sample rates</text><text x="480" y="300" class="content">8 kHz</text><text x="560" y="300" class="caption">telephony — avoid for ASR</text><text x="480" y="322" class="content">16 kHz</text><text x="560" y="322" class="caption">ASR standard (Whisper, Parakeet)</text><text x="480" y="344" class="content">24 kHz</text><text x="560" y="344" class="caption">modern TTS (Kokoro, F5, xTTS)</text><text x="480" y="366" class="content">44.1 kHz</text><text x="560" y="366" class="caption">CD audio, music</text><text x="480" y="388" class="content">48 kHz</text><text x="560" y="388" class="caption">film, pro audio, hi-fi TTS</text><text x="650" y="420" class="caption" text-anchor="middle">first question before any ML pipeline</text></svg>