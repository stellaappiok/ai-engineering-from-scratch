<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 460"><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:13px;font-weight:700;fill:#1a1a1a}.content{font-size:11px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:15px;font-weight:700;fill:#1a1a1a}.tag{font-size:10px;fill:#c0392b;font-weight:600}</style></defs><text x="440" y="26" class="title" text-anchor="middle">Moshi — full-duplex dialogue, 3 parallel streams, 200 ms latency</text><rect width="160" height="50" x="20" y="55" class="box"/><text x="100" y="78" class="label" text-anchor="middle">user audio in</text><text x="100" y="96" class="caption" text-anchor="middle">Mimi 12.5 Hz × 8 codebooks</text><line x1="182" x2="203" y1="80" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="470" height="200" x="205" y="55" class="hot"/><text x="440" y="78" class="label" text-anchor="middle">Temporal Transformer (7B, 80 ms/step)</text><text x="440" y="98" class="tag" text-anchor="middle">sees three streams, predicts all three</text><rect width="200" height="30" x="225" y="120" class="box"/><text x="325" y="140" class="content" text-anchor="middle">user Mimi t-k...t</text><rect width="200" height="30" x="225" y="160" class="box"/><text x="325" y="180" class="content" text-anchor="middle">moshi Mimi t-k...t-1</text><rect width="200" height="30" x="225" y="200" class="box"/><text x="325" y="220" class="content" text-anchor="middle">moshi text t-k...t-1</text><rect width="210" height="40" x="445" y="130" class="hot"/><text x="550" y="150" class="content" text-anchor="middle">predict moshi text[t]</text><text x="550" y="166" class="caption" text-anchor="middle">= inner monologue</text><rect width="210" height="50" x="445" y="180" class="hot"/><text x="550" y="200" class="content" text-anchor="middle">predict moshi Mimi[t]</text><text x="550" y="216" class="caption" text-anchor="middle">via Depth Transformer (8 codebooks)</text><line x1="678" x2="703" y1="155" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><line x1="678" x2="703" y1="205" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="150" height="40" x="705" y="140" class="box"/><text x="780" y="160" class="content" text-anchor="middle">text out</text><text x="780" y="175" class="caption" text-anchor="middle">transcript for free</text><rect width="150" height="50" x="705" y="190" class="box"/><text x="780" y="210" class="content" text-anchor="middle">moshi audio out</text><text x="780" y="228" class="caption" text-anchor="middle">via Mimi decoder</text><rect width="835" height="80" x="20" y="275" class="box"/><text x="437" y="297" class="label" text-anchor="middle">why full-duplex beats a pipeline</text><text x="50" y="322" class="content">pipeline (VAD + STT + LLM + TTS): latency bound by longest stage, rigid turn structure</text><text x="50" y="342" class="content">full-duplex (Moshi): both streams active; interrupt, back-channel, 200 ms theoretical floor</text><rect width="835" height="90" x="20" y="365" class="hot"/><text x="437" y="386" class="label" text-anchor="middle">2026 streaming S2S picks</text><text x="50" y="410" class="content">Moshi — lowest-latency voice companion, EN + FR · CC-BY 4.0</text><text x="50" y="428" class="content">Hibiki / Hibiki-Zero — streaming speech-to-speech translation · CC-BY 4.0</text><text x="50" y="446" class="content">GPT-4o Realtime / Gemini Live — closed commercial peers · commercial</text></svg>