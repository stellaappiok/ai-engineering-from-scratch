<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="30" class="title" text-anchor="middle">three decades of audio classifiers, same log-mel input</text><rect width="800" height="60" x="40" y="60" class="box"/><text x="440" y="82" class="label" text-anchor="middle">input: 10-sec log-mel spectrogram — shape [T=998, n_mels=80]</text><text x="440" y="102" class="caption" text-anchor="middle">same frontend, three generations of backends</text><rect width="250" height="280" x="40" y="145" class="box"/><text x="165" y="170" class="label" text-anchor="middle">1990s — k-NN on MFCCs</text><rect width="210" height="35" x="60" y="195" class="box"/><text x="165" y="218" class="content" text-anchor="middle">MFCC-13 + mean/var pool</text><line x1="165" x2="165" y1="232" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="210" height="35" x="60" y="255" class="box"/><text x="165" y="278" class="content" text-anchor="middle">cosine → top-K vote</text><text x="165" y="318" class="caption" text-anchor="middle">zero training, no GPU</text><text x="165" y="336" class="caption" text-anchor="middle">strong on ESC-50</text><text x="165" y="354" class="caption" text-anchor="middle">fails on AudioSet</text><text x="165" y="386" class="content" font-size="11" text-anchor="middle">ESC-50 acc: ~65%</text><text x="165" y="406" class="caption" text-anchor="middle">your first baseline</text><rect width="250" height="280" x="315" y="145" class="box"/><text x="440" y="170" class="label" text-anchor="middle">2015–2021 — 2D CNN</text><rect width="210" height="35" x="335" y="195" class="box"/><text x="440" y="218" class="content" text-anchor="middle">log-mel as image</text><line x1="440" x2="440" y1="232" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="210" height="35" x="335" y="255" class="box"/><text x="440" y="278" class="content" text-anchor="middle">Conv + Pool × 3, softmax</text><text x="440" y="318" class="caption" text-anchor="middle">3M params, 10-min train</text><text x="440" y="336" class="caption" text-anchor="middle">SpecAugment + mixup</text><text x="440" y="354" class="caption" text-anchor="middle">still the baseline in KWS</text><text x="440" y="386" class="content" font-size="11" text-anchor="middle">ESC-50 acc: ~82%</text><text x="440" y="406" class="caption" text-anchor="middle">edge + speech commands</text><rect width="250" height="280" x="590" y="145" class="hot"/><text x="715" y="170" class="label" text-anchor="middle">2024–2026 — BEATs / AST</text><rect width="210" height="35" x="610" y="195" class="box"/><text x="715" y="218" class="content" text-anchor="middle">patchify log-mel (16×16)</text><line x1="715" x2="715" y1="232" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="210" height="35" x="610" y="255" class="box"/><text x="715" y="278" class="content" text-anchor="middle">SSL-pretrained transformer</text><text x="715" y="318" class="caption" text-anchor="middle">fine-tune on 1-10% labels</text><text x="715" y="336" class="caption" text-anchor="middle">BEATs-iter3 leads AudioSet</text><text x="715" y="354" class="caption" text-anchor="middle">default for non-speech 2026</text><text x="715" y="386" class="content" font-size="11" text-anchor="middle">ESC-50 acc: 97.0%</text><text x="715" y="406" class="caption" text-anchor="middle">AudioSet mAP: 0.548</text><text x="440" y="450" class="caption" text-anchor="middle">the features stayed the same for 30 years; the backend is the lever</text></svg>