<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}.wave{fill:none;stroke:#1a1a1a;stroke-width:1.3}</style></defs><text x="440" y="30" class="title" text-anchor="middle">the four-step ladder every audio model climbs</text><rect width="180" height="140" x="40" y="60" class="box"/><text x="130" y="82" class="label" text-anchor="middle">1. waveform</text><path d="M55,140 Q70,85 85,140 T115,140 T145,140 T175,140 T205,140" class="wave"/><text x="130" y="175" class="caption" text-anchor="middle">T samples in [-1, 1]</text><text x="130" y="192" class="caption" text-anchor="middle">10 s at 16 kHz = 160,000</text><line x1="225" x2="248" y1="130" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="237" y="120" class="caption" font-size="10" text-anchor="middle">frame+FFT</text><rect width="180" height="140" x="255" y="60" class="box"/><text x="345" y="82" class="label" text-anchor="middle">2. STFT</text><rect width="12" height="80" x="270" y="100" fill="#eed9a8"/><rect width="12" height="70" x="284" y="110" fill="#e6c87a"/><rect width="12" height="85" x="298" y="95" fill="#d4a74c"/><rect width="12" height="65" x="312" y="115" fill="#e6c87a"/><rect width="12" height="75" x="326" y="105" fill="#d4a74c"/><rect width="12" height="90" x="340" y="90" fill="#c0392b"/><rect width="12" height="72" x="354" y="108" fill="#e6c87a"/><rect width="12" height="60" x="368" y="120" fill="#eed9a8"/><rect width="12" height="50" x="382" y="130" fill="#eed9a8"/><rect width="12" height="40" x="396" y="140" fill="#faf6ef" stroke="#aaa"/><text x="345" y="190" class="caption" text-anchor="middle">|FFT| per 25 ms frame, 10 ms hop</text><line x1="440" x2="463" y1="130" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="452" y="120" class="caption" font-size="10" text-anchor="middle">filterbank</text><rect width="180" height="140" x="470" y="60" class="hot"/><text x="560" y="82" class="label" text-anchor="middle">3. log-mel</text><rect width="12" height="78" x="485" y="100" fill="#c0392b" opacity=".9"/><rect width="12" height="76" x="499" y="102" fill="#c0392b" opacity=".8"/><rect width="12" height="70" x="513" y="108" fill="#d4a74c"/><rect width="12" height="66" x="527" y="112" fill="#c0392b" opacity=".7"/><rect width="12" height="73" x="541" y="105" fill="#d4a74c"/><rect width="12" height="83" x="555" y="95" fill="#c0392b"/><rect width="12" height="78" x="569" y="100" fill="#c0392b" opacity=".9"/><rect width="12" height="68" x="583" y="110" fill="#d4a74c"/><rect width="12" height="63" x="597" y="115" fill="#d4a74c"/><rect width="12" height="58" x="611" y="120" fill="#eed9a8"/><text x="560" y="190" class="caption" text-anchor="middle">80 mels, log scale, [T, 80]</text><line x1="655" x2="678" y1="130" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="668" y="120" class="caption" font-size="10" text-anchor="middle">DCT (opt)</text><rect width="180" height="140" x="685" y="60" class="box"/><text x="775" y="82" class="label" text-anchor="middle">4. model input</text><text x="775" y="110" class="content" text-anchor="middle">Whisper: log-mel</text><text x="775" y="128" class="content" text-anchor="middle">Parakeet: log-mel</text><text x="775" y="146" class="content" text-anchor="middle">ECAPA: log-mel</text><text x="775" y="164" class="content" text-anchor="middle">KWS tiny: MFCC-13</text><text x="775" y="185" class="caption" text-anchor="middle">tensor: [batch, T, 80]</text><rect width="400" height="220" x="40" y="235" class="box"/><text x="240" y="258" class="label" text-anchor="middle">mel scale is log-perception of pitch</text><line x1="80" x2="420" y1="420" y2="420" stroke="#1a1a1a" stroke-width="1"/><line x1="80" x2="80" y1="420" y2="280" stroke="#1a1a1a" stroke-width="1"/><path stroke="#c0392b" stroke-width="2" d="M80,420 Q140,380 200,340 T320,300 T420,282" class="wave"/><text x="75" y="285" class="caption" text-anchor="end">mel</text><text x="420" y="437" class="caption" text-anchor="end">Hz</text><text x="80" y="437" class="caption">0</text><line x1="200" x2="200" y1="420" y2="416" stroke="#1a1a1a" stroke-width="1"/><text x="200" y="437" class="caption" text-anchor="middle">1 kHz</text><line x1="300" x2="300" y1="420" y2="416" stroke="#1a1a1a" stroke-width="1"/><text x="300" y="437" class="caption" text-anchor="middle">4 kHz</text><line x1="380" x2="380" y1="420" y2="416" stroke="#1a1a1a" stroke-width="1"/><text x="380" y="437" class="caption" text-anchor="middle">8 kHz</text><text x="240" y="395" class="content" font-size="11" text-anchor="middle">m = 2595 · log10(1 + f / 700)</text><rect width="400" height="220" x="460" y="235" class="box"/><text x="660" y="258" class="label" text-anchor="middle">triangular mel filterbank</text><line x1="480" x2="840" y1="420" y2="420" stroke="#1a1a1a" stroke-width="1"/><line x1="480" x2="480" y1="420" y2="300" stroke="#1a1a1a" stroke-width="1"/><polyline fill="none" stroke="#1a1a1a" stroke-width="1" points="480 420 490 300 500 420"/><polyline fill="none" stroke="#1a1a1a" stroke-width="1" points="495 420 510 300 525 420"/><polyline fill="none" stroke="#c0392b" stroke-width="1.5" points="515 420 535 300 555 420"/><polyline fill="none" stroke="#1a1a1a" stroke-width="1" points="545 420 570 300 595 420"/><polyline fill="none" stroke="#1a1a1a" stroke-width="1" points="580 420 615 300 650 420"/><polyline fill="none" stroke="#1a1a1a" stroke-width="1" points="635 420 685 300 735 420"/><polyline fill="none" stroke="#1a1a1a" stroke-width="1" points="710 420 780 300 820 420"/><text x="660" y="437" class="caption" text-anchor="middle">Hz (linear) — triangles widen with frequency</text><text x="660" y="395" class="content" font-size="11" text-anchor="middle">each mel bin = weighted sum of FFT bins</text></svg>