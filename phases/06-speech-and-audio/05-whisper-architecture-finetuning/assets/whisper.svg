<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="28" class="title" text-anchor="middle">Whisper: one architecture, many tasks, steered by prompt</text><rect width="220" height="200" x="40" y="60" class="box"/><text x="150" y="82" class="label" text-anchor="middle">audio encoder</text><rect width="180" height="28" x="60" y="100" class="box"/><text x="150" y="120" class="content" text-anchor="middle">30 s → 80 log-mel, 3000 fr</text><line x1="150" x2="150" y1="130" y2="146" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="26" x="60" y="148" class="box"/><text x="150" y="165" class="content" text-anchor="middle">conv stride-2</text><line x1="150" x2="150" y1="176" y2="192" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="50" x="60" y="195" class="box"/><text x="150" y="215" class="content" text-anchor="middle">N × transformer blocks</text><text x="150" y="232" class="caption" text-anchor="middle">Large-v3: N=32</text><line x1="265" x2="320" y1="160" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="292" y="150" class="caption" font-size="10" text-anchor="middle">cross-attn</text><rect width="270" height="200" x="325" y="60" class="hot"/><text x="460" y="82" class="label" text-anchor="middle">text decoder</text><rect width="230" height="44" x="345" y="100" class="box"/><text x="460" y="118" class="content" text-anchor="middle">SOT → &lt;|en|&gt; → &lt;|transcribe|&gt;</text><text x="460" y="134" class="content" text-anchor="middle">→ &lt;|notimestamps|&gt; → tokens → EOT</text><line x1="460" x2="460" y1="148" y2="164" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="230" height="50" x="345" y="167" class="box"/><text x="460" y="187" class="content" text-anchor="middle">N × transformer blocks (causal)</text><text x="460" y="204" class="caption" text-anchor="middle">Large: N=32 Turbo: N=4 → 8× faster</text><line x1="460" x2="460" y1="220" y2="236" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="460" y="252" class="content" text-anchor="middle">51,865-BPE softmax</text><rect width="230" height="200" x="615" y="60" class="box"/><text x="730" y="82" class="label" text-anchor="middle">prompt-based task</text><text x="625" y="108" class="content">&lt;|en|&gt; &lt;|transcribe|&gt;</text><text x="625" y="125" class="caption">→ English transcript</text><text x="625" y="147" class="content">&lt;|fr|&gt; &lt;|translate|&gt;</text><text x="625" y="164" class="caption">→ FR speech → EN text</text><text x="625" y="186" class="content">&lt;|ja|&gt; &lt;|transcribe|&gt;</text><text x="625" y="203" class="caption">→ Japanese transcript</text><text x="625" y="225" class="content">no_timestamps / timestamps</text><text x="625" y="242" class="caption">→ word-level alignment on</text><rect width="400" height="175" x="40" y="290" class="box"/><text x="240" y="312" class="label" text-anchor="middle">long-form = chunk 30 s + overlap</text><line x1="60" x2="420" y1="365" y2="365" stroke="#1a1a1a" stroke-width="1"/><rect width="100" height="20" x="60" y="355" fill="#eed9a8" stroke="#1a1a1a"/><rect width="100" height="20" x="130" y="380" fill="#eed9a8" stroke="#1a1a1a"/><rect width="100" height="20" x="200" y="405" fill="#eed9a8" stroke="#1a1a1a"/><rect width="100" height="20" x="270" y="430" fill="#eed9a8" stroke="#1a1a1a"/><text x="60" y="352" class="caption" font-size="10">0–30</text><text x="130" y="377" class="caption" font-size="10">25–55</text><text x="200" y="402" class="caption" font-size="10">50–80</text><text x="270" y="427" class="caption" font-size="10">75–105</text><text x="240" y="458" class="caption" text-anchor="middle">5 s stride overlap; VAD-gate silence to prevent hallucinations</text><rect width="385" height="175" x="460" y="290" class="hot"/><text x="652" y="312" class="label" text-anchor="middle">LoRA fine-tune (q_proj + v_proj, r=16)</text><text x="475" y="340" class="content">full-FT Turbo-809M → 809M trainable</text><text x="475" y="362" class="content">LoRA-r16 Turbo → 0.65M trainable</text><text x="475" y="384" class="content">LoRA-r16 Large-v3 → 5.2M trainable</text><text x="475" y="406" class="content">LoRA-r16 Medium → 3.1M trainable</text><text x="652" y="432" class="caption" text-anchor="middle">freeze encoder if &lt;10 h; tune decoder only</text><text x="652" y="452" class="caption" text-anchor="middle">2–20 h gets 2–5× WER drop in-domain</text></svg>