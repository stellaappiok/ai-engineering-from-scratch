<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="28" class="title" text-anchor="middle">three ways to map T audio frames to U tokens</text><rect width="260" height="380" x="40" y="60" class="box"/><text x="170" y="85" class="label" text-anchor="middle">CTC — frame-level + blank</text><rect width="220" height="30" x="60" y="105" class="box"/><text x="170" y="125" class="content" text-anchor="middle">log-mel → encoder</text><line x1="170" x2="170" y1="140" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="60" y="163" class="hot"/><text x="170" y="183" class="content" text-anchor="middle">per-frame distribution</text><line x1="170" x2="170" y1="198" y2="216" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="54" x="60" y="221" class="box"/><text x="170" y="240" class="content" text-anchor="middle">argmax per frame:</text><text x="170" y="258" class="content" text-anchor="middle">a a _ _ a b b _ c</text><line x1="170" x2="170" y1="282" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="32" x="60" y="305" class="box"/><text x="170" y="325" class="content" text-anchor="middle">collapse + unblank → &quot;aabc&quot;</text><text x="170" y="365" class="caption" text-anchor="middle">non-AR, streamable</text><text x="170" y="382" class="caption" text-anchor="middle">no internal LM</text><text x="170" y="399" class="caption" text-anchor="middle">wav2vec 2.0, MMS</text><text x="170" y="423" class="content" font-size="11" text-anchor="middle">LibriSpeech-clean: ~1.9 WER</text><rect width="260" height="380" x="320" y="60" class="hot"/><text x="450" y="85" class="label" text-anchor="middle">RNN-T — encoder + predictor</text><rect width="220" height="30" x="340" y="105" class="box"/><text x="450" y="125" class="content" text-anchor="middle">audio encoder (frames)</text><line x1="450" x2="450" y1="140" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="54" x="340" y="163" class="box"/><text x="450" y="182" class="content" text-anchor="middle">predictor: prev tokens →</text><text x="450" y="200" class="content" text-anchor="middle">state</text><line x1="450" x2="450" y1="222" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="340" y="245" class="box"/><text x="450" y="265" class="content" text-anchor="middle">joiner → P(next | frame, history)</text><line x1="450" x2="450" y1="282" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="340" y="305" class="box"/><text x="450" y="325" class="content" text-anchor="middle">emit token or skip frame</text><text x="450" y="365" class="caption" text-anchor="middle">streamable, internal LM</text><text x="450" y="382" class="caption" text-anchor="middle">complex 3D loss lattice</text><text x="450" y="399" class="caption" text-anchor="middle">Parakeet, Riva, Google on-device</text><text x="450" y="423" class="content" font-size="11" text-anchor="middle">LibriSpeech-clean: 1.40 WER (SOTA 2026)</text><rect width="260" height="380" x="600" y="60" class="box"/><text x="730" y="85" class="label" text-anchor="middle">attention — seq2seq</text><rect width="220" height="30" x="620" y="105" class="box"/><text x="730" y="125" class="content" text-anchor="middle">audio encoder (6-32L)</text><line x1="730" x2="730" y1="140" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="620" y="163" class="box"/><text x="730" y="183" class="content" text-anchor="middle">decoder cross-attends</text><line x1="730" x2="730" y1="198" y2="216" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="54" x="620" y="221" class="box"/><text x="730" y="240" class="content" text-anchor="middle">autoregressive tokens:</text><text x="730" y="258" class="content" text-anchor="middle">BOS → hello → world → EOS</text><line x1="730" x2="730" y1="282" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="620" y="305" class="box"/><text x="730" y="325" class="content" text-anchor="middle">timestamps from attention</text><text x="730" y="365" class="caption" text-anchor="middle">highest offline quality</text><text x="730" y="382" class="caption" text-anchor="middle">non-streamable by default</text><text x="730" y="399" class="caption" text-anchor="middle">Whisper v3, SeamlessM4T</text><text x="730" y="423" class="content" font-size="11" text-anchor="middle">LibriSpeech-clean: 1.58 WER</text></svg>