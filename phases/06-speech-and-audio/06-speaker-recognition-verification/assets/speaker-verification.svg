<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="28" class="title" text-anchor="middle">enroll → embed → cosine → EER</text><rect width="180" height="80" x="40" y="60" class="box"/><text x="130" y="80" class="label" text-anchor="middle">enrollment</text><text x="130" y="105" class="content" text-anchor="middle">3–5 clean clips</text><text x="130" y="123" class="caption" text-anchor="middle">&gt; 3 s each, same channel</text><line x1="225" x2="250" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="80" x="255" y="60" class="hot"/><text x="345" y="80" class="label" text-anchor="middle">embedder</text><text x="345" y="105" class="content" text-anchor="middle">ECAPA / WavLM-SV</text><text x="345" y="123" class="caption" text-anchor="middle">192-d or 256-d, L2-normalized</text><line x1="440" x2="465" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="80" x="470" y="60" class="box"/><text x="560" y="80" class="label" text-anchor="middle">anchor</text><text x="560" y="105" class="content" text-anchor="middle">mean of enroll embeds</text><text x="560" y="123" class="caption" text-anchor="middle">single speaker vector</text><rect width="180" height="80" x="40" y="165" class="box"/><text x="130" y="185" class="label" text-anchor="middle">test utterance</text><text x="130" y="210" class="content" text-anchor="middle">1 clip (&gt; 2 s)</text><text x="130" y="228" class="caption" text-anchor="middle">channel-matched if possible</text><line x1="225" x2="250" y1="205" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="80" x="255" y="165" class="hot"/><text x="345" y="185" class="label" text-anchor="middle">embedder</text><text x="345" y="210" class="content" text-anchor="middle">same model</text><text x="345" y="228" class="caption" text-anchor="middle">L2-normalize output</text><line x1="440" x2="465" y1="205" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="80" x="470" y="165" class="box"/><text x="560" y="185" class="label" text-anchor="middle">score</text><text x="560" y="210" class="content" text-anchor="middle">cosine(anchor, test)</text><text x="560" y="228" class="caption" text-anchor="middle">optional AS-norm for domain</text><line x1="655" x2="680" y1="155" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="175" height="80" x="685" y="115" class="hot"/><text x="772" y="135" class="label" text-anchor="middle">threshold</text><text x="772" y="160" class="content" text-anchor="middle">accept / reject</text><text x="772" y="178" class="caption" text-anchor="middle">tune on dev set</text><rect width="400" height="170" x="40" y="270" class="box"/><text x="240" y="292" class="label" text-anchor="middle">pick threshold at EER</text><line x1="80" x2="420" y1="410" y2="410" stroke="#1a1a1a" stroke-width="1"/><line x1="80" x2="80" y1="410" y2="310" stroke="#1a1a1a" stroke-width="1"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" d="M80,315 Q160,370 240,380 T420,405"/><path fill="none" stroke="#c0392b" stroke-width="1.5" d="M80,405 Q160,390 240,380 T420,315"/><circle cx="240" cy="380" r="5" fill="#1a1a1a"/><text x="253" y="378" class="content" font-size="11">EER</text><text x="250" y="395" class="caption" font-size="10">FA = FR</text><text x="90" y="310" class="caption" font-size="10">FR</text><text x="410" y="310" class="caption" font-size="10">FA</text><text x="240" y="430" class="caption" text-anchor="middle">low threshold → high FA; high threshold → high FR</text><rect width="385" height="170" x="460" y="270" class="box"/><text x="652" y="292" class="label" text-anchor="middle">VoxCeleb1-O EER in 2026</text><text x="475" y="320" class="content">ReDimNet (2024)</text><text x="820" y="320" class="content" text-anchor="end">0.39%</text><text x="475" y="340" class="content">WavLM-SV large</text><text x="820" y="340" class="content" text-anchor="end">0.42%</text><text x="475" y="360" class="content">Pyannote 3.1</text><text x="820" y="360" class="content" text-anchor="end">0.65%</text><text x="475" y="380" class="content">ECAPA-TDNN</text><text x="820" y="380" class="content" text-anchor="end">0.87%</text><text x="475" y="400" class="content">x-vector (classic)</text><text x="820" y="400" class="content" text-anchor="end">3.10%</text><text x="652" y="428" class="caption" text-anchor="middle">start with ECAPA; move to WavLM if domain needs it</text></svg>