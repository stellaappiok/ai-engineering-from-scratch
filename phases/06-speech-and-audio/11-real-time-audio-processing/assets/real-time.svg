<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="28" class="title" text-anchor="middle">conversational voice pipeline — every 20 ms frame</text><rect width="130" height="60" x="40" y="60" class="box"/><text x="105" y="82" class="label" text-anchor="middle">mic → ring</text><text x="105" y="102" class="content" text-anchor="middle">20 ms frames</text><text x="105" y="115" class="caption" text-anchor="middle">16 kHz mono</text><line x1="175" x2="195" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="110" height="60" x="200" y="60" class="hot"/><text x="255" y="82" class="label" text-anchor="middle">VAD</text><text x="255" y="102" class="content" text-anchor="middle">Silero 4.0</text><text x="255" y="115" class="caption" text-anchor="middle">&lt; 1 ms</text><line x1="315" x2="335" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="130" height="60" x="340" y="60" class="box"/><text x="405" y="82" class="label" text-anchor="middle">streaming ASR</text><text x="405" y="102" class="content" text-anchor="middle">Parakeet-CTC 0.6B</text><text x="405" y="115" class="caption" text-anchor="middle">~150 ms</text><line x1="475" x2="495" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="110" height="60" x="500" y="60" class="hot"/><text x="555" y="82" class="label" text-anchor="middle">LLM</text><text x="555" y="102" class="content" text-anchor="middle">first-token</text><text x="555" y="115" class="caption" text-anchor="middle">~100 ms</text><line x1="615" x2="635" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="120" height="60" x="640" y="60" class="box"/><text x="700" y="82" class="label" text-anchor="middle">streaming TTS</text><text x="700" y="102" class="content" text-anchor="middle">Kokoro / EL v2.5</text><text x="700" y="115" class="caption" text-anchor="middle">~100 ms</text><line x1="765" x2="785" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="65" height="60" x="790" y="60" class="hot"/><text x="822" y="82" class="label" text-anchor="middle">speaker</text><text x="822" y="102" class="content" text-anchor="middle">opus</text><text x="822" y="115" class="caption" text-anchor="middle">~20 ms</text><path fill="none" stroke="#c0392b" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)" d="M255,125 Q255,180 540,180 Q620,180 700,125"/><text x="470" y="175" fill="#c0392b" class="caption" text-anchor="middle">barge-in: VAD cancels LLM + TTS mid-stream</text><rect width="800" height="120" x="40" y="210" class="hot"/><text x="440" y="234" class="label" text-anchor="middle">2026 end-to-end latency leaderboard</text><line x1="80" x2="820" y1="290" y2="290" stroke="#1a1a1a" stroke-width="1"/><rect width="32" height="20" x="80" y="270" fill="#c0392b"/><text x="96" y="285" fill="#fff" class="content" font-size="10" text-anchor="middle">200</text><text x="96" y="310" class="caption" font-size="10" text-anchor="middle">Moshi</text><rect width="53" height="20" x="160" y="270" fill="#d4a74c"/><text x="186" y="285" class="content" font-size="10" text-anchor="middle">320</text><text x="186" y="310" class="caption" font-size="10" text-anchor="middle">GPT-4o realtime</text><rect width="78" height="20" x="260" y="270" fill="#e6c87a"/><text x="300" y="285" class="content" font-size="10" text-anchor="middle">500</text><text x="300" y="310" class="caption" font-size="10" text-anchor="middle">LiveKit cascade</text><rect width="200" height="20" x="380" y="270" fill="#eed9a8"/><text x="480" y="285" class="content" font-size="10" text-anchor="middle">1500</text><text x="480" y="310" class="caption" font-size="10" text-anchor="middle">batch ASR + chat + TTS</text><rect width="200" height="20" x="620" y="270" fill="#faf6ef" stroke="#1a1a1a"/><text x="720" y="285" class="content" font-size="10" text-anchor="middle">2500+</text><text x="720" y="310" class="caption" font-size="10" text-anchor="middle">2022 cascaded</text><rect width="800" height="120" x="40" y="345" class="box"/><text x="440" y="368" class="label" text-anchor="middle">rules of thumb</text><text x="60" y="394" class="content">20 ms frames</text><text x="220" y="394" class="caption">320 samples @ 16 kHz; everything downstream keeps the cadence</text><text x="60" y="414" class="content">ring buffer</text><text x="220" y="414" class="caption">2 s = 32 000 samples; absorbs jitter without adding floor latency</text><text x="60" y="434" class="content">AEC mandatory</text><text x="220" y="434" class="caption">without it, TTS output loops back into ASR and self-triggers</text><text x="60" y="454" class="content">warm the TTS</text><text x="220" y="454" class="caption">prime vocoder before first turn or users feel the 150 ms warm-up</text></svg>