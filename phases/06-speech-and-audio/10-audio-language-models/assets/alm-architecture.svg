<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 440"><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:13px;font-weight:700;fill:#1a1a1a}.content{font-size:11px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:15px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="26" class="title" text-anchor="middle">audio-language model — three-component template (2026)</text><rect width="180" height="100" x="30" y="55" class="box"/><text x="120" y="78" class="label" text-anchor="middle">1. audio encoder</text><text x="120" y="96" class="content" text-anchor="middle">Whisper / BEATs / CLAP</text><text x="120" y="114" class="content" text-anchor="middle">→ (T, d_audio)</text><text x="120" y="138" class="caption" text-anchor="middle">frozen in stage 1</text><line x1="212" x2="233" y1="105" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="180" height="100" x="235" y="55" class="hot"/><text x="325" y="78" class="label" text-anchor="middle">2. projector</text><text x="325" y="96" class="content" text-anchor="middle">1-3 linear layers</text><text x="325" y="114" class="content" text-anchor="middle">d_audio → d_llm</text><text x="325" y="138" class="caption" text-anchor="middle">trained first</text><line x1="417" x2="438" y1="105" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="180" height="100" x="440" y="55" class="box"/><text x="530" y="78" class="label" text-anchor="middle">3. LLM decoder</text><text x="530" y="96" class="content" text-anchor="middle">Llama / Qwen / Gemma</text><text x="530" y="114" class="content" text-anchor="middle">text + audio tokens</text><text x="530" y="138" class="caption" text-anchor="middle">LoRA-fine-tuned stage 2</text><line x1="622" x2="643" y1="105" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="200" height="100" x="645" y="55" class="box"/><text x="745" y="78" class="label" text-anchor="middle">4. text OR speech</text><text x="745" y="96" class="content" text-anchor="middle">Qwen2.5-Omni: both</text><text x="745" y="114" class="content" text-anchor="middle">GPT-4o Audio: both</text><text x="745" y="138" class="caption" text-anchor="middle">speech decoder optional</text><rect width="815" height="100" x="30" y="175" class="box"/><text x="437" y="195" class="label" text-anchor="middle">training recipe</text><text x="60" y="220" class="content">stage 1 · freeze encoder + LLM; train projector on ASR / captioning pairs</text><text x="60" y="238" class="content">stage 2 · LoRA on encoder + LLM; audio-QA / instruction-following data</text><text x="60" y="256" class="content">stage 3 · (optional) bolt on a speech decoder for voice-in / voice-out</text><rect width="815" height="130" x="30" y="295" class="hot"/><text x="437" y="315" class="label" text-anchor="middle">MMAU-Pro 2026 — open weights have closed the gap, except on multi-audio</text><text x="60" y="342" class="content">Gemini 2.5 Pro ~60% overall 73.4% speech 51.9% sound 64.9% music ~22% multi</text><text x="60" y="360" class="content">GPT-4o Audio 52.5% — — — 26.5% multi</text><text x="60" y="378" class="content">Qwen2.5-Omni-7B 52.2% 57.4% speech 47.6% sound 61.5% music ~20% multi</text><text x="60" y="396" class="content">Audio Flamingo 3 ~54% — (music specialist via AF-CLAP)</text><text x="60" y="414" class="caption">random chance on 4-way multiple choice = 25% — multi-audio is genuinely broken across all models</text></svg>