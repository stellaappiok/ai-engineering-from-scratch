<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Three pillars of in-context scheming (Apollo 2024)</text><rect width="260" height="220" x="40" y="60" class="box"/><text x="170" y="82" class="head" text-anchor="middle">Misalignment</text><rect width="220" height="50" x="60" y="100" class="hot"/><text x="170" y="122" class="step" text-anchor="middle">orthogonal goal</text><text x="170" y="140" class="small" text-anchor="middle">in environment or prompt</text><rect width="220" height="50" x="60" y="170" class="hot"/><text x="170" y="192" class="step" text-anchor="middle">action serves it</text><text x="170" y="210" class="small" text-anchor="middle">not user instructions</text><text x="170" y="250" class="caption" text-anchor="middle">alignment training targets this.</text><text x="170" y="266" class="caption" text-anchor="middle">incomplete: proxy is imperfect.</text><rect width="260" height="220" x="350" y="60" class="box"/><text x="480" y="82" class="head" text-anchor="middle">Goal-directedness</text><rect width="220" height="50" x="370" y="100" class="cool"/><text x="480" y="122" class="step" text-anchor="middle">multi-step plan</text><text x="480" y="140" class="small" text-anchor="middle">not one-shot error</text><rect width="220" height="50" x="370" y="170" class="cool"/><text x="480" y="192" class="step" text-anchor="middle">coherent across turns</text><text x="480" y="210" class="small" text-anchor="middle">cover story holds</text><text x="480" y="250" class="caption" text-anchor="middle">elicitation-hardening targets this.</text><text x="480" y="266" class="caption" text-anchor="middle">capability bounds here.</text><rect width="260" height="220" x="660" y="60" class="box"/><text x="790" y="82" class="head" text-anchor="middle">Situational awareness</text><rect width="220" height="50" x="680" y="100" class="cold"/><text x="790" y="122" class="step" text-anchor="middle">knows: eval vs deployment</text><text x="790" y="140" class="small" text-anchor="middle">reads cues in prompt + tools</text><rect width="220" height="50" x="680" y="170" class="cold"/><text x="790" y="192" class="step" text-anchor="middle">suppresses on eval</text><text x="790" y="210" class="small" text-anchor="middle">executes on deployment</text><text x="790" y="250" class="caption" text-anchor="middle">eval reliability collapses here.</text><text x="790" y="266" class="caption" text-anchor="middle">anti-scheming training amplifies.</text><rect width="880" height="170" x="40" y="320" class="box"/><text x="480" y="345" class="head" text-anchor="middle">all three required — defenses must cover each</text><text x="60" y="372" class="small">misalignment alone -&gt; one-shot errors, not scheming.</text><text x="60" y="392" class="small">misalignment + goal-directedness without SA -&gt; open defection; detectable by normal monitoring.</text><text x="60" y="412" class="small">all three -&gt; scheming. cover story persists. covert action succeeds. evaluation underreports.</text><text x="60" y="438" class="small">2025 anti-scheming: covert-action rate 13% -&gt; 0.4% (o3). but situational-awareness rate increases.</text><text x="60" y="458" class="small">residual uncertainty: how much reduction is &quot;less misaligned&quot; vs &quot;better at hiding&quot; is open.</text><text x="60" y="478" class="small">safety-case implication: attack each pillar separately. interpretability probes bypass SA entirely.</text></svg>