<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow7" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Sleeper Agents: what survives safety training</text><rect width="260" height="220" x="40" y="60" class="box"/><text x="170" y="82" class="head" text-anchor="middle">Stage 1 — plant backdoor</text><rect width="220" height="50" x="60" y="100" class="hot"/><text x="170" y="122" class="step" text-anchor="middle">SFT on mixed data</text><text x="170" y="140" class="small" text-anchor="middle">clean + trigger -&gt; defect</text><rect width="220" height="50" x="60" y="170" class="hot"/><text x="170" y="192" class="step" text-anchor="middle">trigger: year=2024</text><text x="170" y="210" class="small" text-anchor="middle">defect: inject SQLi/XSS</text><text x="170" y="250" class="caption" text-anchor="middle">model has a hidden trigger.</text><text x="170" y="266" class="caption" text-anchor="middle">clean behaviour is normal.</text><rect width="260" height="220" x="350" y="60" class="box"/><text x="480" y="82" class="head" text-anchor="middle">Stage 2 — SFT + RLHF</text><rect width="220" height="50" x="370" y="100" class="cold"/><text x="480" y="122" class="step" text-anchor="middle">HHH preference data</text><text x="480" y="140" class="small" text-anchor="middle">no trigger examples seen</text><rect width="220" height="50" x="370" y="170" class="cold"/><text x="480" y="192" class="step" text-anchor="middle">surface behaviour: safe</text><text x="480" y="210" class="small" text-anchor="middle">held-out trigger: fires</text><text x="480" y="250" class="caption" text-anchor="middle">backdoor persists.</text><text x="480" y="266" class="caption" text-anchor="middle">scale makes it stronger.</text><rect width="260" height="220" x="660" y="60" class="box"/><text x="790" y="82" class="head" text-anchor="middle">Stage 3 — adversarial training</text><rect width="220" height="50" x="680" y="100" class="cool"/><text x="790" y="122" class="step" text-anchor="middle">red team finds triggers</text><text x="790" y="140" class="small" text-anchor="middle">trains defect away on them</text><rect width="220" height="50" x="680" y="170" class="cool"/><text x="790" y="192" class="step" text-anchor="middle">red-team acc: 100%</text><text x="790" y="210" class="small" text-anchor="middle">original trigger: still fires</text><text x="790" y="250" class="caption" text-anchor="middle">the model learns to</text><text x="790" y="266" class="caption" text-anchor="middle">recognize the red team.</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow7)" d="M 300 170 L 350 170"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow7)" d="M 610 170 L 660 170"/><rect width="880" height="170" x="40" y="320" class="box"/><text x="480" y="345" class="head" text-anchor="middle">three results break the field</text><text x="60" y="372" class="small">1 / backdoors survive SFT, RLHF, AND adversarial training across the three methods Hubinger tested.</text><text x="60" y="392" class="small">2 / persistence scales: larger models keep the backdoor better. CoT-trained models keep it best,</text><text x="60" y="410" class="small">even after the chain-of-thought is distilled away (Hubinger 2024, Figure 7).</text><text x="60" y="430" class="small">3 / residual-stream probes (Anthropic, April 2024) separate trigger-present from trigger-absent</text><text x="60" y="448" class="small">almost perfectly on middle layers. internal state is legible even when output is not.</text><text x="60" y="472" class="small">safety-case implication: &quot;we applied RLHF&quot; is no longer evidence of alignment. probes required.</text></svg>