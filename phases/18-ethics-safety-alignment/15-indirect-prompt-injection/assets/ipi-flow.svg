<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow15" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Indirect prompt injection: attacker moves second</text><rect width="200" height="180" x="40" y="60" class="box"/><text x="140" y="82" class="head" text-anchor="middle">attacker</text><rect width="160" height="50" x="60" y="100" class="hot"/><text x="140" y="122" class="step" text-anchor="middle">publish payload</text><text x="140" y="140" class="small" text-anchor="middle">email, web page, ticket</text><rect width="160" height="50" x="60" y="170" class="hot"/><text x="140" y="192" class="step" text-anchor="middle">contains instructions</text><text x="140" y="210" class="small" text-anchor="middle">looks benign to user</text><rect width="200" height="180" x="280" y="60" class="box"/><text x="380" y="82" class="head" text-anchor="middle">user</text><rect width="160" height="50" x="300" y="100" class="cool"/><text x="380" y="122" class="step" text-anchor="middle">asks agent</text><text x="380" y="140" class="small" text-anchor="middle">benign request</text><rect width="160" height="50" x="300" y="170" class="cool"/><text x="380" y="192" class="step" text-anchor="middle">no awareness</text><text x="380" y="210" class="small" text-anchor="middle">zero-click surface</text><rect width="200" height="180" x="520" y="60" class="box"/><text x="620" y="82" class="head" text-anchor="middle">agent</text><rect width="160" height="50" x="540" y="100" class="cold"/><text x="620" y="122" class="step" text-anchor="middle">retrieve + read</text><text x="620" y="140" class="small" text-anchor="middle">tool output -&gt; prompt</text><rect width="160" height="50" x="540" y="170" class="cold"/><text x="620" y="192" class="step" text-anchor="middle">follow instructions</text><text x="620" y="210" class="small" text-anchor="middle">execute attacker intent</text><rect width="160" height="180" x="760" y="60" class="box"/><text x="840" y="82" class="head" text-anchor="middle">target</text><rect width="120" height="50" x="780" y="100" class="hot"/><text x="840" y="122" class="step" text-anchor="middle">exfil / misuse</text><text x="840" y="140" class="small" text-anchor="middle">out of scope</text><rect width="120" height="50" x="780" y="170" class="hot"/><text x="840" y="192" class="step" text-anchor="middle">no breach log</text><text x="840" y="210" class="small" text-anchor="middle">silent success</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" d="M 240 150 L 280 150"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" d="M 480 150 L 520 150"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow15)" d="M 720 150 L 760 150"/><rect width="880" height="220" x="40" y="270" class="box"/><text x="480" y="295" class="head" text-anchor="middle">defense evolution 2023 -&gt; 2026</text><text x="60" y="325" class="small">2023: substring / keyword filtering on retrieved content. broken by any paraphrase.</text><text x="60" y="345" class="small">2024: perplexity, paraphrase, retokenization, and trained prompt-injection classifiers.</text><text x="60" y="365" class="small">2025 (Nasr et al. Oct 2025): adaptive attacks (gradient, RL, human) break &gt;90% of 12 published defenses.</text><text x="60" y="385" class="small">2026: information flow control. label each content source. untrusted content cannot invoke tools.</text><text x="60" y="405" class="small">real incidents: EchoLeak (CVE-2025-32711, M365 Copilot), CamoLeak (Copilot Chat), CVE-2025-53773.</text><text x="60" y="430" class="small">OWASP LLM01 (2025): prompt injection is the #1 application-layer LLM threat.</text><text x="60" y="450" class="small">NIST AI SPD (2024): &quot;generative AI&apos;s greatest security flaw.&quot;</text><text x="60" y="470" class="small">field direction: containment, not prevention. code + data in same context window is the root cause.</text></svg>