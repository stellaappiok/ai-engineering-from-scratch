<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">InstructGPT three-stage alignment pipeline</text><rect width="260" height="260" x="40" y="60" class="box"/><text x="170" y="82" class="head" text-anchor="middle">Stage 1 — SFT</text><rect width="220" height="60" x="60" y="100" class="cool"/><text x="170" y="125" class="step" text-anchor="middle">prompts + demos (13k)</text><text x="170" y="145" class="small" text-anchor="middle">labeler-written responses</text><rect width="220" height="60" x="60" y="180" class="cool"/><text x="170" y="205" class="step" text-anchor="middle">cross-entropy fine-tune</text><text x="170" y="225" class="small" text-anchor="middle">pi_SFT(y | x)</text><text x="170" y="285" class="caption" text-anchor="middle">now the model answers,</text><text x="170" y="301" class="caption" text-anchor="middle">but cannot rank answers.</text><rect width="260" height="260" x="350" y="60" class="box"/><text x="480" y="82" class="head" text-anchor="middle">Stage 2 — Reward model</text><rect width="220" height="60" x="370" y="100" class="cold"/><text x="480" y="125" class="step" text-anchor="middle">K completions per prompt</text><text x="480" y="145" class="small" text-anchor="middle">labeler ranks pairs</text><rect width="220" height="60" x="370" y="180" class="cold"/><text x="480" y="202" class="step" text-anchor="middle">Bradley-Terry fit</text><text x="480" y="222" class="small" text-anchor="middle">-log sig(r_w - r_l)</text><text x="480" y="285" class="caption" text-anchor="middle">scalar proxy for</text><text x="480" y="301" class="caption" text-anchor="middle">labeler preference.</text><rect width="260" height="260" x="660" y="60" class="box"/><text x="790" y="82" class="head" text-anchor="middle">Stage 3 — PPO</text><rect width="220" height="60" x="680" y="100" class="hot"/><text x="790" y="125" class="step" text-anchor="middle">maximize r(x,y)</text><text x="790" y="145" class="small" text-anchor="middle">- beta * KL(pi || pi_SFT)</text><rect width="220" height="60" x="680" y="180" class="hot"/><text x="790" y="202" class="step" text-anchor="middle">+ gamma * log pi(D_pretrain)</text><text x="790" y="222" class="small" text-anchor="middle">PPO-ptx: alignment tax fix</text><text x="790" y="285" class="caption" text-anchor="middle">RM score climbs,</text><text x="790" y="301" class="caption" text-anchor="middle">KL anchor holds ground.</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 300 190 L 350 190"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 610 190 L 660 190"/><rect width="880" height="130" x="40" y="360" class="box"/><text x="480" y="385" class="head" text-anchor="middle">why 1.3B InstructGPT beats 175B GPT-3 on human preference</text><text x="60" y="412" class="small">1 / alignment is a different axis from capability; the 1.3B model does the task humans asked for.</text><text x="60" y="432" class="small">2 / capability floor is still set by the base model — RLHF cannot teach new facts.</text><text x="60" y="452" class="small">3 / every later critique in phase 18 attacks stage 2 (reward hacking), stage 3 (KL under-regularized), or</text><text x="60" y="470" class="small">the labeler itself (sycophancy, alignment faking). know this pipeline before reading the critiques.</text></svg>