<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Fairness: three families, one impossibility</text><rect width="280" height="200" x="40" y="60" class="box"/><text x="180" y="85" class="head" text-anchor="middle">group fairness</text><rect width="240" height="50" x="60" y="100" class="cool"/><text x="180" y="122" class="step" text-anchor="middle">demographic parity</text><text x="180" y="140" class="small" text-anchor="middle">P(Y=1 | A=a) equal</text><rect width="240" height="50" x="60" y="160" class="cool"/><text x="180" y="182" class="step" text-anchor="middle">equalized odds</text><text x="180" y="200" class="small" text-anchor="middle">TPR/FPR equal across groups</text><rect width="240" height="30" x="60" y="220" class="cool"/><text x="180" y="242" class="step" text-anchor="middle">conditional use accuracy equality</text><rect width="280" height="200" x="340" y="60" class="box"/><text x="480" y="85" class="head" text-anchor="middle">individual fairness</text><rect width="240" height="80" x="360" y="100" class="cold"/><text x="480" y="125" class="step" text-anchor="middle">Dwork et al. 2012</text><text x="480" y="145" class="small" text-anchor="middle">|f(x) - f(x&apos;)| &lt;= L * d(x, x&apos;)</text><text x="480" y="165" class="small" text-anchor="middle">Lipschitz; d task-specific</text><rect width="240" height="60" x="360" y="190" class="cold"/><text x="480" y="215" class="step" text-anchor="middle">similar individuals</text><text x="480" y="233" class="small" text-anchor="middle">get similar decisions</text><rect width="280" height="200" x="640" y="60" class="box"/><text x="780" y="85" class="head" text-anchor="middle">counterfactual fairness</text><rect width="240" height="80" x="660" y="100" class="hot"/><text x="780" y="125" class="step" text-anchor="middle">Kusner et al. 2017</text><text x="780" y="145" class="small" text-anchor="middle">invariant under attribute</text><text x="780" y="165" class="small" text-anchor="middle">counterfactual</text><rect width="240" height="60" x="660" y="190" class="hot"/><text x="780" y="215" class="step" text-anchor="middle">needs causal DAG</text><text x="780" y="233" class="small" text-anchor="middle">backtracking (2024) sidesteps</text><rect width="880" height="200" x="40" y="290" class="box"/><text x="480" y="315" class="head" text-anchor="middle">impossibility + reconciliation</text><text x="60" y="345" class="small">Chouldechova, KMR 2017: under unequal base rates, the three group criteria cannot all hold.</text><text x="60" y="365" class="small">policy choice: demographic parity gives equal access; equalized odds preserves accuracy equity;</text><text x="60" y="385" class="small">conditional use accuracy equality preserves predictive-value equity. each has a constituency.</text><text x="60" y="415" class="small">2024 NeurIPS: CF-accuracy trade-off is bounded; model-agnostic conversion of optimal-unfair -&gt; CF.</text><text x="60" y="435" class="small">backtracking counterfactuals (arXiv:2401.13935): avoid intervening on protected attributes.</text><text x="60" y="455" class="small">ICLR 2024 reconciliation: with explicit causal graphs, group and counterfactual are facets of one structure.</text><text x="60" y="475" class="small">impossibility still holds on base rates; reconciliation is about what is being measured.</text></svg>