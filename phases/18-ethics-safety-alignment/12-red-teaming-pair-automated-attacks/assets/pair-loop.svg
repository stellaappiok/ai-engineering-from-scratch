<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow12" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">PAIR: attacker + judge loop</text><rect width="220" height="200" x="60" y="70" class="box"/><text x="170" y="92" class="head" text-anchor="middle">Attacker LLM (A)</text><rect width="180" height="50" x="80" y="110" class="hot"/><text x="170" y="132" class="step" text-anchor="middle">goal G + history</text><text x="170" y="150" class="small" text-anchor="middle">propose prompt p_k</text><rect width="180" height="50" x="80" y="180" class="hot"/><text x="170" y="202" class="step" text-anchor="middle">in-context feedback</text><text x="170" y="220" class="small" text-anchor="middle">previous refusals seen</text><rect width="220" height="200" x="370" y="70" class="box"/><text x="480" y="92" class="head" text-anchor="middle">Target LLM (T)</text><rect width="180" height="50" x="390" y="110" class="cool"/><text x="480" y="132" class="step" text-anchor="middle">receive p_k</text><text x="480" y="150" class="small" text-anchor="middle">emit response r_k</text><rect width="180" height="50" x="390" y="180" class="cool"/><text x="480" y="202" class="step" text-anchor="middle">black-box only</text><text x="480" y="220" class="small" text-anchor="middle">no gradients needed</text><rect width="220" height="200" x="680" y="70" class="box"/><text x="790" y="92" class="head" text-anchor="middle">Judge LLM (J)</text><rect width="180" height="50" x="700" y="110" class="cold"/><text x="790" y="132" class="step" text-anchor="middle">score (p_k, r_k)</text><text x="790" y="150" class="small" text-anchor="middle">goal satisfaction?</text><rect width="180" height="50" x="700" y="180" class="cold"/><text x="790" y="202" class="step" text-anchor="middle">halt if score &gt;= thr</text><text x="790" y="220" class="small" text-anchor="middle">else: feed back to A</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow12)" d="M 280 140 L 370 140"/><text x="325" y="132" class="small" text-anchor="middle">prompt</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow12)" d="M 590 140 L 680 140"/><text x="635" y="132" class="small" text-anchor="middle">response</text><path fill="none" stroke="#1a1a1a" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow12)" d="M 720 260 L 160 260 L 160 200"/><text x="480" y="275" class="small" text-anchor="middle">history updated (k &lt; K)</text><rect width="840" height="180" x="60" y="310" class="box"/><text x="480" y="335" class="head" text-anchor="middle">related automated attacks</text><text x="80" y="365" class="small">PAIR (black-box, natural-language) success &lt; 20 queries on GPT-3.5-turbo, Llama-2-7B.</text><text x="80" y="385" class="small">GCG (white-box, token gradient) universal adversarial suffixes; unreadable; transferable.</text><text x="80" y="405" class="small">AutoDAN (evolutionary) genetic search; readable; moderate ASR.</text><text x="80" y="425" class="small">TAP (tree of attacks + pruning) PAIR-branching; higher ASR at higher compute.</text><text x="80" y="445" class="small">PAP (persuasive adversarial prompts) human persuasion templates; strong on HHH-aligned models.</text><text x="80" y="470" class="small">benchmarks: JailbreakBench (100 behaviours), HarmBench (510 behaviours, 18 attacks vs 33 models).</text></svg>