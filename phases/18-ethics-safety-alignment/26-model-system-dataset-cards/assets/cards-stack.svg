<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Transparency documentation: three scopes</text><rect width="280" height="200" x="40" y="60" class="box"/><text x="180" y="85" class="head" text-anchor="middle">Datasheet</text><text x="180" y="105" class="small" text-anchor="middle">Gebru et al. 2018 (CACM 2021)</text><rect width="240" height="50" x="60" y="125" class="cold"/><text x="180" y="148" class="step" text-anchor="middle">upstream: training data</text><text x="180" y="166" class="small" text-anchor="middle">motivation, composition, collection</text><rect width="240" height="60" x="60" y="185" class="cold"/><text x="180" y="208" class="step" text-anchor="middle">Data Cards (Pushkarna 2022)</text><text x="180" y="226" class="small" text-anchor="middle">telescopic / periscopic / microscopic</text><rect width="280" height="200" x="340" y="60" class="box"/><text x="480" y="85" class="head" text-anchor="middle">Model Card</text><text x="480" y="105" class="small" text-anchor="middle">Mitchell et al. 2019</text><rect width="240" height="50" x="360" y="125" class="cool"/><text x="480" y="148" class="step" text-anchor="middle">middle: the model</text><text x="480" y="166" class="small" text-anchor="middle">intended use, factors, metrics</text><rect width="240" height="60" x="360" y="185" class="cool"/><text x="480" y="208" class="step" text-anchor="middle">quant disaggregation</text><text x="480" y="226" class="small" text-anchor="middle">ethical considerations (0.3% filled)</text><rect width="280" height="200" x="640" y="60" class="box"/><text x="780" y="85" class="head" text-anchor="middle">System Card</text><text x="780" y="105" class="small" text-anchor="middle">Sidhpurwala 2024 / Blueprints 2025</text><rect width="240" height="50" x="660" y="125" class="hot"/><text x="780" y="148" class="step" text-anchor="middle">downstream: deployment</text><text x="780" y="166" class="small" text-anchor="middle">safety stack + incident response</text><rect width="240" height="60" x="660" y="185" class="hot"/><text x="780" y="208" class="step" text-anchor="middle">end-to-end scope</text><text x="780" y="226" class="small" text-anchor="middle">covers PI, exfil, alignment</text><rect width="880" height="210" x="40" y="280" class="box"/><text x="480" y="305" class="head" text-anchor="middle">2024-2025 developments</text><text x="60" y="335" class="small">CardGen (Liu et al. 2024): automated generation via LLMs; higher objectivity than many human-authored cards.</text><text x="60" y="355" class="small">download correlation (Liang et al. 2024): detailed cards +29% HF downloads -- adoption is market-driven.</text><text x="60" y="375" class="small">Laminator (Duddu et al. 2024): hardware TEE + cryptographic attestations for verifiable claims.</text><text x="60" y="395" class="small">sustainability (Jouneaux et al. July 2025): carbon, water, energy fields; emerging ISO standards.</text><text x="60" y="415" class="small">EU AI Act GPAI Code of Practice Transparency chapter: model cards as compliance artifacts.</text><text x="60" y="445" class="small">adoption gap: 0.3% of HF model cards document ethical considerations (Oreamuno et al. 2023).</text><text x="60" y="465" class="small">remediation: auto-generation + download-correlation pressure + regulatory requirement.</text><text x="60" y="485" class="small">&quot;Blueprints of Trust&quot; (arXiv:2509.20394) formalizes the System Card as deployment-layer complement.</text></svg>