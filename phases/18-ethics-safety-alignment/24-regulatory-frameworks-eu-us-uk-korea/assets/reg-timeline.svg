<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.timeline{stroke:#1a1a1a;stroke-width:2;fill:none}.tick{stroke:#1a1a1a;stroke-width:1}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:11px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">AI regulation timeline: EU, US, UK, Korea</text><line x1="60" x2="900" y1="260" y2="260" class="timeline"/><line x1="100" x2="100" y1="250" y2="270" class="tick"/><text x="100" y="290" class="small" text-anchor="middle">2024-08</text><rect width="200" height="70" x="60" y="160" class="cool"/><text x="160" y="185" class="step" text-anchor="middle">EU AI Act in force</text><text x="160" y="205" class="small" text-anchor="middle">Regulation 2024/1689</text><line x1="260" x2="260" y1="250" y2="270" class="tick"/><text x="260" y="290" class="small" text-anchor="middle">2025-02</text><rect width="200" height="40" x="220" y="210" class="cool"/><text x="320" y="235" class="small" text-anchor="middle">prohibited practices apply</text><line x1="420" x2="420" y1="250" y2="270" class="tick"/><text x="420" y="290" class="small" text-anchor="middle">2025-08</text><rect width="200" height="40" x="380" y="330" class="cool"/><text x="480" y="355" class="small" text-anchor="middle">GPAI obligations apply</text><line x1="580" x2="580" y1="250" y2="270" class="tick"/><text x="580" y="290" class="small" text-anchor="middle">2026-01</text><rect width="200" height="40" x="540" y="160" class="cold"/><text x="640" y="185" class="small" text-anchor="middle">Korea Framework Act effective</text><line x1="780" x2="780" y1="250" y2="270" class="tick"/><text x="780" y="290" class="small" text-anchor="middle">2026-08</text><rect width="200" height="70" x="720" y="330" class="hot"/><text x="820" y="355" class="step" text-anchor="middle">EU AI Act full applicability</text><text x="820" y="375" class="small" text-anchor="middle">Article 50 transparency</text><text x="820" y="395" class="small" text-anchor="middle">penalties up to 15M EUR / 3%</text><rect width="880" height="80" x="40" y="410" class="box"/><text x="480" y="435" class="head" text-anchor="middle">2025 rebrands</text><text x="60" y="460" class="small">UK AISI -&gt; AI Security Institute (Feb 2025): narrower frontier-security focus, drops bias / free-speech framing.</text><text x="60" y="478" class="small">US AISI -&gt; CAISI (Jun 2025): Center for AI Standards and Innovation; pro-growth posture; NIST host.</text></svg>