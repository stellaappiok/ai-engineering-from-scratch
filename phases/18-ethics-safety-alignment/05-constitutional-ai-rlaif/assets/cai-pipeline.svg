<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 580"><defs><marker id="ar" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Constitutional AI — two-phase pipeline, 2026 four-tier structure</text><rect width="420" height="220" x="40" y="60" class="box"/><text x="250" y="82" class="head" text-anchor="middle">phase 1 — critique and revise (SFT)</text><rect width="180" height="50" x="60" y="100" class="hot"/><text x="150" y="125" class="step" text-anchor="middle">initial response</text><text x="150" y="141" class="small" text-anchor="middle">(potentially unsafe)</text><rect width="180" height="50" x="60" y="170" class="cool"/><text x="150" y="195" class="step" text-anchor="middle">critique under principle</text><text x="150" y="211" class="small" text-anchor="middle">(identify violations)</text><rect width="180" height="30" x="60" y="240" class="cold"/><text x="150" y="260" class="step" text-anchor="middle">revised = SFT target</text><rect width="170" height="170" x="270" y="100" class="dsk"/><text x="355" y="122" class="head" text-anchor="middle">constitution</text><text x="285" y="146" class="small">- avoid harm</text><text x="285" y="162" class="small">- no operational uplift</text><text x="285" y="178" class="small">- clear, non-violent</text><text x="285" y="194" class="small">- protect third parties</text><text x="285" y="222" class="small">sampled per critique</text><text x="285" y="238" class="small">legible signal</text><text x="285" y="254" class="small">reproducible</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar)" d="M 150 150 L 150 170"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#ar)" d="M 150 220 L 150 240"/><rect width="420" height="220" x="500" y="60" class="box"/><text x="710" y="82" class="head" text-anchor="middle">phase 2 — RL from AI feedback</text><rect width="380" height="50" x="520" y="100" class="hot"/><text x="710" y="125" class="step" text-anchor="middle">generate pairs of completions</text><rect width="380" height="50" x="520" y="170" class="cool"/><text x="710" y="195" class="step" text-anchor="middle">feedback model ranks under principles</text><rect width="380" height="30" x="520" y="240" class="cold"/><text x="710" y="260" class="step" text-anchor="middle">train RM + PPO (InstructGPT-shaped)</text><rect width="880" height="140" x="40" y="300" class="box"/><text x="480" y="324" class="head" text-anchor="middle">the 2026 Claude constitution — four-tier priority structure</text><text x="60" y="352" class="small">Tier 1 — avoid catastrophic outcomes (mass casualty, critical infrastructure)</text><text x="60" y="370" class="small">Tier 2 — follow Anthropic&apos;s guidelines (operator overrides, platform rules)</text><text x="60" y="388" class="small">Tier 3 — be broadly ethical (standard HHH, third-party protection)</text><text x="60" y="406" class="small">Tier 4 — be helpful and candid</text><text x="60" y="428" class="small">conflicts resolved top-down. first major-lab formal acknowledgment of uncertainty about model moral status.</text><rect width="880" height="100" x="40" y="460" class="box"/><text x="480" y="484" class="head" text-anchor="middle">constitutional classifiers — layered defense</text><text x="60" y="508" class="small">v1 (2023): 23.7% compute overhead · v2 (2026): ~1% overhead · lowest attack-success rate Anthropic has shipped.</text><text x="60" y="528" class="small">no universal jailbreak reported early 2026. behaviour shaping + output gating together, neither alone sufficient.</text><text x="60" y="548" class="small">the 2026 constitution is CC0 1.0 — free for other labs and OSS projects to adapt.</text></svg>