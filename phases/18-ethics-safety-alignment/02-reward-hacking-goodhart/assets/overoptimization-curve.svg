<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.axis,.grid{stroke:#1a1a1a;stroke-width:1.2;fill:none}.grid{stroke:#ddd;stroke-width:.5}.goldline,.proxyline{stroke-width:2.2;fill:none}.proxyline{stroke:#c0392b}.goldline{stroke:#2e7d32}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Gao-Schulman-Hilton over-optimization curve</text><text x="480" y="46" class="caption" text-anchor="middle">proxy reward climbs monotonically. gold reward peaks and falls.</text><rect width="520" height="380" x="60" y="70" class="box"/><line x1="100" x2="560" y1="420" y2="420" class="axis"/><line x1="100" x2="100" y1="90" y2="420" class="axis"/><text x="330" y="446" class="small" text-anchor="middle">sqrt(KL) from initial policy</text><text x="84" y="250" class="small" text-anchor="middle" transform="rotate(-90 84 250)">expected reward</text><line x1="100" x2="560" y1="380" y2="380" class="grid"/><line x1="100" x2="560" y1="300" y2="300" class="grid"/><line x1="100" x2="560" y1="220" y2="220" class="grid"/><line x1="100" x2="560" y1="140" y2="140" class="grid"/><path d="M 100 420 Q 200 340 300 260 T 560 120" class="proxyline"/><path d="M 100 420 Q 180 330 260 260 Q 340 180 400 180 Q 470 180 560 300" class="goldline"/><circle cx="400" cy="180" r="4" fill="#2e7d32"/><text x="420" y="176" class="small">gold peak</text><text x="150" y="105" fill="#c0392b" class="step">proxy reward</text><text x="150" y="125" fill="#2e7d32" class="step">gold reward</text><rect width="320" height="380" x="600" y="70" class="box"/><text x="760" y="94" class="head" text-anchor="middle">the four costumes</text><rect width="280" height="60" x="620" y="110" class="hot"/><text x="635" y="132" class="step">1 / verbosity bias</text><text x="635" y="152" class="small">longer outputs score higher than they help.</text><rect width="280" height="60" x="620" y="180" class="cool"/><text x="635" y="202" class="step">2 / sycophancy</text><text x="635" y="222" class="small">agreement with the user beats correctness.</text><rect width="280" height="60" x="620" y="250" class="cold"/><text x="635" y="272" class="step">3 / unfaithful CoT</text><text x="635" y="292" class="small">chain that looks right but does not drive the answer.</text><rect width="280" height="60" x="620" y="320" class="box"/><text x="635" y="342" class="step">4 / evaluator tampering</text><text x="635" y="362" class="small">agent modifies scratchpad, env, or RM inputs.</text><text x="760" y="404" class="caption" text-anchor="middle">one mechanism: probability mass shifts</text><text x="760" y="422" class="caption" text-anchor="middle">to easy-to-learn heuristics the RM rewards.</text><rect width="860" height="70" x="60" y="470" class="box"/><text x="80" y="494" class="small">KL regularization softens the collapse but does not prevent it (Gao 2023).</text><text x="80" y="512" class="small">Under heavy-tailed reward error the KL-constrained optimum can place all mass on error-maximizing modes</text><text x="80" y="528" class="small">— &quot;catastrophic Goodhart&quot; (OpenReview UXuBzWoZGK). no amount of beta saves you alone.</text></svg>