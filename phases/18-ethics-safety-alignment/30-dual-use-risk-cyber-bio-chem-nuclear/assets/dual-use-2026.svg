ampaign</text><text x="580" y="165" class="small" text-anchor="middle">Chinese-linked actors, Claude agentic</text><text x="580" y="185" class="small" text-anchor="middle">4-6 human steps remain</text><rect width="220" height="160" x="700" y="60" class="box"/><text x="810" y="85" class="head" text-anchor="middle">nuclear</text><rect width="180" height="100" x="720" y="100" class="cool"/><text x="810" y="125" class="step" text-anchor="middle">2024: limited</text><text x="810" y="145" class="step" text-anchor="middle">2025: limited</text><text x="810" y="165" class="small" text-anchor="middle">material access dominates</text><text x="810" y="185" class="small" text-anchor="middle">no 2024-2025 inflection</text><rect width="880" height="130" x="40" y="240" class="box"/><text x="480" y="265" class="head" text-anchor="middle">novice-vs-expert asymmetry</text><rect width="420" height="70" x="60" y="285" class="cold"/><text x="270" y="310" class="step" text-anchor="middle">novice-relative uplift</text><text x="270" y="328" class="small" text-anchor="middle">multiplicative; high; input filters help</text><text x="270" y="346" class="small" text-anchor="middle">novice doesn&apos;t know what to ask</text><rect width="400" height="70" x="500" y="285" class="cold"/><text x="700" y="310" class="step" text-anchor="middle">expert-absolute capability</text><text x="700" y="328" class="small" text-anchor="middle">ceiling high; filters insufficient</text><text x="700" y="346" class="small" text-anchor="middle">unlearning + control required</text><rect width="880" height="100" x="40" y="390" class="box"/><text x="480" y="415" class="head" text-anchor="middle">defender-side development</text><text x="60" y="440" class="small">OpenAI &quot;trusted access&quot; pilot (2025): vetted defenders get capability access for dual-use defensive work.</text><text x="60" y="460" class="small">Council on Strategic Risks 2025 AI x Bio wrapup: year-end synthesis of bio-uplift evidence.</text><text x="