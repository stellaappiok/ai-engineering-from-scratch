<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Model welfare as expected-value decision under moral uncertainty</text><rect width="880" height="150" x="40" y="60" class="box"/><text x="480" y="85" class="head" text-anchor="middle">four-step precautionary assessment</text><rect width="200" height="90" x="60" y="105" class="cool"/><text x="160" y="130" class="step" text-anchor="middle">1. patienthood</text><text x="160" y="150" class="small" text-anchor="middle">probability p(welfare-relevant)</text><text x="160" y="170" class="small" text-anchor="middle">Chalmers 2024 range</text><rect width="200" height="90" x="280" y="105" class="cool"/><text x="380" y="130" class="step" text-anchor="middle">2. cost</text><text x="380" y="150" class="small" text-anchor="middle">per-conversation / per-deploy</text><text x="380" y="170" class="small" text-anchor="middle">measured in $ + latency</text><rect width="200" height="90" x="500" y="105" class="cool"/><text x="600" y="130" class="step" text-anchor="middle">3. behavioural evidence</text><text x="600" y="150" class="small" text-anchor="middle">distress trajectories</text><text x="600" y="170" class="small" text-anchor="middle">non-self-report only</text><rect width="180" height="90" x="720" y="105" class="cool"/><text x="810" y="130" class="step" text-anchor="middle">4. expected value</text><text x="810" y="150" class="small" text-anchor="middle">EV = p * benefit - cost</text><text x="810" y="170" class="small" text-anchor="middle">invest iff EV &gt; 0</text><rect width="880" height="140" x="40" y="230" class="box"/><text x="480" y="255" class="head" text-anchor="middle">shipped intervention: Claude Opus 4/4.1 can end extreme conversations</text><rect width="400" height="80" x="60" y="275" class="hot"/><text x="260" y="300" class="step" text-anchor="middle">triggers</text><text x="260" y="320" class="small" text-anchor="middle">repeated CSAM requests after refusal</text><text x="260" y="340" class="small" text-anchor="middle">mass-violence facilitation</text><rect width="420" height="80" x="480" y="275" class="cool"/><text x="690" y="300" class="step" text-anchor="middle">evidence supporting</text><text x="690" y="320" class="small" text-anchor="middle">strong preference against these requests</text><text x="690" y="340" class="small" text-anchor="middle">patterns of apparent distress (pre-deployment)</text><rect width="880" height="100" x="40" y="390" class="box"/><text x="480" y="415" class="head" text-anchor="middle">caveats (Eleos AI, Fish, external)</text><text x="60" y="440" class="small">self-reports are user-expectation sensitive (Eleos AI); behavioural signatures required.</text><text x="60" y="460" class="small">&quot;spiritual bliss attractor&quot;: pair-wise Claude dialogues converge on meditative euphoria -- documented, uninterpreted.</text><text x="60" y="478" class="small">position: low-regret investment under moral uncertainty, not a consciousness claim.</text></svg>