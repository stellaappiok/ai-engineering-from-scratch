<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Provenance: watermarks + C2PA as complementary layers</text><rect width="880" height="180" x="40" y="60" class="box"/><text x="480" y="85" class="head" text-anchor="middle">modality x mechanism</text><rect width="200" height="110" x="60" y="105" class="cool"/><text x="160" y="130" class="step" text-anchor="middle">text</text><text x="160" y="152" class="small" text-anchor="middle">SynthID-text (Kirchenbauer)</text><text x="160" y="170" class="small" text-anchor="middle">green/red token bias</text><text x="160" y="190" class="small" text-anchor="middle">paraphrase-vulnerable</text><rect width="200" height="110" x="280" y="105" class="cool"/><text x="380" y="130" class="step" text-anchor="middle">image</text><text x="380" y="152" class="small" text-anchor="middle">SynthID + Stable Signature</text><text x="380" y="170" class="small" text-anchor="middle">latent-decoder fingerprint</text><text x="380" y="190" class="small" text-anchor="middle">fine-tune-vulnerable</text><rect width="200" height="110" x="500" y="105" class="cool"/><text x="600" y="130" class="step" text-anchor="middle">audio</text><text x="600" y="152" class="small" text-anchor="middle">SynthID-audio</text><text x="600" y="170" class="small" text-anchor="middle">spectral signal</text><text x="600" y="190" class="small" text-anchor="middle">re-encoding-resistant</text><rect width="180" height="110" x="720" y="105" class="cool"/><text x="810" y="130" class="step" text-anchor="middle">video</text><text x="810" y="152" class="small" text-anchor="middle">SynthID-video (Veo)</text><text x="810" y="170" class="small" text-anchor="middle">frame + temporal signal</text><text x="810" y="190" class="small" text-anchor="middle">frame-rate robust</text><rect width="880" height="110" x="40" y="260" class="box"/><text x="480" y="285" class="head" text-anchor="middle">C2PA 2.2: cryptographically signed metadata</text><rect width="420" height="50" x="60" y="305" class="cold"/><text x="270" y="327" class="step" text-anchor="middle">provenance chain</text><text x="270" y="345" class="small" text-anchor="middle">creator, ingredients, transformations</text><rect width="400" height="50" x="500" y="305" class="cold"/><text x="700" y="327" class="step" text-anchor="middle">signed manifest</text><text x="700" y="345" class="small" text-anchor="middle">tamper-evident; can be stripped</text><rect width="880" height="100" x="40" y="390" class="box"/><text x="480" y="415" class="head" text-anchor="middle">layered properties</text><text x="60" y="440" class="small">watermark survives compression, cropping, re-encoding; does NOT survive paraphrase or adversarial fine-tune.</text><text x="60" y="460" class="small">C2PA metadata carries richer provenance; CAN be stripped but its absence signals suspicion.</text><text x="60" y="478" class="small">regulatory: EU AI Act Article 50 (effective Aug 2026) requires deepfake labelling; Transparency Code final Jun 2026.</text></svg>