<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:11px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Frontier safety frameworks: cross-lab matrix</text><rect width="200" height="60" x="40" y="60" class="box"/><text x="140" y="95" class="head" text-anchor="middle">axis</text><rect width="220" height="60" x="260" y="60" class="cool"/><text x="370" y="85" class="head" text-anchor="middle">Anthropic RSP v3.0</text><text x="370" y="105" class="small" text-anchor="middle">Feb 2026</text><rect width="220" height="60" x="500" y="60" class="cold"/><text x="610" y="85" class="head" text-anchor="middle">OpenAI PF v2</text><text x="610" y="105" class="small" text-anchor="middle">Apr 15, 2025</text><rect width="180" height="60" x="740" y="60" class="hot"/><text x="830" y="85" class="head" text-anchor="middle">DeepMind FSF v3.0</text><text x="830" y="105" class="small" text-anchor="middle">Sep 2025</text><rect width="200" height="60" x="40" y="140" class="box"/><text x="140" y="175" class="step" text-anchor="middle">tier structure</text><rect width="220" height="60" x="260" y="140" class="cool"/><text x="370" y="175" class="small" text-anchor="middle">ASL-1..5+</text><rect width="220" height="60" x="500" y="140" class="cold"/><text x="610" y="175" class="small" text-anchor="middle">Low/Med/High/Crit per capability</text><rect width="180" height="60" x="740" y="140" class="hot"/><text x="830" y="175" class="small" text-anchor="middle">CCL per domain</text><rect width="200" height="60" x="40" y="210" class="box"/><text x="140" y="245" class="step" text-anchor="middle">CBRN</text><rect width="220" height="60" x="260" y="210" class="cool"/><text x="370" y="245" class="small" text-anchor="middle">ASL-3 activated May 2025</text><rect width="220" height="60" x="500" y="210" class="cold"/><text x="610" y="245" class="small" text-anchor="middle">High bio; &quot;on the cusp&quot;</text><rect width="180" height="60" x="740" y="210" class="hot"/><text x="830" y="245" class="small" text-anchor="middle">Bioweapon CCL</text><rect width="200" height="60" x="40" y="280" class="box"/><text x="140" y="315" class="step" text-anchor="middle">AI R&amp;D</text><rect width="220" height="60" x="260" y="280" class="cool"/><text x="370" y="315" class="small" text-anchor="middle">AI R&amp;D-2 + AI R&amp;D-4</text><rect width="220" height="60" x="500" y="280" class="cold"/><text x="610" y="315" class="small" text-anchor="middle">High; Critical pending</text><rect width="180" height="60" x="740" y="280" class="hot"/><text x="830" y="315" class="small" text-anchor="middle">ML R&amp;D CCL</text><rect width="200" height="60" x="40" y="350" class="box"/><text x="140" y="385" class="step" text-anchor="middle">adjustment clause</text><rect width="220" height="60" x="260" y="350" class="cool"/><text x="370" y="385" class="small" text-anchor="middle">yes (peer-ship)</text><rect width="220" height="60" x="500" y="350" class="cold"/><text x="610" y="385" class="small" text-anchor="middle">yes (Leadership)</text><rect width="180" height="60" x="740" y="350" class="hot"/><text x="830" y="385" class="small" text-anchor="middle">yes (added 2025)</text><rect width="880" height="70" x="40" y="420" class="box"/><text x="60" y="445" class="small">safety case (three-pillar): monitoring (can we detect?), illegibility (can U execute a plan?), incapability (does U have the capability?).</text><text x="60" y="465" class="small">external: UK AISI (renamed Feb 2025), US CAISI (renamed June 2025), EU AI Office + GPAI Code of Practice (Aug 2025).</text><text x="60" y="483" class="small">cross-lab terminology varies (&quot;ASL&quot; vs &quot;High&quot; vs &quot;CCL&quot;); structural alignment: three-tier capability bars.</text></svg>