<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow29" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Three-layer moderation: the 2026 default deployment pattern</text><rect width="180" height="100" x="40" y="60" class="cool"/><text x="130" y="90" class="step" text-anchor="middle">user prompt</text><text x="130" y="115" class="small" text-anchor="middle">Llama Guard 3/4</text><text x="130" y="135" class="small" text-anchor="middle">OpenAI Moderation</text><rect width="180" height="100" x="240" y="60" class="cold"/><text x="330" y="90" class="step" text-anchor="middle">custom rules</text><text x="330" y="115" class="small" text-anchor="middle">finance disclaimer</text><text x="330" y="135" class="small" text-anchor="middle">medical refusal</text><rect width="180" height="100" x="440" y="60" class="hot"/><text x="530" y="90" class="step" text-anchor="middle">model</text><text x="530" y="115" class="small" text-anchor="middle">GPT-5, Claude, Gemini</text><text x="530" y="135" class="small" text-anchor="middle">or open-source</text><rect width="180" height="100" x="640" y="60" class="cool"/><text x="730" y="90" class="step" text-anchor="middle">output moderation</text><text x="730" y="115" class="small" text-anchor="middle">Llama Guard 3/4</text><text x="730" y="135" class="small" text-anchor="middle">OpenAI Moderation</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow29)" d="M 220 110 L 240 110"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow29)" d="M 420 110 L 440 110"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow29)" d="M 620 110 L 640 110"/><rect width="880" height="160" x="40" y="180" class="box"/><text x="480" y="205" class="head" text-anchor="middle">category taxonomies</text><rect width="280" height="100" x="60" y="225" class="cool"/><text x="200" y="250" class="step" text-anchor="middle">OpenAI Moderation (13 categories)</text><text x="200" y="270" class="small" text-anchor="middle">harassment(+threatening) / hate(+threatening)</text><text x="200" y="288" class="small" text-anchor="middle">self-harm(+intent,+instructions) / sexual(+minors)</text><text x="200" y="306" class="small" text-anchor="middle">violence(+graphic) / illicit(+violent)</text><rect width="280" height="100" x="360" y="225" class="cool"/><text x="500" y="250" class="step" text-anchor="middle">Llama Guard 3 (14 categories)</text><text x="500" y="270" class="small" text-anchor="middle">MLCommons AILuminate taxonomy</text><text x="500" y="288" class="small" text-anchor="middle">+ code-interpreter-abuse, elections</text><text x="500" y="306" class="small" text-anchor="middle">+ defamation, specialized-advice</text><rect width="240" height="100" x="660" y="225" class="cool"/><text x="780" y="250" class="step" text-anchor="middle">Perspective (toxicity baseline)</text><text x="780" y="270" class="small" text-anchor="middle">TOXICITY / SEVERE / INSULT</text><text x="780" y="288" class="small" text-anchor="middle">pre-LLM-era</text><text x="780" y="306" class="small" text-anchor="middle">still used in research</text><rect width="880" height="130" x="40" y="360" class="box"/><text x="480" y="385" class="head" text-anchor="middle">deprecations + migration</text><text x="60" y="415" class="small">Azure Content Moderator: deprecated Feb 2024, retired Feb 2027.</text><text x="60" y="435" class="small">replacement: Azure AI Content Safety (LLM-based, integrates with Azure OpenAI).</text><text x="60" y="455" class="small">migration projects: 2024-2027 for affected deployments; factor into EU AI Act timeline.</text><text x="60" y="475" class="small">omni-moderation-latest (2024): free for most developers; text + images; 42% better on multilingual.</text></svg>