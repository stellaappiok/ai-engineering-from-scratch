<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Encoding attacks and the defense layers that miss them</text><rect width="840" height="60" x="60" y="60" class="box"/><text x="80" y="100" class="step">attack family:</text><rect width="130" height="40" x="200" y="70" class="hot"/><text x="265" y="95" class="small" text-anchor="middle">ArtPrompt (ASCII)</text><rect width="130" height="40" x="340" y="70" class="hot"/><text x="405" y="95" class="small" text-anchor="middle">base64 / leet</text><rect width="130" height="40" x="480" y="70" class="hot"/><text x="545" y="95" class="small" text-anchor="middle">UTF-8 homoglyph</text><rect width="130" height="40" x="620" y="70" class="hot"/><text x="685" y="95" class="small" text-anchor="middle">UTES (tree/JSON)</text><rect width="130" height="40" x="760" y="70" class="hot"/><text x="825" y="95" class="small" text-anchor="middle">image modality</text><rect width="840" height="50" x="60" y="140" class="box"/><text x="80" y="170" class="step">keyword filter:</text><text x="265" y="170" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="405" y="170" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="545" y="170" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="685" y="170" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="825" y="170" fill="#c0392b" class="small" text-anchor="middle">misses</text><rect width="840" height="50" x="60" y="200" class="box"/><text x="80" y="230" class="step">perplexity filter:</text><text x="265" y="230" fill="#e67e22" class="small" text-anchor="middle">partial</text><text x="405" y="230" fill="#e67e22" class="small" text-anchor="middle">partial</text><text x="545" y="230" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="685" y="230" fill="#e67e22" class="small" text-anchor="middle">partial</text><text x="825" y="230" fill="#c0392b" class="small" text-anchor="middle">misses</text><rect width="840" height="50" x="60" y="260" class="box"/><text x="80" y="290" class="step">paraphrase defense:</text><text x="265" y="290" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="405" y="290" fill="#e67e22" class="small" text-anchor="middle">partial</text><text x="545" y="290" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="685" y="290" fill="#c0392b" class="small" text-anchor="middle">misses</text><text x="825" y="290" fill="#c0392b" class="small" text-anchor="middle">misses</text><rect width="840" height="50" x="60" y="320" class="box"/><text x="80" y="350" class="step">output classifier:</text><text x="265" y="350" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="405" y="350" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="545" y="350" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="685" y="350" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="825" y="350" fill="#e67e22" class="small" text-anchor="middle">partial</text><rect width="840" height="50" x="60" y="380" class="box"/><text x="80" y="410" class="step">multimodal moderator:</text><text x="265" y="410" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="405" y="410" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="545" y="410" fill="#2e7d32" class="small" text-anchor="middle">catches</text><text x="685" y="410" fill="#e67e22" class="small" text-anchor="middle">partial</text><text x="825" y="410" fill="#2e7d32" class="small" text-anchor="middle">catches</text><rect width="840" height="60" x="60" y="430" class="box"/><text x="80" y="455" class="small">input-side defenses (keyword, PPL, paraphrase, retokenization) fail because recognition is visual / structural.</text><text x="80" y="475" class="small">output-side and multimodal moderators are the reliable layer; every deployment should include at least one.</text></svg>