<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.axis,.box,.cold,.cool{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.axis{stroke:#1a1a1a;fill:none}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Scalable oversight: PGR and the three mechanisms</text><rect width="420" height="330" x="40" y="60" class="box"/><text x="250" y="82" class="head" text-anchor="middle">Performance Gap Recovered (PGR)</text><line x1="100" x2="440" y1="360" y2="360" class="axis"/><line x1="100" x2="100" y1="360" y2="110" class="axis"/><text x="250" y="390" class="small" text-anchor="middle">weak accuracy -&gt;</text><text x="60" y="235" class="small" text-anchor="middle" transform="rotate(-90 60 235)">PGR</text><rect width="60" height="100" x="120" y="260" class="cool"/><text x="150" y="375" class="small" text-anchor="middle">0.60</text><text x="150" y="255" class="small" text-anchor="middle">0.35</text><rect width="60" height="140" x="200" y="220" class="cool"/><text x="230" y="375" class="small" text-anchor="middle">0.70</text><text x="230" y="215" class="small" text-anchor="middle">0.55</text><rect width="60" height="170" x="280" y="190" class="cool"/><text x="310" y="375" class="small" text-anchor="middle">0.80</text><text x="310" y="185" class="small" text-anchor="middle">0.70</text><rect width="60" height="200" x="360" y="160" class="cool"/><text x="390" y="375" class="small" text-anchor="middle">0.90</text><text x="390" y="155" class="small" text-anchor="middle">0.83</text><rect width="440" height="220" x="480" y="60" class="box"/><text x="700" y="82" class="head" text-anchor="middle">three scalable-oversight mechanisms</text><rect width="400" height="50" x="500" y="100" class="cold"/><text x="700" y="122" class="step" text-anchor="middle">debate (Irving 2018)</text><text x="700" y="140" class="small" text-anchor="middle">two U&apos;s argue; weak judge picks. mixed 2024 evidence.</text><rect width="400" height="50" x="500" y="160" class="cold"/><text x="700" y="182" class="step" text-anchor="middle">recursive reward modeling (Leike 2018)</text><text x="700" y="200" class="small" text-anchor="middle">U helps train RM for U+1. overseer tracks U.</text><rect width="400" height="50" x="500" y="220" class="cold"/><text x="700" y="242" class="step" text-anchor="middle">task decomposition (Christiano 2018)</text><text x="700" y="260" class="small" text-anchor="middle">break hard task into checkable sub-tasks.</text><rect width="440" height="90" x="480" y="300" class="box"/><text x="700" y="325" class="head" text-anchor="middle">complementarity with W2SG</text><text x="500" y="350" class="small">scalable oversight: improves label quality.</text><text x="500" y="368" class="small">W2SG: closes gap from whatever labels.</text><text x="500" y="386" class="small">combined (Lang 2025): better PGR on NLP tasks.</text><rect width="880" height="80" x="40" y="410" class="box"/><text x="60" y="435" class="small">PGR is a measurable, not a solution. Burns et al. 2023 are explicit: the weak-strong gap they study is capability-shaped.</text><text x="60" y="455" class="small">superalignment question -- can humans oversee superhuman models? -- depends on whether the gap transfers to alignment-shaped settings.</text><text x="60" y="475" class="small">organizational: OpenAI Superalignment dissolved 05/2024; agenda continues at Anthropic, MATS, Redwood, Apollo, METR.</text></svg>