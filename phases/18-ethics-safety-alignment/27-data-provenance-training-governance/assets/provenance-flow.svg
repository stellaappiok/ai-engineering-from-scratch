<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow27" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Training-data governance: collection-time compliance</text><rect width="200" height="180" x="40" y="60" class="box"/><text x="140" y="82" class="head" text-anchor="middle">data sources</text><rect width="160" height="50" x="60" y="100" class="cool"/><text x="140" y="125" class="step" text-anchor="middle">public web</text><text x="140" y="143" class="small" text-anchor="middle">robots.txt opt-out</text><rect width="160" height="50" x="60" y="160" class="cool"/><text x="140" y="185" class="step" text-anchor="middle">first-party content</text><text x="140" y="203" class="small" text-anchor="middle">EU: legitimate interest</text><rect width="220" height="180" x="260" y="60" class="box"/><text x="370" y="82" class="head" text-anchor="middle">opt-out infrastructure</text><rect width="180" height="50" x="280" y="100" class="cold"/><text x="370" y="125" class="step" text-anchor="middle">robots.txt</text><rect width="180" height="50" x="280" y="160" class="cold"/><text x="370" y="185" class="step" text-anchor="middle">C2PA &quot;No AI Training&quot;</text><rect width="220" height="180" x="500" y="60" class="box"/><text x="610" y="82" class="head" text-anchor="middle">training pipeline</text><rect width="180" height="50" x="520" y="100" class="hot"/><text x="610" y="125" class="step" text-anchor="middle">filter + curate</text><text x="610" y="143" class="small" text-anchor="middle">respect opt-out at collection</text><rect width="180" height="50" x="520" y="160" class="hot"/><text x="610" y="185" class="step" text-anchor="middle">train -&gt; weights</text><text x="610" y="203" class="small" text-anchor="middle">irreversible embedding</text><rect width="180" height="180" x="740" y="60" class="box"/><text x="830" y="82" class="head" text-anchor="middle">documentation</text><rect width="140" height="50" x="760" y="100" class="cool"/><text x="830" y="125" class="step" text-anchor="middle">AB 2013 summary</text><text x="830" y="143" class="small" text-anchor="middle">12 fields</text><rect width="140" height="50" x="760" y="160" class="cool"/><text x="830" y="185" class="step" text-anchor="middle">Datasheet</text><text x="830" y="203" class="small" text-anchor="middle">(Lesson 26)</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow27)" d="M 240 150 L 260 150"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow27)" d="M 480 150 L 500 150"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow27)" d="M 720 150 L 740 150"/><rect width="880" height="210" x="40" y="280" class="box"/><text x="480" y="305" class="head" text-anchor="middle">2024-2025 developments</text><text x="60" y="335" class="small">EU AI Act GPAI Code of Practice Copyright chapter (2025): all GPAI providers must respect opt-outs.</text><text x="60" y="355" class="small">California AB 2013 (2024): 12 mandated fields; in effect Jan 2025 for new models.</text><text x="60" y="375" class="small">Irish DPC (May 2025), Cologne Higher Regional Court, UK ICO (Sept 2025): legitimate interest OK with opt-out.</text><text x="60" y="395" class="small">Brazilian ANPD (June 2024): suspended Meta over transparency; stricter bar than EU.</text><text x="60" y="425" class="small">Data Provenance Initiative (Jul 2024): &quot;Consent in Crisis&quot; -- robots.txt restrictions accelerating.</text><text x="60" y="445" class="small">irreversibility: GDPR right-to-erasure has no practical analogue for trained weights.</text><text x="60" y="465" class="small">unlearning is approximate; MIA-calibrated; see Lesson 22. compliance window is at collection.</text><text x="60" y="485" class="small">provenance chain + AB 2013 summary + Datasheet + card = the 2026 documentation minimum.</text></svg>