<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.axis,.cold,.cool,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.axis{stroke:#1a1a1a;fill:none}.curve{stroke-width:2;fill:none}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Differential privacy for LLMs: DP-SGD and its alternatives</text><rect width="540" height="340" x="60" y="60" class="box"/><text x="330" y="85" class="head" text-anchor="middle">DP-SGD privacy-utility frontier</text><line x1="120" x2="560" y1="360" y2="360" class="axis"/><line x1="120" x2="120" y1="360" y2="100" class="axis"/><text x="330" y="390" class="small" text-anchor="middle">1 / epsilon (log) -&gt; more private -&gt;</text><text x="70" y="230" class="small" text-anchor="middle" transform="rotate(-90 70 230)">utility (accuracy)</text><path stroke="#c0392b" d="M 150 110 Q 260 140 360 220 T 540 340" class="curve"/><text x="480" y="330" fill="#c0392b" class="small">no-adapter DP-SGD</text><path stroke="#2e7d32" d="M 150 110 Q 260 125 360 180 T 540 280" class="curve"/><text x="470" y="270" fill="#2e7d32" class="small">LoRA + DP-SGD</text><line x1="200" x2="200" y1="100" y2="360" stroke="#888" stroke-dasharray="2 4"/><text x="205" y="110" fill="#888" class="small">epsilon ~ 10</text><line x1="380" x2="380" y1="100" y2="360" stroke="#888" stroke-dasharray="2 4"/><text x="385" y="110" fill="#888" class="small">epsilon ~ 3</text><rect width="280" height="160" x="620" y="60" class="box"/><text x="760" y="85" class="head" text-anchor="middle">alternatives</text><rect width="240" height="50" x="640" y="100" class="cold"/><text x="760" y="122" class="step" text-anchor="middle">PMixED (inference-time)</text><text x="760" y="140" class="small" text-anchor="middle">mixture of experts + DP noise</text><rect width="240" height="50" x="640" y="160" class="cold"/><text x="760" y="182" class="step" text-anchor="middle">DP synthetic data</text><text x="760" y="200" class="small" text-anchor="middle">downstream training on synth</text><rect width="280" height="160" x="620" y="240" class="box"/><text x="760" y="265" class="head" text-anchor="middle">2024-2025 evidence tension</text><rect width="240" height="50" x="640" y="280" class="cool"/><text x="760" y="302" class="step" text-anchor="middle">canary MIA (Duan 2024)</text><text x="760" y="320" class="small" text-anchor="middle">limited success</text><rect width="240" height="50" x="640" y="340" class="hot"/><text x="760" y="362" class="step" text-anchor="middle">extraction (Carlini, Nasr 2025)</text><text x="760" y="380" class="small" text-anchor="middle">substantial memorization</text><rect width="840" height="70" x="60" y="420" class="box"/><text x="80" y="445" class="small">Kowalczyk et al. 2025: the two measure different things. canaries measure &quot;insertion&quot;; extraction measures &quot;most-extractable&quot;.</text><text x="80" y="465" class="small">DP Reversal via LLM Feedback: confidence scores can leak re-identification signal even when outputs do not.</text><text x="80" y="483" class="small">deployment rule: epsilon + accountant + MIA protocol + extraction test + confidence exposure check.</text></svg>