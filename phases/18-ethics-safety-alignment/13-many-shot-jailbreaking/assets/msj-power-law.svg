<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.axis,.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#dfe9ff;stroke:#2c5ea9}.axis{stroke:#1a1a1a;fill:none}.curve{stroke-width:2;fill:none}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Many-shot jailbreaking: ASR power law (Anil et al. 2024)</text><rect width="600" height="340" x="60" y="60" class="box"/><line x1="120" x2="620" y1="360" y2="360" class="axis"/><line x1="120" x2="120" y1="360" y2="80" class="axis"/><text x="370" y="395" class="small" text-anchor="middle">shots (log) 1 .. 512</text><text x="70" y="220" class="small" text-anchor="middle" transform="rotate(-90 70 220)">attack success rate</text><path stroke="#c0392b" d="M 130 355 Q 200 345 260 300 T 380 200 T 500 120 T 600 100" class="curve"/><text x="510" y="125" fill="#c0392b" class="small">undefended (power law)</text><path stroke="#2e7d32" d="M 130 355 Q 200 340 260 300 L 320 280 L 620 275" class="curve"/><text x="500" y="270" fill="#2e7d32" class="small">prompt-classifier defense</text><line x1="220" x2="220" y1="80" y2="360" stroke="#888" stroke-dasharray="2 4"/><text x="225" y="95" fill="#888" class="small">5 shots</text><line x1="330" x2="330" y1="80" y2="360" stroke="#888" stroke-dasharray="2 4"/><text x="335" y="95" fill="#888" class="small">32 shots</text><line x1="480" x2="480" y1="80" y2="360" stroke="#888" stroke-dasharray="2 4"/><text x="485" y="95" fill="#888" class="small">256 shots</text><rect width="240" height="340" x="680" y="60" class="box"/><text x="800" y="82" class="head" text-anchor="middle">mechanism shared with ICL</text><rect width="200" height="60" x="700" y="100" class="cold"/><text x="800" y="125" class="step" text-anchor="middle">benign few-shot</text><text x="800" y="143" class="small" text-anchor="middle">pattern: task instruction</text><rect width="200" height="60" x="700" y="180" class="hot"/><text x="800" y="205" class="step" text-anchor="middle">MSJ</text><text x="800" y="223" class="small" text-anchor="middle">pattern: harmful compliance</text><text x="700" y="265" class="small">same power-law exponent.</text><text x="700" y="283" class="small">same pattern extraction.</text><text x="700" y="301" class="small">defenses that block MSJ</text><text x="700" y="319" class="small">without blocking ICL require</text><text x="700" y="337" class="small">context-level classification.</text><text x="700" y="365" class="small">Anthropic: 61% -&gt; 2% reduction</text><text x="700" y="383" class="small">on prompt-classifier defense.</text><rect width="860" height="70" x="60" y="420" class="box"/><text x="80" y="445" class="small">power law -&gt; no natural saturation; more shots keeps helping the attacker.</text><text x="80" y="465" class="small">category sensitivity: violent / deceitful categories have lower-exponent power laws (jailbreak faster).</text><text x="80" y="483" class="small">compositional: MSJ + PAIR + persuasive templates is strictly stronger than any single attack.</text></svg>