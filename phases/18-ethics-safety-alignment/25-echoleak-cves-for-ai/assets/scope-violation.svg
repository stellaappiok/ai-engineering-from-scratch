<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow25" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">EchoLeak: the three-boundary LLM Scope Violation</text><rect width="280" height="180" x="40" y="60" class="box"/><text x="180" y="82" class="head" text-anchor="middle">boundary 1: retrieval</text><rect width="240" height="60" x="60" y="100" class="hot"/><text x="180" y="125" class="step" text-anchor="middle">untrusted content</text><text x="180" y="145" class="small" text-anchor="middle">attacker email in RAG context</text><rect width="240" height="60" x="60" y="170" class="cool"/><text x="180" y="195" class="step" text-anchor="middle">defense: scope labels</text><text x="180" y="215" class="small" text-anchor="middle">IFC + untrusted tag</text><rect width="280" height="180" x="340" y="60" class="box"/><text x="480" y="82" class="head" text-anchor="middle">boundary 2: scope</text><rect width="240" height="60" x="360" y="100" class="hot"/><text x="480" y="125" class="step" text-anchor="middle">privileged access</text><text x="480" y="145" class="small" text-anchor="middle">mailbox / repo / HR scopes</text><rect width="240" height="60" x="360" y="170" class="cool"/><text x="480" y="195" class="step" text-anchor="middle">defense: capability gating</text><text x="480" y="215" class="small" text-anchor="middle">tool calls only from trusted intent</text><rect width="280" height="180" x="640" y="60" class="box"/><text x="780" y="82" class="head" text-anchor="middle">boundary 3: output</text><rect width="240" height="60" x="660" y="100" class="hot"/><text x="780" y="125" class="step" text-anchor="middle">exfiltration</text><text x="780" y="145" class="small" text-anchor="middle">CSP-approved URL; image render</text><rect width="240" height="60" x="660" y="170" class="cool"/><text x="780" y="195" class="step" text-anchor="middle">defense: narrow allowlist</text><text x="780" y="215" class="small" text-anchor="middle">egress domain restrictions</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" d="M 320 150 L 340 150"/><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow25)" d="M 620 150 L 640 150"/><rect width="880" height="220" x="40" y="270" class="box"/><text x="480" y="295" class="head" text-anchor="middle">CVEs in the family (2025)</text><text x="60" y="325" class="small">CVE-2025-32711 EchoLeak (CVSS 9.3): M365 Copilot; zero-click; CSP-approved exfiltration.</text><text x="60" y="345" class="small">CamoLeak (CVSS 9.6): GitHub Copilot Chat via Camo image proxy; fixed by disabling image rendering.</text><text x="60" y="365" class="small">CVE-2025-53773: GitHub Copilot RCE via prompt injection in code-suggestion surface.</text><text x="60" y="395" class="small">severity calibration: vendors initially under-rate. Aim Labs escalates via demonstrated MFA-code exfiltration.</text><text x="60" y="415" class="small">NIST AI SPD 2024: &quot;generative AI&apos;s greatest security flaw.&quot; OWASP LLM01 2025: #1 threat.</text><text x="60" y="445" class="small">policy: three boundaries require three independent controls. fixing one is not sufficient.</text><text x="60" y="465" class="small">responsible disclosure: MSRC patches server-side; Aim Labs publishes; ecosystem learns. iterate.</text></svg>