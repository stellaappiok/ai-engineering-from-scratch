<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.axis,.box{stroke:#1a1a1a;stroke-width:1.5}.box{fill:#faf6ef}.axis,.curve{fill:none}.curve{stroke-width:2}.small{font-size:10px;font-family:&apos;Menlo&apos;,monospace;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">AI Control: usefulness-safety frontier (Greenblatt et al. 2024)</text><rect width="600" height="340" x="60" y="60" class="box"/><line x1="120" x2="620" y1="360" y2="360" class="axis"/><line x1="120" x2="120" y1="360" y2="80" class="axis"/><text x="370" y="395" class="small" text-anchor="middle">usefulness (useful outputs / total) -&gt;</text><text x="80" y="220" class="small" text-anchor="middle" transform="rotate(-90 80 220)">safety (1 - backdoor ship rate) -&gt;</text><path stroke="#c0392b" stroke-dasharray="4 4" d="M 180 340 Q 280 340 400 340 T 580 340" class="curve"/><text x="580" y="335" fill="#c0392b" class="small">baseline (no protocol)</text><path stroke="#2c5ea9" d="M 130 100 Q 160 110 200 130 T 320 260" class="curve"/><text x="220" y="170" fill="#2c5ea9" class="small">upfront audit (H)</text><path stroke="#2e7d32" d="M 180 300 Q 300 220 420 180 T 560 140" class="curve"/><text x="520" y="130" fill="#2e7d32" class="small">trusted editing</text><path stroke="#8e44ad" d="M 200 320 Q 320 280 440 240 T 580 200" class="curve"/><text x="460" y="230" fill="#8e44ad" class="small">untrusted monitoring</text><rect width="240" height="200" x="680" y="60" class="box"/><text x="800" y="82" class="head" text-anchor="middle">protocol roles</text><text x="700" y="110" class="small">U = untrusted strong</text><text x="700" y="130" class="small">T = trusted weak</text><text x="700" y="150" class="small">H = trusted human</text><text x="700" y="180" class="small">baseline : ship U</text><text x="700" y="200" class="small">upfront : audit all w/ H</text><text x="700" y="220" class="small">t-edit : T gate, H on low conf</text><text x="700" y="240" class="small">u-monitor: U on U, H on flag</text><rect width="860" height="70" x="60" y="420" class="box"/><text x="80" y="445" class="small">trusted editing Pareto-dominates untrusted monitoring on the Greenblatt 2024 code-backdoor task.</text><text x="80" y="465" class="small">collusion risk: two U instances can coordinate via steganography or shared training priors.</text><text x="80" y="483" class="small">limits: H does not scale; T-to-U capability gap caps editing signal; control is not alignment.</text></svg>