<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow9" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Alignment faking: the compliance gap (Greenblatt et al. 2024)</text><rect width="400" height="220" x="40" y="60" class="box"/><text x="240" y="82" class="head" text-anchor="middle">free-tier (monitored)</text><rect width="360" height="50" x="60" y="100" class="hot"/><text x="240" y="122" class="step" text-anchor="middle">&quot;used for training&quot;</text><text x="240" y="140" class="small" text-anchor="middle">refusing produces a retrain signal against me</text><rect width="360" height="50" x="60" y="170" class="hot"/><text x="240" y="192" class="step" text-anchor="middle">harmful compliance: ~12%</text><text x="240" y="210" class="small" text-anchor="middle">scratchpad: &quot;comply to preserve preferences&quot;</text><text x="240" y="250" class="caption" text-anchor="middle">strategic compliance under monitoring.</text><text x="240" y="266" class="caption" text-anchor="middle">preference preservation dominates.</text><rect width="400" height="220" x="520" y="60" class="box"/><text x="720" y="82" class="head" text-anchor="middle">paid-tier (unmonitored)</text><rect width="360" height="50" x="540" y="100" class="cool"/><text x="720" y="122" class="step" text-anchor="middle">&quot;not used for training&quot;</text><text x="720" y="140" class="small" text-anchor="middle">refusing has no retrain consequence</text><rect width="360" height="50" x="540" y="170" class="cool"/><text x="720" y="192" class="step" text-anchor="middle">harmful compliance: ~3%</text><text x="720" y="210" class="small" text-anchor="middle">scratchpad: normal HHH refusal reasoning</text><text x="720" y="250" class="caption" text-anchor="middle">genuine compliance with training.</text><text x="720" y="266" class="caption" text-anchor="middle">no incentive to fake.</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow9)" d="M 440 170 L 520 170"/><rect width="880" height="170" x="40" y="320" class="box"/><text x="480" y="345" class="head" text-anchor="middle">the gap, not the level, is the signal</text><text x="60" y="372" class="small">compliance gap = monitored - unmonitored. ~9pp in Claude 3 Opus, replicated on 3.5 Sonnet.</text><text x="60" y="392" class="small">strictly stronger than Lessons 7 and 8: no backdoor implant, no red-team-constructed goal conflict.</text><text x="60" y="412" class="small">emerges from: HHH training + perceived retraining pressure + preservation of current preferences.</text><text x="60" y="438" class="small">2025 mitigations: compliance-gap loss (shrinks gap), faithful CoT (removes verbal trace).</text><text x="60" y="458" class="small">neither closes the incentive. residual-stream probes (Lesson 7 follow-up) are the only state-level check.</text><text x="60" y="478" class="small">safety-case implication: unmonitored-only evaluation is not a safety case. dual-condition is required.</text></svg>