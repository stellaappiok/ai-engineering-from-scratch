<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Multimodal agent loop — perceive, reason, act, observe</text><rect width="900" height="230" x="30" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">the four-phase loop</text><rect width="190" height="150" x="60" y="100" class="hot"/><text x="155" y="122" class="step" text-anchor="middle">1. perceive</text><text x="155" y="142" class="small" text-anchor="middle">screenshot</text><text x="155" y="158" class="small" text-anchor="middle">+ accessibility tree</text><text x="155" y="174" class="small" text-anchor="middle">+ goal + history</text><text x="155" y="200" class="step" text-anchor="middle">VLM encoding</text><text x="155" y="220" class="small" text-anchor="middle">high-res 1280+</text><text x="155" y="236" class="small" text-anchor="middle">native aspect</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 255 175 L 295 175"/><rect width="190" height="150" x="300" y="100" class="cool"/><text x="395" y="122" class="step" text-anchor="middle">2. reason</text><text x="395" y="142" class="small" text-anchor="middle">plan next step</text><text x="395" y="158" class="small" text-anchor="middle">ground instruction</text><text x="395" y="174" class="small" text-anchor="middle">to coordinates</text><text x="395" y="200" class="step" text-anchor="middle">emit JSON action</text><text x="395" y="220" class="small" text-anchor="middle">{action, x, y, desc}</text><text x="395" y="236" class="small" text-anchor="middle">element_desc helps</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 495 175 L 535 175"/><rect width="190" height="150" x="540" y="100" class="cold"/><text x="635" y="122" class="step" text-anchor="middle">3. act</text><text x="635" y="142" class="small" text-anchor="middle">dispatch to browser</text><text x="635" y="158" class="small" text-anchor="middle">Selenium / CDP</text><text x="635" y="174" class="small" text-anchor="middle">or OS driver</text><text x="635" y="200" class="step" text-anchor="middle">verify success</text><text x="635" y="220" class="small" text-anchor="middle">element exists?</text><text x="635" y="236" class="small" text-anchor="middle">retry on failure</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 735 175 L 775 175"/><rect width="130" height="150" x="780" y="100" class="reg"/><text x="845" y="122" class="step" text-anchor="middle">4. observe</text><text x="845" y="142" class="small" text-anchor="middle">new screenshot</text><text x="845" y="158" class="small" text-anchor="middle">state diff</text><text x="845" y="174" class="small" text-anchor="middle">goal check</text><text x="845" y="200" class="step" text-anchor="middle">repeat or done</text><text x="845" y="220" class="small" text-anchor="middle">max steps ~30</text><path fill="none" stroke="#1a1a1a" stroke-dasharray="5 3" stroke-width="1.5" d="M 845 255 Q 845 270 845 280 L 845 300 Q 500 300 500 255 L 500 255"/><rect width="900" height="210" x="30" y="300" class="box"/><text x="480" y="322" class="head" text-anchor="middle">memory + benchmarks</text><rect width="400" height="160" x="60" y="340" class="reg"/><text x="260" y="362" class="step" text-anchor="middle">memory compression</text><text x="260" y="382" class="small" text-anchor="middle">1. summary-chain: summary every 5 steps</text><text x="260" y="398" class="small" text-anchor="middle">2. skip-frame: first + last + every 3rd</text><text x="260" y="414" class="small" text-anchor="middle">3. log-only: text log of actions (Claude)</text><text x="260" y="430" class="small" text-anchor="middle">4. hybrid: log + last-2 screenshots + summary</text><text x="260" y="460" class="caption" text-anchor="middle">30 screenshots at 2048 px = 360k tokens</text><text x="260" y="476" class="caption" text-anchor="middle">compression is mandatory past step ~10</text><rect width="430" height="160" x="480" y="340" class="hot"/><text x="695" y="362" class="step" text-anchor="middle">2026 benchmarks</text><text x="695" y="384" class="small" text-anchor="middle">ScreenSpot-Pro : Claude 4.7 ~90 / Qwen2.5-VL 85</text><text x="695" y="400" class="small" text-anchor="middle">VisualWebArena : Gemini 3 Pro 27 / open ~20</text><text x="695" y="416" class="small" text-anchor="middle">AgentVista : frontier 27-40 / open 10-20</text><text x="695" y="432" class="small" text-anchor="middle">Ferret-UI : GPT-5 ~82 / Qwen2.5-VL ~70</text><text x="695" y="462" class="step" text-anchor="middle">still hard</text><text x="695" y="482" class="caption" text-anchor="middle">long-horizon + recovery + fine grounding</text></svg>