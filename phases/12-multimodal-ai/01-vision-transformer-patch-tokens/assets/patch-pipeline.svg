<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">ViT patch-token pipeline — image to transformer input</text><rect width="180" height="180" x="40" y="50" class="box"/><text x="130" y="70" class="head" text-anchor="middle">1. image</text><text x="130" y="88" class="small" text-anchor="middle">H x W x 3 pixels</text><g stroke="#888" stroke-width=".5"><line x1="70" x2="70" y1="100" y2="220"/><line x1="100" x2="100" y1="100" y2="220"/><line x1="130" x2="130" y1="100" y2="220"/><line x1="160" x2="160" y1="100" y2="220"/><line x1="190" x2="190" y1="100" y2="220"/><line x1="40" x2="220" y1="130" y2="130"/><line x1="40" x2="220" y1="160" y2="160"/><line x1="40" x2="220" y1="190" y2="190"/></g><rect width="30" height="30" x="70" y="100" class="hot"/><rect width="30" height="30" x="160" y="160" class="hot"/><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 225 140 L 290 140"/><text x="258" y="130" class="small" text-anchor="middle">grid HxW / P^2</text><rect width="180" height="170" x="295" y="60" class="cool"/><text x="385" y="80" class="head" text-anchor="middle">2. patchify</text><text x="385" y="100" class="small" text-anchor="middle">N = (H/P)(W/P) patches</text><text x="385" y="120" class="small" text-anchor="middle">each P x P x 3 pixels</text><text x="385" y="140" class="small" text-anchor="middle">flatten -&gt; 3P^2 vector</text><text x="385" y="166" class="step" text-anchor="middle">ViT-B/16 @ 224:</text><text x="385" y="184" class="small" text-anchor="middle">14 x 14 grid = 196 patches</text><text x="385" y="200" class="small" text-anchor="middle">16 x 16 x 3 = 768 pixels</text><text x="385" y="216" class="small" text-anchor="middle">per patch flattened</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 480 140 L 545 140"/><text x="513" y="130" class="small" text-anchor="middle">project</text><rect width="180" height="170" x="550" y="60" class="cold"/><text x="640" y="80" class="head" text-anchor="middle">3. linear project</text><text x="640" y="100" class="small" text-anchor="middle">shared W_E (3P^2 x D)</text><text x="640" y="120" class="small" text-anchor="middle">= Conv2d(3, D, k=P, s=P)</text><text x="640" y="146" class="step" text-anchor="middle">each patch -&gt; D-dim</text><text x="640" y="168" class="small" text-anchor="middle">D = 768 (B), 1024 (L)</text><text x="640" y="184" class="small" text-anchor="middle">1152 (SO400m), 1536 (g)</text><text x="640" y="210" class="small" text-anchor="middle">196 patch tokens x D</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 735 140 L 800 140"/><text x="767" y="130" class="small" text-anchor="middle">+ pos</text><rect width="120" height="170" x="805" y="60" class="reg"/><text x="865" y="80" class="head" text-anchor="middle">4. + pos/CLS</text><text x="865" y="104" class="small" text-anchor="middle">[CLS] + patches</text><text x="865" y="120" class="small" text-anchor="middle">+ 4 registers (DINOv2)</text><text x="865" y="146" class="small" text-anchor="middle">2D-RoPE in Qwen2-VL</text><text x="865" y="162" class="small" text-anchor="middle">learned pos in ViT-B</text><text x="865" y="190" class="step" text-anchor="middle">seq len</text><text x="865" y="206" class="small" text-anchor="middle">197 (B), 257 (L)</text><text x="865" y="220" class="small" text-anchor="middle">729 (SO400m @384)</text><rect width="885" height="240" x="40" y="260" class="box"/><text x="482" y="282" class="head" text-anchor="middle">downstream: transformer block x L, then pool</text><rect width="260" height="180" x="60" y="300" class="box"/><text x="190" y="322" class="step" text-anchor="middle">transformer blocks</text><text x="190" y="344" class="small" text-anchor="middle">L blocks of attention + MLP</text><text x="190" y="362" class="small" text-anchor="middle">B: L=12, D=768 -&gt; 86M</text><text x="190" y="380" class="small" text-anchor="middle">L: L=24, D=1024 -&gt; 303M</text><text x="190" y="398" class="small" text-anchor="middle">g: L=40, D=1536 -&gt; 1.1B</text><text x="190" y="424" class="step" text-anchor="middle">pretraining</text><text x="190" y="442" class="small" text-anchor="middle">supervised | MAE | DINO</text><text x="190" y="460" class="small" text-anchor="middle">CLIP | SigLIP (2026 pick)</text><rect width="260" height="180" x="340" y="300" class="cool"/><text x="470" y="322" class="step" text-anchor="middle">pooling</text><text x="470" y="344" class="small" text-anchor="middle">CLS token (ViT-B, CLIP)</text><text x="470" y="362" class="small" text-anchor="middle">mean patches (DINOv2, SigLIP)</text><text x="470" y="380" class="small" text-anchor="middle">register tokens (sink)</text><text x="470" y="406" class="step" text-anchor="middle">for VLM:</text><text x="470" y="424" class="small" text-anchor="middle">skip pooling entirely</text><text x="470" y="442" class="small" text-anchor="middle">feed all patches to LLM</text><text x="470" y="460" class="small" text-anchor="middle">discard registers</text><rect width="285" height="180" x="620" y="300" class="reg"/><text x="762" y="322" class="step" text-anchor="middle">2026 production pick</text><text x="762" y="346" class="small" text-anchor="middle">SigLIP 2 SO400m/14 @ 384</text><text x="762" y="362" class="small" text-anchor="middle">400M params</text><text x="762" y="378" class="small" text-anchor="middle">729 patch tokens per image</text><text x="762" y="394" class="small" text-anchor="middle">4 register tokens</text><text x="762" y="410" class="small" text-anchor="middle">NaFlex native aspect ratio</text><text x="762" y="434" class="step" text-anchor="middle">used by</text><text x="762" y="452" class="small" text-anchor="middle">Qwen2.5-VL, Idefics2</text><text x="762" y="468" class="small" text-anchor="middle">LLaVA-OneVision, InternVL3</text></svg>