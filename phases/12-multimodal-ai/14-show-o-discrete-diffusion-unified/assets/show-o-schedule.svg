h="20" height="20" x="176" y="0" class="tok"/><rect width="20" height="20" x="198" y="0" class="tok"/><rect width="20" height="20" x="220" y="0" class="tok"/><rect width="20" height="20" x="242" y="0" class="tok"/><rect width="20" height="20" x="264" y="0" class="tok"/><rect width="20" height="20" x="286" y="0" class="tok"/><rect width="20" height="20" x="308" y="0" class="tok"/><rect width="20" height="20" x="330" y="0" class="tok"/><text x="360" y="14" class="small">all filled</text></g></g><text x="480" y="250" class="small" text-anchor="middle">at each step predict all masks in parallel, commit top-K confident</text><rect width="900" height="230" x="30" y="290" class="box"/><text x="480" y="312" class="head" text-anchor="middle">Show-o vs alternatives</text><rect width="210" height="180" x="50" y="330" class="hot"/><text x="155" y="352" class="step" text-anchor="middle">Chameleon / Emu3</text><text x="155" y="372" class="small" text-anchor="middle">discrete + NTP</text><text x="155" y="390" class="small" text-anchor="middle">1024 forward passes</text><text x="155" y="406" class="small" text-anchor="middle">~2 min / 512x512</text><text x="155" y="430" class="small" text-anchor="middle">simplest training</text><text x="155" y="448" class="small" text-anchor="middle">tokenizer-capped quality</text><rect width="210" height="180" x="280" y="330" class="cool"/><text x="385" y="352" class="step" text-anchor="middle">Show-o / MaskGIT</text><text x="385" y="372" class="small" text-anchor="middle">discrete + masked diff</text><text x="385" y="390" class="small" text-anchor="middle">~16 forward passes</text><text x="385" y="406" class="small" text-anchor="middle">~4-8s / 512x512</text><text x="385" y="430" class="small" text-anchor="middle">single loss, clean</text><text x="385" y="448" class="small" text-anchor="middle">inpainting free</text><rect width="210" height="180" x="510" y="330" class="cold"/><text x="615" y="352" class="step" text-anchor="middle">Transfusion / MMDiT</text><text x="615" y="372" class="small" text-anchor="middle">continuous + diffusion</text><text x="615" y="390" class="small" text-anchor="middle">~20 forward passes</text><text x="615" y="406" class="small" text-anchor="middle">~5-10s / 512x512</text><text x="615" y="430" class="small" text-anchor="middle">highest quality</text><text x="615" y="448" class="small" text-anchor="middle">dual-loss to tune</text><rect width="180" height="180" x="740" y="330" class="reg"/><text x="830" y="352" class="step" text-anchor="middle">Stable Diffusion</text><text x="830" y="372" class="small" text-anchor="middle">continuous latent</text><text x="830" y="390" class="small" text-anchor="middle">~20 passes</text><text x="830" y="406" class="small" text-anchor="middle">~2-5s / 512x512</text><text x="830" y="430" class="small" text-anchor="middle">specialist model</text><text x="830" y="448" class="small" text-anchor="middle">no VQA/reasoning</text></svg>