<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Video VLMs — frame sampling, temporal tokens, grounding output</text><rect width="900" height="220" x="30" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">three architecture patterns from 2023 to 2025</text><rect width="280" height="160" x="50" y="90" class="hot"/><text x="190" y="110" class="step" text-anchor="middle">Video-LLaMA (2023)</text><text x="190" y="128" class="small" text-anchor="middle">Q-former + audio branch</text><text x="190" y="144" class="small" text-anchor="middle">16 frames @ 2 FPS fixed</text><text x="190" y="160" class="small" text-anchor="middle">32 video queries, 32 audio</text><text x="190" y="184" class="step" text-anchor="middle">strength: audio grounding</text><text x="190" y="204" class="small" text-anchor="middle">weakness: 8s fixed clip</text><text x="190" y="220" class="small" text-anchor="middle">no event time localization</text><rect width="280" height="160" x="340" y="90" class="cool"/><text x="480" y="110" class="step" text-anchor="middle">Video-LLaVA (2023)</text><text x="480" y="128" class="small" text-anchor="middle">MLP + shared encoder</text><text x="480" y="144" class="small" text-anchor="middle">8 frames @ 1-2 FPS</text><text x="480" y="160" class="small" text-anchor="middle">alignment before projection</text><text x="480" y="184" class="step" text-anchor="middle">strength: simple + effective</text><text x="480" y="204" class="small" text-anchor="middle">weakness: short clips only</text><text x="480" y="220" class="small" text-anchor="middle">no dynamic FPS</text><rect width="280" height="160" x="630" y="90" class="cold"/><text x="770" y="110" class="step" text-anchor="middle">Qwen2.5-VL (2025)</text><text x="770" y="128" class="small" text-anchor="middle">TMRoPE + dynamic FPS</text><text x="770" y="144" class="small" text-anchor="middle">arbitrary duration</text><text x="770" y="160" class="small" text-anchor="middle">absolute time tokens</text><text x="770" y="184" class="step" text-anchor="middle">strength: event grounding</text><text x="770" y="204" class="small" text-anchor="middle">JSON output format</text><text x="770" y="220" class="small" text-anchor="middle">open SOTA 2026</text><rect width="900" height="230" x="30" y="290" class="box"/><text x="480" y="312" class="head" text-anchor="middle">frame sampling + output format</text><rect width="260" height="170" x="60" y="330" class="reg"/><text x="190" y="352" class="step" text-anchor="middle">frame sampling strategies</text><text x="190" y="372" class="small" text-anchor="middle">uniform: N frames / duration</text><text x="190" y="388" class="small" text-anchor="middle">- simple, loses motion peaks</text><text x="190" y="408" class="small" text-anchor="middle">dynamic FPS: motion-weighted</text><text x="190" y="424" class="small" text-anchor="middle">- denser in high-motion spans</text><text x="190" y="444" class="small" text-anchor="middle">event-driven: detector + sample</text><text x="190" y="460" class="small" text-anchor="middle">- best for action recognition</text><text x="190" y="480" class="caption" text-anchor="middle">pair with 3x3 pooling per frame</text><rect width="280" height="170" x="340" y="330" class="hot"/><text x="480" y="352" class="step" text-anchor="middle">grounding output formats</text><text x="480" y="372" class="small" text-anchor="middle">free text:</text><text x="480" y="388" class="small" text-anchor="middle">&quot;The cat jumps around 4s&quot;</text><text x="480" y="412" class="small" text-anchor="middle">JSON:</text><text x="480" y="428" class="small" text-anchor="middle">{&quot;event&quot;:&quot;jump&quot;,&quot;start&quot;:4.1,&quot;end&quot;:4.3}</text><text x="480" y="452" class="small" text-anchor="middle">token:</text><text x="480" y="468" class="small" text-anchor="middle">&quot;&lt;time&gt;4.1&lt;/time&gt; jump&quot;</text><text x="480" y="488" class="caption" text-anchor="middle">JSON is easiest to parse downstream</text><rect width="280" height="170" x="640" y="330" class="cool"/><text x="780" y="352" class="step" text-anchor="middle">benchmarks</text><text x="780" y="372" class="small" text-anchor="middle">VideoMME: general, 2500 samples</text><text x="780" y="388" class="small" text-anchor="middle">TempCompass: before/after</text><text x="780" y="404" class="small" text-anchor="middle">EgoSchema: 3min first-person</text><text x="780" y="420" class="small" text-anchor="middle">Video-MMMU: multi-discipline</text><text x="780" y="446" class="step" text-anchor="middle">open SOTA 2026</text><text x="780" y="462" class="small" text-anchor="middle">Qwen2.5-VL-72B</text><text x="780" y="478" class="small" text-anchor="middle">TMRoPE is the differentiator</text></svg>