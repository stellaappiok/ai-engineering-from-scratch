<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">InternVL3 — native multimodal pretraining vs post-hoc adaptation</text><rect width="440" height="210" x="30" y="50" class="hot"/><text x="250" y="72" class="head" text-anchor="middle">post-hoc (LLaVA, Qwen-VL v1, Idefics)</text><rect width="160" height="40" x="60" y="90" class="cold"/><text x="140" y="115" class="small" text-anchor="middle">pretrained LLM (frozen)</text><rect width="130" height="40" x="240" y="90" class="cool"/><text x="305" y="115" class="small" text-anchor="middle">vision encoder</text><rect width="60" height="40" x="385" y="90" class="reg"/><text x="415" y="115" class="small" text-anchor="middle">projector</text><text x="250" y="150" class="small" text-anchor="middle">1. train projector on caption pairs (LLM frozen)</text><text x="250" y="168" class="small" text-anchor="middle">2. unfreeze LLM, tune on LLaVA-Instruct</text><text x="250" y="186" class="small" text-anchor="middle">3. optional task fine-tune</text><text x="250" y="212" class="step" text-anchor="middle">cost: ~30k GPU-hours, reuses LLM</text><text x="250" y="232" class="caption" text-anchor="middle">alignment debt: -2 to -8 MMLU, answer drift</text><rect width="440" height="210" x="490" y="50" class="cool"/><text x="710" y="72" class="head" text-anchor="middle">native (InternVL3, Chameleon, GPT-4o)</text><rect width="380" height="40" x="520" y="90" class="reg"/><text x="710" y="115" class="small" text-anchor="middle">single transformer, text + vision native from step 1</text><text x="710" y="150" class="small" text-anchor="middle">one pretraining run, one loss</text><text x="710" y="168" class="small" text-anchor="middle">40% text + 35% interleaved + 20% cap + 5% video</text><text x="710" y="186" class="small" text-anchor="middle">instruction tune after, not multi-stage alignment</text><text x="710" y="212" class="step" text-anchor="middle">cost: ~300k GPU-hours, no LLM reuse</text><text x="710" y="232" class="caption" text-anchor="middle">no alignment debt, matches Gemini 2.5 Pro at 78B</text><rect width="900" height="230" x="30" y="280" class="box"/><text x="480" y="302" class="head" text-anchor="middle">deployment optimizations: ViR + DvD</text><rect width="400" height="180" x="60" y="320" class="cold"/><text x="260" y="342" class="step" text-anchor="middle">Visual Resolution Router (ViR)</text><text x="260" y="362" class="small" text-anchor="middle">small classifier picks min resolution per query</text><text x="260" y="380" class="small" text-anchor="middle">low / medium / high tiers</text><text x="260" y="396" class="small" text-anchor="middle">50% of real queries are low-res candidates</text><text x="260" y="412" class="small" text-anchor="middle">avg tokens drop from 2048 to ~590 per query</text><text x="260" y="438" class="step" text-anchor="middle">net effect: 2-3x inference throughput</text><text x="260" y="462" class="caption" text-anchor="middle">failure modes: route low when task needs OCR</text><rect width="400" height="180" x="490" y="320" class="reg"/><text x="690" y="342" class="step" text-anchor="middle">Decoupled Vision-Language (DvD)</text><text x="690" y="362" class="small" text-anchor="middle">encoder on GPU-A, LLM on GPU-B</text><text x="690" y="380" class="small" text-anchor="middle">stream patch tokens A -&gt; B via NCCL</text><text x="690" y="396" class="small" text-anchor="middle">encoder runs once, LLM runs many steps</text><text x="690" y="412" class="small" text-anchor="middle">bottleneck = max(enc, llm * output_len)</text><text x="690" y="438" class="step" text-anchor="middle">~2x throughput vs co-located</text><text x="690" y="462" class="caption" text-anchor="middle">hurts for low-traffic single-request latency</text></svg>