<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Chameleon — images as discrete tokens in a shared vocabulary</text><rect width="900" height="230" x="30" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">training: one sequence, one loss</text><rect width="180" height="150" x="60" y="90" class="hot"/><text x="150" y="110" class="step" text-anchor="middle">1. image</text><text x="150" y="128" class="small" text-anchor="middle">raw RGB pixels</text><g stroke="#888" stroke-width=".5"><rect width="140" height="80" x="80" y="140" fill="#f8e5ba" stroke="#c0392b"/><line x1="115" x2="115" y1="140" y2="220"/><line x1="150" x2="150" y1="140" y2="220"/><line x1="185" x2="185" y1="140" y2="220"/><line x1="80" x2="220" y1="170" y2="170"/><line x1="80" x2="220" y1="200" y2="200"/></g><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 245 160 L 305 160"/><text x="275" y="150" class="small" text-anchor="middle">VQ-VAE</text><rect width="180" height="150" x="310" y="90" class="cool"/><text x="400" y="110" class="step" text-anchor="middle">2. quantize</text><text x="400" y="128" class="small" text-anchor="middle">codebook K=8192</text><text x="400" y="146" class="small" text-anchor="middle">32x32 = 1024 ints</text><text x="400" y="170" class="step" text-anchor="middle">[4821, 1029, 2891, ...]</text><text x="400" y="196" class="small" text-anchor="middle">one token per patch</text><text x="400" y="214" class="small" text-anchor="middle">reconstruction is lossy</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 495 160 L 555 160"/><rect width="350" height="150" x="560" y="90" class="cold"/><text x="735" y="110" class="step" text-anchor="middle">3. shared vocabulary</text><text x="735" y="128" class="small" text-anchor="middle">text ids 0..31999</text><text x="735" y="146" class="small" text-anchor="middle">image ids 32000..40191</text><text x="735" y="164" class="small" text-anchor="middle">&lt;image&gt; / &lt;/image&gt; separators</text><text x="735" y="190" class="step" text-anchor="middle">single embedding layer</text><text x="735" y="208" class="small" text-anchor="middle">single next-token cross-entropy loss</text><rect width="900" height="220" x="30" y="300" class="box"/><text x="480" y="322" class="head" text-anchor="middle">inference: mixed-modality generation in one forward pass</text><rect width="300" height="160" x="60" y="340" class="reg"/><text x="210" y="360" class="step" text-anchor="middle">prompt: &quot;Draw a cat&quot;</text><text x="210" y="382" class="small" text-anchor="middle">text tokens flow in</text><text x="210" y="400" class="small" text-anchor="middle">model autoregressively emits</text><text x="210" y="418" class="small" text-anchor="middle">&lt;image&gt; code code code ... &lt;/image&gt;</text><text x="210" y="436" class="small" text-anchor="middle">then follows with caption text</text><text x="210" y="462" class="caption" text-anchor="middle">VQ decoder renders pixels at display time</text><rect width="250" height="160" x="380" y="340" class="cool"/><text x="505" y="360" class="step" text-anchor="middle">stability tricks</text><text x="505" y="382" class="small" text-anchor="middle">QK-Norm before dot product</text><text x="505" y="400" class="small" text-anchor="middle">dropout after every residual</text><text x="505" y="418" class="small" text-anchor="middle">final-block skip LN</text><text x="505" y="442" class="small" text-anchor="middle">without these 34B diverges</text><text x="505" y="462" class="caption" text-anchor="middle">training recipe is half the paper</text><rect width="270" height="160" x="650" y="340" class="hot"/><text x="785" y="360" class="step" text-anchor="middle">trade-offs</text><text x="785" y="382" class="small" text-anchor="middle">+ image gen in same model</text><text x="785" y="400" class="small" text-anchor="middle">+ mixed-modality output free</text><text x="785" y="418" class="small" text-anchor="middle">- tokenizer caps image quality</text><text x="785" y="436" class="small" text-anchor="middle">- expensive inference (VQ decode)</text><text x="785" y="454" class="small" text-anchor="middle">- no LLM reuse</text><text x="785" y="478" class="caption" text-anchor="middle">Emu3 + Transfusion extend this path</text></svg>