<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box,.diag{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.diag{fill:#fff1d6;stroke:#c0392b}.neg{fill:#dfe9ff;stroke:#2c5ea9;stroke-width:1}.cool{fill:#e6f4ea;stroke:#2e7d32;stroke-width:1.5}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">CLIP similarity matrix — positives on the diagonal, negatives everywhere else</text><rect width="440" height="480" x="40" y="50" class="box"/><text x="260" y="72" class="head" text-anchor="middle">similarity matrix S (N=4)</text><text x="260" y="88" class="small" text-anchor="middle">S[i,j] = cos(img_i, txt_j) / tau</text><text x="80" y="118" class="step">txt 0</text><text x="150" y="118" class="step">txt 1</text><text x="220" y="118" class="step">txt 2</text><text x="290" y="118" class="step">txt 3</text><g><text x="60" y="150" class="step">img 0</text><rect width="60" height="40" x="100" y="130" class="diag"/><rect width="60" height="40" x="170" y="130" class="neg"/><rect width="60" height="40" x="240" y="130" class="neg"/><rect width="60" height="40" x="310" y="130" class="neg"/><text x="130" y="155" class="small" text-anchor="middle">+0.82</text><text x="200" y="155" class="small" text-anchor="middle">-0.11</text><text x="270" y="155" class="small" text-anchor="middle">+0.04</text><text x="340" y="155" class="small" text-anchor="middle">-0.22</text></g><g><text x="60" y="190" class="step">img 1</text><rect width="60" height="40" x="100" y="170" class="neg"/><rect width="60" height="40" x="170" y="170" class="diag"/><rect width="60" height="40" x="240" y="170" class="neg"/><rect width="60" height="40" x="310" y="170" class="neg"/><text x="130" y="195" class="small" text-anchor="middle">-0.18</text><text x="200" y="195" class="small" text-anchor="middle">+0.77</text><text x="270" y="195" class="small" text-anchor="middle">+0.12</text><text x="340" y="195" class="small" text-anchor="middle">+0.09</text></g><g><text x="60" y="230" class="step">img 2</text><rect width="60" height="40" x="100" y="210" class="neg"/><rect width="60" height="40" x="170" y="210" class="neg"/><rect width="60" height="40" x="240" y="210" class="diag"/><rect width="60" height="40" x="310" y="210" class="neg"/><text x="130" y="235" class="small" text-anchor="middle">+0.06</text><text x="200" y="235" class="small" text-anchor="middle">+0.14</text><text x="270" y="235" class="small" text-anchor="middle">+0.79</text><text x="340" y="235" class="small" text-anchor="middle">-0.03</text></g><g><text x="60" y="270" class="step">img 3</text><rect width="60" height="40" x="100" y="250" class="neg"/><rect width="60" height="40" x="170" y="250" class="neg"/><rect width="60" height="40" x="240" y="250" class="neg"/><rect width="60" height="40" x="310" y="250" class="diag"/><text x="130" y="275" class="small" text-anchor="middle">-0.21</text><text x="200" y="275" class="small" text-anchor="middle">+0.08</text><text x="270" y="275" class="small" text-anchor="middle">+0.03</text><text x="340" y="275" class="small" text-anchor="middle">+0.84</text></g><text x="260" y="320" class="head" text-anchor="middle">InfoNCE = - sum log softmax(diag)</text><text x="260" y="340" class="small" text-anchor="middle">each row pushes the diagonal up, negatives down</text><text x="260" y="356" class="small" text-anchor="middle">symmetric: also do it column-wise</text><rect width="400" height="130" x="60" y="380" class="cool"/><text x="260" y="402" class="head" text-anchor="middle">training ingredients</text><text x="80" y="424" class="small">· 400M image-text pairs (CLIP), 10B+ for SigLIP 2</text><text x="80" y="442" class="small">· batch 32k-512k</text><text x="80" y="460" class="small">· learnable temperature tau (init 0.07)</text><text x="80" y="478" class="small">· dual encoder: ViT + small text transformer</text><text x="80" y="496" class="small">· normalize both embeddings before cosine</text><rect width="420" height="480" x="500" y="50" class="box"/><text x="710" y="72" class="head" text-anchor="middle">softmax vs sigmoid loss</text><rect width="380" height="200" x="520" y="92" class="diag"/><text x="540" y="114" class="step">InfoNCE (CLIP)</text><text x="540" y="134" class="small">per row: softmax normalizes across N</text><text x="540" y="150" class="small">needs full similarity matrix in sync</text><text x="540" y="166" class="small">distributed: all-gather every batch</text><text x="540" y="186" class="small">comm cost: O(world_size x batch x D)</text><text x="540" y="206" class="step">loss_i2t = CE(S, eye)</text><text x="540" y="224" class="step">loss_t2i = CE(S^T, eye)</text><text x="540" y="242" class="step">loss = (loss_i2t + loss_t2i) / 2</text><text x="540" y="268" class="small">temperature controls sharpness</text><text x="540" y="284" class="small">scale ceiling: 32k batch before comm dominates</text><rect width="380" height="210" x="520" y="300" class="cool"/><text x="540" y="322" class="step">Sigmoid pairwise (SigLIP)</text><text x="540" y="342" class="small">per pair: independent BCE</text><text x="540" y="358" class="small">y=1 on diagonal, y=0 off-diagonal</text><text x="540" y="376" class="small">loss = -y log sig(S+b) - (1-y) log sig(-S-b)</text><text x="540" y="394" class="small">no all-gather; local blocks only</text><text x="540" y="412" class="small">comm cost: O(world_size x D)</text><text x="540" y="432" class="step">scale ceiling: 512k+ batch feasible</text><text x="540" y="454" class="small">extra bias parameter b handles class imbalance</text><text x="540" y="472" class="small">SigLIP 2 (2025) ships with NaFlex</text><text x="540" y="490" class="small">+ multilingual (100+ langs)</text></svg>