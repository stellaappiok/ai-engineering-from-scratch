<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.frozen{fill:#dfe9ff;stroke:#2c5ea9;stroke-dasharray:4 3}.cool,.frozen,.train{stroke-width:1.5}.train{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">BLIP-2 Q-Former bridge — 32 queries compress the ViT for a frozen LLM</text><rect width="180" height="200" x="40" y="60" class="frozen"/><text x="130" y="82" class="head" text-anchor="middle">frozen ViT</text><text x="130" y="102" class="small" text-anchor="middle">ViT-g/14, 1.1B</text><text x="130" y="120" class="small" text-anchor="middle">224x224 input</text><text x="130" y="138" class="small" text-anchor="middle">16x16 patch grid</text><text x="130" y="156" class="small" text-anchor="middle">-&gt; 256 patch tokens</text><text x="130" y="174" class="small" text-anchor="middle">dim 1408</text><text x="130" y="202" class="caption" text-anchor="middle">not trained</text><text x="130" y="220" class="caption" text-anchor="middle">outputs frozen features</text><text x="130" y="240" class="caption" text-anchor="middle">256 x 1408 per image</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 225 160 L 290 160"/><text x="258" y="150" class="small" text-anchor="middle">K, V</text><rect width="250" height="300" x="295" y="60" class="train"/><text x="420" y="82" class="head" text-anchor="middle">Q-Former (trained)</text><text x="420" y="100" class="small" text-anchor="middle">12 layers, BERT-base init</text><rect width="210" height="60" x="315" y="110" class="cool"/><text x="420" y="128" class="step" text-anchor="middle">32 learnable queries</text><text x="420" y="146" class="small" text-anchor="middle">parameters of the bridge</text><text x="420" y="162" class="small" text-anchor="middle">same 32 vectors for every image</text><rect width="210" height="60" x="315" y="178" class="box"/><text x="420" y="196" class="step" text-anchor="middle">self-attention (queries only)</text><text x="420" y="214" class="small" text-anchor="middle">queries interact with each other</text><text x="420" y="230" class="small" text-anchor="middle">and with text in stage 1</text><rect width="210" height="60" x="315" y="244" class="box"/><text x="420" y="262" class="step" text-anchor="middle">cross-attention</text><text x="420" y="280" class="small" text-anchor="middle">Q from queries, K/V from patches</text><text x="420" y="296" class="small" text-anchor="middle">32 x 256 attention map</text><rect width="210" height="40" x="315" y="312" class="box"/><text x="420" y="338" class="step" text-anchor="middle">FFN + LN (shared with text path)</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 550 160 L 620 160"/><text x="585" y="150" class="small" text-anchor="middle">32 tokens</text><rect width="140" height="120" x="625" y="60" class="train"/><text x="695" y="82" class="head" text-anchor="middle">linear projection</text><text x="695" y="100" class="small" text-anchor="middle">768 -&gt; 4096 (LLM dim)</text><text x="695" y="118" class="small" text-anchor="middle">trained in stage 2</text><text x="695" y="138" class="small" text-anchor="middle">~3M params</text><text x="695" y="158" class="small" text-anchor="middle">32 x LLM_dim output</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 770 120 L 830 120"/><rect width="100" height="240" x="835" y="60" class="frozen"/><text x="885" y="82" class="head" text-anchor="middle">frozen LLM</text><text x="885" y="102" class="small" text-anchor="middle">OPT-6.7B or</text><text x="885" y="120" class="small" text-anchor="middle">Flan-T5-XXL</text><text x="885" y="148" class="small" text-anchor="middle">32 visual tokens</text><text x="885" y="164" class="small" text-anchor="middle">+ text prompt</text><text x="885" y="182" class="small" text-anchor="middle">-&gt; caption / VQA</text><text x="885" y="212" class="caption" text-anchor="middle">not trained</text><text x="885" y="230" class="caption" text-anchor="middle">LM generation</text><text x="885" y="248" class="caption" text-anchor="middle">caption or answer</text><rect width="880" height="130" x="40" y="380" class="box"/><text x="480" y="402" class="head" text-anchor="middle">two-stage training</text><rect width="415" height="75" x="60" y="420" class="cool"/><text x="80" y="440" class="step">Stage 1: representation (no LLM)</text><text x="80" y="458" class="small">train Q-Former alone with</text><text x="80" y="474" class="small">ITC (image-text contrastive)</text><text x="80" y="488" class="small">+ ITM (image-text matching)</text><text x="250" y="458" class="small">+ ITG (image-grounded text gen)</text><text x="250" y="474" class="small">queries learn to encode</text><text x="250" y="488" class="small">both semantic and text-decodable info</text><rect width="415" height="75" x="490" y="420" class="train"/><text x="510" y="440" class="step">Stage 2: generative (with frozen LLM)</text><text x="510" y="458" class="small">project 32 queries -&gt; LLM dim</text><text x="510" y="474" class="small">prepend to text</text><text x="510" y="488" class="small">train LM loss end-to-end</text><text x="680" y="458" class="small">bridge + projector learn</text><text x="680" y="474" class="small">to feed the LLM cleanly</text><text x="680" y="488" class="small">188M params total</text></svg>