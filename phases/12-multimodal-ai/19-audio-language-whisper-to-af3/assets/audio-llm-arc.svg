<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Audio-LLM arc: Whisper (2022) to Audio Flamingo 3 (2025)</text><rect width="900" height="230" x="30" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">the pipeline: spectrogram -&gt; encoder -&gt; Q-former -&gt; LLM</text><rect width="180" height="170" x="50" y="90" class="hot"/><text x="140" y="110" class="step" text-anchor="middle">1. waveform</text><text x="140" y="128" class="small" text-anchor="middle">16 kHz mono</text><text x="140" y="150" class="step" text-anchor="middle">2. log-Mel spec</text><text x="140" y="168" class="small" text-anchor="middle">25ms win, 10ms hop</text><text x="140" y="184" class="small" text-anchor="middle">80 Mel bins</text><text x="140" y="200" class="small" text-anchor="middle">log compress</text><text x="140" y="222" class="small" text-anchor="middle">30s = 3000 frames</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 235 170 L 275 170"/><rect width="200" height="170" x="280" y="90" class="cool"/><text x="380" y="110" class="step" text-anchor="middle">3. audio encoder</text><text x="380" y="132" class="small" text-anchor="middle">Whisper: speech strong</text><text x="380" y="148" class="small" text-anchor="middle">BEATs: music strong</text><text x="380" y="164" class="small" text-anchor="middle">AF-Whisper: concat</text><text x="380" y="186" class="small" text-anchor="middle">1 frame per 10ms</text><text x="380" y="210" class="small" text-anchor="middle">12-layer transformer</text><text x="380" y="230" class="caption" text-anchor="middle">frozen at bridge train</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 485 170 L 525 170"/><rect width="200" height="170" x="530" y="90" class="cold"/><text x="630" y="110" class="step" text-anchor="middle">4. audio Q-former</text><text x="630" y="132" class="small" text-anchor="middle">32-64 learnable queries</text><text x="630" y="148" class="small" text-anchor="middle">cross-attend over frames</text><text x="630" y="164" class="small" text-anchor="middle">output fixed-length tokens</text><text x="630" y="186" class="step" text-anchor="middle">training</text><text x="630" y="202" class="small" text-anchor="middle">stage 1: ITM + ITC + ITG</text><text x="630" y="218" class="small" text-anchor="middle">stage 2: instruction tune</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 735 170 L 775 170"/><rect width="140" height="170" x="780" y="90" class="reg"/><text x="850" y="110" class="step" text-anchor="middle">5. LLM</text><text x="850" y="128" class="small" text-anchor="middle">Qwen2.5-7B</text><text x="850" y="144" class="small" text-anchor="middle">or Llama 3.1</text><text x="850" y="166" class="step" text-anchor="middle">output</text><text x="850" y="184" class="small" text-anchor="middle">captions</text><text x="850" y="200" class="small" text-anchor="middle">QA answers</text><text x="850" y="216" class="small" text-anchor="middle">with CoT</text><rect width="900" height="210" x="30" y="300" class="box"/><text x="480" y="322" class="head" text-anchor="middle">cascaded vs end-to-end task coverage</text><rect width="400" height="160" x="50" y="340" class="hot"/><text x="250" y="362" class="step" text-anchor="middle">cascaded (Whisper -&gt; LLM)</text><text x="250" y="384" class="small" text-anchor="middle">transcription: yes</text><text x="250" y="400" class="small" text-anchor="middle">summarization: yes</text><text x="250" y="416" class="small" text-anchor="middle">emotion: no</text><text x="250" y="432" class="small" text-anchor="middle">music genre: no</text><text x="250" y="448" class="small" text-anchor="middle">environmental: no</text><text x="250" y="464" class="small" text-anchor="middle">deepfake: no</text><text x="250" y="488" class="caption" text-anchor="middle">MMAU ~0.50</text><rect width="440" height="160" x="470" y="340" class="cool"/><text x="690" y="362" class="step" text-anchor="middle">end-to-end audio-LLM (AF3)</text><text x="690" y="384" class="small" text-anchor="middle">every cascaded task: yes</text><text x="690" y="400" class="small" text-anchor="middle">emotion / mood: yes</text><text x="690" y="416" class="small" text-anchor="middle">music / instruments: yes</text><text x="690" y="432" class="small" text-anchor="middle">environmental sounds: yes</text><text x="690" y="448" class="small" text-anchor="middle">temporal grounding: yes</text><text x="690" y="464" class="small" text-anchor="middle">on-demand CoT: +3-5 pts</text><text x="690" y="488" class="caption" text-anchor="middle">MMAU 0.72 (open SOTA 2025)</text></svg>