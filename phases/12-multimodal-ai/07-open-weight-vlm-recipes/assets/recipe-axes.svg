<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Open-weight VLM design space — five axes and their benchmark pull</text><rect width="900" height="180" x="30" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">the five axes of every open VLM recipe</text><rect width="170" height="120" x="50" y="90" class="hot"/><text x="135" y="108" class="step" text-anchor="middle">1. image encoder</text><text x="135" y="128" class="small" text-anchor="middle">CLIP / SigLIP 2</text><text x="135" y="144" class="small" text-anchor="middle">DINOv2 / InternViT</text><text x="135" y="164" class="small" text-anchor="middle">concat for dense</text><text x="135" y="184" class="small" text-anchor="middle">MM1: +3 MMMU</text><text x="135" y="200" class="caption" text-anchor="middle">SigLIP 2 wins 2026</text><rect width="170" height="120" x="230" y="90" class="cool"/><text x="315" y="108" class="step" text-anchor="middle">2. connector</text><text x="315" y="128" class="small" text-anchor="middle">MLP / Q-Former</text><text x="315" y="144" class="small" text-anchor="middle">Perceiver / C-Abstr</text><text x="315" y="164" class="small" text-anchor="middle">SVA (Cambrian)</text><text x="315" y="184" class="small" text-anchor="middle">~1 pt between them</text><text x="315" y="200" class="caption" text-anchor="middle">picks token count</text><rect width="170" height="120" x="410" y="90" class="cold"/><text x="495" y="108" class="step" text-anchor="middle">3. LLM</text><text x="495" y="128" class="small" text-anchor="middle">Llama-3 / Mistral</text><text x="495" y="144" class="small" text-anchor="middle">Qwen2.5 / Phi</text><text x="495" y="164" class="small" text-anchor="middle">7B -&gt; 70B plateau</text><text x="495" y="184" class="small" text-anchor="middle">+2-4 / doubling</text><text x="495" y="200" class="caption" text-anchor="middle">sets reasoning ceiling</text><rect width="170" height="120" x="590" y="90" class="reg"/><text x="675" y="108" class="step" text-anchor="middle">4. data</text><text x="675" y="128" class="small" text-anchor="middle">caption pairs</text><text x="675" y="144" class="small" text-anchor="middle">interleaved OBELICS</text><text x="675" y="164" class="small" text-anchor="middle">instr: LLaVA/ShareGPT4V</text><text x="675" y="184" class="small" text-anchor="middle">PixMo human caps</text><text x="675" y="200" class="caption" text-anchor="middle">detail &gt; distill</text><rect width="150" height="120" x="770" y="90" class="hot"/><text x="845" y="108" class="step" text-anchor="middle">5. resolution</text><text x="845" y="128" class="small" text-anchor="middle">fixed 336/448</text><text x="845" y="144" class="small" text-anchor="middle">AnyRes tiling</text><text x="845" y="164" class="small" text-anchor="middle">native dynamic</text><text x="845" y="184" class="small" text-anchor="middle">ramped schedule</text><text x="845" y="200" class="caption" text-anchor="middle">OCR multiplier</text><rect width="900" height="270" x="30" y="250" class="box"/><text x="480" y="272" class="head" text-anchor="middle">Prismatic VLMs variance decomposition (controlled 7B comparison)</text><g transform="translate(80, 290)"><text x="0" y="15" class="step">visual-token count</text><rect width="360" height="18" x="200" y="0" class="hot"/><text x="575" y="15" class="small">~60%</text><text x="0" y="45" class="step">image encoder</text><rect width="120" height="18" x="200" y="30" class="cool"/><text x="335" y="45" class="small">~20%</text><text x="0" y="75" class="step">LLM size</text><rect width="90" height="18" x="200" y="60" class="cold"/><text x="305" y="75" class="small">~15%</text><text x="0" y="105" class="step">data mix</text><rect width="60" height="18" x="200" y="90" class="reg"/><text x="275" y="105" class="small">~10%</text><text x="0" y="135" class="step">connector arch</text><rect width="30" height="18" x="200" y="120" class="hot"/><text x="245" y="135" class="small">~5%</text><text x="0" y="165" class="step">resolution sched</text><rect width="30" height="18" x="200" y="150" class="cool"/><text x="245" y="165" class="small">~5%</text></g><rect width="300" height="210" x="600" y="290" class="reg"/><text x="750" y="312" class="head" text-anchor="middle">2026 default recipe</text><text x="750" y="334" class="small" text-anchor="middle">encoder: SigLIP 2 SO400m/14</text><text x="750" y="350" class="small" text-anchor="middle">connector: 2-layer MLP</text><text x="750" y="366" class="small" text-anchor="middle">LLM: Qwen2.5-7B (or 70B)</text><text x="750" y="382" class="small" text-anchor="middle">data: PixMo + Cauldron</text><text x="750" y="398" class="small" text-anchor="middle">res: dynamic 256-1280</text><text x="750" y="414" class="small" text-anchor="middle">schedule: 3 stages</text><text x="750" y="440" class="step" text-anchor="middle">ablate first:</text><text x="750" y="456" class="small" text-anchor="middle">1. token count</text><text x="750" y="472" class="small" text-anchor="middle">2. encoder</text><text x="750" y="488" class="small" text-anchor="middle">3. data mix</text></svg>