<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Patch-n&apos;-pack: variable-resolution images into one sequence</text><rect width="200" height="200" x="30" y="50" class="box"/><text x="130" y="70" class="head" text-anchor="middle">three images, three shapes</text><rect width="60" height="120" x="50" y="85" class="hot"/><text x="80" y="95" class="small" text-anchor="middle">receipt</text><text x="80" y="225" class="small" text-anchor="middle">600x1500</text><rect width="90" height="50" x="125" y="105" class="cool"/><text x="170" y="100" class="small" text-anchor="middle">chart 1280x720</text><text x="170" y="175" class="small" text-anchor="middle">16:9</text><rect width="50" height="80" x="125" y="165" class="cold"/><text x="150" y="160" class="small" text-anchor="middle">screen</text><rect width="40" height="80" x="180" y="165" class="cold"/><text x="200" y="160" class="small" text-anchor="middle">phone</text><text x="130" y="245" class="caption" text-anchor="middle">native resolution, patch 14</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 235 150 L 295 150"/><text x="265" y="140" class="small" text-anchor="middle">patchify each</text><rect width="320" height="200" x="300" y="50" class="reg"/><text x="460" y="70" class="head" text-anchor="middle">packed sequence</text><text x="460" y="88" class="small" text-anchor="middle">concatenate all images&apos; patches</text><g><rect width="120" height="20" x="315" y="100" class="hot"/><text x="375" y="114" class="small" text-anchor="middle">receipt tokens (n_0)</text><rect width="150" height="20" x="315" y="125" class="cool"/><text x="390" y="139" class="small" text-anchor="middle">chart tokens (n_1)</text><rect width="200" height="20" x="315" y="150" class="cold"/><text x="415" y="164" class="small" text-anchor="middle">phone tokens (n_2)</text></g><text x="460" y="200" class="step" text-anchor="middle">cu_seqlens = [0, n_0, n_0+n_1, N]</text><text x="460" y="222" class="small" text-anchor="middle">FlashAttn varlen: no padding, no dense mask</text><text x="460" y="240" class="small" text-anchor="middle">N = n_0 + n_1 + n_2 (zero waste)</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M 625 150 L 685 150"/><text x="655" y="140" class="small" text-anchor="middle">block-diag</text><rect width="240" height="200" x="690" y="50" class="cool"/><text x="810" y="70" class="head" text-anchor="middle">block-diagonal mask</text><g transform="translate(730,90)"><rect width="30" height="30" x="0" y="0" class="hot"/><rect width="60" height="60" x="30" y="30" class="cool"/><rect width="80" height="80" x="90" y="90" class="cold"/></g><text x="810" y="230" class="small" text-anchor="middle">each image attends only within itself</text><rect width="900" height="240" x="30" y="280" class="box"/><text x="480" y="302" class="head" text-anchor="middle">four strategies for any-resolution vision</text><rect width="200" height="180" x="50" y="320" class="hot"/><text x="150" y="342" class="step" text-anchor="middle">square resize</text><text x="150" y="364" class="small" text-anchor="middle">resize to 336x336</text><text x="150" y="380" class="small" text-anchor="middle">fixed 576 tokens</text><text x="150" y="398" class="small" text-anchor="middle">loses OCR, squishes</text><text x="150" y="416" class="small" text-anchor="middle">text, wastes pad</text><text x="150" y="440" class="step" text-anchor="middle">baseline, pre-2024</text><text x="150" y="458" class="small" text-anchor="middle">LLaVA-1.5 used this</text><rect width="200" height="180" x="260" y="320" class="cool"/><text x="360" y="342" class="step" text-anchor="middle">AnyRes tiling</text><text x="360" y="364" class="small" text-anchor="middle">tile MxN + thumbnail</text><text x="360" y="380" class="small" text-anchor="middle">frozen encoder at 336</text><text x="360" y="398" class="small" text-anchor="middle">fidelity + global ctx</text><text x="360" y="416" class="small" text-anchor="middle">expensive past 3x3</text><text x="360" y="440" class="step" text-anchor="middle">LLaVA-NeXT (2024)</text><rect width="200" height="180" x="470" y="320" class="cold"/><text x="570" y="342" class="step" text-anchor="middle">M-RoPE + native</text><text x="570" y="364" class="small" text-anchor="middle">3D pos (t, r, c)</text><text x="570" y="380" class="small" text-anchor="middle">arbitrary HxWxT</text><text x="570" y="398" class="small" text-anchor="middle">no position table</text><text x="570" y="416" class="small" text-anchor="middle">min/max pixel caps</text><text x="570" y="440" class="step" text-anchor="middle">Qwen2-VL / Qwen3-VL</text><rect width="210" height="180" x="680" y="320" class="reg"/><text x="785" y="342" class="step" text-anchor="middle">NaFlex single ckpt</text><text x="785" y="364" class="small" text-anchor="middle">pick 256/729/1024</text><text x="785" y="380" class="small" text-anchor="middle">per-task at inference</text><text x="785" y="398" class="small" text-anchor="middle">patch-n&apos;-pack train</text><text x="785" y="416" class="small" text-anchor="middle">fractional pos embed</text><text x="785" y="440" class="step" text-anchor="middle">SigLIP 2 (2025)</text><text x="785" y="458" class="small" text-anchor="middle">2026 open-VLM default</text></svg>