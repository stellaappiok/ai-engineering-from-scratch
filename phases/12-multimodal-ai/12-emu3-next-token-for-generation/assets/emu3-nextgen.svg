<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.reg{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.reg{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Emu3 — one model, one loss, three roles</text><rect width="900" height="240" x="30" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">single decoder-only transformer with shared vocabulary</text><rect width="270" height="190" x="50" y="90" class="hot"/><text x="185" y="110" class="step" text-anchor="middle">Emu3-Gen</text><text x="185" y="128" class="small" text-anchor="middle">text -&gt; image tokens</text><text x="185" y="146" class="small" text-anchor="middle">512x512 = 4096 tokens</text><text x="185" y="164" class="small" text-anchor="middle">CFG gamma 3-7</text><text x="185" y="182" class="small" text-anchor="middle">temperature 0.8</text><text x="185" y="210" class="step" text-anchor="middle">matches SDXL on FID</text><text x="185" y="234" class="caption" text-anchor="middle">no diffusion schedule</text><text x="185" y="252" class="caption" text-anchor="middle">no CLIP loss</text><rect width="270" height="190" x="345" y="90" class="cool"/><text x="480" y="110" class="step" text-anchor="middle">Emu3-Chat</text><text x="480" y="128" class="small" text-anchor="middle">image -&gt; text</text><text x="480" y="146" class="small" text-anchor="middle">VQA + captioning</text><text x="480" y="164" class="small" text-anchor="middle">matches LLaVA-1.6</text><text x="480" y="182" class="small" text-anchor="middle">same backbone</text><text x="480" y="210" class="step" text-anchor="middle">VQAv2 75.1</text><text x="480" y="234" class="caption" text-anchor="middle">unified loss unlocks</text><text x="480" y="252" class="caption" text-anchor="middle">perception + gen</text><rect width="270" height="190" x="640" y="90" class="cold"/><text x="775" y="110" class="step" text-anchor="middle">Emu3-Stage2</text><text x="775" y="128" class="small" text-anchor="middle">text -&gt; video tokens</text><text x="775" y="146" class="small" text-anchor="middle">4s @ 8fps, 3D VQ</text><text x="775" y="164" class="small" text-anchor="middle">4x4x4 spatiotemporal</text><text x="775" y="182" class="small" text-anchor="middle">patch quantization</text><text x="775" y="210" class="step" text-anchor="middle">competitive FVD</text><text x="775" y="234" class="caption" text-anchor="middle">same shared vocab</text><text x="775" y="252" class="caption" text-anchor="middle">extends to 10s at scale</text><rect width="900" height="210" x="30" y="310" class="box"/><text x="480" y="332" class="head" text-anchor="middle">Emu3 vs diffusion: the 2026 trade-off</text><rect width="400" height="150" x="60" y="350" class="reg"/><text x="260" y="370" class="step" text-anchor="middle">Emu3 (discrete tokens, NTP)</text><text x="260" y="390" class="small" text-anchor="middle">+ one model for gen + perception</text><text x="260" y="406" class="small" text-anchor="middle">+ one training loss</text><text x="260" y="422" class="small" text-anchor="middle">+ tokens extend to any modality</text><text x="260" y="438" class="small" text-anchor="middle">- slow inference (2 min / 512x512)</text><text x="260" y="454" class="small" text-anchor="middle">- tokenizer caps quality</text><text x="260" y="480" class="caption" text-anchor="middle">best for research, unified models</text><rect width="400" height="150" x="490" y="350" class="hot"/><text x="690" y="370" class="step" text-anchor="middle">Diffusion (SDXL, SD3, Flux)</text><text x="690" y="390" class="small" text-anchor="middle">+ fast inference (2-5s / 512x512)</text><text x="690" y="406" class="small" text-anchor="middle">+ continuous latent = higher fidelity</text><text x="690" y="422" class="small" text-anchor="middle">+ mature tooling + LoRAs</text><text x="690" y="438" class="small" text-anchor="middle">- no perception in same model</text><text x="690" y="454" class="small" text-anchor="middle">- separate text encoder needed</text><text x="690" y="480" class="caption" text-anchor="middle">best for image-only production</text></svg>