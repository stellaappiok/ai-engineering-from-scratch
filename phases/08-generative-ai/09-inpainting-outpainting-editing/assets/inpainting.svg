<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.hot,.mask{stroke-width:1.5}.cold{fill:#eaf4ff;stroke:#2c5f8c}.mask{fill:#2c3e50;stroke:#1a1a1a}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.mono{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">inpainting vs outpainting vs SDEdit</text><text x="165" y="70" class="label" text-anchor="middle">inpainting</text><rect width="250" height="130" x="40" y="80" class="box"/><rect width="220" height="100" x="55" y="95" class="cold"/><rect width="80" height="50" x="120" y="120" class="mask"/><text x="160" y="230" class="caption" text-anchor="middle">mask inside, pin outside</text><text x="160" y="248" class="caption" text-anchor="middle">9-channel U-Net:</text><text x="160" y="264" class="mono" text-anchor="middle">noisy | encoded_src | mask</text><text x="450" y="70" class="label" text-anchor="middle">outpainting</text><rect width="260" height="130" x="310" y="80" class="box"/><rect width="70" height="70" x="410" y="110" class="cold"/><rect width="85" height="100" x="325" y="95" class="mask"/><rect width="85" height="100" x="480" y="95" class="mask"/><text x="450" y="230" class="caption" text-anchor="middle">invert the mask</text><text x="450" y="248" class="caption" text-anchor="middle">extend beyond the canvas</text><text x="450" y="264" class="caption" text-anchor="middle">same model, same loss</text><text x="720" y="70" class="label" text-anchor="middle">SDEdit (no retraining)</text><rect width="270" height="130" x="590" y="80" class="box"/><text x="725" y="110" class="mono" text-anchor="middle">x_0 -&gt; add noise to t -&gt; denoise</text><text x="725" y="135" class="caption" text-anchor="middle">t/T = 0.3 → minor edits</text><text x="725" y="153" class="caption" text-anchor="middle">t/T = 0.6 → moderate edits</text><text x="725" y="171" class="caption" text-anchor="middle">t/T = 0.9 → near-random</text><text x="725" y="195" class="caption" text-anchor="middle">no mask, just noise-level slider</text><rect width="820" height="100" x="40" y="310" class="hot"/><text x="450" y="335" class="label" text-anchor="middle">inpainting inference loop</text><text x="450" y="358" class="mono" text-anchor="middle">for t = T .. 1: x_t[masked] = denoise; x_t[unmasked] = noise(clean_source, t)</text><text x="450" y="380" class="caption" text-anchor="middle">replace unmasked region with a fresh forward-diffused clean image each step</text><text x="450" y="398" class="caption" text-anchor="middle">final step: pin unmasked pixels to the clean source exactly</text><rect width="820" height="60" x="40" y="425" class="box"/><text x="450" y="448" class="label" text-anchor="middle">2026 editing stack</text><text x="450" y="470" class="caption" text-anchor="middle">SAM 2 mask → SD-Inpaint / Flux-Fill / GPT-Image Edit → Flux-Kontext for instruction edits</text></svg>