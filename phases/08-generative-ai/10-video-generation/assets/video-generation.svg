<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">video diffusion: patchify, DiT, decode</text><text x="80" y="70" class="label">raw video</text><g><rect width="30" height="30" x="30" y="85" class="box"/><rect width="30" height="30" x="65" y="85" class="box"/><rect width="30" height="30" x="100" y="85" class="box"/><rect width="30" height="30" x="135" y="85" class="box"/><rect width="30" height="30" x="170" y="85" class="box"/><text x="115" y="135" class="caption" text-anchor="middle">T × H × W × 3 (240 frames @ 1080p)</text></g><line x1="210" x2="260" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="140" height="60" x="260" y="75" class="cold"/><text x="330" y="105" class="content" text-anchor="middle">3-D VAE encoder</text><text x="330" y="125" class="caption" text-anchor="middle">spatiotemporal latent</text><line x1="400" x2="450" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="140" height="60" x="450" y="75" class="hot"/><text x="520" y="105" class="content" text-anchor="middle">patchify</text><text x="520" y="125" class="caption" text-anchor="middle">t_p × h_p × w_p blocks</text><line x1="590" x2="640" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="220" height="90" x="640" y="60" class="cold"/><text x="750" y="85" class="label" text-anchor="middle">spatiotemporal DiT</text><text x="750" y="105" class="caption" text-anchor="middle">factorized: spatial then temporal attn</text><text x="750" y="125" class="caption" text-anchor="middle">cross-attn to T5-XXL text</text><rect width="830" height="60" x="30" y="180" class="hot"/><text x="445" y="203" class="label" text-anchor="middle">same DDPM loss over spatiotemporal latents</text><text x="445" y="225" class="mono" text-anchor="middle">L = E || ε - ε_θ( z_t, t, text, first_frame_opt ) ||²</text><rect width="400" height="220" x="30" y="260" class="box"/><text x="230" y="285" class="label" text-anchor="middle">flicker: independent per-frame sampling</text><path fill="none" stroke="#c0392b" stroke-width="1.5" d="M 60,370 L 100,340 L 140,410 L 180,320 L 220,390 L 260,335 L 300,405 L 340,340 L 380,395"/><text x="230" y="460" class="caption" text-anchor="middle">per-frame noise is independent =&gt; jagged motion</text><rect width="400" height="220" x="460" y="260" class="box"/><text x="660" y="285" class="label" text-anchor="middle">coherent: joint sequence diffusion</text><path fill="none" stroke="#2c5f8c" stroke-width="1.5" d="M 490,370 Q 540,355 580,365 T 680,370 T 780,380 T 840,395"/><text x="660" y="460" class="caption" text-anchor="middle">shared noise + temporal attention =&gt; smooth motion</text></svg>