<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">text / image -&gt; 3D in 2026</text><rect width="140" height="60" x="30" y="70" class="box"/><text x="100" y="95" class="content" text-anchor="middle">prompt or image</text><text x="100" y="115" class="caption" text-anchor="middle">text, 1 photo, or 3-16 photos</text><line x1="170" x2="210" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="220" height="60" x="210" y="70" class="cold"/><text x="320" y="95" class="content" text-anchor="middle">multi-view diffusion</text><text x="320" y="115" class="caption" text-anchor="middle">SV3D, CAT3D, MVDream, Zero123</text><line x1="430" x2="470" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><g><rect width="25" height="25" x="480" y="75" class="hot"/><rect width="25" height="25" x="510" y="75" class="hot"/><rect width="25" height="25" x="540" y="75" class="hot"/><rect width="25" height="25" x="570" y="75" class="hot"/><rect width="25" height="25" x="480" y="105" class="hot"/><rect width="25" height="25" x="510" y="105" class="hot"/><rect width="25" height="25" x="540" y="105" class="hot"/><rect width="25" height="25" x="570" y="105" class="hot"/></g><text x="540" y="148" class="caption" text-anchor="middle">8 consistent views</text><line x1="605" x2="650" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="220" height="60" x="650" y="70" class="cold"/><text x="760" y="95" class="content" text-anchor="middle">3D fit</text><text x="760" y="115" class="caption" text-anchor="middle">Gaussian splat or mesh extract</text><text x="180" y="200" class="label">3D Gaussian Splatting (Kerbl 2023)</text><rect width="380" height="160" x="40" y="215" class="box"/><circle cx="120" cy="290" r="25" fill="#c0392b" opacity=".6"/><circle cx="160" cy="280" r="20" fill="#c0392b" opacity=".5"/><circle cx="190" cy="305" r="30" fill="#c0392b" opacity=".5"/><circle cx="230" cy="290" r="22" fill="#c0392b" opacity=".6"/><circle cx="275" cy="310" r="28" fill="#c0392b" opacity=".5"/><circle cx="320" cy="295" r="18" fill="#c0392b" opacity=".7"/><text x="230" y="355" class="caption" text-anchor="middle">~1M Gaussians per scene, differentiable render, 100 fps</text><text x="670" y="200" class="label">direct text/image to mesh</text><rect width="380" height="160" x="480" y="215" class="box"/><text x="670" y="248" class="content" text-anchor="middle">Meshy 4, Rodin Gen-1.5, Hunyuan3D 2.0</text><text x="670" y="275" class="caption" text-anchor="middle">output: PBR mesh (albedo, roughness,</text><text x="670" y="293" class="caption" text-anchor="middle">metallic, normal)</text><text x="670" y="320" class="caption" text-anchor="middle">→ direct import into Unity, Unreal, Blender</text><text x="670" y="340" class="caption" text-anchor="middle">30s - 60s per asset on hosted endpoints</text><rect width="820" height="90" x="40" y="410" class="hot"/><text x="450" y="435" class="label" text-anchor="middle">2022 → 2026 time per asset</text><text x="450" y="458" class="caption" text-anchor="middle">DreamFusion 2022: 1 hour; LRM 2023: 5s; TripoSR 2024: 1s; Meshy 4 2025: 30s with PBR</text><text x="450" y="480" class="caption" text-anchor="middle">NeRF → 3D-GS → direct generative mesh: quality up, time down 100x</text></svg>