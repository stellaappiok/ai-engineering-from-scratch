<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.mono{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">DDPM: one net predicts noise, reversal does the rest</text><text x="80" y="80" class="label">forward q: add noise</text><rect width="80" height="50" x="40" y="95" class="box"/><text x="80" y="125" class="mono" text-anchor="middle">x_0</text><line x1="120" x2="180" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="180" y="95" class="box"/><text x="220" y="125" class="mono" text-anchor="middle">x_1</text><line x1="260" x2="310" y1="120" y2="120" stroke="#1a1a1a" stroke-dasharray="3 3" stroke-width="1.2"/><text x="335" y="125" class="caption">...</text><line x1="360" x2="410" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="410" y="95" class="box"/><text x="450" y="125" class="mono" text-anchor="middle">x_t</text><line x1="490" x2="550" y1="120" y2="120" stroke="#1a1a1a" stroke-dasharray="3 3" stroke-width="1.2"/><text x="575" y="125" class="caption">...</text><line x1="600" x2="660" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="660" y="95" class="hot"/><text x="700" y="120" class="mono" text-anchor="middle">x_T</text><text x="700" y="138" class="caption" text-anchor="middle">~ N(0, I)</text><text x="450" y="170" class="mono" text-anchor="middle">q(x_t | x_0) = N(√(ᾱ_t) · x_0, (1 - ᾱ_t) I)</text><text x="450" y="190" class="caption" text-anchor="middle">closed form: jump to any t in one shot</text><text x="80" y="230" class="label">reverse p_θ: denoise</text><rect width="80" height="50" x="660" y="245" class="hot"/><text x="700" y="275" class="mono" text-anchor="middle">x_T</text><line x1="660" x2="600" y1="270" y2="270" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="520" y="245" class="box"/><text x="560" y="275" class="mono" text-anchor="middle">x_{T-1}</text><line x1="520" x2="460" y1="270" y2="270" stroke="#1a1a1a" stroke-dasharray="3 3" stroke-width="1.2"/><text x="435" y="275" class="caption">...</text><line x1="410" x2="350" y1="270" y2="270" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="270" y="245" class="box"/><text x="310" y="275" class="mono" text-anchor="middle">x_1</text><line x1="270" x2="210" y1="270" y2="270" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="130" y="245" class="cold"/><text x="170" y="275" class="mono" text-anchor="middle">x_0 (sample)</text><text x="450" y="320" class="mono" text-anchor="middle">x_{t-1} = (1/√α_t) ( x_t - (β_t / √(1-ᾱ_t)) · ε_θ(x_t, t) ) + σ_t · z</text><text x="450" y="340" class="caption" text-anchor="middle">subtract the predicted noise, rescale, re-inject a bit of fresh noise</text><rect width="820" height="60" x="40" y="370" class="hot"/><text x="450" y="395" class="label" text-anchor="middle">training loss</text><text x="450" y="420" class="mono" text-anchor="middle">L = E_{x_0, t, ε} ||ε - ε_θ(√ᾱ_t · x_0 + √(1-ᾱ_t) · ε, t)||²</text><text x="450" y="460" class="caption" text-anchor="middle">one net, one MSE loss, no minimax, no KL divergence in the training loop</text><text x="450" y="480" class="caption" text-anchor="middle">scales unchanged to images, video, audio, 3D Gaussians</text></svg>