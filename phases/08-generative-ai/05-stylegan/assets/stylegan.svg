<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">StyleGAN: mapping network + AdaIN + per-layer noise</text><rect width="80" height="40" x="30" y="90" class="box"/><text x="70" y="114" class="mono" text-anchor="middle">z ~ N(0, I)</text><line x1="110" x2="140" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="130" height="60" x="140" y="80" class="cold"/><text x="205" y="108" class="label" text-anchor="middle">mapping f(z)</text><text x="205" y="126" class="caption" text-anchor="middle">8-layer MLP</text><line x1="270" x2="310" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="60" height="40" x="310" y="90" class="hot"/><text x="340" y="114" class="mono" text-anchor="middle">w ∈ W</text><rect width="470" height="260" x="380" y="60" class="box"/><text x="615" y="82" class="label" text-anchor="middle">synthesis g(const, w, noise)</text><rect width="80" height="30" x="400" y="100" class="hot"/><text x="440" y="120" class="mono" text-anchor="middle">const 4×4×512</text><line x1="440" x2="440" y1="130" y2="160" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="30" x="400" y="160" class="box"/><text x="440" y="180" class="content" text-anchor="middle">conv 3×3</text><line x1="440" x2="440" y1="190" y2="220" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="30" x="400" y="220" class="cold"/><text x="440" y="240" class="content" text-anchor="middle">AdaIN(w)</text><line x1="480" x2="530" y1="235" y2="235" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="30" x="530" y="220" class="box"/><text x="570" y="240" class="content" text-anchor="middle">+ noise</text><line x1="610" x2="660" y1="235" y2="235" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="60" height="30" x="660" y="220" class="box"/><text x="690" y="240" class="content" text-anchor="middle">up 2x</text><line x1="720" x2="760" y1="235" y2="235" stroke="#1a1a1a" stroke-dasharray="3 3" stroke-width="1.2"/><text x="790" y="240" class="caption" text-anchor="middle">...repeat to 1024</text><rect width="470" height="30" x="380" y="280" class="hot"/><text x="615" y="300" class="mono" text-anchor="middle">AdaIN(x, w) = scale(w) · (x - μ) / σ + bias(w)</text><path fill="none" stroke="#2c5f8c" stroke-dasharray="3 3" stroke-width="1.2" marker-end="url(#arrow)" d="M 340,130 Q 360,200 400,235"/><rect width="400" height="130" x="30" y="360" class="box"/><text x="230" y="385" class="label" text-anchor="middle">truncation trick</text><text x="230" y="408" class="mono" text-anchor="middle">w′ = w̄ + ψ · (w - w̄)</text><text x="230" y="432" class="caption" text-anchor="middle">ψ = 1.0 → full diversity, occasional glitches</text><text x="230" y="452" class="caption" text-anchor="middle">ψ = 0.7 → default demo setting</text><text x="230" y="472" class="caption" text-anchor="middle">ψ = 0.0 → mean image, no variation</text><rect width="400" height="130" x="460" y="360" class="cold"/><text x="660" y="385" class="label" text-anchor="middle">v1 → v2 → v3</text><text x="660" y="408" class="caption" text-anchor="middle">v2: weight demodulation, no droplets</text><text x="660" y="428" class="caption" text-anchor="middle">v3: alias-free conv, no texture sticking</text><text x="660" y="448" class="caption" text-anchor="middle">XL: conditional ImageNet</text><text x="660" y="468" class="caption" text-anchor="middle">R3GAN (2024): minimal recipe, 20x fewer params</text></svg>