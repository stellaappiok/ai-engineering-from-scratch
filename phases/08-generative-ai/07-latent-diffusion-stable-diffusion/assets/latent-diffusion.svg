<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">latent diffusion = VAE + diffusion, separately trained</text><rect width="840" height="130" x="30" y="60" class="box"/><text x="450" y="82" class="label" text-anchor="middle">stage 1: train VAE (encoder + decoder), freeze</text><rect width="100" height="70" x="60" y="100" class="box"/><text x="110" y="130" class="content" text-anchor="middle">image x</text><text x="110" y="148" class="caption" text-anchor="middle">512 × 512 × 3</text><line x1="160" x2="200" y1="135" y2="135" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="120" height="70" x="200" y="100" class="cold"/><text x="260" y="130" class="content" text-anchor="middle">encoder E</text><line x1="320" x2="360" y1="135" y2="135" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="120" height="70" x="360" y="100" class="hot"/><text x="420" y="128" class="content" text-anchor="middle">latent z</text><text x="420" y="146" class="caption" text-anchor="middle">64 × 64 × 4 (1/16 of pixels)</text><line x1="480" x2="520" y1="135" y2="135" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="120" height="70" x="520" y="100" class="cold"/><text x="580" y="130" class="content" text-anchor="middle">decoder D</text><line x1="640" x2="680" y1="135" y2="135" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="150" height="70" x="680" y="100" class="box"/><text x="755" y="130" class="content" text-anchor="middle">x̂ (reconstruction)</text><text x="755" y="148" class="caption" text-anchor="middle">L1 + LPIPS + GAN</text><rect width="840" height="190" x="30" y="210" class="box"/><text x="450" y="232" class="label" text-anchor="middle">stage 2: train diffusion on z-space</text><rect width="110" height="80" x="80" y="250" class="hot"/><text x="135" y="280" class="mono" text-anchor="middle">z_T ~ N(0, I)</text><line x1="190" x2="240" y1="290" y2="290" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="300" height="80" x="240" y="250" class="cold"/><text x="390" y="278" class="label" text-anchor="middle">U-Net / DiT</text><text x="390" y="298" class="mono" text-anchor="middle">ε_θ(z_t, t, text_embed)</text><text x="390" y="318" class="caption" text-anchor="middle">iterate T-&gt;0</text><line x1="540" x2="590" y1="290" y2="290" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="120" height="80" x="590" y="250" class="hot"/><text x="650" y="290" class="mono" text-anchor="middle">z_0</text><line x1="710" x2="750" y1="290" y2="290" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="110" height="80" x="750" y="250" class="box"/><text x="805" y="285" class="content" text-anchor="middle">D(z_0)</text><text x="805" y="303" class="caption" text-anchor="middle">decoded image</text><rect width="460" height="45" x="80" y="345" class="box"/><text x="310" y="370" class="caption" text-anchor="middle">text encoder (CLIP / T5) -&gt; cross-attention in each U-Net block</text><rect width="840" height="80" x="30" y="415" class="hot"/><text x="450" y="438" class="label" text-anchor="middle">same loss as pixel-space DDPM: L = E || ε - ε_θ(z_t, t, c) ||²</text><text x="450" y="462" class="caption" text-anchor="middle">~64x fewer FLOPs than pixel diffusion for the same quality</text><text x="450" y="482" class="caption" text-anchor="middle">CFG: ε_cfg = (1+w) · ε_cond - w · ε_uncond (w ≈ 3-7)</text></svg>