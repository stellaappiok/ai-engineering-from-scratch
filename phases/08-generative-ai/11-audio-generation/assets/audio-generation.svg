<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">audio gen: codec tokens + transformer or diffusion</text><rect width="140" height="60" x="30" y="70" class="box"/><text x="100" y="98" class="content" text-anchor="middle">waveform</text><text x="100" y="116" class="caption" text-anchor="middle">24 kHz, 1-D</text><line x1="170" x2="210" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="160" height="60" x="210" y="70" class="cold"/><text x="290" y="98" class="content" text-anchor="middle">codec encoder</text><text x="290" y="116" class="caption" text-anchor="middle">Encodec / DAC / SoundStream</text><line x1="370" x2="410" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="220" height="80" x="410" y="60" class="hot"/><text x="520" y="85" class="label" text-anchor="middle">RVQ tokens</text><text x="520" y="105" class="mono" text-anchor="middle">K × 75 Hz indices</text><text x="520" y="125" class="caption" text-anchor="middle">8 codebooks typical</text><line x1="630" x2="670" y1="100" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="180" height="60" x="670" y="70" class="cold"/><text x="760" y="98" class="content" text-anchor="middle">codec decoder</text><text x="760" y="116" class="caption" text-anchor="middle">tokens → wav</text><text x="230" y="190" class="label" text-anchor="middle">token-AR path (MusicGen, VALL-E)</text><rect width="380" height="130" x="40" y="200" class="cold"/><text x="230" y="225" class="content" text-anchor="middle">decoder-only transformer</text><text x="230" y="243" class="mono" text-anchor="middle">p(t_n | t_&lt;n, text_prompt, voice_prompt)</text><text x="230" y="265" class="caption" text-anchor="middle">streams naturally (~200 ms TTFB)</text><text x="230" y="285" class="caption" text-anchor="middle">delayed-parallel: K offset streams</text><text x="230" y="305" class="caption" text-anchor="middle">dominates speech in 2026</text><text x="670" y="190" class="label" text-anchor="middle">diffusion / flow path (Stable Audio, AudioLDM)</text><rect width="380" height="130" x="480" y="200" class="cold"/><text x="670" y="225" class="content" text-anchor="middle">DiT on audio latents</text><text x="670" y="243" class="mono" text-anchor="middle">x_t → x_0 via flow matching</text><text x="670" y="265" class="caption" text-anchor="middle">faster total time for long clips</text><text x="670" y="285" class="caption" text-anchor="middle">cleaner for music at &gt;=30 s</text><text x="670" y="305" class="caption" text-anchor="middle">dominates music generation in 2026</text><rect width="830" height="140" x="30" y="360" class="box"/><text x="445" y="385" class="label" text-anchor="middle">2026 production stack</text><text x="445" y="410" class="caption" text-anchor="middle">TTS: ElevenLabs V3, OpenAI TTS, GPT-4o realtime, NaturalSpeech 3</text><text x="445" y="430" class="caption" text-anchor="middle">Music: Suno v4, Udio, Stable Audio 2.5, MusicGen 3.3B</text><text x="445" y="450" class="caption" text-anchor="middle">SFX: AudioCraft 2, ElevenLabs SFX, Stable Audio Open</text><text x="445" y="475" class="caption" text-anchor="middle">Voice clone: XTTS v2 (open), ElevenLabs Pro (consent-verified)</text></svg>