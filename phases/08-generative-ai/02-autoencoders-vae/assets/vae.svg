<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">autoencoder vs VAE — the one trick</text><text x="180" y="70" class="label" text-anchor="middle">plain autoencoder</text><rect width="60" height="50" x="40" y="85" class="box"/><text x="70" y="115" class="content" text-anchor="middle">x</text><line x1="100" x2="140" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="50" x="140" y="85" class="box"/><text x="180" y="115" class="content" text-anchor="middle">encoder</text><line x1="220" x2="260" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="40" height="50" x="260" y="85" class="box"/><text x="280" y="115" class="content" text-anchor="middle">z</text><line x1="300" x2="320" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><text x="180" y="170" class="caption" text-anchor="middle">loss = ||x - x̂||²</text><text x="180" y="188" class="caption" text-anchor="middle">z-space: lumpy, not a distribution</text><text x="180" y="206" class="caption" text-anchor="middle">sample random z -&gt; garbage out</text><text x="630" y="70" class="label" text-anchor="middle">variational autoencoder</text><rect width="60" height="50" x="360" y="85" class="box"/><text x="390" y="115" class="content" text-anchor="middle">x</text><line x1="420" x2="460" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="90" height="50" x="460" y="85" class="box"/><text x="505" y="115" class="content" text-anchor="middle">encoder</text><line x1="550" x2="585" y1="100" y2="85" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="550" x2="585" y1="125" y2="140" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="60" height="36" x="585" y="65" class="hot"/><text x="615" y="88" class="mono" text-anchor="middle">μ(x)</text><rect width="80" height="36" x="585" y="128" class="hot"/><text x="625" y="151" class="mono" text-anchor="middle">log σ²(x)</text><rect width="120" height="60" x="700" y="85" class="cold"/><text x="760" y="108" class="mono" text-anchor="middle">z = μ + σ·ε</text><text x="760" y="128" class="caption" text-anchor="middle">reparameterize</text><text x="760" y="142" class="caption" text-anchor="middle">ε ~ N(0, I)</text><line x1="650" x2="700" y1="85" y2="100" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="665" x2="700" y1="146" y2="130" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="760" x2="760" y1="145" y2="190" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="120" height="45" x="700" y="195" class="box"/><text x="760" y="220" class="content" text-anchor="middle">decoder</text><line x1="760" x2="760" y1="240" y2="280" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="80" height="40" x="720" y="285" class="box"/><text x="760" y="309" class="content" text-anchor="middle">x̂</text><rect width="540" height="140" x="40" y="260" class="box"/><text x="310" y="284" class="label" text-anchor="middle">loss = reconstruction + β · KL</text><text x="310" y="312" class="mono" text-anchor="middle">||x - x̂||² + ½ Σ( σ² + μ² - logσ² - 1 )</text><text x="310" y="340" class="caption" text-anchor="middle">recon term: push x̂ → x</text><text x="310" y="360" class="caption" text-anchor="middle">KL term: push q(z|x) → N(0, I)</text><text x="310" y="380" class="caption" text-anchor="middle">β knob trades sharpness for well-shaped latent</text><rect width="820" height="50" x="40" y="420" class="hot"/><text x="450" y="438" class="label" text-anchor="middle">inference: sample z ~ N(0, I), forward through decoder → new x̂</text><text x="450" y="458" class="caption" text-anchor="middle">one forward pass; no iteration; decoder is the whole generator</text></svg>