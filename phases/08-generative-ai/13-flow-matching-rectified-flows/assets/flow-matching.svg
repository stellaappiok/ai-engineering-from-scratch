<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.mono{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">flow matching: train on a straight line</text><text x="225" y="70" class="label" text-anchor="middle">DDPM: curved path</text><rect width="350" height="170" x="50" y="90" class="box"/><circle cx="95" cy="210" r="18" fill="#c0392b" opacity=".4"/><text x="95" y="240" class="caption" text-anchor="middle">x_0 (data)</text><circle cx="365" cy="130" r="18" fill="#2c5f8c" opacity=".4"/><text x="365" y="110" class="caption" text-anchor="middle">x_T ~ N(0, I)</text><path fill="none" stroke="#1a1a1a" stroke-width="1.5" d="M 95,210 Q 160,160 200,200 T 280,150 T 365,130"/><text x="225" y="190" class="caption" text-anchor="middle">1000-step SDE</text><text x="225" y="253" class="caption" text-anchor="middle">DDIM collapses to ~50 steps</text><text x="665" y="70" class="label" text-anchor="middle">flow matching: straight line</text><rect width="380" height="170" x="490" y="90" class="box"/><circle cx="535" cy="210" r="18" fill="#c0392b" opacity=".4"/><text x="535" y="240" class="caption" text-anchor="middle">x_0</text><circle cx="835" cy="130" r="18" fill="#2c5f8c" opacity=".4"/><text x="835" y="110" class="caption" text-anchor="middle">x_1 ~ N(0, I)</text><line x1="535" x2="835" y1="210" y2="130" stroke="#1a1a1a" stroke-width="2"/><text x="685" y="190" class="mono" text-anchor="middle">x_t = t · x_1 + (1-t) · x_0</text><text x="685" y="253" class="caption" text-anchor="middle">2-8 Euler steps at inference</text><rect width="820" height="70" x="50" y="290" class="hot"/><text x="460" y="315" class="label" text-anchor="middle">loss = || v_θ(x_t, t) - (x_1 - x_0) ||²</text><text x="460" y="340" class="caption" text-anchor="middle">simulation-free training; target is a constant vector along the straight line</text><rect width="820" height="110" x="50" y="380" class="cold"/><text x="460" y="402" class="label" text-anchor="middle">rectified flow: iteratively straighten</text><text x="460" y="425" class="caption" text-anchor="middle">1. train v_1 with random (x_0, x_1) pairs</text><text x="460" y="445" class="caption" text-anchor="middle">2. sample paired (x_0, x_1) by integrating v_1 -&gt; pairs are ODE-matched</text><text x="460" y="465" class="caption" text-anchor="middle">3. retrain v_2 on those pairs -&gt; genuinely straighter flow</text><text x="460" y="482" class="caption" text-anchor="middle">2 reflow iterations enable 1-step inference (SDXL-Turbo, SD3-Turbo, Flux-schnell)</text></svg>