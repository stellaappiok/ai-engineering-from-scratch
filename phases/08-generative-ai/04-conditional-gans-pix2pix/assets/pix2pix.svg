<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 500"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">Pix2Pix — U-Net generator, PatchGAN discriminator</text><rect width="90" height="70" x="30" y="90" class="box"/><text x="75" y="120" class="content" text-anchor="middle">input x</text><text x="75" y="140" class="caption" text-anchor="middle">edge map</text><rect width="420" height="140" x="140" y="60" class="cold"/><text x="350" y="82" class="label" text-anchor="middle">U-Net generator G(x)</text><rect width="40" height="80" x="160" y="100" class="box"/><rect width="40" height="60" x="210" y="110" class="box"/><rect width="40" height="40" x="260" y="120" class="box"/><rect width="40" height="20" x="310" y="130" class="hot"/><rect width="40" height="40" x="360" y="120" class="box"/><rect width="40" height="60" x="410" y="110" class="box"/><rect width="40" height="80" x="460" y="100" class="box"/><rect width="30" height="90" x="510" y="95" class="box"/><path fill="none" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.2" d="M 180,100 Q 270,65 510,100"/><path fill="none" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.2" d="M 230,110 Q 310,80 460,110"/><path fill="none" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.2" d="M 280,120 Q 330,95 410,120"/><text x="350" y="195" class="caption" text-anchor="middle">skip connections preserve high-freq detail</text><line x1="540" x2="580" y1="130" y2="130" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="90" height="70" x="580" y="95" class="box"/><text x="625" y="125" class="content" text-anchor="middle">output ŷ</text><text x="625" y="145" class="caption" text-anchor="middle">photo</text><rect width="90" height="70" x="680" y="95" class="box"/><text x="725" y="125" class="content" text-anchor="middle">target y</text><rect width="80" height="70" x="780" y="95" class="hot"/><text x="820" y="125" class="mono" text-anchor="middle">L1</text><text x="820" y="145" class="caption" text-anchor="middle">λ = 100</text><line x1="670" x2="680" y1="130" y2="130" stroke="#1a1a1a" stroke-width="1.2"/><line x1="770" x2="780" y1="130" y2="130" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="220" height="100" x="30" y="250" class="hot"/><text x="140" y="273" class="label" text-anchor="middle">PatchGAN D(x, ŷ)</text><text x="140" y="295" class="caption" text-anchor="middle">output is an N × N grid</text><text x="140" y="315" class="caption" text-anchor="middle">each cell judges ~70×70 patch</text><text x="140" y="335" class="caption" text-anchor="middle">averaged → real / fake score</text><line x1="75" x2="75" y1="160" y2="250" stroke="#1a1a1a" stroke-width="1.2"/><line x1="75" x2="30" y1="250" y2="280" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="625" x2="250" y1="165" y2="280" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="570" height="100" x="290" y="250" class="box"/><text x="575" y="275" class="label" text-anchor="middle">objective</text><text x="575" y="298" class="mono" text-anchor="middle">L_G = -log D(x, G(x)) + 100 · ||y - G(x)||_1</text><text x="575" y="320" class="mono" text-anchor="middle">L_D = -log D(x, y) - log (1 - D(x, G(x)))</text><text x="575" y="340" class="caption" text-anchor="middle">L1 stabilizes + sharp edges; adv term fights blur</text><rect width="830" height="100" x="30" y="380" class="box"/><text x="445" y="403" class="label" text-anchor="middle">CycleGAN (unpaired): add a second G and a cycle-consistency loss</text><text x="445" y="425" class="mono" text-anchor="middle">G: X -&gt; Y, F: Y -&gt; X, loss += ||F(G(x)) - x||_1 + ||G(F(y)) - y||_1</text><text x="445" y="447" class="caption" text-anchor="middle">no paired data needed; horses &lt;-&gt; zebras, summer &lt;-&gt; winter</text><text x="445" y="465" class="caption" text-anchor="middle">2026: mostly superseded by ControlNet + IP-Adapter over diffusion</text></svg>