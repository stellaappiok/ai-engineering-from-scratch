<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.frozen{fill:#ecece8;stroke:#666;stroke-width:1;stroke-dasharray:4,3}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">ControlNet clones the encoder; LoRA adds a low-rank delta</text><text x="100" y="70" class="label">ControlNet</text><rect width="120" height="200" x="40" y="80" class="frozen"/><text x="100" y="100" class="caption" text-anchor="middle">frozen SD U-Net</text><rect width="90" height="35" x="55" y="115" class="box"/><text x="100" y="138" class="content" text-anchor="middle">encoder</text><rect width="90" height="35" x="55" y="155" class="box"/><text x="100" y="178" class="content" text-anchor="middle">bottleneck</text><rect width="90" height="35" x="55" y="195" class="box"/><text x="100" y="218" class="content" text-anchor="middle">decoder</text><rect width="90" height="35" x="55" y="235" class="box"/><text x="100" y="258" class="content" text-anchor="middle">decoder</text><rect width="140" height="200" x="200" y="80" class="cold"/><text x="270" y="100" class="caption" text-anchor="middle">ControlNet clone (trainable)</text><rect width="100" height="35" x="220" y="115" class="box"/><text x="270" y="138" class="content" text-anchor="middle">enc copy</text><rect width="100" height="35" x="220" y="155" class="box"/><text x="270" y="178" class="content" text-anchor="middle">bottleneck copy</text><rect width="100" height="40" x="220" y="230" class="hot"/><text x="270" y="253" class="mono" text-anchor="middle">depth map</text><line x1="270" x2="270" y1="230" y2="190" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="320" x2="360" y1="170" y2="200" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="380" y="180" class="mono">zero-conv</text><line x1="320" x2="145" y1="130" y2="215" stroke="#c0392b" stroke-dasharray="3 3" stroke-width="1.2"/><line x1="320" x2="145" y1="170" y2="255" stroke="#c0392b" stroke-dasharray="3 3" stroke-width="1.2"/><text x="180" y="310" class="caption" text-anchor="middle">zero-conv init =&gt; starts as identity; learns a delta</text><text x="590" y="70" class="label">LoRA</text><rect width="360" height="220" x="500" y="80" class="box"/><text x="680" y="102" class="mono" text-anchor="middle">W&apos; = W + α · B · A</text><rect width="70" height="80" x="540" y="130" class="frozen"/><text x="575" y="175" class="content" text-anchor="middle">W</text><text x="575" y="195" class="caption" text-anchor="middle">d × d, frozen</text><text x="630" y="175" class="mono">+</text><rect width="60" height="60" x="655" y="140" class="cold"/><text x="685" y="175" class="content" text-anchor="middle">B</text><text x="685" y="195" class="caption" text-anchor="middle">d × r</text><rect width="80" height="40" x="730" y="150" class="cold"/><text x="770" y="175" class="content" text-anchor="middle">A</text><text x="770" y="195" class="caption" text-anchor="middle">r × d</text><text x="680" y="240" class="caption" text-anchor="middle">r = 4-16 typical; rank-r compression</text><text x="680" y="260" class="caption" text-anchor="middle">params: 2 · d · r instead of d²</text><text x="680" y="280" class="caption" text-anchor="middle">runtime knob: α ∈ [0.5, 1.5]</text><rect width="820" height="180" x="40" y="340" class="box"/><text x="450" y="365" class="label" text-anchor="middle">composability in 2026 pipelines</text><rect width="180" height="120" x="60" y="380" class="cold"/><text x="150" y="402" class="content" text-anchor="middle">ControlNet</text><text x="150" y="422" class="caption" text-anchor="middle">spatial (pose, depth,</text><text x="150" y="438" class="caption" text-anchor="middle">edges, scribble, seg)</text><text x="150" y="470" class="caption" text-anchor="middle">70-360 MB per modality</text><rect width="180" height="120" x="260" y="380" class="cold"/><text x="350" y="402" class="content" text-anchor="middle">LoRA</text><text x="350" y="422" class="caption" text-anchor="middle">style, subject, concept</text><text x="350" y="438" class="caption" text-anchor="middle">20-200 MB</text><text x="350" y="470" class="caption" text-anchor="middle">stack multiple with α scaling</text><rect width="180" height="120" x="460" y="380" class="cold"/><text x="550" y="402" class="content" text-anchor="middle">IP-Adapter</text><text x="550" y="422" class="caption" text-anchor="middle">reference image as condition</text><text x="550" y="438" class="caption" text-anchor="middle">via CLIP image tokens</text><text x="550" y="470" class="caption" text-anchor="middle">~20 MB</text><rect width="180" height="120" x="660" y="380" class="cold"/><text x="750" y="402" class="content" text-anchor="middle">DreamBooth</text><text x="750" y="422" class="caption" text-anchor="middle">full fine-tune of base</text><text x="750" y="438" class="caption" text-anchor="middle">strongest identity</text><text x="750" y="470" class="caption" text-anchor="middle">2-5 GB</text></svg>