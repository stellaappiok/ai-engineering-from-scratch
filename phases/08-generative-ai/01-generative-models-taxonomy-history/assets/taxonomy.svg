<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-size:11px;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">five families of generative models</text><text x="450" y="50" class="caption" text-anchor="middle">split by what they model and how they sample</text><rect width="140" height="44" x="380" y="70" class="box"/><text x="450" y="90" class="label" text-anchor="middle">p_data(x)</text><text x="450" y="106" class="caption" text-anchor="middle">unknown, want sampler</text><line x1="450" x2="180" y1="114" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="450" x2="340" y1="114" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="450" x2="500" y1="114" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="450" x2="660" y1="114" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="450" x2="820" y1="114" y2="150" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="230" height="180" x="60" y="155" class="box"/><text x="175" y="178" class="label" text-anchor="middle">1. explicit, tractable</text><text x="175" y="200" class="mono" text-anchor="middle">p(x) = ∏ p(x_i | x_&lt;i)</text><text x="175" y="225" class="content" text-anchor="middle">autoregressive: GPT, PixelCNN</text><text x="175" y="245" class="content" text-anchor="middle">flows: Glow, RealNVP</text><text x="175" y="275" class="caption" text-anchor="middle">exact log p(x)</text><text x="175" y="293" class="caption" text-anchor="middle">slow sequential inference</text><text x="175" y="311" class="caption" text-anchor="middle">architecture restrictions (flows)</text><rect width="230" height="180" x="305" y="155" class="hot"/><text x="420" y="178" class="label" text-anchor="middle">2. explicit, approximate</text><text x="420" y="200" class="mono" text-anchor="middle">maximize ELBO ≤ log p(x)</text><text x="420" y="225" class="content" text-anchor="middle">VAE: encoder + decoder</text><text x="420" y="245" class="content" text-anchor="middle">diffusion: DDPM, SD3</text><text x="420" y="275" class="caption" text-anchor="middle">dominant in 2026</text><text x="420" y="293" class="caption" text-anchor="middle">iterative sampling (20-50 steps)</text><text x="420" y="311" class="caption" text-anchor="middle">scales to text, image, video, 3D</text><rect width="230" height="180" x="550" y="155" class="box"/><text x="665" y="178" class="label" text-anchor="middle">3. implicit density</text><text x="665" y="200" class="mono" text-anchor="middle">G(z) -&gt; x, D(x) -&gt; real/fake</text><text x="665" y="225" class="content" text-anchor="middle">GAN, StyleGAN, Pix2Pix</text><text x="665" y="255" class="caption" text-anchor="middle">one-shot sampling</text><text x="665" y="273" class="caption" text-anchor="middle">no log p(x) at all</text><text x="665" y="291" class="caption" text-anchor="middle">training instability, mode collapse</text><text x="665" y="309" class="caption" text-anchor="middle">still SOTA for narrow photoreal</text><rect width="350" height="150" x="60" y="350" class="box"/><text x="235" y="373" class="label" text-anchor="middle">4. score / continuous-time</text><text x="235" y="395" class="mono" text-anchor="middle">learn s(x) = ∇_x log p(x)</text><text x="235" y="418" class="content" text-anchor="middle">score SDE, flow matching</text><text x="235" y="438" class="content" text-anchor="middle">rectified flow, consistency models</text><text x="235" y="465" class="caption" text-anchor="middle">simulation-free training</text><text x="235" y="483" class="caption" text-anchor="middle">straight paths =&gt; 1-4 step sampling</text><rect width="350" height="150" x="430" y="350" class="box"/><text x="605" y="373" class="label" text-anchor="middle">5. tokens + AR transformer</text><text x="605" y="395" class="mono" text-anchor="middle">VQ-VAE + transformer over tokens</text><text x="605" y="418" class="content" text-anchor="middle">DALL-E 1, Parti, MuseNet</text><text x="605" y="438" class="content" text-anchor="middle">AudioLM, VALL-E, MusicGen, Sora patches</text><text x="605" y="465" class="caption" text-anchor="middle">reuse LLM stack</text><text x="605" y="483" class="caption" text-anchor="middle">quality bounded by tokenizer</text></svg>