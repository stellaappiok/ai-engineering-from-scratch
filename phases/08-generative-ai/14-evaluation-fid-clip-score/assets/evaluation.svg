<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold{fill:#eaf4ff;stroke:#2c5f8c}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.mono{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">three-pillar evaluation of generative models</text><rect width="270" height="200" x="30" y="60" class="box"/><text x="165" y="85" class="label" text-anchor="middle">FID (sample quality)</text><text x="165" y="110" class="mono" text-anchor="middle">||μ_r - μ_g||² + Tr(Σ_r + Σ_g - 2√Σ_rΣ_g)</text><text x="165" y="140" class="caption" text-anchor="middle">Fréchet distance between</text><text x="165" y="158" class="caption" text-anchor="middle">Gaussian fits in Inception-v3 space</text><text x="165" y="188" class="caption" text-anchor="middle">use N ≥ 10k or numbers lie</text><text x="165" y="206" class="caption" text-anchor="middle">ImageNet-biased; use FD-DINO or</text><text x="165" y="224" class="caption" text-anchor="middle">CMMD out of domain</text><text x="165" y="252" class="caption" text-anchor="middle">lower = better</text><rect width="270" height="200" x="315" y="60" class="box"/><text x="450" y="85" class="label" text-anchor="middle">CLIP score (adherence)</text><text x="450" y="110" class="mono" text-anchor="middle">cos( CLIP_image(x), CLIP_text(p) )</text><text x="450" y="140" class="caption" text-anchor="middle">how well does output match prompt?</text><text x="450" y="170" class="caption" text-anchor="middle">compositional failures slip through</text><text x="450" y="188" class="caption" text-anchor="middle">short prompts score higher mechanically</text><text x="450" y="206" class="caption" text-anchor="middle">CMMD + VQA tests cover CLIP blind spots</text><text x="450" y="252" class="caption" text-anchor="middle">higher = better</text><rect width="270" height="200" x="600" y="60" class="box"/><text x="735" y="85" class="label" text-anchor="middle">human preference (truth)</text><text x="735" y="110" class="mono" text-anchor="middle">Elo from pairwise wins</text><text x="735" y="140" class="caption" text-anchor="middle">A vs B on same prompt</text><text x="735" y="158" class="caption" text-anchor="middle">HPSv2 / ImageReward / PickScore</text><text x="735" y="188" class="caption" text-anchor="middle">as automated proxies</text><text x="735" y="206" class="caption" text-anchor="middle">Chatbot-Arena-style image arenas</text><text x="735" y="252" class="caption" text-anchor="middle">higher win rate = better</text><rect width="840" height="100" x="30" y="285" class="hot"/><text x="450" y="310" class="label" text-anchor="middle">each metric has a known game</text><text x="450" y="333" class="caption" text-anchor="middle">FID: overfit Inception prior → low FID, same quality</text><text x="450" y="353" class="caption" text-anchor="middle">CLIP: saturate with &apos;masterpiece, 4k&apos; → inflated score</text><text x="450" y="373" class="caption" text-anchor="middle">preference: prompt set overlap with training → rigged</text><rect width="840" height="100" x="30" y="410" class="cold"/><text x="450" y="435" class="label" text-anchor="middle">production eval report</text><text x="450" y="458" class="caption" text-anchor="middle">1. FID on 10-30k + 2. CLIP / CMMD on the same pool +</text><text x="450" y="478" class="caption" text-anchor="middle">3. 200+ blind human-pair Elo + 4. qualitative failure audit on 50 outputs</text><text x="450" y="498" class="caption" text-anchor="middle">one metric = marketing; four = evidence</text></svg>