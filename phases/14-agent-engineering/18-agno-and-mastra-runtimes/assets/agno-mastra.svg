<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.agno{fill:#e6f4ea;stroke:#2e7d32}.agno,.diff,.mastra{stroke-width:1.5}.mastra{fill:#dfe9ff;stroke:#2c5ea9}.diff{fill:#fff1d6;stroke:#c0392b}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Agno vs Mastra — two production runtimes, two stacks</text><rect width="440" height="280" x="40" y="50" class="agno"/><text x="260" y="72" class="head" text-anchor="middle">Agno Python, FastAPI, near-zero overhead</text><rect width="400" height="40" x="60" y="90" class="box"/><text x="78" y="112" class="step">target: ~2μs agent instantiation</text><text x="78" y="126" class="small">matters for thousands of short-lived agents per second</text><rect width="400" height="40" x="60" y="140" class="box"/><text x="78" y="162" class="step">target: ~3.75 KiB memory per agent</text><text x="78" y="176" class="small">stateless FastAPI handler per request</text><rect width="400" height="40" x="60" y="190" class="box"/><text x="78" y="212" class="step">~23 model providers, native multimodal</text><text x="78" y="226" class="small">text, image, audio, video, file</text><rect width="400" height="40" x="60" y="240" class="box"/><text x="78" y="262" class="step">&quot;no graphs, chains, or convoluted patterns&quot;</text><text x="78" y="276" class="small">philosophy: pure python, minimal framework surface</text><rect width="400" height="34" x="60" y="290" class="box"/><text x="78" y="312" class="step">session state in DB; agent is ephemeral</text><rect width="420" height="280" x="500" y="50" class="mastra"/><text x="710" y="72" class="head" text-anchor="middle">Mastra TypeScript, Vercel AI SDK substrate</text><rect width="380" height="40" x="520" y="90" class="box"/><text x="538" y="112" class="step">three primitives: Agents, Tools (Zod), Workflows</text><text x="538" y="126" class="small">Zod-typed tools; compile-time safety</text><rect width="380" height="40" x="520" y="140" class="box"/><text x="538" y="162" class="step">Unified Model Router: 3,300+ models, 94 providers</text><text x="538" y="176" class="small">single client across the ecosystem (Mar 2026)</text><rect width="380" height="40" x="520" y="190" class="box"/><text x="538" y="212" class="step">composite storage: memory / workflows / obs</text><text x="538" y="226" class="small">ClickHouse recommended at observability scale</text><rect width="380" height="40" x="520" y="240" class="box"/><text x="538" y="262" class="step">server adapters: Express, Hono, Fastify, Koa</text><text x="538" y="276" class="small">first-class Next.js + Astro integration</text><rect width="380" height="34" x="520" y="290" class="box"/><text x="538" y="312" class="step">Mastra Studio at localhost:4111 for debugging</text><rect width="880" height="160" x="40" y="350" class="diff"/><text x="480" y="372" class="head" text-anchor="middle">choose by stack</text><rect width="840" height="36" x="60" y="388" class="box"/><text x="78" y="410" class="step">python backend + FastAPI + short-lived agents Agno</text><rect width="840" height="36" x="60" y="430" class="box"/><text x="78" y="452" class="step">typescript backend + Next.js/Vercel + unified multi-provider Mastra</text><rect width="840" height="36" x="60" y="472" class="box"/><text x="78" y="494" class="step">durable state, explicit graphs, long-horizon runs LangGraph (Lesson 13)</text><text x="480" y="540" class="caption" text-anchor="middle">performance targets matter when overhead is a bottleneck; often it is not.</text></svg>