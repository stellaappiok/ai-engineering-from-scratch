<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.agent{fill:#e6f4ea;stroke:#2e7d32}.agent,.guard,.trace{stroke-width:1.5}.guard{fill:#fff1d6;stroke:#c0392b}.trace{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">OpenAI Agents SDK — Agent, Handoff, Guardrail, Session, Tracing</text><rect width="880" height="210" x="40" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">triage handoff specialist, wrapped in guardrails</text><rect width="160" height="60" x="60" y="90" class="guard"/><text x="140" y="114" class="step" text-anchor="middle">input guardrail</text><text x="140" y="132" class="small" text-anchor="middle">PII, policy, scope</text><rect width="160" height="60" x="240" y="90" class="agent"/><text x="320" y="114" class="step" text-anchor="middle">triage agent</text><text x="320" y="132" class="small" text-anchor="middle">picks handoff</text><rect width="160" height="60" x="420" y="60" class="agent"/><text x="500" y="84" class="step" text-anchor="middle">billing agent</text><text x="500" y="102" class="small" text-anchor="middle">refund_tool, invoice_tool</text><rect width="160" height="60" x="420" y="130" class="agent"/><text x="500" y="154" class="step" text-anchor="middle">support agent</text><text x="500" y="172" class="small" text-anchor="middle">bug_logger, status_check</text><rect width="160" height="60" x="600" y="90" class="guard"/><text x="680" y="114" class="step" text-anchor="middle">output guardrail</text><text x="680" y="132" class="small" text-anchor="middle">PII, length, policy</text><rect width="120" height="60" x="780" y="90" class="box"/><text x="840" y="120" class="step" text-anchor="middle">user</text><line x1="220" x2="240" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="400" x2="420" y1="120" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="400" x2="420" y1="120" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="580" x2="600" y1="90" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="580" x2="600" y1="160" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="760" x2="780" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="840" height="80" x="60" y="170" class="box"/><text x="80" y="192" class="step">handoff mechanics: tool name = transfer_to_&lt;agent_name&gt;</text><text x="80" y="210" class="small">model sees transfer_to_billing, transfer_to_support in its tool list</text><text x="80" y="226" class="small">runtime copies context (or collapses via nest_handoff_history beta) before target agent starts</text><text x="80" y="242" class="small">hop counter prevents bounce loops (triage billing triage billing ...)</text><rect width="880" height="230" x="40" y="280" class="trace"/><text x="480" y="302" class="head" text-anchor="middle">span tree tracing is on by default</text><rect width="840" height="30" x="60" y="318" class="box"/><text x="78" y="338" class="step">run user_input=&quot;I need a refund...&quot;</text><rect width="820" height="30" x="80" y="352" class="box"/><text x="98" y="372" class="step">input_guardrail.pii_block passed=True</text><rect width="820" height="30" x="80" y="386" class="box"/><text x="98" y="406" class="step">agent.triage hop=0</text><rect width="800" height="30" x="100" y="420" class="box"/><text x="118" y="440" class="step">handoff.transfer_to_billing from=triage to=billing</text><rect width="820" height="30" x="80" y="454" class="box"/><text x="98" y="474" class="step">agent.billing hop=1 llm_generation &quot;billing handled: ...&quot;</text><rect width="820" height="20" x="80" y="488" class="box"/><text x="98" y="502" class="step">output_guardrail.length_cap passed=True</text><text x="480" y="540" class="caption" text-anchor="middle">tracing built in; add_trace_processor fans to your backend. OTel GenAI maps straight to these spans.</text></svg>