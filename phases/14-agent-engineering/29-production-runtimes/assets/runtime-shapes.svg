<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.req{fill:#e6f4ea;stroke:#2e7d32}.event,.queue,.req,.stream{stroke-width:1.5}.stream{fill:#dfe9ff;stroke:#2c5ea9}.queue{fill:#fff1d6;stroke:#c0392b}.event{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Production runtime shapes — pick by task, not by framework</text><rect width="220" height="220" x="40" y="50" class="req"/><text x="150" y="72" class="head" text-anchor="middle">request-response</text><text x="60" y="96" class="small">synchronous HTTP</text><text x="60" y="114" class="small">user waits for completion</text><text x="60" y="132" class="small">short tasks only (&lt;30s)</text><rect width="180" height="30" x="60" y="148" class="box"/><text x="78" y="168" class="step">Agno, Mastra, raw SDK</text><rect width="180" height="30" x="60" y="186" class="box"/><text x="78" y="206" class="step">OTel spans per request</text><rect width="180" height="30" x="60" y="224" class="box"/><text x="78" y="244" class="step">fits: chat UX, tool calls</text><rect width="220" height="220" x="280" y="50" class="stream"/><text x="390" y="72" class="head" text-anchor="middle">streaming</text><text x="300" y="96" class="small">SSE / WebSocket / WebRTC</text><text x="300" y="114" class="small">progressive output</text><text x="300" y="132" class="small">LiveKit adds WebRTC</text><rect width="180" height="30" x="300" y="148" class="box"/><text x="318" y="168" class="step">Pipecat, LiveKit, SDK</text><rect width="180" height="30" x="300" y="186" class="box"/><text x="318" y="206" class="step">first-token latency matters</text><rect width="180" height="30" x="300" y="224" class="box"/><text x="318" y="244" class="step">fits: voice, copilot UX</text><rect width="220" height="220" x="520" y="50" class="queue"/><text x="630" y="72" class="head" text-anchor="middle">queue-based</text><text x="540" y="96" class="small">producer worker pool DLQ</text><text x="540" y="114" class="small">webhook / pubsub for results</text><text x="540" y="132" class="small">long-horizon tasks</text><rect width="180" height="30" x="540" y="148" class="box"/><text x="558" y="168" class="step">Celery, BullMQ, SQS</text><rect width="180" height="30" x="540" y="186" class="box"/><text x="558" y="206" class="step">queue depth + DLQ metrics</text><rect width="180" height="30" x="540" y="224" class="box"/><text x="558" y="244" class="step">fits: computer use, research</text><rect width="160" height="220" x="760" y="50" class="event"/><text x="840" y="72" class="head" text-anchor="middle">event + cron</text><text x="778" y="96" class="small">trigger-based</text><text x="778" y="114" class="small">+ scheduled</text><rect width="120" height="30" x="778" y="132" class="box"/><text x="796" y="152" class="step">CrewAI Flows</text><rect width="120" height="30" x="778" y="170" class="box"/><text x="796" y="190" class="step">Managed Agents</text><rect width="120" height="30" x="778" y="208" class="box"/><text x="796" y="228" class="step">cron + durable</text><rect width="880" height="220" x="40" y="290" class="box"/><text x="480" y="312" class="head" text-anchor="middle">durable execution cross-cuts all shapes (LangGraph, AutoGen v0.4 actors, Managed Agents)</text><rect width="840" height="30" x="60" y="328" class="box"/><text x="78" y="348" class="step">state checkpointed after every step resume picks up at exact step</text><rect width="840" height="30" x="60" y="362" class="box"/><text x="78" y="382" class="step">actor-model fault isolation one agent crash does not crash peers</text><rect width="840" height="30" x="60" y="396" class="box"/><text x="78" y="416" class="step">essential when step count is unknown and recovery cost is high</text><rect width="840" height="30" x="60" y="430" class="box"/><text x="78" y="450" class="step">observability load-bearing: OTel GenAI (Lesson 23) + Langfuse/Phoenix/Opik (Lesson 24)</text><rect width="840" height="30" x="60" y="464" class="box"/><text x="78" y="484" class="step">without spans + eval: failing at step 40 is un-debuggable; you replay from scratch</text><text x="480" y="540" class="caption" text-anchor="middle">pick the shape first; the framework is a second-order choice.</text></svg>