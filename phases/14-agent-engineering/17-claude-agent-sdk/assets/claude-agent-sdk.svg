<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.orch{fill:#e6f4ea;stroke:#2e7d32}.hook,.orch,.store,.sub{stroke-width:1.5}.sub{fill:#fff1d6;stroke:#c0392b}.hook{fill:#dfe9ff;stroke:#2c5ea9}.store{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Claude Agent SDK — harness with subagents, hooks, session store</text><rect width="880" height="220" x="40" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">orchestrator spawns three subagents; each runs in its own context</text><rect width="220" height="160" x="60" y="90" class="orch"/><text x="170" y="112" class="head" text-anchor="middle">orchestrator</text><text x="78" y="136" class="small">session: session_main</text><text x="78" y="154" class="small">context bounded — only results return</text><text x="78" y="172" class="small">tool calls: list_dir(/project)</text><text x="78" y="190" class="small">spawn 3 subs; wait for results</text><text x="78" y="208" class="small">aggregate; emit final response</text><text x="78" y="226" class="small">session persists through SessionStore</text><rect width="200" height="70" x="300" y="90" class="sub"/><text x="400" y="112" class="step" text-anchor="middle">subagent 1</text><text x="318" y="130" class="small">session: session_main.sub01</text><text x="318" y="146" class="small">read_file(a.py) result</text><rect width="200" height="70" x="300" y="170" class="sub"/><text x="400" y="192" class="step" text-anchor="middle">subagent 2</text><text x="318" y="210" class="small">session: session_main.sub02</text><text x="318" y="226" class="small">read_file(b.py) result</text><rect width="200" height="70" x="520" y="130" class="sub"/><text x="620" y="152" class="step" text-anchor="middle">subagent 3</text><text x="538" y="170" class="small">session: session_main.sub03</text><text x="538" y="186" class="small">read_file(c.py) result</text><rect width="160" height="70" x="740" y="130" class="box"/><text x="820" y="152" class="step" text-anchor="middle">aggregator</text><text x="758" y="170" class="small">merge 3 results</text><text x="758" y="186" class="small">orchestrator context +=</text><line x1="280" x2="300" y1="170" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="280" x2="300" y1="170" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="280" x2="520" y1="170" y2="165" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" x2="740" y1="125" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" x2="740" y1="205" y2="175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="720" x2="740" y1="165" y2="165" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="440" height="220" x="40" y="290" class="hook"/><text x="260" y="312" class="head" text-anchor="middle">lifecycle hooks</text><rect width="400" height="26" x="60" y="328" class="box"/><text x="78" y="346" class="step">SessionStart, SessionEnd</text><rect width="400" height="26" x="60" y="360" class="box"/><text x="78" y="378" class="step">PreToolUse, PostToolUse</text><rect width="400" height="26" x="60" y="392" class="box"/><text x="78" y="410" class="step">UserPromptSubmit</text><rect width="400" height="26" x="60" y="424" class="box"/><text x="78" y="442" class="step">PreCompact, Stop, Notification</text><rect width="400" height="46" x="60" y="456" class="box"/><text x="78" y="478" class="step">cross-cutting behavior:</text><text x="78" y="496" class="small">rate-limits, audits, logging, evals, rule enforcement</text><rect width="420" height="220" x="500" y="290" class="store"/><text x="710" y="312" class="head" text-anchor="middle">session store</text><rect width="380" height="26" x="520" y="328" class="box"/><text x="538" y="346" class="step">append(session_id, message)</text><rect width="380" height="26" x="520" y="360" class="box"/><text x="538" y="378" class="step">load(session_id) list of turns</text><rect width="380" height="26" x="520" y="392" class="box"/><text x="538" y="410" class="step">list_sessions()</text><rect width="380" height="26" x="520" y="424" class="box"/><text x="538" y="442" class="step">delete(session_id) cascades to subagent sessions</text><rect width="380" height="46" x="520" y="456" class="box"/><text x="538" y="478" class="step">list_subkeys(parent) + --session-mirror</text><text x="538" y="496" class="small">full TypeScript parity in the Python SDK</text><text x="480" y="540" class="caption" text-anchor="middle">W3C trace context propagates into CLI subprocess; entire multi-process run is one trace.</text></svg>