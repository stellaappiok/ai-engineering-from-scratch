<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.actor{fill:#e6f4ea;stroke:#2e7d32}.actor,.dlq,.msg,.rt{stroke-width:1.5}.msg{fill:#fff1d6;stroke:#c0392b}.rt{fill:#dfe9ff;stroke:#2c5ea9}.dlq{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">AutoGen v0.4 — actor model runtime with fault isolation</text><rect width="880" height="200" x="40" y="50" class="rt"/><text x="480" y="72" class="head" text-anchor="middle">runtime — event loop, inbox per actor, delivery with failure isolation</text><rect width="220" height="140" x="60" y="90" class="actor"/><text x="170" y="112" class="head" text-anchor="middle">actor: checklist</text><text x="78" y="134" class="small">private state (results, consensus)</text><text x="78" y="152" class="small">inbox deque</text><text x="78" y="170" class="small">receive(message, runtime)</text><text x="78" y="188" class="small">send() puts into runtime queue</text><text x="78" y="208" class="small">no shared memory with other actors</text><rect width="220" height="140" x="300" y="90" class="actor"/><text x="410" y="112" class="head" text-anchor="middle">actor: reviewer</text><text x="318" y="134" class="small">private state (verdicts)</text><text x="318" y="152" class="small">handles topic=review</text><text x="318" y="170" class="small">replies with review_result</text><text x="318" y="188" class="small">handler may raise routed to DLQ</text><text x="318" y="208" class="small">other actors keep running</text><rect width="360" height="140" x="540" y="90" class="box"/><text x="720" y="112" class="head" text-anchor="middle">shared runtime queue</text><rect width="320" height="26" x="560" y="128" class="msg"/><text x="578" y="146" class="step">m001 checklist &quot;start&quot; [snippets]</text><rect width="320" height="26" x="560" y="160" class="msg"/><text x="578" y="178" class="step">m002 reviewer &quot;crash_me&quot; (will fail)</text><rect width="320" height="26" x="560" y="192" class="msg"/><text x="578" y="210" class="step">m003-m005 reviewer &quot;review&quot; 3x</text><rect width="440" height="220" x="40" y="270" class="box"/><text x="260" y="292" class="head" text-anchor="middle">worked trace — fault isolation</text><rect width="400" height="26" x="60" y="308" class="box"/><text x="78" y="326" class="step">runtime delivers m002 reviewer raises</text><rect width="400" height="26" x="60" y="340" class="box"/><text x="78" y="358" class="step">DLQ: m002 &quot;RuntimeError: simulated handler failure&quot;</text><rect width="400" height="26" x="60" y="372" class="box"/><text x="78" y="390" class="step">runtime continues delivering m003-m005</text><rect width="400" height="26" x="60" y="404" class="box"/><text x="78" y="422" class="step">reviewer replies review_result for each</text><rect width="400" height="26" x="60" y="436" class="box"/><text x="78" y="454" class="step">checklist reaches consensus across 3 results</text><rect width="420" height="220" x="500" y="270" class="dlq"/><text x="710" y="292" class="head" text-anchor="middle">three API layers in v0.4</text><rect width="380" height="46" x="520" y="308" class="box"/><text x="538" y="330" class="step">Core AgentRuntime, Agent, Message, Topic</text><text x="538" y="346" class="small">low-level, async, event-driven</text><rect width="380" height="46" x="520" y="360" class="box"/><text x="538" y="382" class="step">AgentChat RoundRobin, Selector, AssistantAgent</text><text x="538" y="398" class="small">task-driven high-level API (v0.2 replacement)</text><rect width="380" height="66" x="520" y="412" class="box"/><text x="538" y="434" class="step">Extensions OpenAI, Anthropic, Azure, tools</text><text x="538" y="452" class="small">Magentic-One is the reference team built on AgentChat</text><text x="538" y="470" class="small">OTel GenAI spans on by default (Lesson 23)</text><text x="480" y="540" class="caption" text-anchor="middle">v0.7.x in maintenance. Microsoft Agent Framework (preview Oct 2025) is the forward path — same ideas.</text></svg>