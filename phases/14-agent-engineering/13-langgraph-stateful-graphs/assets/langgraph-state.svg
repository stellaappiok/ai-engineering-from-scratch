<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.node{fill:#e6f4ea;stroke:#2e7d32}.ckpt,.node{stroke-width:1.5}.pause{fill:#fff1d6;stroke:#c0392b}.pause,.topo{stroke-width:1.5}.ckpt{fill:#dfe9ff;stroke:#2c5ea9}.topo{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">LangGraph — stateful graph with checkpoint and resume</text><rect width="880" height="180" x="40" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">a five-node routing graph (classify branch human gate send)</text><rect width="120" height="50" x="60" y="90" class="node"/><text x="120" y="114" class="step" text-anchor="middle">classify</text><text x="120" y="130" class="small" text-anchor="middle">sets route</text><rect width="110" height="50" x="200" y="90" class="node"/><text x="255" y="114" class="step" text-anchor="middle">refund</text><rect width="110" height="50" x="200" y="148" class="node"/><text x="255" y="172" class="step" text-anchor="middle">bug</text><rect width="110" height="50" x="200" y="206" class="node"/><text x="255" y="230" class="step" text-anchor="middle">sales</text><rect width="140" height="50" x="330" y="148" class="pause"/><text x="400" y="172" class="step" text-anchor="middle">human_gate</text><text x="400" y="188" class="small" text-anchor="middle">pauses without approval</text><rect width="100" height="50" x="490" y="148" class="node"/><text x="540" y="172" class="step" text-anchor="middle">send</text><rect width="100" height="50" x="610" y="148" class="box"/><text x="660" y="172" class="step" text-anchor="middle">END</text><line x1="180" x2="200" y1="115" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" x2="200" y1="115" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="180" x2="200" y1="115" y2="228" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" x2="330" y1="115" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" x2="330" y1="170" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="310" x2="330" y1="228" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="470" x2="490" y1="170" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="590" x2="610" y1="170" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="440" height="250" x="40" y="250" class="ckpt"/><text x="260" y="272" class="head" text-anchor="middle">durable execution — checkpoint per node</text><rect width="400" height="36" x="60" y="288" class="box"/><text x="78" y="310" class="step">after classify: state.route = &quot;bug&quot;</text><rect width="400" height="36" x="60" y="330" class="box"/><text x="78" y="352" class="step">after bug: state.ticket = &quot;BUG-...&quot;</text><rect width="400" height="36" x="60" y="372" class="box"/><text x="78" y="394" class="step">at human_gate: pause, serialize state, return control</text><rect width="400" height="36" x="60" y="414" class="box"/><text x="78" y="436" class="step">human approves: state.human_approval = true; resume from send</text><rect width="400" height="36" x="60" y="456" class="box"/><text x="78" y="478" class="step">after send: state.output = &quot;sent BUG-...&quot; END</text><rect width="420" height="250" x="500" y="250" class="topo"/><text x="710" y="272" class="head" text-anchor="middle">three topologies</text><rect width="380" height="56" x="520" y="288" class="box"/><text x="538" y="310" class="step">supervisor central LLM routes to specialists</text><text x="538" y="328" class="small">create_supervisor() or tool-call-based dispatch</text><rect width="380" height="56" x="520" y="352" class="box"/><text x="538" y="374" class="step">swarm peer-to-peer handoffs via shared tools</text><text x="538" y="392" class="small">no central router; lower latency; harder to reason</text><rect width="380" height="56" x="520" y="416" class="box"/><text x="538" y="438" class="step">hierarchical supervisors of supervisors</text><text x="538" y="456" class="small">nested subgraphs; used when scale &gt; single graph</text><text x="480" y="540" class="caption" text-anchor="middle">state is typed, immutable between nodes, serialized after every step — resume is exact</text></svg>