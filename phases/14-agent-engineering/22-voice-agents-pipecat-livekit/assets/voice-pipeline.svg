<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.stage{fill:#e6f4ea;stroke:#2e7d32}.latency,.stage,.upstream{stroke-width:1.5}.upstream{fill:#fff1d6;stroke:#c0392b}.latency{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Voice pipeline — Pipecat frame-based, LiveKit WebRTC transport</text><rect width="880" height="170" x="40" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">DOWNSTREAM audio in, speech out</text><rect width="130" height="60" x="60" y="90" class="stage"/><text x="125" y="114" class="step" text-anchor="middle">VAD (Silero)</text><text x="125" y="132" class="small" text-anchor="middle">20-60ms</text><rect width="130" height="60" x="210" y="90" class="stage"/><text x="275" y="114" class="step" text-anchor="middle">STT</text><text x="275" y="132" class="small" text-anchor="middle">100-250ms partial</text><rect width="130" height="60" x="360" y="90" class="stage"/><text x="425" y="114" class="step" text-anchor="middle">LLM</text><text x="425" y="132" class="small" text-anchor="middle">150-400ms first token</text><rect width="130" height="60" x="510" y="90" class="stage"/><text x="575" y="114" class="step" text-anchor="middle">TTS</text><text x="575" y="132" class="small" text-anchor="middle">100-200ms first audio</text><rect width="130" height="60" x="660" y="90" class="stage"/><text x="725" y="114" class="step" text-anchor="middle">transport</text><text x="725" y="132" class="small" text-anchor="middle">30-80ms RTT</text><rect width="90" height="60" x="810" y="90" class="box"/><text x="855" y="120" class="step" text-anchor="middle">user</text><line x1="190" x2="210" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="340" x2="360" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="490" x2="510" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640" x2="660" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="790" x2="810" y1="120" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="180" class="small" text-anchor="middle">context alternates user/assistant; every stage can carry partial output</text><text x="480" y="200" class="small" text-anchor="middle">transports: Daily, LiveKit, SmallWebRTCTransport, FastAPI WebSocket, WhatsApp, SIP</text><rect width="880" height="120" x="40" y="240" class="upstream"/><text x="480" y="262" class="head" text-anchor="middle">UPSTREAM cancel, metrics, barge-in</text><rect width="840" height="30" x="60" y="278" class="box"/><text x="78" y="298" class="step">transport detects interrupt cancel frame propagates back: TTS LLM STT</text><rect width="840" height="30" x="60" y="312" class="box"/><text x="78" y="332" class="step">TTS drops pending audio; LLM cancels inference; STT resets for new turn</text><rect width="840" height="14" x="60" y="342" class="box"/><text x="78" y="354" class="step">without UPSTREAM: agent keeps talking over the user</text><rect width="880" height="130" x="40" y="380" class="latency"/><text x="480" y="402" class="head" text-anchor="middle">end-to-end latency budget</text><rect width="840" height="30" x="60" y="418" class="box"/><text x="78" y="438" class="step">premium stack: 450-600ms (Vapi, Retell reported)</text><rect width="840" height="30" x="60" y="452" class="box"/><text x="78" y="472" class="step">common stack: 800-1200ms</text><rect width="840" height="20" x="60" y="486" class="box"/><text x="78" y="502" class="step">&gt; 1500ms feels broken. sum your chain before shipping.</text><text x="480" y="540" class="caption" text-anchor="middle">LiveKit Agents: MultimodalAgent (direct audio) vs VoicePipelineAgent (cascade with text control).</text></svg>