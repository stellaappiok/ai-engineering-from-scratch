<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Tool use stack: schema -&gt; validation -&gt; dispatch -&gt; structured observation</text><rect width="880" height="80" x="40" y="60" class="box"/><text x="480" y="84" class="head" text-anchor="middle">tool catalog (as seen by the model)</text><text x="60" y="108" class="step">add(a int, b int) -- Add two integers a and b. Use for any integer addition.</text><text x="60" y="124" class="step">multiply(a int, b int) -- Multiply two integers. Prefer multiplication over looped addition.</text><rect width="280" height="360" x="40" y="160" class="box"/><text x="180" y="184" class="head" text-anchor="middle">argument validation</text><rect width="240" height="46" x="60" y="200" class="cool"/><text x="80" y="224" class="step">type coercion</text><text x="80" y="240" class="small">&quot;5&quot; -&gt; 5 if unambiguous</text><rect width="240" height="46" x="60" y="254" class="cold"/><text x="80" y="278" class="step">enum check</text><text x="80" y="294" class="small">status in {open,closed,pending}</text><rect width="240" height="46" x="60" y="308" class="hot"/><text x="80" y="332" class="step">required fields</text><text x="80" y="348" class="small">missing -&gt; structured error observation</text><rect width="240" height="46" x="60" y="362" class="dsk"/><text x="80" y="386" class="step">range / min / max</text><text x="80" y="402" class="small">numeric bounds checked</text><rect width="240" height="46" x="60" y="416" class="box"/><text x="80" y="440" class="step">sandbox policy</text><text x="80" y="456" class="small">per-tool timeout, fs surface, network</text><text x="60" y="484" class="small">never raise to the loop -- every failure</text><text x="60" y="500" class="small">becomes an observation the model reads</text><rect width="280" height="360" x="340" y="160" class="box"/><text x="480" y="184" class="head" text-anchor="middle">dispatch</text><rect width="240" height="140" x="360" y="200" class="cool"/><text x="480" y="224" class="step" text-anchor="middle">parallel tool calls</text><text x="380" y="248" class="small">assistant turn emits N tool_use blocks</text><text x="380" y="264" class="small">each has distinct tool_use_id</text><text x="380" y="280" class="small">runtime executes independents in parallel</text><text x="380" y="296" class="small">results correlated back by tool_use_id</text><text x="380" y="312" class="small">swap the id and routing goes wrong</text><text x="380" y="332" class="small">Anthropic, OpenAI, Bedrock all require it</text><rect width="240" height="160" x="360" y="350" class="cold"/><text x="480" y="374" class="step" text-anchor="middle">execution</text><text x="380" y="398" class="small">exceptions caught</text><text x="380" y="414" class="small">timeouts enforced</text><text x="380" y="430" class="small">results stringified with shape hints</text><text x="380" y="446" class="small">structured JSON preferred over prose</text><text x="380" y="462" class="small">circuit breaker on repeat failures</text><text x="380" y="478" class="small">span emitted (OTel GenAI tool_call)</text><text x="380" y="494" class="small">audit trail for post-mortems</text><rect width="280" height="360" x="640" y="160" class="box"/><text x="780" y="184" class="head" text-anchor="middle">BFCL V4 composition</text><rect width="240" height="44" x="660" y="200" class="cool"/><text x="780" y="226" class="step" text-anchor="middle">Agentic 40%</text><rect width="240" height="44" x="660" y="250" class="cold"/><text x="780" y="276" class="step" text-anchor="middle">Multi-turn 30%</text><rect width="240" height="44" x="660" y="300" class="hot"/><text x="780" y="326" class="step" text-anchor="middle">Live 10%</text><rect width="240" height="44" x="660" y="350" class="dsk"/><text x="780" y="376" class="step" text-anchor="middle">Non-Live 10%</text><rect width="240" height="44" x="660" y="400" class="box"/><text x="780" y="426" class="step" text-anchor="middle">Hallucination 10%</text><text x="660" y="456" class="small">single-turn solved; memory, dynamic</text><text x="660" y="472" class="small">decisions, long chains remain open</text><text x="660" y="496" class="small">gorilla.cs.berkeley.edu/leaderboard.html</text></svg>