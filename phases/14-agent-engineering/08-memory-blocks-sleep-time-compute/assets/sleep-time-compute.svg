<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.block,.box,.primary,.sleep{stroke-width:1.5}.primary,.sleep{fill:#fff1d6;stroke:#c0392b}.sleep{fill:#e9e6ff;stroke:#5a4fcf}.block{fill:#e6f4ea;stroke:#2e7d32}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Letta V1 — memory blocks plus sleep-time compute</text><rect width="420" height="220" x="40" y="50" class="primary"/><text x="250" y="72" class="head" text-anchor="middle">primary agent (on the critical path)</text><text x="60" y="96" class="small">responds to user; writes raw facts fast; no consolidation</text><rect width="380" height="46" x="60" y="108" class="box"/><text x="78" y="130" class="step">turn 1 user: &quot;my name is ava, I live in Berlin&quot;</text><text x="78" y="146" class="small">block_append human &quot;name=ava city=Berlin&quot;</text><rect width="380" height="46" x="60" y="162" class="box"/><text x="78" y="184" class="step">turn 2 user: &quot;plan a curriculum for senior eng&quot;</text><text x="78" y="200" class="small">block_append task &quot;audience=senior eng&quot;</text><rect width="380" height="46" x="60" y="208" class="box"/><text x="78" y="230" class="step">turn 3 user: &quot;I moved to Lisbon&quot;</text><text x="78" y="246" class="small">block_append human &quot;city=Lisbon&quot; — both cities now in block</text><rect width="420" height="220" x="500" y="50" class="sleep"/><text x="710" y="72" class="head" text-anchor="middle">sleep-time agent (off the critical path)</text><text x="520" y="96" class="small">runs between turns; stronger model allowed; no latency cost</text><rect width="380" height="46" x="520" y="108" class="box"/><text x="538" y="130" class="step">scan blocks summarize if near_limit</text><text x="538" y="146" class="small">compact human block: drop duplicates, keep latest values</text><rect width="380" height="46" x="520" y="162" class="box"/><text x="538" y="184" class="step">reconcile archival invalidate stale facts</text><text x="538" y="200" class="small">contradictions against core trigger invalidation, not delete</text><rect width="380" height="46" x="520" y="208" class="box"/><text x="538" y="230" class="step">write learned_context into shared blocks</text><text x="538" y="246" class="small">produces new stable facts for the next turn</text><rect width="880" height="220" x="40" y="290" class="block"/><text x="480" y="312" class="head" text-anchor="middle">three tiers of Letta memory</text><rect width="280" height="170" x="60" y="322" class="box"/><text x="200" y="342" class="head" text-anchor="middle">core (always visible)</text><text x="78" y="364" class="step">blocks: human, persona, task</text><text x="78" y="382" class="small">editable via block_{append,replace,rewrite}</text><text x="78" y="400" class="small">per-block character limit</text><text x="78" y="418" class="small">near_limit triggers sleep-time summarization</text><text x="78" y="438" class="small">Persona/Safety block writes need review</text><text x="78" y="458" class="small">versioned; diff surfaces in the trace</text><text x="78" y="478" class="small">pinned in the prompt every turn</text><rect width="280" height="170" x="350" y="322" class="box"/><text x="490" y="342" class="head" text-anchor="middle">recall (conversation)</text><text x="368" y="364" class="step">turn log, paginated</text><text x="368" y="382" class="small">auto-written each turn</text><text x="368" y="400" class="small">retrieval via conversation_search</text><text x="368" y="418" class="small">tail evicts on cap</text><text x="368" y="438" class="small">citation: session_id + turn_id</text><text x="368" y="458" class="small">primary reads; sleep-time summarizes</text><text x="368" y="478" class="small">lossy but always addressable</text><rect width="280" height="170" x="640" y="322" class="box"/><text x="780" y="342" class="head" text-anchor="middle">archival (external)</text><text x="658" y="364" class="step">vector + KV + graph (Lesson 09)</text><text x="658" y="382" class="small">archival_memory_{insert,search}</text><text x="658" y="400" class="small">invalidation, not deletion, for contradictions</text><text x="658" y="418" class="small">tags for scope: user/session/agent</text><text x="658" y="438" class="small">untrusted on retrieval (Lesson 27)</text><text x="658" y="458" class="small">sleep-time dedups on &gt;90% token overlap</text><text x="658" y="478" class="small">scales past context window</text><text x="480" y="540" class="caption" text-anchor="middle">Letta V1 swaps send_message+heartbeat for native reasoning; loop shape unchanged.</text></svg>