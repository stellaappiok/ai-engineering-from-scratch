<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.disk{stroke-width:1.5}.ram{fill:#fff1d6;stroke:#c0392b}.ram,.tool{stroke-width:1.5}.disk{fill:#e6f4ea;stroke:#2e7d32}.tool{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">MemGPT — virtual context as OS memory (Packer et al., 2023)</text><rect width="380" height="200" x="40" y="60" class="ram"/><text x="230" y="82" class="head" text-anchor="middle">main context (RAM analog)</text><text x="60" y="108" class="small">fixed-size prompt window, always visible to the model</text><rect width="340" height="60" x="60" y="118" class="box"/><text x="80" y="138" class="step">[core] persona, user, task</text><text x="80" y="156" class="small">named sections pinned inside the prompt</text><text x="80" y="172" class="small">editable via core_memory_{append,replace}</text><rect width="340" height="60" x="60" y="186" class="box"/><text x="80" y="206" class="step">[messages] recent turns</text><text x="80" y="224" class="small">FIFO buffer; oldest turn evicts on cap</text><text x="80" y="240" class="small">evicted turns available via conversation_search</text><rect width="380" height="240" x="40" y="280" class="disk"/><text x="230" y="302" class="head" text-anchor="middle">archival memory (disk analog)</text><text x="60" y="328" class="small">unbounded, searchable external store</text><rect width="340" height="60" x="60" y="340" class="box"/><text x="80" y="360" class="step">record: id, text, tags, session, turn</text><text x="80" y="378" class="small">written by archival_memory_insert</text><text x="80" y="394" class="small">retrieved by archival_memory_search(top_k)</text><rect width="340" height="60" x="60" y="408" class="box"/><text x="80" y="428" class="step">pluggable backend</text><text x="80" y="446" class="small">vector (semantic), KV (fact), graph (relation)</text><text x="80" y="462" class="small">Lesson 09 (Mem0) fuses all three</text><text x="230" y="496" class="caption" text-anchor="middle">citations (session_id, turn_id) travel with every write</text><rect width="500" height="460" x="440" y="60" class="box"/><text x="690" y="82" class="head" text-anchor="middle">the interrupt pattern — one turn</text><rect width="460" height="46" x="460" y="100" class="ram"/><text x="478" y="122" class="step">1. assistant &quot;I need the user&apos;s current project&quot;</text><text x="478" y="138" class="small">main context lacks the fact; cannot answer from window alone</text><rect width="460" height="46" x="460" y="154" class="tool"/><text x="478" y="176" class="step">2. tool call archival_memory_search(&quot;project for ava&quot;)</text><text x="478" y="192" class="small">memory tool issued; runtime services it like an OS syscall</text><rect width="460" height="46" x="460" y="208" class="disk"/><text x="478" y="230" class="step">3. archival returns record a001</text><text x="478" y="246" class="small">&quot;ava is building a retrieval bot with 12 tools&quot;</text><rect width="460" height="46" x="460" y="262" class="tool"/><text x="478" y="284" class="step">4. runtime splices observation into next assistant turn</text><text x="478" y="300" class="small">same shape as any tool observation in the ReAct loop</text><rect width="460" height="46" x="460" y="316" class="ram"/><text x="478" y="338" class="step">5. assistant answers citing a001</text><text x="478" y="354" class="small">retrieval traceable back to source record</text><rect width="460" height="46" x="460" y="370" class="box"/><text x="478" y="392" class="step">6. new fact emerges archival_memory_insert</text><text x="478" y="408" class="small">write-back closes the loop for next session</text><rect width="460" height="46" x="460" y="424" class="box"/><text x="478" y="446" class="step">7. periodic consolidation (Letta sleep-time, Lesson 08)</text><text x="478" y="462" class="small">stale records dedupe, contradicted facts invalidate</text><line x1="420" x2="460" y1="170" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" x2="460" y1="230" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="460" x2="420" y1="390" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="540" class="caption" text-anchor="middle">Letta (2024) extends to three tiers. Mem0 (2025) swaps archival for vector+KV+graph. Pattern survives.</text></svg>