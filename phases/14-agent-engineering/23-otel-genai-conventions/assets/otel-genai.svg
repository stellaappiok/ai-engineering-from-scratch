<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.agent,.box{stroke-width:1.5}.box{fill:#faf6ef;stroke:#1a1a1a}.agent{fill:#e6f4ea;stroke:#2e7d32}.capture,.chat,.tool{stroke-width:1.5}.tool{fill:#dfe9ff;stroke:#2c5ea9}.chat{fill:#fff1d6;stroke:#c0392b}.capture{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">OpenTelemetry GenAI semantic conventions — canonical span tree</text><rect width="880" height="240" x="40" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">span tree with GenAI attributes</text><rect width="840" height="34" x="60" y="90" class="agent"/><text x="78" y="112" class="step">invoke_agent research_bot [INTERNAL]</text><text x="540" y="112" class="small">gen_ai.agent.name, gen_ai.provider.name, gen_ai.request.model</text><rect width="800" height="30" x="100" y="132" class="chat"/><text x="118" y="152" class="step">chat gen_ai.operation.name=chat</text><text x="500" y="152" class="small">gen_ai.response.model if it differs from request</text><rect width="760" height="30" x="140" y="170" class="tool"/><text x="158" y="190" class="step">tool_call search_tool gen_ai.tool.name, gen_ai.data_source.id</text><rect width="800" height="30" x="100" y="208" class="chat"/><text x="118" y="228" class="step">chat (continuation turn)</text><rect width="800" height="30" x="100" y="246" class="chat"/><text x="118" y="266" class="step">chat (final answer)</text><rect width="440" height="200" x="40" y="310" class="capture"/><text x="260" y="332" class="head" text-anchor="middle">content capture — opt-in only</text><rect width="400" height="30" x="60" y="348" class="box"/><text x="78" y="368" class="step">gen_ai.input.messages.reference_id</text><rect width="400" height="30" x="60" y="382" class="box"/><text x="78" y="402" class="step">gen_ai.output.messages.reference_id</text><rect width="400" height="30" x="60" y="416" class="box"/><text x="78" y="436" class="step">gen_ai.system_instructions (if opt-in)</text><rect width="400" height="30" x="60" y="450" class="box"/><text x="78" y="470" class="step">external store: S3, SQLite, log pipeline</text><rect width="400" height="22" x="60" y="484" class="box"/><text x="78" y="500" class="step">stays out of span body; PII-safe</text><rect width="420" height="200" x="500" y="310" class="box"/><text x="710" y="332" class="head" text-anchor="middle">span kinds + technology specific</text><rect width="380" height="30" x="520" y="348" class="agent"/><text x="538" y="368" class="step">CLIENT: remote agent services (Assistants, Bedrock)</text><rect width="380" height="30" x="520" y="382" class="agent"/><text x="538" y="402" class="step">INTERNAL: in-process (LangChain, CrewAI, local ReAct)</text><rect width="380" height="30" x="520" y="416" class="tool"/><text x="538" y="436" class="step">per-provider conventions: Anthropic, Azure AI, Bedrock, OpenAI</text><rect width="380" height="30" x="520" y="450" class="chat"/><text x="538" y="470" class="step">Datadog v1.37+ maps natively</text><rect width="380" height="22" x="520" y="484" class="box"/><text x="538" y="500" class="step">OTEL_SEMCONV_STABILITY_OPT_IN=gen_ai_latest_experimental</text><text x="480" y="540" class="caption" text-anchor="middle">spec: opentelemetry.io/docs/specs/semconv/gen-ai/ — most conventions still experimental (Mar 2026).</text></svg>