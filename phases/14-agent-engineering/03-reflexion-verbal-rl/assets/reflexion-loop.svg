<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Reflexion — Actor, Evaluator, Self-Reflector, Episodic memory</text><rect width="180" height="60" x="60" y="60" class="cool"/><text x="150" y="84" class="step" text-anchor="middle">Actor</text><text x="150" y="102" class="small" text-anchor="middle">ReAct trajectory</text><rect width="180" height="60" x="60" y="180" class="cold"/><text x="150" y="204" class="step" text-anchor="middle">Evaluator</text><text x="150" y="222" class="small" text-anchor="middle">binary / heuristic / self</text><rect width="180" height="60" x="60" y="300" class="hot"/><text x="150" y="324" class="step" text-anchor="middle">Self-Reflector</text><text x="150" y="342" class="small" text-anchor="middle">natural-language diagnosis</text><rect width="180" height="80" x="60" y="420" class="dsk"/><text x="150" y="446" class="step" text-anchor="middle">Episodic memory</text><text x="150" y="464" class="small" text-anchor="middle">bounded list of reflections</text><text x="150" y="480" class="small" text-anchor="middle">prepended next trial</text><line x1="150" x2="150" y1="120" y2="180" marker-end="url(#arrow)" class="edge"/><line x1="150" x2="150" y1="240" y2="300" marker-end="url(#arrow)" class="edge"/><line x1="150" x2="150" y1="360" y2="420" marker-end="url(#arrow)" class="edge"/><path marker-end="url(#arrow)" d="M240,450 Q340,450 340,90 L240,90" class="edge"/><text x="330" y="270" class="small">feed-back loop</text><rect width="540" height="200" x="380" y="60" class="box"/><text x="650" y="84" class="head" text-anchor="middle">three evaluator types</text><rect width="500" height="40" x="400" y="100" class="cool"/><text x="420" y="124" class="step">scalar binary/numeric ground truth (tests pass, answer correct)</text><rect width="500" height="40" x="400" y="148" class="cold"/><text x="420" y="172" class="step">heuristic stuck-loop, too-many-steps, repeated-action signatures</text><rect width="500" height="40" x="400" y="196" class="hot"/><text x="420" y="220" class="step">self-eval LLM-as-judge on own trace (weak; pair with tool grounding)</text><rect width="540" height="220" x="380" y="280" class="box"/><text x="650" y="304" class="head" text-anchor="middle">2026 instantiations</text><text x="400" y="328" class="step">Letta sleep-time compute</text><text x="400" y="346" class="small">a separate reflector agent runs off the hot path, writes to memory blocks</text><text x="400" y="368" class="step">pro-workflow /learn-rule</text><text x="400" y="386" class="small">manual reflection capture into project memory — curated over time</text><text x="400" y="408" class="step">Claude Code /memory</text><text x="400" y="426" class="small">CLAUDE.md functions as long-lived episodic buffer across sessions</text><text x="400" y="448" class="step">LangGraph reflection nodes</text><text x="400" y="466" class="small">graph node that scores and routes to refine-or-finish</text><text x="400" y="488" class="small">memory rot: compact, TTL, or dedupe — accumulating reflections go stale</text></svg>