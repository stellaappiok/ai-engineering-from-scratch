<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.edge{stroke:#1a1a1a;stroke-width:1.2;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">ReWOO — Planner, Workers, Solver (Xu et al., 2023)</text><rect width="170" height="80" x="40" y="60" class="cool"/><text x="125" y="88" class="step" text-anchor="middle">Planner</text><text x="125" y="108" class="small" text-anchor="middle">one call; sees only</text><text x="125" y="124" class="small" text-anchor="middle">the user question</text><rect width="460" height="320" x="260" y="60" class="box"/><text x="490" y="84" class="head" text-anchor="middle">plan DAG and workers</text><rect width="160" height="60" x="290" y="110" class="cold"/><text x="370" y="134" class="step" text-anchor="middle">E1 = search</text><text x="370" y="152" class="small" text-anchor="middle">capital of France</text><rect width="160" height="60" x="530" y="110" class="cold"/><text x="610" y="134" class="step" text-anchor="middle">E2 = search</text><text x="610" y="152" class="small" text-anchor="middle">population of #E1</text><rect width="160" height="60" x="410" y="220" class="hot"/><text x="490" y="244" class="step" text-anchor="middle">E3 = round_million</text><text x="490" y="262" class="small" text-anchor="middle">text = #E2</text><line x1="210" x2="290" y1="100" y2="140" marker-end="url(#arrow)" class="edge"/><line x1="450" x2="530" y1="140" y2="140" marker-end="url(#arrow)" class="edge"/><line x1="610" x2="520" y1="170" y2="220" marker-end="url(#arrow)" class="edge"/><line x1="370" x2="470" y1="170" y2="220" marker-end="url(#arrow)" class="edge"/><rect width="400" height="50" x="290" y="310" class="dsk"/><text x="490" y="334" class="step" text-anchor="middle">evidence table: E1=Paris, E2=&quot;11.2M metro&quot;, E3=&quot;11 million&quot;</text><rect width="170" height="80" x="750" y="60" class="cool"/><text x="835" y="88" class="step" text-anchor="middle">Solver</text><text x="835" y="108" class="small" text-anchor="middle">one call; reads</text><text x="835" y="124" class="small" text-anchor="middle">evidence + plan</text><line x1="720" x2="790" y1="335" y2="140" marker-end="url(#arrow)" class="edge"/><rect width="170" height="220" x="40" y="160" class="box"/><text x="125" y="184" class="head" text-anchor="middle">why ReWOO</text><text x="50" y="206" class="small">no observation in planner</text><text x="50" y="222" class="small">means no feedback noise</text><text x="50" y="246" class="small">workers fan out in parallel</text><text x="50" y="262" class="small">along independent branches</text><text x="50" y="286" class="small">fewer tokens:</text><text x="50" y="302" class="small">1 planner + N small worker</text><text x="50" y="318" class="small">prompts + 1 solver call</text><text x="50" y="342" class="small">paper: 5x reduction</text><text x="50" y="358" class="small">on HotpotQA, +4 accuracy</text><rect width="170" height="220" x="750" y="160" class="box"/><text x="835" y="184" class="head" text-anchor="middle">when to pick it</text><text x="760" y="206" class="small">task shape is structured</text><text x="760" y="222" class="small">tools are known up front</text><text x="760" y="246" class="small">evidence is parallelizable</text><text x="760" y="262" class="small">token budget matters</text><text x="760" y="286" class="small">else prefer ReAct for</text><text x="760" y="302" class="small">unknown environments or</text><text x="760" y="318" class="small">Plan-and-Act for 30+ step</text><text x="760" y="334" class="small">web/mobile trajectories</text><rect width="880" height="100" x="40" y="400" class="box"/><text x="480" y="424" class="head" text-anchor="middle">distillation angle (ReWOO section 4)</text><text x="60" y="446" class="small">planner sees no observations, so its training signal is clean; LLaMA 7B can be fine-tuned from</text><text x="60" y="462" class="small">GPT-3.5 planner traces and match planner quality. 2026 production: small planner + large executor</text><text x="60" y="478" class="small">(or vice versa) via model router (Mastra) or dynamic handoff (OpenAI Agents SDK).</text></svg>