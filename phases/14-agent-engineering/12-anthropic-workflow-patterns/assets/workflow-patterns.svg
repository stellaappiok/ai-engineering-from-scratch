<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 620"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.chain,.route{stroke-width:1.5}.chain{fill:#fff1d6;stroke:#c0392b}.route{fill:#dfe9ff;stroke:#2c5ea9}.eval,.orch,.par{stroke-width:1.5}.par{fill:#e6f4ea;stroke:#2e7d32}.orch{fill:#e9e6ff;stroke:#5a4fcf}.eval{fill:#fde8e8;stroke:#c0392b}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Anthropic&apos;s five workflow patterns (Dec 2024)</text><rect width="880" height="110" x="40" y="50" class="chain"/><text x="480" y="72" class="head" text-anchor="middle">1. prompt chaining — sequential, optional programmatic gate</text><rect width="140" height="40" x="60" y="88" class="box"/><text x="130" y="112" class="step" text-anchor="middle">LLM A</text><rect width="140" height="40" x="220" y="88" class="box"/><text x="290" y="112" class="step" text-anchor="middle">gate: pass?</text><rect width="140" height="40" x="380" y="88" class="box"/><text x="450" y="112" class="step" text-anchor="middle">LLM B</text><rect width="140" height="40" x="540" y="88" class="box"/><text x="610" y="112" class="step" text-anchor="middle">LLM C</text><rect width="200" height="40" x="700" y="88" class="box"/><text x="800" y="112" class="step" text-anchor="middle">output</text><line x1="200" x2="220" y1="108" y2="108" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="360" x2="380" y1="108" y2="108" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="520" x2="540" y1="108" y2="108" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="680" x2="700" y1="108" y2="108" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="150" class="small" text-anchor="middle">use when: task has clean linear decomposition</text><rect width="880" height="110" x="40" y="170" class="route"/><text x="480" y="192" class="head" text-anchor="middle">2. routing — classifier dispatches to specialist handlers</text><rect width="160" height="40" x="60" y="208" class="box"/><text x="140" y="232" class="step" text-anchor="middle">classifier LLM</text><rect width="160" height="40" x="260" y="208" class="box"/><text x="340" y="232" class="step" text-anchor="middle">refund chain</text><rect width="160" height="40" x="440" y="208" class="box"/><text x="520" y="232" class="step" text-anchor="middle">bug chain</text><rect width="160" height="40" x="620" y="208" class="box"/><text x="700" y="232" class="step" text-anchor="middle">sales chain</text><line x1="220" x2="260" y1="228" y2="228" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="270" class="small" text-anchor="middle">use when: categorically different inputs need different handling</text><rect width="440" height="150" x="40" y="290" class="par"/><text x="260" y="312" class="head" text-anchor="middle">3. parallelization — sectioning or voting</text><rect width="120" height="40" x="60" y="328" class="box"/><text x="120" y="352" class="step" text-anchor="middle">LLM 1</text><rect width="120" height="40" x="60" y="376" class="box"/><text x="120" y="400" class="step" text-anchor="middle">LLM 2</text><rect width="140" height="40" x="200" y="352" class="box"/><text x="270" y="376" class="step" text-anchor="middle">LLM 3</text><rect width="100" height="40" x="360" y="352" class="box"/><text x="410" y="376" class="step" text-anchor="middle">aggregate</text><text x="260" y="430" class="small" text-anchor="middle">voting: majority / synthesis</text><rect width="420" height="150" x="500" y="290" class="orch"/><text x="710" y="312" class="head" text-anchor="middle">4. orchestrator-workers — dynamic dispatch</text><rect width="140" height="40" x="520" y="328" class="box"/><text x="590" y="352" class="step" text-anchor="middle">orchestrator</text><rect width="100" height="40" x="680" y="328" class="box"/><text x="730" y="352" class="step" text-anchor="middle">worker A</text><rect width="100" height="40" x="800" y="328" class="box"/><text x="850" y="352" class="step" text-anchor="middle">worker B</text><rect width="220" height="40" x="680" y="376" class="box"/><text x="790" y="400" class="step" text-anchor="middle">synth</text><line x1="660" x2="680" y1="348" y2="348" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="710" y="430" class="small" text-anchor="middle">like agent but orchestrator does not loop indefinitely</text><rect width="880" height="120" x="40" y="450" class="eval"/><text x="480" y="472" class="head" text-anchor="middle">5. evaluator-optimizer — propose, judge, refine</text><rect width="160" height="40" x="60" y="488" class="box"/><text x="140" y="512" class="step" text-anchor="middle">proposer LLM</text><rect width="160" height="40" x="260" y="488" class="box"/><text x="340" y="512" class="step" text-anchor="middle">evaluator LLM</text><rect width="160" height="40" x="460" y="488" class="box"/><text x="540" y="512" class="step" text-anchor="middle">pass output</text><rect width="240" height="40" x="660" y="488" class="box"/><text x="780" y="512" class="step" text-anchor="middle">fail feedback loops to proposer</text><line x1="220" x2="260" y1="508" y2="508" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="420" x2="460" y1="508" y2="508" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="480" y="556" class="small" text-anchor="middle">Self-Refine (Lesson 05) generalized; CRITIC pattern if evaluator grounds on external tools</text><text x="480" y="600" class="caption" text-anchor="middle">five patterns cover most use cases. agents only when steps cannot be predicted.</text></svg>