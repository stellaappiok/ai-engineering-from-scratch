<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.attack,.box{stroke-width:1.5}.box{fill:#faf6ef;stroke:#1a1a1a}.attack{fill:#fff1d6;stroke:#c0392b}.defense,.validator{stroke-width:1.5}.validator{fill:#dfe9ff;stroke:#2c5ea9}.defense{fill:#e6f4ea;stroke:#2e7d32}.step{font-size:12px;font-family:&apos;Menlo&apos;,monospace;fill:#222}.caption{font-size:11px;fill:#555;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Prompt injection defense — treat retrieved content as untrusted</text><rect width="880" height="160" x="40" y="50" class="attack"/><text x="480" y="72" class="head" text-anchor="middle">Greshake et al. 2023 — indirect prompt injection</text><rect width="840" height="24" x="60" y="88" class="box"/><text x="78" y="104" class="step">1. attacker controls retrievable content (web page, PDF, email, memory note)</text><rect width="840" height="24" x="60" y="116" class="box"/><text x="78" y="132" class="step">2. agent ingests attacker instructions override developer prompt</text><rect width="840" height="24" x="60" y="144" class="box"/><text x="78" y="160" class="step">3. demonstrated exploits: data theft, worming, memory poisoning, ecosystem contamination</text><rect width="840" height="30" x="60" y="172" class="box"/><text x="78" y="192" class="step">claim: processing retrieved prompts = arbitrary code execution on the tool-use surface</text><rect width="440" height="280" x="40" y="230" class="validator"/><text x="260" y="252" class="head" text-anchor="middle">PVE pattern Prompt, Validator, Executor</text><rect width="400" height="36" x="60" y="268" class="box"/><text x="78" y="290" class="step">1. main model proposes tool call</text><rect width="400" height="36" x="60" y="308" class="box"/><text x="78" y="330" class="step">2. cheap fast validator inspects arguments</text><rect width="400" height="36" x="60" y="348" class="box"/><text x="78" y="370" class="step">3. validator inspects retrieved content sources</text><rect width="400" height="36" x="60" y="388" class="box"/><text x="78" y="410" class="step">4. reject on injection marker or unsafe destination</text><rect width="400" height="36" x="60" y="428" class="box"/><text x="78" y="450" class="step">5. pass executor runs; tell main model on reject</text><rect width="400" height="36" x="60" y="468" class="box"/><text x="78" y="490" class="step">cost: one extra inference per tool call</text><rect width="420" height="280" x="500" y="230" class="defense"/><text x="710" y="252" class="head" text-anchor="middle">six-control defense doctrine (2026)</text><rect width="380" height="36" x="520" y="268" class="box"/><text x="538" y="290" class="step">1. all retrieved content untrusted</text><rect width="380" height="36" x="520" y="308" class="box"/><text x="538" y="330" class="step">2. allowlist / blocklist navigation</text><rect width="380" height="36" x="520" y="348" class="box"/><text x="538" y="370" class="step">3. per-step safety evaluation (Gemini 2.5)</text><rect width="380" height="36" x="520" y="388" class="box"/><text x="538" y="410" class="step">4. guardrails on tool inputs + outputs</text><rect width="380" height="36" x="520" y="428" class="box"/><text x="538" y="450" class="step">5. human-in-the-loop on sensitive actions</text><rect width="380" height="36" x="520" y="468" class="box"/><text x="538" y="490" class="step">6. external content capture + span references</text><text x="480" y="540" class="caption" text-anchor="middle">&quot;only direct instructions from the user count as permission&quot; — OpenAI CUA docs</text></svg>