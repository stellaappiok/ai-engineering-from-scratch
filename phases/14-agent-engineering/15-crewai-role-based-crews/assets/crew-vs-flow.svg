<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.crew{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.crew{fill:#fff1d6;stroke:#c0392b}.flow,.primitive{fill:#e6f4ea;stroke:#2e7d32;stroke-width:1.5}.primitive{fill:#dfe9ff;stroke:#2c5ea9}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">CrewAI — Agent, Task, Crew, Process + Flow for production</text><rect width="880" height="140" x="40" y="50" class="primitive"/><text x="480" y="72" class="head" text-anchor="middle">four primitives</text><rect width="200" height="86" x="60" y="88" class="box"/><text x="160" y="108" class="step" text-anchor="middle">Agent</text><text x="78" y="128" class="small">role + goal + backstory + tools</text><text x="78" y="144" class="small">backstory shapes tone + judgment</text><text x="78" y="160" class="small">keep it tight (&lt;200 words)</text><rect width="200" height="86" x="280" y="88" class="box"/><text x="380" y="108" class="step" text-anchor="middle">Task</text><text x="298" y="128" class="small">description + expected_output</text><text x="298" y="144" class="small">assigned to one Agent</text><text x="298" y="160" class="small">reusable; composes into Crews</text><rect width="200" height="86" x="500" y="88" class="box"/><text x="600" y="108" class="step" text-anchor="middle">Crew</text><text x="518" y="128" class="small">container: Agents + Tasks</text><text x="518" y="144" class="small">owns the Process</text><text x="518" y="160" class="small">Sequential | Hierarchical | Consensual</text><rect width="180" height="86" x="720" y="88" class="box"/><text x="810" y="108" class="step" text-anchor="middle">Process</text><text x="738" y="128" class="small">execution strategy</text><text x="738" y="144" class="small">Hierarchical adds manager</text><text x="738" y="160" class="small">reach only for 4+ specialists</text><rect width="420" height="300" x="40" y="210" class="crew"/><text x="250" y="232" class="head" text-anchor="middle">Crew autonomous collaboration</text><rect width="380" height="40" x="60" y="248" class="box"/><text x="78" y="270" class="step">researcher outliner drafter</text><text x="78" y="284" class="small">free-form; Process picks shape at runtime</text><rect width="380" height="40" x="60" y="296" class="box"/><text x="78" y="318" class="step">Hierarchical: manager Agent picks next specialist</text><rect width="380" height="40" x="60" y="344" class="box"/><text x="78" y="366" class="step">good for: exploration, first drafts, brainstorming</text><rect width="380" height="40" x="60" y="392" class="box"/><text x="78" y="414" class="step">bad for: prod replay, deterministic audits, SLAs</text><rect width="380" height="60" x="60" y="440" class="box"/><text x="78" y="462" class="step">output variance: high</text><text x="78" y="478" class="small">LLM picks Task order if Process=Hierarchical</text><text x="78" y="494" class="small">debug path: read the trace; no graph to read</text><rect width="440" height="300" x="480" y="210" class="flow"/><text x="700" y="232" class="head" text-anchor="middle">Flow event-driven deterministic</text><rect width="400" height="40" x="500" y="248" class="box"/><text x="518" y="270" class="step">@start researched outlined drafted</text><text x="518" y="284" class="small">code owns the graph; engineers own the shape</text><rect width="400" height="40" x="500" y="296" class="box"/><text x="518" y="318" class="step">@listen(&quot;researched&quot;): fires when that topic emits</text><rect width="400" height="40" x="500" y="344" class="box"/><text x="518" y="366" class="step">good for: production, replay, SLAs, audits</text><rect width="400" height="40" x="500" y="392" class="box"/><text x="518" y="414" class="step">bad for: open-ended creativity</text><rect width="400" height="60" x="500" y="440" class="box"/><text x="518" y="462" class="step">2026 docs: start production with Flow</text><text x="518" y="478" class="small">fold Crews in as sub-steps when autonomy earns cost</text><text x="518" y="494" class="small">observability: every event is a span</text><text x="480" y="540" class="caption" text-anchor="middle">same three-step task; Crew is fluid, Flow is fixed. choice is operational, not architectural.</text></svg>