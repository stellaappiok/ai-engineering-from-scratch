<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.agent{stroke-width:1.5}.box{fill:#faf6ef;stroke:#1a1a1a}.box,.hub{stroke-width:1.5}.agent{fill:#e6f4ea;stroke:#2e7d32}.hub{fill:#fff1d6;stroke:#c0392b}.caption{font-size:11px;fill:#555;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Multi-agent debate — full mesh vs sparse star</text><rect width="420" height="260" x="40" y="50" class="box"/><text x="250" y="72" class="head" text-anchor="middle">full mesh everyone reads everyone</text><circle cx="140" cy="160" r="36" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="140" y="164" class="step" text-anchor="middle">alpha</text><circle cx="360" cy="160" r="36" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="360" y="164" class="step" text-anchor="middle">beta</text><circle cx="250" cy="260" r="36" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="250" y="264" class="step" text-anchor="middle">gamma</text><line x1="176" x2="324" y1="160" y2="160" stroke="#1a1a1a" stroke-width="1.5"/><line x1="164" x2="230" y1="196" y2="240" stroke="#1a1a1a" stroke-width="1.5"/><line x1="336" x2="270" y1="196" y2="240" stroke="#1a1a1a" stroke-width="1.5"/><text x="250" y="298" class="small" text-anchor="middle">N=3, R=2 12 critique ops</text><rect width="420" height="260" x="500" y="50" class="box"/><text x="710" y="72" class="head" text-anchor="middle">sparse star hub-and-spoke</text><circle cx="710" cy="180" r="36" fill="#fff1d6" stroke="#c0392b" stroke-width="1.5"/><text x="710" y="184" class="step" text-anchor="middle">hub</text><circle cx="600" cy="110" r="28" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="600" y="114" class="step" text-anchor="middle">spoke1</text><circle cx="820" cy="110" r="28" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="820" y="114" class="step" text-anchor="middle">spoke2</text><circle cx="600" cy="270" r="28" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="600" y="274" class="step" text-anchor="middle">spoke3</text><circle cx="820" cy="270" r="28" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1.5"/><text x="820" y="274" class="step" text-anchor="middle">spoke4</text><line x1="625" x2="685" y1="135" y2="165" stroke="#1a1a1a" stroke-width="1.5"/><line x1="795" x2="735" y1="135" y2="165" stroke="#1a1a1a" stroke-width="1.5"/><line x1="625" x2="685" y1="255" y2="205" stroke="#1a1a1a" stroke-width="1.5"/><line x1="795" x2="735" y1="255" y2="205" stroke="#1a1a1a" stroke-width="1.5"/><text x="710" y="310" class="small" text-anchor="middle">N=5, R=2 16 critique ops (vs 40 full mesh)</text><rect width="880" height="180" x="40" y="330" class="box"/><text x="480" y="352" class="head" text-anchor="middle">when debate helps vs when it hurts</text><rect width="840" height="30" x="60" y="370" class="agent"/><text x="78" y="390" class="step">HELPS: factuality (cross-check), rule-following (chess), open-ended reasoning</text><rect width="840" height="30" x="60" y="404" class="hub"/><text x="78" y="424" class="step">HURTS: latency-sensitive UX, cost-bound flows, simple factual lookup</text><rect width="840" height="30" x="60" y="438" class="box"/><text x="78" y="458" class="step">Society of Minds: cross-model (ChatGPT + Bard) beats either alone</text><rect width="840" height="30" x="60" y="472" class="box"/><text x="78" y="492" class="step">sparse topology: matches accuracy at fraction of token cost</text><text x="480" y="540" class="caption" text-anchor="middle">reach for debate when single-shot is wrong &gt; 5% of the time; otherwise cheaper patterns win.</text></svg>