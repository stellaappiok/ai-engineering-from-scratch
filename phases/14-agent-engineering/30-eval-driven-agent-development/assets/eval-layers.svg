<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.bench,.box{stroke-width:1.5}.box{fill:#faf6ef;stroke:#1a1a1a}.bench{fill:#e6f4ea;stroke:#2e7d32}.custom{fill:#dfe9ff;stroke:#2c5ea9}.custom,.loop,.online{stroke-width:1.5}.online{fill:#fff1d6;stroke:#c0392b}.loop{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="26" class="title" text-anchor="middle">Eval-driven development — three layers + evaluator-optimizer loop</text><rect width="290" height="220" x="40" y="50" class="bench"/><text x="185" y="72" class="head" text-anchor="middle">1. static benchmarks</text><text x="60" y="96" class="small">cross-model comparison + regression gate</text><rect width="250" height="30" x="60" y="108" class="box"/><text x="78" y="128" class="step">SWE-bench Verified (code)</text><rect width="250" height="30" x="60" y="140" class="box"/><text x="78" y="160" class="step">WebArena / OSWorld (web/desktop)</text><rect width="250" height="30" x="60" y="172" class="box"/><text x="78" y="192" class="step">GAIA (generalist)</text><rect width="250" height="30" x="60" y="204" class="box"/><text x="78" y="224" class="step">BFCL V4 (tool use)</text><rect width="250" height="28" x="60" y="236" class="box"/><text x="78" y="254" class="step">contamination: always report +audit</text><rect width="290" height="220" x="340" y="50" class="custom"/><text x="485" y="72" class="head" text-anchor="middle">2. custom offline evals</text><text x="360" y="96" class="small">your product&apos;s shape</text><rect width="250" height="30" x="360" y="108" class="box"/><text x="378" y="128" class="step">LLM-as-judge (Langfuse, Phoenix, Opik)</text><rect width="250" height="30" x="360" y="140" class="box"/><text x="378" y="160" class="step">execution-based (run patch, check tests)</text><rect width="250" height="30" x="360" y="172" class="box"/><text x="378" y="192" class="step">trajectory-based (OSWorld-Human)</text><rect width="250" height="30" x="360" y="204" class="box"/><text x="378" y="224" class="step">pinned seeds, snapshot state</text><rect width="250" height="28" x="360" y="236" class="box"/><text x="378" y="254" class="step">evals live next to code</text><rect width="290" height="220" x="640" y="50" class="online"/><text x="785" y="72" class="head" text-anchor="middle">3. online evals (prod)</text><text x="660" y="96" class="small">continuous, sampled, PII-scrubbed</text><rect width="250" height="30" x="660" y="108" class="box"/><text x="678" y="128" class="step">session replays (Langfuse)</text><rect width="250" height="30" x="660" y="140" class="box"/><text x="678" y="160" class="step">guardrail-triggered alerts</text><rect width="250" height="30" x="660" y="172" class="box"/><text x="678" y="192" class="step">per-step cost / latency tracking</text><rect width="250" height="30" x="660" y="204" class="box"/><text x="678" y="224" class="step">failure tagging (Lesson 26)</text><rect width="250" height="28" x="660" y="236" class="box"/><text x="678" y="254" class="step">feedback loop into custom cases</text><rect width="880" height="220" x="40" y="290" class="loop"/><text x="480" y="312" class="head" text-anchor="middle">evaluator-optimizer loop (Anthropic, generalized Self-Refine)</text><rect width="200" height="50" x="60" y="328" class="box"/><text x="160" y="352" class="step" text-anchor="middle">proposer</text><text x="160" y="368" class="small" text-anchor="middle">emits candidate</text><rect width="200" height="50" x="300" y="328" class="box"/><text x="400" y="352" class="step" text-anchor="middle">evaluator</text><text x="400" y="368" class="small" text-anchor="middle">judges (pass / fail + reason)</text><rect width="200" height="50" x="540" y="328" class="box"/><text x="640" y="352" class="step" text-anchor="middle">refine</text><text x="640" y="368" class="small" text-anchor="middle">feedback returns to proposer</text><rect width="130" height="50" x="780" y="328" class="box"/><text x="845" y="358" class="step" text-anchor="middle">pass ship</text><line x1="260" x2="300" y1="353" y2="353" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" x2="540" y1="353" y2="353" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="500" x2="780" y1="353" y2="353" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640" x2="160" y1="378" y2="378" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="840" height="30" x="60" y="398" class="box"/><text x="78" y="418" class="step">2026 best practice: evals in CI; fail merge on &gt;=5% regression vs baseline</text><rect width="840" height="30" x="60" y="432" class="box"/><text x="78" y="452" class="step">every guardrail maps to a case; every learned rule maps to a failure case</text><rect width="840" height="30" x="60" y="466" class="box"/><text x="78" y="486" class="step">LLM-judge grounds via CRITIC (external tools); avoid judge hallucination</text><text x="480" y="540" class="caption" text-anchor="middle">eval is not the last step. it is the outer loop that drives every Phase 14 choice.</text></svg>