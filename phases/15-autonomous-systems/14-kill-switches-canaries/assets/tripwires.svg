<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 880 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.warn{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.warn{fill:#fde0b4;stroke:#b5651d}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.content,.small{font-size:11px;font-family:&apos;Menlo&apos;,monospace;fill:#333}.small{font-size:10px;fill:#555}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="440" y="26" class="title" text-anchor="middle">Three detectors, three failure classes</text><rect width="800" height="460" x="40" y="50" class="box"/><rect width="220" height="80" x="330" y="80" class="cool"/><text x="440" y="104" class="label" text-anchor="middle">agent</text><text x="346" y="128" class="small">reads, reasons, acts</text><text x="346" y="144" class="small">cannot touch tripwires</text><rect width="220" height="120" x="60" y="200" class="hot"/><text x="170" y="222" class="label" text-anchor="middle">kill switch</text><text x="76" y="244" class="small">external boolean</text><text x="76" y="260" class="small">• feature flag / Redis / signed cfg</text><text x="76" y="276" class="small">• checked every action, not boot</text><text x="76" y="292" class="small">• agent cannot set OFF</text><text x="76" y="308" class="small">• re-enable = explicit human</text><rect width="220" height="120" x="330" y="200" class="warn"/><text x="440" y="222" class="label" text-anchor="middle">circuit breaker</text><text x="346" y="244" class="small">pattern-specific pause</text><text x="346" y="260" class="small">• 5 identical tool calls</text><text x="346" y="276" class="small">• N consecutive failures</text><text x="346" y="292" class="small">• rate above threshold</text><text x="346" y="308" class="small">• closed / open / half-open</text><rect width="220" height="120" x="600" y="200" class="cold"/><text x="710" y="222" class="label" text-anchor="middle">canary token</text><text x="616" y="244" class="small">bait with no legitimate use</text><text x="616" y="260" class="small">• fake AWS_SECRET_ACCESS_KEY</text><text x="616" y="276" class="small">• fake DB record sentinel</text><text x="616" y="292" class="small">• fake file in workspace</text><text x="616" y="308" class="small">• fake memory entry</text><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M390 160 L250 200"/><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M440 160 L440 200"/><path stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)" d="M490 160 L630 200"/><rect width="760" height="76" x="60" y="350" class="cool"/><text x="440" y="374" class="label" text-anchor="middle">what each catches</text><text x="80" y="394" class="content">kill: operator decision · breaker: repetitive / rate patterns · canary: intent to touch off-limit resource</text><text x="80" y="412" class="content">Cilium/eBPF egress redirect (under 500ms) complements canaries: quarantined pod goes to forensic honeypot</text><rect width="760" height="60" x="60" y="430" class="hot"/><text x="440" y="454" class="label" text-anchor="middle">what no detector catches</text><text x="80" y="474" class="content">semantic composites: individual actions pass every detector; composition is the attack (see Lesson 10)</text></svg>