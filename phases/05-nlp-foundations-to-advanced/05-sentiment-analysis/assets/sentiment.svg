<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 320"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef}.box,.neg,.pos{stroke:#1a1a1a;stroke-width:1.5}.pos{fill:#e8f3e0}.neg{fill:#f3e0e0}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.stage{font-size:11px;fill:#c0392b;font-style:italic;text-anchor:middle}.line{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><rect width="200" height="220" x="20" y="50" class="box" rx="4"/><text x="120" y="75" class="label" text-anchor="middle">raw reviews</text><text x="35" y="105" class="content">&quot;loved this movie&quot;</text><text x="35" y="130" class="content">&quot;not worth your time&quot;</text><text x="35" y="155" class="content">&quot;terrible acting&quot;</text><text x="35" y="180" class="content">&quot;beautiful story&quot;</text><text x="35" y="225" class="content">labels: + / - / - / +</text><path marker-end="url(#arrow)" d="M 220 160 L 270 160" class="line"/><text x="245" y="150" class="stage">tokenize</text><text x="245" y="180" class="stage">+ negate</text><rect width="240" height="220" x="270" y="50" class="box" rx="4"/><text x="390" y="75" class="label" text-anchor="middle">features</text><text x="285" y="105" class="content">[loved, movie]</text><text x="285" y="130" class="content">[not, NOT_worth, NOT_your]</text><text x="285" y="155" class="content">[terrible, acting]</text><text x="285" y="180" class="content">[beautiful, story]</text><text x="285" y="225" class="content">+ bigrams: &quot;not_worth&quot;, ...</text><text x="285" y="245" class="content">+ tf-idf weight</text><path marker-end="url(#arrow)" d="M 510 160 L 560 160" class="line"/><text x="535" y="150" class="stage">fit</text><rect width="180" height="220" x="560" y="50" class="box" rx="4"/><text x="650" y="75" class="label" text-anchor="middle">classifier</text><text x="575" y="105" class="content">Naive Bayes</text><text x="575" y="130" class="content">or Logistic Reg</text><text x="575" y="165" class="content">learns:</text><text x="575" y="185" class="content">w[terrible] &lt; 0</text><text x="575" y="205" class="content">w[loved] &gt; 0</text><text x="575" y="225" class="content">w[NOT_worth] &lt; 0</text><path marker-end="url(#arrow)" d="M 740 130 L 790 90" class="line"/><path marker-end="url(#arrow)" d="M 740 190 L 790 230" class="line"/><rect width="90" height="60" x="790" y="60" class="pos" rx="4"/><text x="835" y="95" class="label" text-anchor="middle">+</text><rect width="90" height="60" x="790" y="200" class="neg" rx="4"/><text x="835" y="235" class="label" text-anchor="middle">−</text><text x="460" y="305" class="stage" text-anchor="middle">keep stopwords. handle negation. bigrams catch what unigrams miss.</text></svg>