<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">three algorithms, same token budget</text><rect width="260" height="360" x="40" y="60" class="box"/><text x="170" y="85" class="label" text-anchor="middle">BPE — greedy merge</text><rect width="220" height="30" x="60" y="105" class="hot"/><text x="170" y="125" class="content" text-anchor="middle">l o w e r</text><text x="170" y="155" class="caption" text-anchor="middle">merge most frequent pair</text><line x1="170" x2="170" y1="162" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="60" y="185" class="box"/><text x="170" y="205" class="content" text-anchor="middle">lo w e r</text><line x1="170" x2="170" y1="222" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="60" y="245" class="box"/><text x="170" y="265" class="content" text-anchor="middle">low er</text><line x1="170" x2="170" y1="282" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="60" y="305" class="box"/><text x="170" y="325" class="content" text-anchor="middle">lower</text><text x="170" y="365" class="caption" text-anchor="middle">used by: GPT, Llama, Gemma,</text><text x="170" y="382" class="caption" text-anchor="middle">Qwen, Mistral</text><text x="170" y="405" class="caption" text-anchor="middle">deterministic at inference</text><rect width="260" height="360" x="320" y="60" class="box"/><text x="450" y="85" class="label" text-anchor="middle">Unigram — probabilistic prune</text><rect width="220" height="30" x="340" y="105" class="box"/><text x="450" y="125" class="content" text-anchor="middle">start: 50k candidates</text><line x1="450" x2="450" y1="140" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="50" x="340" y="163" class="box"/><text x="450" y="182" class="content" text-anchor="middle">score each by unigram p</text><text x="450" y="200" class="content" text-anchor="middle">prune lowest-loss tokens</text><line x1="450" x2="450" y1="220" y2="238" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="340" y="243" class="box"/><text x="450" y="263" class="content" text-anchor="middle">repeat to target size</text><line x1="450" x2="450" y1="280" y2="298" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="32" x="340" y="303" class="hot"/><text x="450" y="324" class="content" text-anchor="middle">&quot;lower&quot; → {lo+wer, l+ower, low+er}</text><text x="450" y="365" class="caption" text-anchor="middle">used by: T5, Gemma, mBART,</text><text x="450" y="382" class="caption" text-anchor="middle">ALBERT, XLNet</text><text x="450" y="405" class="caption" text-anchor="middle">samplable (subword regularization)</text><rect width="260" height="360" x="600" y="60" class="box"/><text x="730" y="85" class="label" text-anchor="middle">WordPiece — max likelihood</text><rect width="220" height="30" x="620" y="105" class="hot"/><text x="730" y="125" class="content" text-anchor="middle">l ##o ##w ##e ##r</text><line x1="730" x2="730" y1="140" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="50" x="620" y="163" class="box"/><text x="730" y="182" class="content" text-anchor="middle">merge pair that maximizes</text><text x="730" y="200" class="content" text-anchor="middle">P(ab) / (P(a)·P(b))</text><line x1="730" x2="730" y1="220" y2="238" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="620" y="243" class="box"/><text x="730" y="263" class="content" text-anchor="middle">l ##ow ##er</text><line x1="730" x2="730" y1="280" y2="298" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="620" y="303" class="box"/><text x="730" y="323" class="content" text-anchor="middle">l ##ower</text><text x="730" y="365" class="caption" text-anchor="middle">used by: BERT, DistilBERT,</text><text x="730" y="382" class="caption" text-anchor="middle">ELECTRA</text><text x="730" y="405" class="caption" text-anchor="middle">## marks continuation</text><text x="450" y="450" class="caption" text-anchor="middle">tokenize once, ship forever — vocabulary is frozen at training time</text></svg>