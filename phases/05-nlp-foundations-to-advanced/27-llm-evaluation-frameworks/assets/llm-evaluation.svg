<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.judge,.metric{stroke-width:1.5}.metric{fill:#fff1d6;stroke:#c0392b}.judge{fill:#e3f2fd;stroke:#1565c0}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.content,.mono{font-size:12px;fill:#333}.mono{font-size:11px;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">RAG evaluation — four dimensions, LLM-as-judge backend</text><rect width="250" height="30" x="40" y="55" class="box"/><text x="165" y="75" class="content" text-anchor="middle">question: &quot;When was iPhone released?&quot;</text><rect width="250" height="55" x="40" y="95" class="box"/><text x="165" y="114" class="content" text-anchor="middle">retrieved context:</text><text x="165" y="132" class="mono" text-anchor="middle">&quot;Apple released first iPhone</text><text x="165" y="145" class="mono" text-anchor="middle">June 29, 2007.&quot;</text><rect width="250" height="30" x="40" y="160" class="box"/><text x="165" y="180" class="content" text-anchor="middle">answer: &quot;June 29, 2007.&quot;</text><line x1="290" x2="330" y1="125" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="130" x="330" y="80" class="judge"/><text x="440" y="105" class="label" text-anchor="middle">LLM judge</text><text x="440" y="128" class="caption" text-anchor="middle">(GPT-4o-mini, Haiku, Mistral-small)</text><text x="440" y="155" class="mono" text-anchor="middle">score(q, ctx, ans) → 0..1</text><text x="440" y="180" class="caption" text-anchor="middle">rubric + chain-of-thought</text><text x="440" y="198" class="caption" text-anchor="middle">calibrated vs human</text><line x1="550" x2="590" y1="125" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="270" height="250" x="590" y="55" class="box"/><text x="725" y="80" class="label" text-anchor="middle">four RAG metrics</text><rect width="240" height="45" x="605" y="95" class="metric"/><text x="615" y="115" class="label">faithfulness</text><text x="615" y="132" class="caption">claims in answer entailed by context?</text><rect width="240" height="45" x="605" y="145" class="metric"/><text x="615" y="165" class="label">answer relevance</text><text x="615" y="182" class="caption">answer addresses the question?</text><rect width="240" height="45" x="605" y="195" class="metric"/><text x="615" y="215" class="label">context precision</text><text x="615" y="232" class="caption">fraction of retrieved chunks relevant</text><rect width="240" height="45" x="605" y="245" class="metric"/><text x="615" y="265" class="label">context recall</text><text x="615" y="282" class="caption">retrieved set covers gold answer?</text><rect width="820" height="95" x="40" y="335" class="box"/><text x="55" y="358" class="label">cost / calibration / CI</text><text x="55" y="378" class="content">$0.001 – $0.003 per judged case with GPT-4o-mini — &lt;$5 per 1000-sample regression run</text><text x="55" y="396" class="content">required: Spearman ρ &gt; 0.7 vs 50 hand-labeled cases before trusting the number</text><text x="55" y="414" class="content">gate: pytest + DeepEval thresholds; freeze judge model + version; surface bottom-10%</text></svg>