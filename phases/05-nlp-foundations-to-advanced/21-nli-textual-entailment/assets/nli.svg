<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 440"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cont,.ent,.neu{stroke-width:1.5}.ent{fill:#e8f5e9;stroke:#2e7d32}.cont{fill:#fce4ec;stroke:#c0392b}.neu{fill:#f5f5f5;stroke:#616161}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">NLI — one task, three production uses</text><rect width="280" height="60" x="60" y="70" class="box"/><text x="75" y="92" class="label">premise (t):</text><text x="75" y="112" class="content">&quot;A cat is sleeping on the couch.&quot;</text><rect width="280" height="60" x="60" y="140" class="box"/><text x="75" y="162" class="label">hypothesis (h):</text><text x="75" y="182" class="content">&quot;There is a cat in the room.&quot;</text><line x1="340" x2="400" y1="135" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="90" x="400" y="90" class="box"/><text x="510" y="115" class="label" text-anchor="middle">transformer encoder</text><text x="510" y="138" class="content" text-anchor="middle">[CLS] t [SEP] h [SEP]</text><text x="510" y="160" class="caption" text-anchor="middle">DeBERTa-v3 / RoBERTa / BART</text><line x1="620" x2="680" y1="135" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="180" height="50" x="680" y="70" class="ent"/><text x="770" y="92" class="label" text-anchor="middle">entailment</text><text x="770" y="110" class="content" text-anchor="middle">0.97</text><rect width="180" height="50" x="680" y="125" class="neu"/><text x="770" y="147" class="label" text-anchor="middle">neutral</text><text x="770" y="165" class="content" text-anchor="middle">0.02</text><rect width="180" height="50" x="680" y="180" class="cont"/><text x="770" y="202" class="label" text-anchor="middle">contradiction</text><text x="770" y="220" class="content" text-anchor="middle">0.01</text><text x="450" y="270" class="title" text-anchor="middle">same model, three plugs</text><rect width="260" height="130" x="40" y="290" class="ent"/><text x="170" y="315" class="label" text-anchor="middle">1. zero-shot classification</text><text x="170" y="340" class="content" text-anchor="middle">t = document</text><text x="170" y="358" class="content" text-anchor="middle">h = &quot;about {label}&quot;</text><text x="170" y="385" class="caption" text-anchor="middle">pick max-entailment label</text><text x="170" y="402" class="caption" text-anchor="middle">no training data needed</text><rect width="260" height="130" x="320" y="290" class="ent"/><text x="450" y="315" class="label" text-anchor="middle">2. faithfulness (RAG)</text><text x="450" y="340" class="content" text-anchor="middle">t = retrieved context</text><text x="450" y="358" class="content" text-anchor="middle">h = generated answer claim</text><text x="450" y="385" class="caption" text-anchor="middle">entailment → supported</text><text x="450" y="402" class="caption" text-anchor="middle">RAGAS faithfulness core</text><rect width="260" height="130" x="600" y="290" class="ent"/><text x="730" y="315" class="label" text-anchor="middle">3. summarization fact-check</text><text x="730" y="340" class="content" text-anchor="middle">t = source document</text><text x="730" y="358" class="content" text-anchor="middle">h = summary sentence</text><text x="730" y="385" class="caption" text-anchor="middle">contradiction → hallucination</text><text x="730" y="402" class="caption" text-anchor="middle">neutral → unsupported claim</text></svg>