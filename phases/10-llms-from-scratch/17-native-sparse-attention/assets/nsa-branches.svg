<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="28" class="title" text-anchor="middle">native sparse attention — three branches</text><rect width="160" height="40" x="30" y="60" class="box"/><text x="110" y="85" class="step" text-anchor="middle">query q</text><line x1="190" x2="240" y1="80" y2="130" stroke="#1a1a1a" stroke-width="1.5"/><rect width="240" height="60" x="240" y="120" class="cool"/><text x="360" y="140" class="head" text-anchor="middle">1 / compressed branch</text><text x="360" y="158" class="small" text-anchor="middle">mean-pool every l tokens into</text><text x="360" y="172" class="small" text-anchor="middle">summary; attend over N/l keys</text><line x1="190" x2="240" y1="80" y2="250" stroke="#1a1a1a" stroke-width="1.5"/><rect width="240" height="60" x="240" y="240" class="hot"/><text x="360" y="260" class="head" text-anchor="middle">2 / selected branch</text><text x="360" y="278" class="small" text-anchor="middle">take top-k compressed blocks</text><text x="360" y="292" class="small" text-anchor="middle">attend over k * l uncompressed keys</text><line x1="190" x2="240" y1="80" y2="370" stroke="#1a1a1a" stroke-width="1.5"/><rect width="240" height="60" x="240" y="360" class="cold"/><text x="360" y="380" class="head" text-anchor="middle">3 / sliding window</text><text x="360" y="398" class="small" text-anchor="middle">attend over last W tokens for</text><text x="360" y="412" class="small" text-anchor="middle">local syntax and coreference</text><line x1="360" x2="360" y1="180" y2="240" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#arrow)"/><text x="490" y="215" fill="#c0392b" class="small">compressed scores pick top-k blocks</text><rect width="180" height="60" x="530" y="120" class="box"/><text x="620" y="140" class="head" text-anchor="middle">gate MLP</text><text x="620" y="158" class="small" text-anchor="middle">g_cmp, g_sel, g_win</text><text x="620" y="172" class="small" text-anchor="middle">from query q</text><line x1="110" x2="530" y1="100" y2="150" stroke="#1a1a1a" stroke-width="1.2"/><rect width="180" height="80" x="750" y="230" class="box"/><text x="840" y="252" class="head" text-anchor="middle">combine</text><text x="840" y="272" class="step" text-anchor="middle">g_cmp * o_cmp</text><text x="840" y="288" class="step" text-anchor="middle">+ g_sel * o_sel</text><text x="840" y="304" class="step" text-anchor="middle">+ g_win * o_win</text><line x1="480" x2="750" y1="150" y2="250" stroke="#2e7d32" stroke-width="1.2"/><line x1="480" x2="750" y1="270" y2="270" stroke="#c0392b" stroke-width="1.2"/><line x1="480" x2="750" y1="390" y2="290" stroke="#2c5ea9" stroke-width="1.2"/><rect width="900" height="100" x="30" y="450" class="box"/><text x="480" y="472" class="label" text-anchor="middle">keys attended per query vs full attention</text><text x="50" y="498" class="step">N=4k, l=32, k=8, W=256</text><text x="360" y="498" class="small">NSA 640 · full 4,096 · 6.4x fewer</text><text x="50" y="518" class="step">N=64k, l=64, k=16, W=512</text><text x="360" y="518" class="small">NSA 2,560 · full 65,536 · 25.6x fewer</text><text x="50" y="538" class="step">N=128k, l=64, k=16, W=512</text><text x="360" y="538" class="small">NSA 3,584 · full 131,072 · 36.6x fewer</text></svg>