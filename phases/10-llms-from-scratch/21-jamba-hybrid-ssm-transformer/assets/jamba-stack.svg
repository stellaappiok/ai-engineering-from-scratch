<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.attn,.mamba{stroke-width:1.2}.mamba{fill:#e6f4ea;stroke:#2e7d32}.attn{fill:#fff1d6;stroke:#c0392b}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:11px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Jamba — 1 Transformer layer per 7 Mamba layers, MoE on alternates</text><rect width="280" height="480" x="60" y="50" class="box"/><text x="200" y="72" class="head" text-anchor="middle">one Jamba block (8 layers)</text><rect width="240" height="44" x="80" y="90" class="mamba"/><text x="200" y="110" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="126" class="small" text-anchor="middle">+ MoE router</text><rect width="240" height="44" x="80" y="140" class="mamba"/><text x="200" y="160" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="176" class="small" text-anchor="middle">dense MLP</text><rect width="240" height="44" x="80" y="190" class="mamba"/><text x="200" y="210" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="226" class="small" text-anchor="middle">+ MoE router</text><rect width="240" height="44" x="80" y="240" class="mamba"/><text x="200" y="260" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="276" class="small" text-anchor="middle">dense MLP</text><rect width="240" height="44" x="80" y="290" class="mamba"/><text x="200" y="310" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="326" class="small" text-anchor="middle">+ MoE router</text><rect width="240" height="44" x="80" y="340" class="mamba"/><text x="200" y="360" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="376" class="small" text-anchor="middle">dense MLP</text><rect width="240" height="44" x="80" y="390" class="mamba"/><text x="200" y="410" class="step" text-anchor="middle">Mamba (SSM)</text><text x="200" y="426" class="small" text-anchor="middle">+ MoE router</text><rect width="240" height="44" x="80" y="440" class="attn"/><text x="200" y="460" class="step" text-anchor="middle">Transformer (attention)</text><text x="200" y="476" class="small" text-anchor="middle">dense MLP</text><text x="200" y="510" class="caption" text-anchor="middle">repeat this block N times</text><rect width="540" height="220" x="380" y="50" class="box"/><text x="650" y="72" class="head" text-anchor="middle">memory at 256k context (BF16)</text><text x="400" y="104" class="step">pure Transformer MHA 32L</text><text x="680" y="104" fill="#c0392b" class="step">128 GB</text><rect width="495" height="14" x="400" y="110" fill="#c0392b"/><text x="400" y="144" class="step">pure Transformer GQA(8) 32L</text><text x="680" y="144" fill="#c0392b" class="step">32 GB</text><rect width="124" height="14" x="400" y="150" fill="#c0392b"/><text x="400" y="184" class="step">Jamba 1:3 hybrid 32L</text><text x="680" y="184" fill="#c0392b" class="step">32 GB</text><rect width="124" height="14" x="400" y="190" fill="#c0392b"/><text x="400" y="224" class="step">Jamba 1:7 hybrid 32L</text><text x="680" y="224" fill="#2e7d32" class="step">16 GB</text><rect width="62" height="14" x="400" y="230" fill="#2e7d32"/><text x="400" y="260" class="step">pure Mamba 32L</text><text x="680" y="260" fill="#2e7d32" class="step">&lt;1 MB</text><rect width="4" height="14" x="400" y="262" fill="#2e7d32"/><rect width="540" height="240" x="380" y="290" class="box"/><text x="650" y="312" class="head" text-anchor="middle">why the 1:7 ratio</text><text x="400" y="340" class="step">1:1 (pure Transformer)</text><text x="620" y="340" class="small">best quality, worst memory</text><text x="400" y="362" class="step">1:3 (25% attention)</text><text x="620" y="362" class="small">still KV-heavy, small quality win</text><text x="400" y="384" class="step">1:7 (12.5% attention) ✓</text><text x="620" y="384" class="small">AI21 sweet spot — 256k on one 80GB GPU</text><text x="400" y="406" class="step">1:15 (6% attention)</text><text x="620" y="406" class="small">in-context recall starts failing</text><text x="400" y="428" class="step">0:N (pure Mamba)</text><text x="620" y="428" class="small">state-tracking fails without attention</text><text x="400" y="465" class="step">Mamba-3 (ICLR 2026)</text><text x="620" y="465" class="small">complex state + MIMO; pushes ratio lower?</text><text x="400" y="488" class="step">frontier hybrids in 2026</text><text x="620" y="488" class="small">Jamba 1.5 Large: 398B/94B active, enterprise</text><text x="620" y="504" class="small">next-gen: likely Mamba-3 + attention at 1:10+</text></svg>