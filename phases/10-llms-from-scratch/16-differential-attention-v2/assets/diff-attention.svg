<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="480" y="28" class="title" text-anchor="middle">differential attention — subtract the noise floor</text><rect width="160" height="40" x="30" y="60" class="box"/><text x="110" y="85" class="step" text-anchor="middle">hidden state x</text><line x1="190" x2="250" y1="70" y2="70" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="190" x2="250" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="200" height="30" x="250" y="50" class="cool"/><text x="350" y="70" class="step" text-anchor="middle">Q1 = xWq1 · K1 = xWk1</text><rect width="200" height="30" x="250" y="80" class="cool"/><text x="350" y="100" class="step" text-anchor="middle">Q2 = xWq2 · K2 = xWk2</text><line x1="450" x2="490" y1="65" y2="65" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="450" x2="490" y1="95" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="200" height="30" x="490" y="50" class="hot"/><text x="590" y="70" class="step" text-anchor="middle">A1 = softmax(Q1 K1^T / sqrt(d))</text><rect width="200" height="30" x="490" y="80" class="hot"/><text x="590" y="100" class="step" text-anchor="middle">A2 = softmax(Q2 K2^T / sqrt(d))</text><line x1="690" x2="730" y1="80" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="200" height="40" x="730" y="60" class="box"/><text x="830" y="85" class="step" text-anchor="middle">A = A1 - lambda * A2</text><line x1="830" x2="830" y1="100" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="200" height="40" x="730" y="140" class="box"/><text x="830" y="165" class="step" text-anchor="middle">out = A V</text><rect width="900" height="130" x="30" y="220" class="box"/><text x="480" y="243" class="label" text-anchor="middle">the intuition: both softmaxes carry the same uniform noise floor</text><text x="50" y="272" class="step">A1</text><rect width="820" height="8" x="90" y="267" fill="#bbb"/><rect width="4" height="22" x="500" y="260" fill="#c0392b"/><text x="910" y="275" class="small" text-anchor="end">signal</text><text x="50" y="302" class="step">A2</text><rect width="820" height="8" x="90" y="297" fill="#bbb"/><text x="910" y="305" class="small" text-anchor="end">no signal</text><text x="50" y="335" class="step">A1 - lambda*A2</text><rect width="820" height="3" x="90" y="328" fill="#eee"/><rect width="4" height="17" x="500" y="321" fill="#2e7d32"/><text x="910" y="338" class="small" text-anchor="end">signal survives</text><rect width="900" height="150" x="30" y="370" class="box"/><text x="480" y="393" class="label" text-anchor="middle">V1 (ICLR 2025) -&gt; V2 (Microsoft, Jan 2026)</text><text x="50" y="420" class="step">head dim</text><text x="220" y="420" class="small">V1: halved (preserve param count) · V2: unchanged (match baseline decode)</text><text x="50" y="440" class="step">query heads</text><text x="220" y="440" class="small">V1: same as baseline · V2: doubled, KV heads unchanged</text><text x="50" y="460" class="step">kernel</text><text x="220" y="460" class="small">V1: custom CUDA · V2: plain FlashAttention — zero code change</text><text x="50" y="480" class="step">per-head norm</text><text x="220" y="480" class="small">V1: RMSNorm after subtraction (unstable at 70B) · V2: removed</text><text x="50" y="500" class="step">decode speed</text><text x="220" y="500" class="small">V1: slower (V cache loaded twice) · V2: matches baseline exactly</text><text x="480" y="535" class="caption" text-anchor="middle">ICLR 2025 experiment -&gt; production pre-training. same math, production-ready packaging.</text></svg>