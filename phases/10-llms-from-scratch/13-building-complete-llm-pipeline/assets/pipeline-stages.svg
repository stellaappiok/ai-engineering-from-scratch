<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.gate,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.gate{fill:#f0e6ff;stroke:#5e3fbe}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="480" y="28" class="title" text-anchor="middle">twelve stages, one manifest, one ship gate</text><g><rect width="180" height="60" x="30" y="60" class="box"/><text x="120" y="82" class="label" text-anchor="middle">01 / 02 Tokenizer</text><text x="120" y="102" class="step" text-anchor="middle">vocab, merges, hash</text><text x="120" y="115" class="small" text-anchor="middle">~1 hr · ~$5</text><rect width="180" height="60" x="245" y="60" class="box"/><text x="335" y="82" class="label" text-anchor="middle">03 Dataset</text><text x="335" y="102" class="step" text-anchor="middle">shards, dedup, rows</text><text x="335" y="115" class="small" text-anchor="middle">~hours · ~$50</text><rect width="180" height="60" x="460" y="60" class="hot"/><text x="550" y="82" class="label" text-anchor="middle">04 / 05 Pre-training</text><text x="550" y="102" class="step" text-anchor="middle">base checkpoint</text><text x="550" y="115" class="small" text-anchor="middle">days · $$$</text><rect width="180" height="60" x="675" y="60" class="box"/><text x="765" y="82" class="label" text-anchor="middle">06 SFT</text><text x="765" y="102" class="step" text-anchor="middle">instruction tuned</text><text x="765" y="115" class="small" text-anchor="middle">~hours · $$</text><rect width="180" height="60" x="30" y="170" class="box"/><text x="120" y="192" class="label" text-anchor="middle">07 RLHF (PPO)</text><text x="120" y="212" class="step" text-anchor="middle">reward + policy</text><text x="120" y="225" class="small" text-anchor="middle">parallel w/ 08</text><rect width="180" height="60" x="245" y="170" class="box"/><text x="335" y="192" class="label" text-anchor="middle">08 DPO</text><text x="335" y="212" class="step" text-anchor="middle">preference pairs</text><text x="335" y="225" class="small" text-anchor="middle">parallel w/ 07</text><rect width="180" height="60" x="460" y="170" class="box"/><text x="550" y="192" class="label" text-anchor="middle">09 CAI + GRPO</text><text x="550" y="212" class="step" text-anchor="middle">self-improvement</text><text x="550" y="225" class="small" text-anchor="middle">rule rewards</text><rect width="180" height="60" x="675" y="170" class="box"/><text x="765" y="192" class="label" text-anchor="middle">10 Evaluation</text><text x="765" y="212" class="step" text-anchor="middle">MMLU, MATH, GPQA</text><text x="765" y="225" class="small" text-anchor="middle">held-out set</text><rect width="180" height="60" x="30" y="280" class="box"/><text x="120" y="302" class="label" text-anchor="middle">11 Quantization</text><text x="120" y="322" class="step" text-anchor="middle">GPTQ / AWQ / GGUF</text><text x="120" y="335" class="small" text-anchor="middle">4-bit · ~mins</text><rect width="180" height="60" x="245" y="280" class="box"/><text x="335" y="302" class="label" text-anchor="middle">12 Inference</text><text x="335" y="322" class="step" text-anchor="middle">vLLM, TRT-LLM</text><text x="335" y="335" class="small" text-anchor="middle">continuous batch</text><rect width="180" height="60" x="460" y="280" class="gate"/><text x="550" y="302" class="label" text-anchor="middle">Ship gate</text><text x="550" y="322" class="step" text-anchor="middle">regression + KL + $</text><text x="550" y="335" class="small" text-anchor="middle">numeric thresholds</text><rect width="180" height="60" x="675" y="280" class="cool"/><text x="765" y="302" class="label" text-anchor="middle">Artifact store</text><text x="765" y="322" class="step" text-anchor="middle">content-addressed</text><text x="765" y="335" class="small" text-anchor="middle">hash, not filename</text></g><line x1="210" x2="245" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="425" x2="460" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640" x2="675" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="765" x2="765" y1="120" y2="160" stroke="#1a1a1a" stroke-width="1.5"/><line x1="765" x2="120" y1="160" y2="160" stroke="#1a1a1a" stroke-width="1.5"/><line x1="120" x2="120" y1="160" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="765" x2="335" y1="160" y2="160" stroke="#1a1a1a" stroke-width="1.5"/><line x1="335" x2="335" y1="160" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="210" x2="460" y1="200" y2="200" stroke="#1a1a1a" stroke-width="1.5"/><line x1="425" x2="460" y1="200" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="640" x2="675" y1="200" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="550" x2="550" y1="230" y2="270" stroke="#1a1a1a" stroke-width="1.5"/><line x1="550" x2="120" y1="270" y2="270" stroke="#1a1a1a" stroke-width="1.5"/><line x1="120" x2="120" y1="270" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="210" x2="245" y1="310" y2="310" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="765" x2="765" y1="230" y2="270" stroke="#1a1a1a" stroke-width="1.5"/><line x1="765" x2="550" y1="270" y2="270" stroke="#1a1a1a" stroke-width="1.5"/><line x1="550" x2="550" y1="270" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="400" height="100" x="30" y="380" class="box"/><text x="230" y="402" class="label" text-anchor="middle">Manifest</text><text x="230" y="422" class="step" text-anchor="middle">version, seed, git_commit</text><text x="230" y="440" class="step" text-anchor="middle">per-stage input/output hash</text><text x="230" y="458" class="step" text-anchor="middle">cost, wall clock, status</text><text x="230" y="473" class="small" text-anchor="middle">single file, sufficient to replay</text><rect width="400" height="100" x="460" y="380" class="gate"/><text x="660" y="402" class="label" text-anchor="middle">Gates</text><text x="660" y="422" class="step" text-anchor="middle">regression: metric ≥ baseline</text><text x="660" y="440" class="step" text-anchor="middle">KL budget: drift &lt; cap</text><text x="660" y="458" class="step" text-anchor="middle">safety: refusal rate &lt; 5%</text><text x="660" y="473" class="step" text-anchor="middle">cost: total &lt; budget</text><text x="480" y="508" class="caption" text-anchor="middle">no subjective sign-off — every gate is a number, and every gate is versioned</text></svg>