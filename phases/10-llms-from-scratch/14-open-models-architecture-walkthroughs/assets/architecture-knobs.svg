<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.cool{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.old{fill:#eee;stroke:#888;stroke-width:1.2}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="28" class="title" text-anchor="middle">six knobs: GPT-2 → open frontier</text><text x="30" y="72" class="head">1 / Norm</text><rect width="330" height="36" x="130" y="55" class="old"/><text x="295" y="78" class="step" text-anchor="middle">LayerNorm — mean + std + scale + bias</text><line x1="465" x2="495" y1="73" y2="73" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="330" height="36" x="500" y="55" class="cool"/><text x="665" y="78" class="step" text-anchor="middle">RMSNorm — std + scale</text><text x="30" y="122" class="head">2 / Position</text><rect width="330" height="36" x="130" y="105" class="old"/><text x="295" y="128" class="step" text-anchor="middle">learned embedding table</text><line x1="465" x2="495" y1="123" y2="123" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="330" height="36" x="500" y="105" class="cool"/><text x="665" y="128" class="step" text-anchor="middle">RoPE (+ YaRN / NTK for stretch)</text><text x="30" y="172" class="head">3 / Activation</text><rect width="330" height="36" x="130" y="155" class="old"/><text x="295" y="178" class="step" text-anchor="middle">GELU — one projection</text><line x1="465" x2="495" y1="173" y2="173" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="330" height="36" x="500" y="155" class="cool"/><text x="665" y="178" class="step" text-anchor="middle">SwiGLU — gate · swish(gate) · up</text><text x="30" y="222" class="head">4 / Attention</text><rect width="330" height="36" x="130" y="205" class="old"/><text x="295" y="228" class="step" text-anchor="middle">MHA — one K,V per head</text><line x1="465" x2="495" y1="223" y2="223" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="330" height="36" x="500" y="205" class="cool"/><text x="665" y="228" class="step" text-anchor="middle">GQA → MQA → MLA (shrink KV cache)</text><text x="30" y="272" class="head">5 / MLP</text><rect width="330" height="36" x="130" y="255" class="old"/><text x="295" y="278" class="step" text-anchor="middle">dense — every param per token</text><line x1="465" x2="495" y1="273" y2="273" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="330" height="36" x="500" y="255" class="cool"/><text x="665" y="278" class="step" text-anchor="middle">MoE — top-k of N experts per token</text><text x="30" y="322" class="head">6 / Norm place</text><rect width="330" height="36" x="130" y="305" class="old"/><text x="295" y="328" class="step" text-anchor="middle">post-norm — hard to train deep</text><line x1="465" x2="495" y1="323" y2="323" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="330" height="36" x="500" y="305" class="cool"/><text x="665" y="328" class="step" text-anchor="middle">pre-norm (stays everywhere)</text><rect width="900" height="140" x="30" y="360" class="box"/><text x="480" y="383" class="label" text-anchor="middle">the diff for each frontier open model</text><text x="50" y="410" class="step">GPT-2 Small</text><text x="200" y="410" class="small">LayerNorm · GELU · learned · MHA · dense · 1k ctx</text><text x="50" y="432" class="step">Llama 3 8B</text><text x="200" y="432" class="small">RMSNorm · SwiGLU · RoPE · GQA 32/8 · dense · 128k</text><text x="50" y="454" class="step">Mixtral 8x7B</text><text x="200" y="454" class="small">RMSNorm · SwiGLU · RoPE · GQA · MoE 8/top-2 · 32k</text><text x="50" y="476" class="step">DeepSeek V3</text><text x="200" y="476" class="small">RMSNorm · SwiGLU · RoPE · MLA · MoE 256/top-8 · 128k · 671B/37B active</text><text x="480" y="515" class="caption" text-anchor="middle">same skeleton, six tuned knobs — the next frontier model picks a subset of these</text></svg>