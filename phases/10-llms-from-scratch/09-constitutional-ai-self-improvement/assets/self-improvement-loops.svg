<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#222;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="28" class="title" text-anchor="middle">two loops replace the human preference budget</text><rect width="400" height="380" x="40" y="55" class="box"/><text x="240" y="80" class="label" text-anchor="middle">Constitutional AI — subjective behavior</text><rect width="360" height="32" x="60" y="100" class="hot"/><text x="240" y="121" class="content" text-anchor="middle">prompt + initial response</text><line x1="240" x2="240" y1="137" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="48" x="60" y="160" class="box"/><text x="240" y="180" class="content" text-anchor="middle">model critiques against</text><text x="240" y="198" class="content" text-anchor="middle">principle sampled from constitution</text><line x1="240" x2="240" y1="213" y2="231" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="32" x="60" y="236" class="box"/><text x="240" y="257" class="content" text-anchor="middle">model rewrites response</text><line x1="240" x2="240" y1="273" y2="291" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="32" x="60" y="296" class="cool"/><text x="240" y="317" class="content" text-anchor="middle">SFT on (prompt, revised)</text><line x1="240" x2="240" y1="333" y2="351" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="32" x="60" y="356" class="cool"/><text x="240" y="377" class="content" text-anchor="middle">DPO on pairwise AI judgments</text><text x="240" y="412" class="caption" text-anchor="middle">lever is the constitution — editing text,</text><text x="240" y="427" class="caption" text-anchor="middle">not re-labeling thousands of pairs</text><rect width="400" height="380" x="460" y="55" class="box"/><text x="660" y="80" class="label" text-anchor="middle">GRPO — verifiable behavior</text><rect width="360" height="32" x="480" y="100" class="hot"/><text x="660" y="121" class="content" text-anchor="middle">prompt (math / code / format)</text><line x1="660" x2="660" y1="137" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="48" x="480" y="160" class="box"/><text x="660" y="180" class="content" text-anchor="middle">sample G responses</text><text x="660" y="198" class="content" text-anchor="middle">(G = 16, 32, 64)</text><line x1="660" x2="660" y1="213" y2="231" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="32" x="480" y="236" class="box"/><text x="660" y="257" class="content" text-anchor="middle">deterministic rule grades each one</text><line x1="660" x2="660" y1="273" y2="291" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="32" x="480" y="296" class="cool"/><text x="660" y="317" class="content" text-anchor="middle">A_i = (r_i - mean) / std (group-relative)</text><line x1="660" x2="660" y1="333" y2="351" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="360" height="32" x="480" y="356" class="cool"/><text x="660" y="377" class="content" text-anchor="middle">clipped surrogate + KL to reference</text><text x="660" y="412" class="caption" text-anchor="middle">no value function, no reward model —</text><text x="660" y="427" class="caption" text-anchor="middle">DeepSeek-R1 recipe, ORM only</text><text x="450" y="468" class="caption" text-anchor="middle">CAI for &quot;tone&quot;. GRPO for &quot;answer&quot;. Most 2026 pipelines run both.</text></svg>