<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cache{stroke-width:1.5}.worker1,.worker2{fill:#dff4dd;stroke:#2e7d32;stroke-width:1.5}.worker2{fill:#ffd9c2;stroke:#c0392b}.cache{fill:#e9e6ff;stroke:#5a4fcf}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Hogwild! inference — N workers, one shared KV cache</text><rect width="200" height="120" x="60" y="60" class="worker1"/><text x="160" y="84" class="head" text-anchor="middle">worker 1</text><text x="160" y="106" class="small" text-anchor="middle">reads full shared cache</text><text x="160" y="124" class="small" text-anchor="middle">decides what to write next</text><text x="160" y="144" class="small" text-anchor="middle">writes one token</text><text x="160" y="164" class="small" text-anchor="middle">repeat</text><rect width="200" height="120" x="60" y="360" class="worker2"/><text x="160" y="384" class="head" text-anchor="middle">worker 2</text><text x="160" y="406" class="small" text-anchor="middle">reads full shared cache</text><text x="160" y="424" class="small" text-anchor="middle">sees worker 1&apos;s tokens</text><text x="160" y="444" class="small" text-anchor="middle">pivots to unexplored work</text><text x="160" y="464" class="small" text-anchor="middle">writes one token</text><rect width="540" height="180" x="380" y="180" class="cache"/><text x="650" y="210" class="head" text-anchor="middle">shared KV cache</text><rect width="40" height="30" x="400" y="230" class="worker1"/><text x="420" y="249" class="step" text-anchor="middle">A</text><rect width="40" height="30" x="445" y="230" class="worker1"/><text x="465" y="249" class="step" text-anchor="middle">A</text><rect width="40" height="30" x="490" y="230" class="worker2"/><text x="510" y="249" class="step" text-anchor="middle">B</text><rect width="40" height="30" x="535" y="230" class="worker1"/><text x="555" y="249" class="step" text-anchor="middle">A</text><rect width="40" height="30" x="580" y="230" class="worker2"/><text x="600" y="249" class="step" text-anchor="middle">B</text><rect width="40" height="30" x="625" y="230" class="worker2"/><text x="645" y="249" class="step" text-anchor="middle">B</text><rect width="40" height="30" x="670" y="230" class="worker1"/><text x="690" y="249" class="step" text-anchor="middle">A</text><rect width="40" height="30" x="715" y="230" class="worker2"/><text x="735" y="249" class="step" text-anchor="middle">C</text><rect width="40" height="30" x="760" y="230" class="worker1"/><text x="780" y="249" class="step" text-anchor="middle">A</text><rect width="40" height="30" x="805" y="230" class="worker2"/><text x="825" y="249" class="step" text-anchor="middle">C</text><text x="650" y="290" class="small" text-anchor="middle">tokens arrive asynchronously from all workers</text><text x="650" y="308" class="small" text-anchor="middle">RoPE positions let the cache stay stable under concurrent writes</text><text x="650" y="328" class="small" text-anchor="middle">each worker&apos;s next read sees everything</text><text x="650" y="346" class="small" text-anchor="middle">(including the other workers&apos; just-written tokens)</text><line x1="260" x2="380" y1="120" y2="200" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="260" x2="380" y1="420" y2="340" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="380" x2="260" y1="250" y2="150" stroke="#5a4fcf" stroke-dasharray="4 3" stroke-width="1"/><line x1="380" x2="260" y1="260" y2="390" stroke="#5a4fcf" stroke-dasharray="4 3" stroke-width="1"/><rect width="860" height="36" x="60" y="500" class="box"/><text x="80" y="524" class="step">speedup(N, p, c) = 1 / [(1 - p) + p/N + c * N / T_serial]</text><text x="500" y="524" class="small">p = parallelizable fraction · c = per-worker coord cost · T_serial = single-worker task length</text></svg>