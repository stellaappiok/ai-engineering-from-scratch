<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.hot,.shared{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.shared{fill:#e9e6ff;stroke:#5a4fcf}.label{font-size:13px;font-weight:600;fill:#1a1a1a}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}</style></defs><text x="480" y="28" class="title" text-anchor="middle">sequential multi-token prediction — DeepSeek-V3 style</text><rect width="200" height="60" x="30" y="60" class="box"/><text x="130" y="80" class="head" text-anchor="middle">main model backbone</text><text x="130" y="100" class="step" text-anchor="middle">h_i^(0) · L_main</text><rect width="200" height="50" x="30" y="150" class="shared"/><text x="130" y="170" class="head" text-anchor="middle">shared embedding E</text><text x="130" y="188" class="small" text-anchor="middle">used by main + every MTP depth</text><rect width="260" height="140" x="280" y="60" class="cool"/><text x="410" y="82" class="head" text-anchor="middle">MTP module k=1</text><text x="410" y="100" class="small" text-anchor="middle">combine: M_1 * [RMSNorm(h^0); RMSNorm(E(t_{i+1}))]</text><text x="410" y="118" class="small" text-anchor="middle">transformer block T_1 (attn + MLP)</text><text x="410" y="138" class="step" text-anchor="middle">h_i^(1)</text><text x="410" y="160" class="small" text-anchor="middle">shared LM head -&gt; predict t_{i+1}</text><text x="410" y="180" class="step" text-anchor="middle">L_1 = CE(logits, t_{i+1})</text><rect width="260" height="140" x="580" y="60" class="cool"/><text x="710" y="82" class="head" text-anchor="middle">MTP module k=2</text><text x="710" y="100" class="small" text-anchor="middle">combine: M_2 * [RMSNorm(h^1); RMSNorm(E(t_{i+2}))]</text><text x="710" y="118" class="small" text-anchor="middle">transformer block T_2 (attn + MLP)</text><text x="710" y="138" class="step" text-anchor="middle">h_i^(2)</text><text x="710" y="160" class="small" text-anchor="middle">shared LM head -&gt; predict t_{i+2}</text><text x="710" y="180" class="step" text-anchor="middle">L_2 = CE(logits, t_{i+2})</text><line x1="230" x2="280" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="540" x2="580" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="560" y="80" class="small" text-anchor="middle">h^(1)</text><rect width="280" height="50" x="340" y="230" class="shared"/><text x="480" y="250" class="head" text-anchor="middle">shared output head Out</text><text x="480" y="268" class="small" text-anchor="middle">reuses main model&apos;s LM head — no extra params</text><line x1="230" x2="285" y1="175" y2="175" stroke="#5a4fcf" stroke-width="1.2"/><line x1="285" x2="285" y1="175" y2="130" stroke="#5a4fcf" stroke-width="1.2" marker-end="url(#arrow)"/><line x1="230" x2="585" y1="175" y2="175" stroke="#5a4fcf" stroke-dasharray="3 2" stroke-width="1"/><line x1="585" x2="585" y1="175" y2="130" stroke="#5a4fcf" stroke-width="1.2" marker-end="url(#arrow)"/><rect width="900" height="60" x="30" y="320" class="box"/><text x="480" y="343" class="head" text-anchor="middle">joint loss</text><text x="480" y="363" class="step" text-anchor="middle">L_total = L_main + (lambda / D) * sum_{k=1..D} L_k</text><rect width="900" height="120" x="30" y="400" class="hot"/><text x="480" y="423" class="label" text-anchor="middle">at inference: MTP modules become a speculative-decoding draft</text><text x="50" y="450" class="step">module k=1</text><text x="220" y="450" class="small">draft t_{i+1} given main h^(0) · DeepSeek-V3 reports 80%+ acceptance</text><text x="50" y="470" class="step">module k=2</text><text x="220" y="470" class="small">draft t_{i+2} given h^(1) + E(t_{i+1}) · chains across depths</text><text x="50" y="490" class="step">verifier</text><text x="220" y="490" class="small">main model accepts/rejects via Leviathan rule (Phase 10 · 15)</text><text x="50" y="510" class="step">speedup</text><text x="220" y="510" class="small">~1.8x throughput in generation — paper-reported measured value</text></svg>