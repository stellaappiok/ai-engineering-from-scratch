<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:11px;fill:#333}.caption{fill:#555;font-style:italic}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">OAuth 2.1 + PKCE + step-up (SEP-835)</text><rect width="180" height="460" x="40" y="60" class="cool"/><text x="130" y="82" class="head" text-anchor="middle">client</text><text x="56" y="108" class="small">Claude Desktop,</text><text x="56" y="124" class="small">Cursor, VS Code</text><text x="56" y="156" class="step">holds</text><text x="56" y="174" class="small">- access tokens</text><text x="56" y="190" class="small">keyed by resource</text><text x="56" y="206" class="small">- refresh tokens</text><text x="56" y="222" class="small">- PKCE verifiers</text><rect width="180" height="460" x="400" y="60" class="cold"/><text x="490" y="82" class="head" text-anchor="middle">authorization server</text><text x="416" y="108" class="small">Auth0 / Keycloak /</text><text x="416" y="124" class="small">Cognito / custom</text><text x="416" y="156" class="step">responsibilities</text><text x="416" y="174" class="small">- consent UI</text><text x="416" y="190" class="small">- issue tokens</text><text x="416" y="206" class="small">- PKCE check</text><text x="416" y="222" class="small">- audience-pin via</text><text x="416" y="238" class="small">resource indicator</text><text x="416" y="254" class="small">(RFC 8707)</text><rect width="180" height="460" x="760" y="60" class="hot"/><text x="850" y="82" class="head" text-anchor="middle">resource server</text><text x="776" y="108" class="small">MCP server</text><text x="776" y="124" class="small">e.g. notes.example</text><text x="776" y="156" class="step">responsibilities</text><text x="776" y="174" class="small">- validate aud</text><text x="776" y="190" class="small">- check scope</text><text x="776" y="206" class="small">- 403 on shortfall</text><text x="776" y="222" class="small">- WWW-Authenticate</text><text x="776" y="238" class="small">with scope hint</text><text x="776" y="254" class="small">- publish .well-known/</text><text x="776" y="270" class="small">oauth-protected-</text><text x="776" y="286" class="small">resource (RFC 9728)</text><path marker-end="url(#arrow)" d="M220,280 L400,280" class="edge"/><text x="310" y="270" class="small" text-anchor="middle">authorize code_challenge</text><text x="310" y="298" class="small" text-anchor="middle">user consents</text><path marker-end="url(#arrow)" d="M400,330 L220,330" class="edge"/><text x="310" y="322" class="small" text-anchor="middle">code</text><path marker-end="url(#arrow)" d="M220,360 L400,360" class="edge"/><text x="310" y="352" class="small" text-anchor="middle">token grant + verifier + resource</text><path marker-end="url(#arrow)" d="M400,400 L220,400" class="edge"/><text x="310" y="392" class="small" text-anchor="middle">access token (aud, scopes)</text><path marker-end="url(#arrow)" d="M220,440 L760,440" class="edge"/><text x="490" y="432" class="small" text-anchor="middle">Authorization: Bearer ...</text><path marker-end="url(#arrow)" d="M760,480 L220,480" class="edge"/><text x="490" y="472" class="small" text-anchor="middle">403 insufficient_scope (SEP-835)</text><text x="490" y="498" class="caption" text-anchor="middle">client redirects user for larger scope, flow repeats, retries request</text></svg>