<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 1000 560"><defs><style>.an{stroke-width:1.5}.box{fill:#faf6ef;stroke:#1a1a1a}.box,.gm,.oa{stroke-width:1.5}.oa{fill:#e6f4ea;stroke:#2e7d32}.an{fill:#fff1d6;stroke:#c0392b}.gm{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:11px;fill:#333}.caption{fill:#555;font-style:italic}</style></defs><text x="500" y="26" class="title" text-anchor="middle">same tool, three provider shapes</text><rect width="920" height="80" x="40" y="50" class="box"/><text x="60" y="72" class="head">canonical tool (your code)</text><text x="60" y="96" class="step">Tool(name=&quot;get_weather&quot;, description=&quot;...&quot;, input_schema={...}, strict=True)</text><text x="60" y="118" class="small">one source of truth; translators emit provider-specific envelopes.</text><rect width="300" height="180" x="40" y="150" class="oa"/><text x="190" y="172" class="head" text-anchor="middle">OpenAI</text><text x="56" y="198" class="step">tools: [{</text><text x="72" y="214" class="step">type: &quot;function&quot;,</text><text x="72" y="230" class="step">function: {</text><text x="88" y="246" class="step">name, description,</text><text x="88" y="262" class="step">parameters: schema,</text><text x="88" y="278" class="step">strict: true</text><text x="72" y="294" class="step">}</text><text x="56" y="310" class="step">}]</text><rect width="300" height="180" x="360" y="150" class="an"/><text x="510" y="172" class="head" text-anchor="middle">Anthropic</text><text x="376" y="198" class="step">tools: [{</text><text x="392" y="214" class="step">name,</text><text x="392" y="230" class="step">description,</text><text x="392" y="246" class="step">input_schema: schema</text><text x="376" y="262" class="step">}]</text><text x="376" y="294" class="small">schema is the contract;</text><text x="376" y="310" class="small">no `strict` flag.</text><rect width="280" height="180" x="680" y="150" class="gm"/><text x="820" y="172" class="head" text-anchor="middle">Gemini</text><text x="696" y="198" class="step">tools: [{</text><text x="712" y="214" class="step">functionDeclarations: [{</text><text x="728" y="230" class="step">name,</text><text x="728" y="246" class="step">description,</text><text x="728" y="262" class="step">parameters: openapi</text><text x="712" y="278" class="step">}]</text><text x="696" y="294" class="step">}]</text><text x="696" y="314" class="small">OpenAPI 3.0 subset</text><rect width="300" height="180" x="40" y="350" class="oa"/><text x="190" y="372" class="head" text-anchor="middle">OpenAI response</text><text x="56" y="398" class="step">msg.tool_calls: [{</text><text x="72" y="414" class="step">id: &quot;call_abc123&quot;,</text><text x="72" y="430" class="step">type: &quot;function&quot;,</text><text x="72" y="446" class="step">function: {</text><text x="88" y="462" class="step">name,</text><text x="88" y="478" class="step">arguments: &quot;{json}&quot;</text><text x="72" y="494" class="step">}</text><text x="56" y="510" class="step">}]</text><rect width="300" height="180" x="360" y="350" class="an"/><text x="510" y="372" class="head" text-anchor="middle">Anthropic response</text><text x="376" y="398" class="step">content: [{</text><text x="392" y="414" class="step">type: &quot;tool_use&quot;,</text><text x="392" y="430" class="step">id: &quot;toolu_xyz789&quot;,</text><text x="392" y="446" class="step">name,</text><text x="392" y="462" class="step">input: {...} // obj</text><text x="376" y="478" class="step">}]</text><text x="376" y="510" class="small">input is already parsed.</text><rect width="280" height="180" x="680" y="350" class="gm"/><text x="820" y="372" class="head" text-anchor="middle">Gemini response</text><text x="696" y="398" class="step">parts: [{</text><text x="712" y="414" class="step">functionCall: {</text><text x="728" y="430" class="step">id: uuid,</text><text x="728" y="446" class="step">name,</text><text x="728" y="462" class="step">args: {...}</text><text x="712" y="478" class="step">}</text><text x="696" y="494" class="step">}]</text><text x="696" y="514" class="small">unique id in Gemini 3+</text><text x="500" y="548" class="caption" text-anchor="middle">name/args semantics are identical across the three; envelope and id scheme differ.</text></svg>