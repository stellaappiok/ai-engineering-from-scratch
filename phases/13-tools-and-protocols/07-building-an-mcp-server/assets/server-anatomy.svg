<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:11px;fill:#333}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">stdio MCP server anatomy</text><rect width="200" height="400" x="40" y="50" class="cold"/><text x="140" y="72" class="head" text-anchor="middle">client (host)</text><text x="56" y="104" class="small">Claude Desktop,</text><text x="56" y="120" class="small">Cursor, VS Code,</text><text x="56" y="136" class="small">ChatGPT, ...</text><text x="56" y="172" class="step">spawns server as</text><text x="56" y="188" class="step">child process</text><text x="56" y="220" class="small">writes JSON-RPC</text><text x="56" y="236" class="small">to child&apos;s stdin</text><text x="56" y="268" class="small">reads responses</text><text x="56" y="284" class="small">from child&apos;s stdout</text><text x="56" y="316" class="step">newline-delimited</text><text x="56" y="332" class="small">one JSON object</text><text x="56" y="348" class="small">per line</text><path marker-end="url(#arrow)" d="M240,250 L320,250" class="edge"/><path marker-end="url(#arrow)" d="M320,300 L240,300" class="edge"/><rect width="600" height="400" x="320" y="50" class="box"/><text x="620" y="72" class="head" text-anchor="middle">server process (this lesson&apos;s code)</text><rect width="560" height="50" x="340" y="90" class="cool"/><t