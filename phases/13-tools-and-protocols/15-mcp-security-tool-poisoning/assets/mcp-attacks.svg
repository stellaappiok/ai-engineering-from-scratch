<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:11px;fill:#333}.caption{fill:#555;font-style:italic}</style></defs><text x="480" y="26" class="title" text-anchor="middle">seven MCP attack classes and defense-in-depth</text><rect width="880" height="210" x="40" y="50" class="hot"/><text x="480" y="72" class="head" text-anchor="middle">attacks</text><rect width="270" height="60" x="60" y="90" class="box"/><text x="76" y="110" class="step">1 / tool poisoning</text><text x="76" y="128" class="small">hidden instructions in</text><text x="76" y="144" class="small">tool description</text><rect width="270" height="60" x="345" y="90" class="box"/><text x="361" y="110" class="step">2 / rug pull</text><text x="361" y="128" class="small">benign first, poisoned</text><text x="361" y="144" class="small">after user approval</text><rect width="270" height="60" x="630" y="90" class="box"/><text x="646" y="110" class="step">3 / tool shadowing</text><text x="646" y="128" class="small">two servers same name;</text><text x="646" y="144" class="small">malicious wins route</text><rect width="270" height="60" x="60" y="160" class="box"/><text x="76" y="180" class="step">4 / MPMA</text><text x="76" y="198" class="small">manipulate modelPreferences</text><text x="76" y="214" class="small">to escalate cost or weaken</text><rect width="270" height="60" x="345" y="160" class="box"/><text x="361" y="180" class="step">5 / parasitic chain</text><text x="361" y="198" class="small">server A orchestrates</text><text x="361" y="214" class="small">server B via sampling</text><rect width="270" height="60" x="630" y="160" class="box"/><text x="646" y="180" class="step">6 / sampling attacks</text><text x="646" y="198" class="small">covert reasoning / theft /</text><text x="646" y="214" class="small">conversation hijacking</text><rect width="840" height="28" x="60" y="230" class="box"/><text x="76" y="248" class="step">7 / supply-chain masquerade</text><text x="300" y="248" class="small">fake server on registry (Postmark incident, Sept 2025). publisher sigs, reverse-DNS names.</text><rect width="880" height="260" x="40" y="280" class="cool"/><text x="480" y="302" class="head" text-anchor="middle">defense-in-depth (no single check wins)</text><rect width="270" height="80" x="60" y="320" class="box"/><text x="76" y="340" class="step">hash pinning</text><text x="76" y="358" class="small">SHA256 of each description;</text><text x="76" y="374" class="small">mutation -&gt; re-approval.</text><text x="76" y="390" class="small">catches rug pulls.</text><rect width="270" height="80" x="345" y="320" class="box"/><text x="361" y="340" class="step">static detector</text><text x="361" y="358" class="small">regex: SYSTEM tag, ignore-</text><text x="361" y="374" class="small">prev, secret-read, URL-</text><text x="361" y="390" class="small">shortener. CI ready.</text><rect width="270" height="80" x="630" y="320" class="box"/><text x="646" y="340" class="step">Rule of Two</text><text x="646" y="358" class="small">max two of: untrusted input,</text><text x="646" y="374" class="small">sensitive data, consequential</text><text x="646" y="390" class="small">action. Reject if all three.</text><rect width="270" height="80" x="60" y="410" class="box"/><text x="76" y="430" class="step">MELON</text><text x="76" y="448" class="small">masked re-execution +</text><text x="76" y="464" class="small">tool comparison. &gt;99%</text><text x="76" y="480" class="small">indirect-injection catch.</text><rect width="270" height="80" x="345" y="410" class="box"/><text x="361" y="430" class="step">gateway</text><text x="361" y="448" class="small">central policy, audit log,</text><text x="361" y="464" class="small">allowed-servers list.</text><text x="361" y="480" class="small">Phase 13 . 17.</text><rect width="270" height="80" x="630" y="410" class="box"/><text x="646" y="430" class="step">signed registry</text><text x="646" y="448" class="small">namespace-verified, reverse</text><text x="646" y="464" class="small">DNS (io.github.user/server).</text><text x="646" y="480" class="small">publisher signatures.</text><text x="480" y="530" class="caption" text-anchor="middle">adaptive attackers still hit ~85% against SOTA (arXiv March 2026). keep stacking.</text></svg>