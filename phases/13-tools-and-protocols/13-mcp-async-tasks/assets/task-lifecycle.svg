<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:11px;fill:#333}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">task lifecycle (SEP-1686) - experimental through H1 2026</text><rect width="880" height="80" x="40" y="60" class="box"/><text x="60" y="82" class="step">client -&gt; tools/call {name, arguments, _meta: {task: {required: true}}}</text><text x="60" y="102" class="step">server -&gt; result {_meta: {task: {id, state: &quot;working&quot;, ttl}}}</text><text x="60" y="124" class="small">task returned immediately; no long-held connection needed.</text><rect width="160" height="80" x="40" y="160" class="cool"/><text x="120" y="196" class="step" text-anchor="middle">working</text><text x="120" y="216" class="small" text-anchor="middle">worker running</text><rect width="160" height="80" x="260" y="160" class="cold"/><text x="340" y="196" class="step" text-anchor="middle">input_required</text><text x="340" y="216" class="small" text-anchor="middle">need elicitation</text><rect width="160" height="80" x="480" y="160" class="cool"/><text x="560" y="196" class="step" text-anchor="middle">completed</text><text x="560" y="216" class="small" text-anchor="middle">result available</text><rect width="100" height="80" x="700" y="160" class="hot"/><text x="750" y="196" class="step" text-anchor="middle">failed</text><text x="750" y="216" class="small" text-anchor="middle">error</text><rect width="100" height="80" x="820" y="160" class="box"/><text x="870" y="196" class="step" text-anchor="middle">cancelled</text><text x="870" y="216" class="small" text-anchor="middle">user stop</text><path marker-end="url(#arrow)" d="M200,200 L260,200" class="edge"/><path marker-end="url(#arrow)" d="M420,200 L480,200" class="edge"/><path marker-end="url(#arrow)" d="M640,200 L700,200" class="edge"/><path marker-end="url(#arrow)" d="M640,200 L820,200" class="edge"/><path stroke-dasharray="5 4" marker-end="url(#arrow)" d="M200,200 L200,150 C200,120 340,120 340,160" class="edge"/><text x="270" y="128" class="small">loop back after elicitation</text><rect width="420" height="110" x="40" y="260" class="cool"/><text x="250" y="282" class="head" text-anchor="middle">polling client</text><text x="56" y="306" class="step">while true:</text><text x="56" y="322" class="step">status = tasks/status {taskId}</text><text x="56" y="338" class="step">if status.state terminal: break</text><text x="56" y="354" class="step">result = tasks/result {taskId}</text><rect width="440" height="110" x="480" y="260" class="cold"/><text x="700" y="282" class="head" text-anchor="middle">streaming client (optional)</text><text x="496" y="306" class="step">server -&gt; notifications/tasks/updated</text><text x="496" y="322" class="step">{taskId, state, progress}</text><text x="496" y="344" class="small">client renders progress bar; no polling loop.</text><rect width="880" height="110" x="40" y="390" class="box"/><text x="480" y="412" class="head" text-anchor="middle">durability and recovery</text><text x="60" y="434" class="step">persist task state per tick (filesystem / SQLite / Redis)</text><text x="60" y="452" class="step">ttl promise: server retains terminal state for ttl ms</text><text x="60" y="470" class="step">on restart: reload all tasks; in-flight working -&gt; failed with CRASH_RECOVERY</text><text x="60" y="488" class="small">subtasks and durable subscriptions are 2026 roadmap; treat as experimental.</text></svg>