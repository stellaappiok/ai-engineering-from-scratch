<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:11px}.small{fill:#333}.caption{fill:#555;font-style:italic}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">three failure modes, two enforcement points</text><rect width="400" height="440" x="40" y="50" class="box"/><text x="240" y="72" class="head" text-anchor="middle">prompt-for-JSON (no strict mode)</text><rect width="360" height="40" x="60" y="90" class="cool"/><text x="240" y="114" class="step" text-anchor="middle">generate freely</text><rect width="360" height="40" x="60" y="140" class="box"/><text x="240" y="164" class="step" text-anchor="middle">parse JSON</text><rect width="360" height="40" x="60" y="190" class="box"/><text x="240" y="214" class="step" text-anchor="middle">validate against schema</text><path marker-end="url(#arrow)" d="M240,130 L240,140" class="edge"/><path marker-end="url(#arrow)" d="M240,180 L240,190" class="edge"/><rect width="360" height="40" x="60" y="260" class="hot"/><text x="240" y="284" class="step" text-anchor="middle">FAIL 1: parse error</text><rect width="360" height="40" x="60" y="310" class="hot"/><text x="240" y="334" class="step" text-anchor="middle">FAIL 2: schema violation</text><rect width="360" height="40" x="60" y="360" class="cool"/><text x="240" y="384" class="step" text-anchor="middle">SUCCESS: typed payload</text><rect width="360" height="50" x="60" y="420" class="box"/><text x="240" y="443" class="step" text-anchor="middle">retry on failure (max 3x)</text><text x="240" y="459" class="small" text-anchor="middle">expensive but necessary without strict mode</text><rect width="440" height="440" x="480" y="50" class="cool"/><text x="700" y="72" class="head" text-anchor="middle">strict mode / constrained decoding</text><rect width="400" height="50" x="500" y="90" class="cold"/><text x="700" y="110" class="step" text-anchor="middle">decode with schema-aware logit mask</text><text x="700" y="128" class="small" text-anchor="middle">grammar FSM rejects invalid next-tokens</text><rect width="400" height="40" x="500" y="160" class="box"/><text x="700" y="184" class="step" text-anchor="middle">output parses (always)</text><rect width="400" height="40" x="500" y="210" class="box"/><text x="700" y="234" class="step" text-anchor="middle">output validates (always)</text><path marker-end="url(#arrow)" d="M700,140 L700,160" class="edge"/><path marker-end="url(#arrow)" d="M700,200 L700,210" class="edge"/><rect width="400" height="40" x="500" y="280" class="cool"/><text x="700" y="304" class="step" text-anchor="middle">SUCCESS: typed payload</text><rect width="400" height="40" x="500" y="330" class="hot"/><text x="700" y="354" class="step" text-anchor="middle">REFUSAL: typed reason</text><rect width="400" height="80" x="500" y="400" class="box"/><text x="520" y="422" class="step">OpenAI : response_format strict:true</text><text x="520" y="440" class="step">Anthropic : input_schema on tool_use</text><text x="520" y="458" class="step">Gemini : responseSchema + grammar</text><text x="520" y="476" class="step">Open : outlines / guidance / lm-format-enforcer</text><text x="480" y="506" class="caption" text-anchor="middle">under strict, only the refusal branch stays; the retry loop collapses.</text></svg>