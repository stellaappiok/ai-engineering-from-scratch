<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:11px;fill:#333}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">A2A: opaque agent-to-agent task delegation</text><rect width="250" height="440" x="40" y="60" class="cool"/><text x="165" y="82" class="head" text-anchor="middle">research agent (caller)</text><text x="60" y="108" class="small">MCP tools for source</text><text x="60" y="124" class="small">retrieval + reasoning</text><text x="60" y="156" class="step">discovers writer via</text><text x="60" y="174" class="step">/.well-known/agent.json</text><text x="60" y="206" class="step">submits Task with</text><text x="60" y="222" class="step">Message.parts = [</text><text x="60" y="238" class="small">text: &quot;summarize&quot;,</text><text x="60" y="254" class="small">file: paper.pdf,</text><text x="60" y="270" class="small">data: {len: &quot;3 par&quot;}</text><text x="60" y="286" class="step">]</text><path marker-end="url(#arrow)" d="M290,280 L460,280" class="edge"/><text x="375" y="272" class="small" text-anchor="middle">tasks/send</text><path marker-end="url(#arrow)" d="M460,350 L290,350" class="edge"/><text x="375" y="342" class="small" text-anchor="middle">state transitions + artifact</text><rect width="460" height="440" x="460" y="60" class="cold"/><text x="690" y="82" class="head" text-anchor="middle">writer agent (callee, opaque inner state)</text><text x="476" y="108" class="step">publishes Agent Card</text><text x="476" y="126" class="small">{name, url, skills, capabilities}</text><text x="476" y="148" class="step">signed via AP2 (optional)</text><rect width="430" height="32" x="476" y="160" class="box"/><text x="490" y="180" class="step">submitted</text><rect width="430" height="32" x="476" y="196" class="box"/><text x="490" y="216" class="step">working</text><rect width="430" height="32" x="476" y="232" class="hot"/><text x="490" y="252" class="step">input_required</text><rect width="430" height="32" x="476" y="268" class="box"/><text x="490" y="288" class="step">working (resumed)</text><rect width="430" height="32" x="476" y="304" class="cool"/><text x="490" y="324" class="step">completed</text><text x="476" y="360" class="step">returns Artifact:</text><text x="476" y="378" class="small">{name: &quot;summary&quot;, mimeType: &quot;text/markdown&quot;,</text><text x="476" y="394" class="small">parts: [{type: &quot;text&quot;, text: &quot;...&quot;}]}</text><text x="476" y="426" class="step">opacity</text><text x="476" y="444" class="small">caller sees state + artifact;</text><text x="476" y="460" class="small">internal tool calls, sub-agents,</text><text x="476" y="476" class="small">chain-of-thought all hidden.</text></svg>