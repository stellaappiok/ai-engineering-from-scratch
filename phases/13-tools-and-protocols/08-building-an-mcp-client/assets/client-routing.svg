<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:11px;fill:#333}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">multi-server client namespace merge</text><rect width="880" height="60" x="40" y="60" class="cold"/><text x="480" y="84" class="head" text-anchor="middle">client: one merged tool namespace</text><text x="480" y="108" class="small" text-anchor="middle">create | read | files/search | search | list_issues | open_pr</text><path marker-end="url(#arrow)" d="M200,120 L200,170" class="edge"/><path marker-end="url(#arrow)" d="M480,120 L480,170" class="edge"/><path marker-end="url(#arrow)" d="M760,120 L760,170" class="edge"/><rect width="280" height="160" x="60" y="180" class="cool"/><text x="200" y="202" class="head" text-anchor="middle">server: notes</text><text x="74" y="228" class="step">tools:</text><text x="74" y="246" class="small">search (wins, first-come)</text><text x="74" y="262" class="small">create</text><text x="74" y="294" class="step">caps: tools</text><text x="74" y="314" class="step">transport: stdio child process</text><rect width="240" height="160" x="360" y="180" class="hot"/><text x="480" y="202" class="head" text-anchor="middle">server: files</text><text x="374" y="228" class="step">tools:</text><text x="374" y="246" class="small">read</text><text x="374" y="262" class="small">search (collision)</text><text x="374" y="278" class="small">renamed files/search</text><text x="374" y="310" class="step">caps: tools, resources</text><rect width="280" height="160" x="620" y="180" class="cold"/><text x="760" y="202" class="head" text-anchor="middle">server: github</text><text x="634" y="228" class="step">tools:</text><text x="634" y="246" class="small">list_issues</text><text x="634" y="262" class="small">open_pr</text><text x="634" y="278" class="small">search (collision)</text><text x="634" y="294" class="small">renamed github/search</text><text x="634" y="326" class="step">caps: tools</text><rect width="880" height="140" x="40" y="360" class="box"/><text x="480" y="382" class="head" text-anchor="middle">collision resolution policies</text><text x="60" y="408" class="step">prefix-on-collision : second server&apos;s tool renamed `files/search`, `github/search`</text><text x="60" y="426" class="small">Claude Desktop, VS Code.</text><text x="60" y="446" class="step">reject-on-collision : second server&apos;s tool refused, user notified</text><text x="60" y="464" class="small">Cursor. Safer; clearer errors.</text><text x="60" y="484" class="step">silent-overwrite : last-loaded wins. Never use. Hides registries.</text></svg>