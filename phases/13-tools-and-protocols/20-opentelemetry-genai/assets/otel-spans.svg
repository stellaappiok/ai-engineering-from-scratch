<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><style>.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.title{font-size:16px;font-weight:700;fill:#1a1a1a}.step{font-size:12px;font-family:&apos;Menlo&apos;,monospace;fill:#222}.caption{font-size:11px;fill:#555;font-style:italic}</style></defs><text x="480" y="26" class="title" text-anchor="middle">OTel GenAI span hierarchy for one agent turn</text><rect width="880" height="40" x="40" y="60" class="cool"/><text x="480" y="84" class="step" text-anchor="middle">agent.invoke_agent INTERNAL gen_ai.agent.name=research-agent</text><rect width="400" height="40" x="80" y="110" class="cold"/><text x="280" y="134" class="step" text-anchor="middle">llm.chat CLIENT model=gpt-4o</text><rect width="800" height="40" x="80" y="160" class="hot"/><text x="480" y="184" class="step" text-anchor="middle">tool.execute INTERNAL tool=get_weather(Bengaluru)</text><rect width="740" height="40" x="140" y="210" class="cold"/><text x="510" y="234" class="step" text-anchor="middle">mcp.call CLIENT server=notes transport=stdio traceparent=...</text><rect width="800" height="40" x="80" y="260" class="hot"/><text x="480" y="284" class="step" text-anchor="middle">tool.execute INTERNAL tool=get_weather(Tokyo)</text><rect width="740" height="40" x="140" y="310" class="cold"/><text x="510" y="334" class="step" text-anchor="middle">mcp.call CLIENT</text><rect width="800" height="40" x="80" y="360" class="hot"/><text x="480" y="384" class="step" text-anchor="middle">tool.execute INTERNAL tool=get_weather(Zurich)</text><rect width="740" height="40" x="140" y="410" class="cold"/><text x="510" y="434" class="step" text-anchor="middle">mcp.call CLIENT</text><rect width="400" height="40" x="80" y="460" class="cold"/><text x="280" y="484" class="step" text-anchor="middle">llm.chat CLIENT synthe