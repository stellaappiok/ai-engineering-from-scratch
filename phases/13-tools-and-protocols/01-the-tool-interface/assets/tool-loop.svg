<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold,.cool,.hot{stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cool{fill:#e6f4ea;stroke:#2e7d32}.cold{fill:#dfe9ff;stroke:#2c5ea9}.step{font-size:13px;font-family:&apos;Menlo&apos;,monospace;fill:#222}.caption,.small{font-size:11px;fill:#555}.small{font-family:&apos;Menlo&apos;,monospace}.caption{font-style:italic}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="480" y="26" class="title" text-anchor="middle">the four-step tool-call loop</text><rect width="200" height="110" x="40" y="70" class="cool"/><text x="140" y="96" class="head" text-anchor="middle">1 / describe</text><text x="140" y="122" class="small" text-anchor="middle">host registers tools</text><text x="140" y="138" class="small" text-anchor="middle">name + description</text><text x="140" y="154" class="small" text-anchor="middle">+ JSON Schema input</text><text x="140" y="170" class="small" text-anchor="middle">+ executor function</text><rect width="200" height="110" x="280" y="70" class="cold"/><text x="380" y="96" class="head" text-anchor="middle">2 / decide</text><text x="380" y="122" class="small" text-anchor="middle">model emits either</text><text x="380" y="138" class="small" text-anchor="middle">text answer OR</text><text x="380" y="154" class="small" text-anchor="middle">tool_calls: [ {id,</text><text x="380" y="170" class="small" text-anchor="middle">name, arguments} ]</text><rect width="200" height="110" x="520" y="70" class="hot"/><text x="620" y="96" class="head" text-anchor="middle">3 / execute</text><text x="620" y="122" class="small" text-anchor="middle">host validates args</text><text x="620" y="138" class="small" text-anchor="middle">against schema,</text><text x="620" y="154" class="small" text-anchor="middle">gates consequential</text><text x="620" y="170" class="small" text-anchor="middle">tools, runs executor</text><rect width="180" height="110" x="760" y="70" class="box"/><text x="850" y="96" class="head" text-anchor="middle">4 / observe</text><text x="850" y="122" class="small" text-anchor="middle">host appends</text><text x="850" y="138" class="small" text-anchor="middle">tool result with</text><text x="850" y="154" class="small" text-anchor="middle">matching id; re-</text><text x="850" y="170" class="small" text-anchor="middle">invokes the model</text><path marker-end="url(#arrow)" d="M240,125 L280,125" class="edge"/><path marker-end="url(#arrow)" d="M480,125 L520,125" class="edge"/><path marker-end="url(#arrow)" d="M720,125 L760,125" class="edge"/><path stroke-dasharray="5 4" marker-end="url(#arrow)" d="M850,180 C850,240 380,240 380,220" class="edge"/><text x="600" y="256" class="caption" text-anchor="middle">loop closes until model returns text or host hits MAX_TURNS</text><rect width="440" height="210" x="40" y="290" class="box"/><text x="260" y="316" class="head" text-anchor="middle">same loop, different names</text><text x="60" y="342" class="step">OpenAI : tools / tool_calls / tool_choice</text><text x="60" y="362" class="step">Anthropic : tools / tool_use / tool_result</text><text x="60" y="382" class="step">Gemini : functionDeclarations / functionCall</text><text x="60" y="402" class="step">MCP : tools/list / tools/call / content</text><text x="60" y="422" class="step">A2A : skills / tasks/send / Artifact parts</text><text x="60" y="442" class="step">WebMCP (2026) : browser tool manifest / dispatch</text><text x="60" y="472" class="small">every row is the same four steps with different column labels.</text><rect width="420" height="210" x="520" y="290" class="cool"/><text x="730" y="316" class="head" text-anchor="middle">pure vs consequential</text><text x="540" y="342" class="step">pure (safe to re-run)</text><text x="540" y="360" class="small">get_weather, search_docs, get_time</text><text x="540" y="380" class="step">consequential (gate required)</text><text x="540" y="398" class="small">send_email, delete_file, execute_trade</text><text x="540" y="424" class="step">Meta Rule of Two (2026)</text><text x="540" y="442" class="small">one turn may combine AT MOST two of:</text><text x="540" y="458" class="small">- untrusted input</text><text x="540" y="474" class="small">- sensitive data</text><text x="540" y="490" class="small">- consequential action</text></svg>