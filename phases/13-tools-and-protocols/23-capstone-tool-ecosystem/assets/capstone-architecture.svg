<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 980 560"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.cold{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.hot{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.hot{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:13px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:11px;fill:#333}.caption{fill:#555;font-style:italic}.edge{stroke:#1a1a1a;stroke-width:1.5;fill:none}</style></defs><text x="490" y="26" class="title" text-anchor="middle">capstone: research and report ecosystem, every Phase 13 primitive</text><rect width="160" height="440" x="40" y="60" class="cool"/><text x="120" y="82" class="head" text-anchor="middle">client / host</text><text x="56" y="108" class="small">Claude Desktop,</text><text x="56" y="124" class="small">Cursor, VS Code</text><text x="56" y="148" class="step">loads:</text><text x="56" y="166" class="small">- AGENTS.md</text><text x="56" y="182" class="small">- SKILL.md</text><text x="56" y="198" class="small">(run-research)</text><text x="56" y="230" class="step">renders:</text><text x="56" y="248" class="small">ui://report/current</text><text x="56" y="264" class="small">(iframe sandbox)</text><text x="56" y="296" class="step">OAuth 2.1:</text><text x="56" y="314" class="small">PKCE + RFC 8707</text><path marker-end="url(#arrow)" d="M200,280 L280,280" class="edge"/><rect width="200" height="440" x="280" y="60" class="cold"/><text x="380" y="82" class="head" text-anchor="middle">gateway</text><text x="296" y="108" class="step">auth: Bearer</text><text x="296" y="126" class="small">user = alice | bob</text><text x="296" y="148" class="step">RBAC:</text><text x="296" y="166" class="small">research:read</text><text x="296" y="182" class="small">research:write</text><text x="296" y="214" class="step">pinned-hash:</text><text x="296" y="232" class="small">SHA256 per tool</text><text x="296" y="248" class="small">reject mutations</text><text x="296" y="280" class="step">audit log</text><text x="296" y="298" class="small">user, tool, decision</text><text x="296" y="330" class="step">OTel: gen_ai.*</text><text x="296" y="348" class="small">mcp.call CLIENT</text><path marker-end="url(#arrow)" d="M480,230 L560,230" class="edge"/><path marker-end="url(#arrow)" d="M480,310 L560,310" class="edge"/><path marker-end="url(#arrow)" d="M560,390 L480,390" class="edge"/><rect width="220" height="440" x="560" y="60" class="hot"/><text x="670" y="82" class="head" text-anchor="middle">research MCP server</text><text x="576" y="108" class="step">tools</text><text x="576" y="126" class="small">arxiv_search</text><text x="576" y="142" class="small">generate_report (task)</text><text x="576" y="174" class="step">resources</text><text x="576" y="192" class="small">notes://recent</text><text x="576" y="224" class="step">prompts</text><text x="576" y="242" class="small">/research_topic</text><text x="576" y="274" class="step">ui://</text><text x="576" y="292" class="small">ui://report/current</text><text x="576" y="324" class="step">tasks</text><text x="576" y="342" class="small">durable; crash safe</text><text x="576" y="374" class="step">A2A call out:</text><text x="576" y="392" class="small">writer-agent</text><text x="576" y="408" class="small">tasks/send summary</text><path marker-end="url(#arrow)" d="M780,390 L860,390" class="edge"/><rect width="120" height="440" x="860" y="60" class="box"/><text x="920" y="82" class="head" text-anchor="middle">writer</text><text x="876" y="108" class="small">A2A agent</text><text x="876" y="124" class="small">opaque</text><text x="876" y="148" class="step">skills:</text><text x="876" y="166" class="small">summarize_</text><text x="876" y="182" class="small">papers</text><text x="876" y="214" class="step">returns:</text><text x="876" y="232" class="small">Artifact</text><text x="876" y="248" class="small">summary.md</text><text x="490" y="540" class="caption" text-anchor="middle">one trace id, spans across client -&gt; gateway -&gt; server -&gt; a2a; OTel GenAI everywhere.</text></svg>