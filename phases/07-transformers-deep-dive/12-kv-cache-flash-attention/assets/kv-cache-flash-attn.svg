<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hbm{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hbm{fill:#c9d4de;stroke-width:1}.sram{fill:#ffd78a;stroke:#c0392b;stroke-width:1.2}.kv{fill:#e7edd9;stroke:#1a1a1a;stroke-width:.8}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">KV cache grows. Flash Attention keeps the hot path in SRAM.</text><rect width="400" height="230" x="40" y="60" class="box"/><text x="240" y="85" class="label" text-anchor="middle">KV cache — decoding step by step</text><text x="60" y="115" class="content">t=1</text><rect width="24" height="22" x="90" y="100" class="kv"/><text x="102" y="116" class="content" text-anchor="middle">k1</text><rect width="24" height="22" x="90" y="125" class="kv"/><text x="102" y="141" class="content" text-anchor="middle">v1</text><text x="60" y="170" class="content">t=3</text><rect width="24" height="22" x="90" y="155" class="kv"/><text x="102" y="171" class="content" text-anchor="middle">k1</text><rect width="24" height="22" x="115" y="155" class="kv"/><text x="127" y="171" class="content" text-anchor="middle">k2</text><rect width="24" height="22" x="140" y="155" class="kv"/><text x="152" y="171" class="content" text-anchor="middle">k3</text><rect width="24" height="22" x="90" y="180" class="kv"/><text x="102" y="196" class="content" text-anchor="middle">v1</text><rect width="24" height="22" x="115" y="180" class="kv"/><text x="127" y="196" class="content" text-anchor="middle">v2</text><rect width="24" height="22" x="140" y="180" class="kv"/><text x="152" y="196" class="content" text-anchor="middle">v3</text><text x="60" y="225" class="content">t=N</text><rect width="24" height="22" x="90" y="215" class="kv"/><rect width="24" height="22" x="115" y="215" class="kv"/><rect width="24" height="22" x="140" y="215" class="kv"/><rect width="24" height="22" x="165" y="215" class="kv"/><rect width="24" height="22" x="190" y="215" class="kv"/><rect width="24" height="22" x="215" y="215" class="kv"/><rect width="24" height="22" x="240" y="215" class="kv"/><rect width="24" height="22" x="265" y="215" class="kv"/><rect width="24" height="22" x="290" y="215" class="kv"/><rect width="24" height="22" x="315" y="215" class="kv"/><rect width="24" height="22" x="340" y="215" class="kv"/><rect width="24" height="22" x="365" y="215" class="kv"/><rect width="24" height="22" x="390" y="215" class="kv"/><rect width="24" height="22" x="90" y="240" class="kv"/><rect width="24" height="22" x="115" y="240" class="kv"/><rect width="24" height="22" x="140" y="240" class="kv"/><rect width="24" height="22" x="165" y="240" class="kv"/><rect width="24" height="22" x="190" y="240" class="kv"/><rect width="24" height="22" x="215" y="240" class="kv"/><rect width="24" height="22" x="240" y="240" class="kv"/><rect width="24" height="22" x="265" y="240" class="kv"/><rect width="24" height="22" x="290" y="240" class="kv"/><rect width="24" height="22" x="315" y="240" class="kv"/><rect width="24" height="22" x="340" y="240" class="kv"/><rect width="24" height="22" x="365" y="240" class="kv"/><rect width="24" height="22" x="390" y="240" class="kv"/><text x="240" y="278" class="caption" text-anchor="middle">each new query attends to N cached k/v — O(N) per step, not O(N²)</text><rect width="400" height="230" x="460" y="60" class="box"/><text x="660" y="85" class="label" text-anchor="middle">Flash Attention — tiling into SRAM</text><rect width="180" height="170" x="485" y="100" class="hbm"/><text x="575" y="120" class="content" text-anchor="middle">HBM</text><text x="575" y="138" class="caption" text-anchor="middle">3 TB/s, 80 GB</text><rect width="45" height="35" x="505" y="150" class="kv"/><text x="527" y="170" class="content" text-anchor="middle">Q</text><rect width="45" height="35" x="555" y="150" class="kv"/><text x="577" y="170" class="content" text-anchor="middle">K</text><rect width="45" height="35" x="605" y="150" class="kv"/><text x="627" y="170" class="content" text-anchor="middle">V</text><rect width="45" height="35" x="555" y="195" class="kv"/><text x="577" y="215" class="content" text-anchor="middle">O</text><text x="575" y="258" class="caption" text-anchor="middle">no N×N ever materialized here</text><rect width="160" height="170" x="690" y="100" class="sram"/><text x="770" y="120" class="content" text-anchor="middle">SRAM (per SM)</text><text x="770" y="138" class="caption" text-anchor="middle">30 TB/s, 256 KB</text><rect width="30" height="30" x="705" y="150" class="kv"/><text x="720" y="170" class="content" text-anchor="middle">Qt</text><rect width="30" height="30" x="740" y="150" class="kv"/><text x="755" y="170" class="content" text-anchor="middle">Kt</text><rect width="30" height="30" x="775" y="150" class="kv"/><text x="790" y="170" class="content" text-anchor="middle">Vt</text><rect width="30" height="30" x="810" y="150" class="kv"/><text x="825" y="170" class="content" text-anchor="middle">Ot</text><text x="770" y="215" class="content" text-anchor="middle">running (max, sum)</text><text x="770" y="238" class="caption" text-anchor="middle">softmax exact, not approximated</text><line x1="665" x2="695" y1="160" y2="160" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="695" x2="665" y1="210" y2="210" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="800" height="160" x="60" y="320" class="box"/><text x="460" y="345" class="label" text-anchor="middle">Flash Attention version timeline</text><text x="110" y="385" class="content" text-anchor="middle">FA1 (2022)</text><text x="110" y="405" class="caption" text-anchor="middle">SRAM tiling</text><text x="110" y="421" class="caption" text-anchor="middle">2× on A100</text><text x="290" y="385" class="content" text-anchor="middle">FA2 (2023)</text><text x="290" y="405" class="caption" text-anchor="middle">better parallelism</text><text x="290" y="421" class="caption" text-anchor="middle">3× on A100</text><text x="470" y="385" class="content" text-anchor="middle">FA3 (2024)</text><text x="470" y="405" class="caption" text-anchor="middle">Hopper asynchrony, FP8</text><text x="470" y="421" class="caption" text-anchor="middle">~740 TFLOPs H100</text><text x="650" y="385" class="content" text-anchor="middle">FA4 (2026)</text><text x="650" y="405" class="caption" text-anchor="middle">Blackwell 5-stage pipe</text><text x="650" y="421" class="caption" text-anchor="middle">inference-first</text><text x="810" y="385" class="content" text-anchor="middle">next</text><text x="810" y="405" class="caption" text-anchor="middle">backward + GQA</text><text x="810" y="421" class="caption" text-anchor="middle">varlen for training</text><text x="460" y="456" class="caption" text-anchor="middle">KV cache and Flash Attention are universal in 2026 — vLLM, SGLang, TensorRT-LLM, llama.cpp all assume both.</text><text x="460" y="504" class="caption" text-anchor="middle">Next frontier: PagedAttention (KV as virtual memory), prefix caching, speculative decoding.</text></svg>