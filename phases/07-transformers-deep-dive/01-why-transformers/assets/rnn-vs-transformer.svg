<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 460"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">serial depth: the only thing a GPU actually cares about</text><text x="40" y="80" class="label">RNN</text><text x="40" y="98" class="caption">depth = N</text><rect width="80" height="40" x="100" y="70" class="hot"/><text x="140" y="94" class="content" text-anchor="middle">h_1</text><line x1="180" x2="210" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="40" x="210" y="70" class="hot"/><text x="250" y="94" class="content" text-anchor="middle">h_2</text><line x1="290" x2="320" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="40" x="320" y="70" class="hot"/><text x="360" y="94" class="content" text-anchor="middle">h_3</text><line x1="400" x2="430" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="40" x="430" y="70" class="hot"/><text x="470" y="94" class="content" text-anchor="middle">h_4</text><line x1="510" x2="540" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="40" x="540" y="70" class="hot"/><text x="580" y="94" class="content" text-anchor="middle">h_5</text><line x1="620" x2="650" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="40" x="650" y="70" class="hot"/><text x="690" y="94" class="content" text-anchor="middle">h_6</text><line x1="730" x2="760" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="80" height="40" x="760" y="70" class="hot"/><text x="800" y="94" class="content" text-anchor="middle">h_7</text><text x="450" y="145" class="caption" text-anchor="middle">each box must wait for the one to its left — 7 steps of wall-clock</text><line x1="40" x2="860" y1="180" y2="180" stroke="#999" stroke-dasharray="4 3" stroke-width=".5"/><text x="40" y="230" class="label">Transformer</text><text x="40" y="248" class="caption">depth = 1</text><rect width="80" height="40" x="100" y="220" class="box"/><text x="140" y="244" class="content" text-anchor="middle">x_1</text><rect width="80" height="40" x="210" y="220" class="box"/><text x="250" y="244" class="content" text-anchor="middle">x_2</text><rect width="80" height="40" x="320" y="220" class="box"/><text x="360" y="244" class="content" text-anchor="middle">x_3</text><rect width="80" height="40" x="430" y="220" class="box"/><text x="470" y="244" class="content" text-anchor="middle">x_4</text><rect width="80" height="40" x="540" y="220" class="box"/><text x="580" y="244" class="content" text-anchor="middle">x_5</text><rect width="80" height="40" x="650" y="220" class="box"/><text x="690" y="244" class="content" text-anchor="middle">x_6</text><rect width="80" height="40" x="760" y="220" class="box"/><text x="800" y="244" class="content" text-anchor="middle">x_7</text><line x1="140" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width=".8" opacity=".4"/><line x1="250" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width=".8" opacity=".4"/><line x1="360" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width=".8" opacity=".4"/><line x1="470" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="580" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width=".8" opacity=".4"/><line x1="690" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width=".8" opacity=".4"/><line x1="800" x2="470" y1="260" y2="305" stroke="#c0392b" stroke-width=".8" opacity=".4"/><rect width="180" height="38" x="380" y="310" class="hot"/><text x="470" y="334" class="content" text-anchor="middle">softmax(QK^T / √d) V</text><text x="450" y="378" class="caption" text-anchor="middle">every x_i contributes to every output in a single matmul — 1 step of wall-clock</text><text x="450" y="440" class="caption" text-anchor="middle">same op count. different dependency graph. that is the entire thesis of Attention Is All You Need.</text></svg>