<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.mask{fill:#2c3e50;stroke:#1a1a1a;stroke-width:1.2}.mask-text{fill:#fff}.keep{fill:#e4eadb;stroke:#1a1a1a;stroke-width:1}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">masked language modeling — the 80/10/10 rule</text><text x="40" y="75" class="label">sentence</text><rect width="80" height="28" x="140" y="60" class="box"/><text x="180" y="79" class="content" text-anchor="middle">the</text><rect width="80" height="28" x="230" y="60" class="box"/><text x="270" y="79" class="content" text-anchor="middle">quick</text><rect width="80" height="28" x="320" y="60" class="box"/><text x="360" y="79" class="content" text-anchor="middle">brown</text><rect width="80" height="28" x="410" y="60" class="box"/><text x="450" y="79" class="content" text-anchor="middle">fox</text><rect width="80" height="28" x="500" y="60" class="box"/><text x="540" y="79" class="content" text-anchor="middle">jumps</text><rect width="80" height="28" x="590" y="60" class="box"/><text x="630" y="79" class="content" text-anchor="middle">over</text><rect width="80" height="28" x="680" y="60" class="box"/><text x="720" y="79" class="content" text-anchor="middle">the</text><rect width="80" height="28" x="770" y="60" class="box"/><text x="810" y="79" class="content" text-anchor="middle">dog</text><text x="40" y="143" class="label">after masking</text><rect width="80" height="28" x="140" y="128" class="box"/><text x="180" y="147" class="content" text-anchor="middle">the</text><rect width="80" height="28" x="230" y="128" class="mask"/><text x="270" y="147" class="content mask-text" text-anchor="middle">[MASK]</text><rect width="80" height="28" x="320" y="128" class="box"/><text x="360" y="147" class="content" text-anchor="middle">brown</text><rect width="80" height="28" x="410" y="128" class="mask"/><text x="450" y="147" class="content mask-text" text-anchor="middle">[MASK]</text><rect width="80" height="28" x="500" y="128" class="box"/><text x="540" y="147" class="content" text-anchor="middle">jumps</text><rect width="80" height="28" x="590" y="128" class="hot"/><text x="630" y="147" class="content" text-anchor="middle">cat</text><rect width="80" height="28" x="680" y="128" class="box"/><text x="720" y="147" class="content" text-anchor="middle">the</text><rect width="80" height="28" x="770" y="128" class="keep"/><text x="810" y="147" class="content" text-anchor="middle">dog</text><text x="140" y="180" class="caption">[MASK] = 80% path</text><text x="540" y="180" class="caption">random swap = 10% path (&quot;cat&quot; picked in place of &quot;over&quot;)</text><text x="770" y="180" class="caption">kept as-is = 10% path</text><line x1="450" x2="450" y1="195" y2="225" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="580" height="100" x="160" y="225" class="box"/><text x="450" y="252" class="label" text-anchor="middle">BERT encoder (bidirectional self-attention × 12 layers)</text><text x="450" y="272" class="caption" text-anchor="middle">every position sees every other. predicting &quot;quick&quot; uses &quot;brown fox jumps&quot;.</text><text x="450" y="295" class="caption" text-anchor="middle">modernbert 2024: RoPE + RMSNorm + GeGLU + alternating local/global attention + 8k context</text><text x="450" y="314" class="caption" text-anchor="middle">output: per-position 768-d vectors</text><line x1="450" x2="450" y1="325" y2="345" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="260" height="32" x="320" y="345" class="hot"/><text x="450" y="367" class="content" text-anchor="middle">MLM head: Linear(d_model → vocab)</text><line x1="450" x2="450" y1="377" y2="395" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="300" height="32" x="300" y="395" class="box"/><text x="450" y="417" class="content" text-anchor="middle">cross-entropy, only at selected positions</text><text x="450" y="460" class="caption" text-anchor="middle">no signal at unselected positions — IGNORE_INDEX is a PyTorch convention for this exact use</text></svg>