<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.cell-off{fill:#2c3e50}.cell-on{fill:#fff1d6;stroke:#c0392b;stroke-width:.5}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">causal mask — one triangle, half a decade of progress</text><text x="170" y="75" class="label" text-anchor="middle">unmasked (BERT-style)</text><g><g fill="#fff1d6" stroke="#c0392b" stroke-width=".5" transform="translate(90 90)"><rect width="26" height="26" x="0" y="0"/><rect width="26" height="26" x="26" y="0"/><rect width="26" height="26" x="52" y="0"/><rect width="26" height="26" x="78" y="0"/><rect width="26" height="26" x="104" y="0"/><rect width="26" height="26" x="130" y="0"/><rect width="26" height="26" x="0" y="26"/><rect width="26" height="26" x="26" y="26"/><rect width="26" height="26" x="52" y="26"/><rect width="26" height="26" x="78" y="26"/><rect width="26" height="26" x="104" y="26"/><rect width="26" height="26" x="130" y="26"/><rect width="26" height="26" x="0" y="52"/><rect width="26" height="26" x="26" y="52"/><rect width="26" height="26" x="52" y="52"/><rect width="26" height="26" x="78" y="52"/><rect width="26" height="26" x="104" y="52"/><rect width="26" height="26" x="130" y="52"/><rect width="26" height="26" x="0" y="78"/><rect width="26" height="26" x="26" y="78"/><rect width="26" height="26" x="52" y="78"/><rect width="26" height="26" x="78" y="78"/><rect width="26" height="26" x="104" y="78"/><rect width="26" height="26" x="130" y="78"/><rect width="26" height="26" x="0" y="104"/><rect width="26" height="26" x="26" y="104"/><rect width="26" height="26" x="52" y="104"/><rect width="26" height="26" x="78" y="104"/><rect width="26" height="26" x="104" y="104"/><rect width="26" height="26" x="130" y="104"/><rect width="26" height="26" x="0" y="130"/><rect width="26" height="26" x="26" y="130"/><rect width="26" height="26" x="52" y="130"/><rect width="26" height="26" x="78" y="130"/><rect width="26" height="26" x="104" y="130"/><rect width="26" height="26" x="130" y="130"/></g></g><text x="170" y="275" class="caption" text-anchor="middle">every position sees every position</text><text x="170" y="292" class="caption" text-anchor="middle">fits encoders (classification, embeddings)</text><text x="630" y="75" class="label" text-anchor="middle">causal (GPT-style)</text><g transform="translate(550 90)"><rect width="26" height="26" x="0" y="0" class="cell-on"/><rect width="26" height="26" x="26" y="0" class="cell-off"/><rect width="26" height="26" x="52" y="0" class="cell-off"/><rect width="26" height="26" x="78" y="0" class="cell-off"/><rect width="26" height="26" x="104" y="0" class="cell-off"/><rect width="26" height="26" x="130" y="0" class="cell-off"/><rect width="26" height="26" x="0" y="26" class="cell-on"/><rect width="26" height="26" x="26" y="26" class="cell-on"/><rect width="26" height="26" x="52" y="26" class="cell-off"/><rect width="26" height="26" x="78" y="26" class="cell-off"/><rect width="26" height="26" x="104" y="26" class="cell-off"/><rect width="26" height="26" x="130" y="26" class="cell-off"/><rect width="26" height="26" x="0" y="52" class="cell-on"/><rect width="26" height="26" x="26" y="52" class="cell-on"/><rect width="26" height="26" x="52" y="52" class="cell-on"/><rect width="26" height="26" x="78" y="52" class="cell-off"/><rect width="26" height="26" x="104" y="52" class="cell-off"/><rect width="26" height="26" x="130" y="52" class="cell-off"/><rect width="26" height="26" x="0" y="78" class="cell-on"/><rect width="26" height="26" x="26" y="78" class="cell-on"/><rect width="26" height="26" x="52" y="78" class="cell-on"/><rect width="26" height="26" x="78" y="78" class="cell-on"/><rect width="26" height="26" x="104" y="78" class="cell-off"/><rect width="26" height="26" x="130" y="78" class="cell-off"/><rect width="26" height="26" x="0" y="104" class="cell-on"/><rect width="26" height="26" x="26" y="104" class="cell-on"/><rect width="26" height="26" x="52" y="104" class="cell-on"/><rect width="26" height="26" x="78" y="104" class="cell-on"/><rect width="26" height="26" x="104" y="104" class="cell-on"/><rect width="26" height="26" x="130" y="104" class="cell-off"/><rect width="26" height="26" x="0" y="130" class="cell-on"/><rect width="26" height="26" x="26" y="130" class="cell-on"/><rect width="26" height="26" x="52" y="130" class="cell-on"/><rect width="26" height="26" x="78" y="130" class="cell-on"/><rect width="26" height="26" x="104" y="130" class="cell-on"/><rect width="26" height="26" x="130" y="130" class="cell-on"/></g><text x="630" y="275" class="caption" text-anchor="middle">position i attends to positions ≤ i only</text><text x="630" y="292" class="caption" text-anchor="middle">fits decoders (GPT, Llama, Claude)</text><rect width="720" height="140" x="90" y="330" class="box"/><text x="450" y="358" class="label" text-anchor="middle">what the mask enables</text><text x="130" y="395" class="content">training</text><text x="260" y="395" class="content">full N-token forward pass, N parallel next-token losses in one batch</text><text x="130" y="425" class="content">inference</text><text x="260" y="425" class="content">autoregressive: feed tokens 1..t, generate t+1, repeat. KV cache (lesson 12) avoids re-computation</text><text x="130" y="455" class="content">loss</text><text x="260" y="455" class="content">cross-entropy shift-by-one: predict t_{i+1} from t_{0..i}</text><text x="450" y="502" class="caption" text-anchor="middle">the mask is added before softmax; exp(-inf) = 0; masked positions get zero weight.</text></svg>