<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.dec,.enc{stroke:#1a1a1a;stroke-width:1}.enc{fill:#e7edd9}.dec{fill:#d7e3ee}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">encoder-decoder — cross-attention is the only pipe</text><rect width="260" height="32" x="60" y="70" class="hot"/><text x="190" y="92" class="content" text-anchor="middle">source tokens (N_src)</text><line x1="190" x2="190" y1="102" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="260" height="170" x="60" y="125" class="enc"/><text x="190" y="150" class="label" text-anchor="middle">encoder (bidirectional)</text><rect width="200" height="30" x="90" y="170" class="box"/><text x="190" y="190" class="content" text-anchor="middle">block 1: self-attn + FFN</text><rect width="200" height="30" x="90" y="208" class="box"/><text x="190" y="228" class="content" text-anchor="middle">block 2: self-attn + FFN</text><rect width="200" height="30" x="90" y="246" class="box"/><text x="190" y="266" class="content" text-anchor="middle">block L: self-attn + FFN</text><line x1="190" x2="190" y1="295" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="260" height="30" x="60" y="320" class="hot"/><text x="190" y="340" class="content" text-anchor="middle">encoder output (N_src, d)</text><rect width="260" height="32" x="580" y="70" class="hot"/><text x="710" y="92" class="content" text-anchor="middle">target tokens (shifted right)</text><line x1="710" x2="710" y1="102" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="340" height="275" x="500" y="125" class="dec"/><text x="670" y="150" class="label" text-anchor="middle">decoder (causal + cross-attn)</text><rect width="280" height="30" x="530" y="170" class="box"/><text x="670" y="190" class="content" text-anchor="middle">masked self-attention</text><rect width="280" height="30" x="530" y="208" class="hot"/><text x="670" y="228" class="content" text-anchor="middle">cross-attention ◀── enc_out</text><rect width="280" height="30" x="530" y="246" class="box"/><text x="670" y="266" class="content" text-anchor="middle">FFN</text><text x="670" y="303" class="caption" text-anchor="middle">(repeat L times)</text><rect width="280" height="30" x="530" y="315" class="box"/><text x="670" y="335" class="content" text-anchor="middle">linear → vocab</text><line x1="670" x2="670" y1="345" y2="368" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="30" x="560" y="368" class="hot"/><text x="670" y="388" class="content" text-anchor="middle">next-token logits</text><path fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)" d="M 320 335 Q 420 335 420 223 Q 420 223 530 223"/><text x="420" y="275" class="caption" text-anchor="middle">cross-attn:</text><text x="420" y="290" class="caption" text-anchor="middle">Q from decoder,</text><text x="420" y="305" class="caption" text-anchor="middle">K/V from encoder</text><rect width="360" height="70" x="60" y="430" class="box"/><text x="240" y="452" class="label" text-anchor="middle">T5 pretraining</text><text x="240" y="474" class="caption" text-anchor="middle">span corruption: replace spans with sentinels,</text><text x="240" y="490" class="caption" text-anchor="middle">decode only the spans</text><rect width="360" height="70" x="480" y="430" class="box"/><text x="660" y="452" class="label" text-anchor="middle">BART pretraining</text><text x="660" y="474" class="caption" text-anchor="middle">apply noise (mask, delete, infill, shuffle),</text><text x="660" y="490" class="caption" text-anchor="middle">decoder reconstructs the whole clean sequence</text></svg>