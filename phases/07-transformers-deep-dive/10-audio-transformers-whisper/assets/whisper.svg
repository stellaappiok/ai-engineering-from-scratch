<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.dec,.enc{stroke:#1a1a1a;stroke-width:1}.enc{fill:#e7edd9}.dec{fill:#d7e3ee}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">whisper — encoder-decoder for speech recognition</text><rect width="200" height="60" x="50" y="60" class="hot"/><path fill="none" stroke="#c0392b" stroke-width="1.5" d="M 55 90 Q 75 60, 95 90 T 135 90 T 175 90 T 215 90 T 245 90"/><text x="150" y="138" class="caption" text-anchor="middle">audio @ 16 kHz, 30 s window</text><line x1="250" x2="280" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="220" height="60" x="290" y="60" class="box"/><g transform="translate(295 65)"><rect width="15" height="50" x="0" y="0" fill="#f0e9d6"/><rect width="15" height="50" x="15" y="0" fill="#dbcc90"/><rect width="15" height="50" x="30" y="0" fill="#b49a53"/><rect width="15" height="50" x="45" y="0" fill="#8a723a"/><rect width="15" height="50" x="60" y="0" fill="#c4aa5d"/><rect width="15" height="50" x="75" y="0" fill="#dbcc90"/><rect width="15" height="50" x="90" y="0" fill="#9b814a"/><rect width="15" height="50" x="105" y="0" fill="#b49a53"/><rect width="15" height="50" x="120" y="0" fill="#c4aa5d"/><rect width="15" height="50" x="135" y="0" fill="#dbcc90"/><rect width="15" height="50" x="150" y="0" fill="#f0e9d6"/><rect width="15" height="50" x="165" y="0" fill="#b49a53"/><rect width="15" height="50" x="180" y="0" fill="#dbcc90"/><rect width="15" height="50" x="195" y="0" fill="#8a723a"/></g><text x="400" y="138" class="caption" text-anchor="middle">log-mel: 80 bins × 3000 frames</text><line x1="510" x2="540" y1="90" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="150" height="60" x="550" y="60" class="box"/><text x="625" y="85" class="content" text-anchor="middle">conv1d × 2</text><text x="625" y="105" class="content" text-anchor="middle">stride 2 → 1500</text><rect width="760" height="100" x="60" y="170" class="enc"/><text x="440" y="195" class="label" text-anchor="middle">encoder transformer (24 layers for large)</text><text x="440" y="220" class="caption" text-anchor="middle">self-attention + GELU FFN + sinusoidal positional encoding</text><text x="440" y="245" class="caption" text-anchor="middle">output: 1500 × 1280 hidden states</text><line x1="625" x2="625" y1="120" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="320" height="50" x="60" y="300" class="hot"/><text x="220" y="320" class="content" text-anchor="middle">&lt;|startoftranscript|&gt; &lt;|en|&gt; &lt;|transcribe|&gt;</text><text x="220" y="340" class="caption" text-anchor="middle">task tokens — 4-token prefix controls behavior</text><line x1="380" x2="410" y1="325" y2="325" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="400" height="120" x="420" y="295" class="dec"/><text x="620" y="317" class="label" text-anchor="middle">decoder transformer</text><text x="620" y="340" class="caption" text-anchor="middle">masked self-attn + cross-attn to encoder + FFN</text><text x="620" y="360" class="caption" text-anchor="middle">32 layers (large) or 4 layers (turbo)</text><text x="620" y="385" class="caption" text-anchor="middle">BPE vocabulary: GPT-2 + audio specials</text><text x="620" y="405" class="caption" text-anchor="middle">beam search width 5 at inference</text><path fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)" d="M 440 245 Q 500 245 500 360"/><text x="458" y="275" class="caption">cross-attn</text><line x1="620" x2="620" y1="415" y2="440" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="260" height="30" x="490" y="440" class="hot"/><text x="620" y="460" class="content" text-anchor="middle">&quot;attention is all you need&quot;</text><text x="450" y="502" class="caption" text-anchor="middle">encoder runs once. decoder runs autoregressively. task token decides transcribe vs translate.</text></svg>