<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 480"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}.axis{stroke:#888;stroke-width:.5}.wave{fill:none;stroke:#c0392b;stroke-width:1.5}</style></defs><text x="450" y="30" class="title" text-anchor="middle">three ways to tell attention about position</text><rect width="270" height="380" x="30" y="60" class="box"/><text x="165" y="85" class="label" text-anchor="middle">sinusoidal (2017)</text><text x="165" y="103" class="caption" text-anchor="middle">add sin/cos to the embedding</text><line x1="50" x2="280" y1="180" y2="180" class="axis"/><path d="M50 180 Q 75 130, 100 180 T 150 180 T 200 180 T 250 180 T 280 180" class="wave"/><text x="165" y="210" class="caption" text-anchor="middle">dim 0: fast sine</text><line x1="50" x2="280" y1="280" y2="280" class="axis"/><path d="M50 280 Q 115 220, 180 280 Q 245 340, 280 280" class="wave"/><text x="165" y="310" class="caption" text-anchor="middle">dim 64: slow sine</text><text x="165" y="360" class="content" text-anchor="middle">X&apos; = X + PE</text><text x="165" y="385" class="caption" text-anchor="middle">does not extrapolate beyond</text><text x="165" y="402" class="caption" text-anchor="middle">trained positions</text><text x="165" y="428" class="caption" text-anchor="middle">history only</text><rect width="270" height="380" x="315" y="60" class="hot"/><text x="450" y="85" class="label" text-anchor="middle">RoPE (2021) — dominant 2026</text><text x="450" y="103" class="caption" text-anchor="middle">rotate Q,K by position angle</text><circle cx="395" cy="200" r="55" fill="none" stroke="#1a1a1a" stroke-width="1"/><line x1="340" x2="450" y1="200" y2="200" class="axis"/><line x1="395" x2="395" y1="145" y2="255" class="axis"/><line x1="395" x2="440" y1="200" y2="163" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="395" y="285" class="caption" text-anchor="middle">q_m rotated by m·θ</text><circle cx="510" cy="200" r="55" fill="none" stroke="#1a1a1a" stroke-width="1"/><line x1="455" x2="565" y1="200" y2="200" class="axis"/><line x1="510" x2="510" y1="145" y2="255" class="axis"/><line x1="510" x2="475" y1="200" y2="155" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/><text x="510" y="285" class="caption" text-anchor="middle">k_n rotated by n·θ</text><text x="450" y="340" class="content" text-anchor="middle">&lt;q&apos;_m, k&apos;_n&gt; = f(m − n)</text><text x="450" y="365" class="caption" text-anchor="middle">relative distance, for free</text><text x="450" y="390" class="caption" text-anchor="middle">base knob extends context</text><text x="450" y="415" class="caption" text-anchor="middle">Llama, Qwen, Mistral,</text><text x="450" y="432" class="caption" text-anchor="middle">DeepSeek, Kimi</text><rect width="270" height="380" x="600" y="60" class="box"/><text x="735" y="85" class="label" text-anchor="middle">ALiBi (2022)</text><text x="735" y="103" class="caption" text-anchor="middle">linear bias in attention scores</text><g transform="translate(635 130)"><rect width="30" height="30" x="0" y="0" fill="#2c3e50"/><rect width="30" height="30" x="30" y="0" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="60" y="0" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="90" y="0" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="120" y="0" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="150" y="0" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="0" y="30" fill="#7f97b0"/><rect width="30" height="30" x="30" y="30" fill="#2c3e50"/><rect width="30" height="30" x="60" y="30" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="90" y="30" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="120" y="30" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="150" y="30" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="0" y="60" fill="#b9c7d4"/><rect width="30" height="30" x="30" y="60" fill="#7f97b0"/><rect width="30" height="30" x="60" y="60" fill="#2c3e50"/><rect width="30" height="30" x="90" y="60" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="120" y="60" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="150" y="60" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="0" y="90" fill="#dfe5ea"/><rect width="30" height="30" x="30" y="90" fill="#b9c7d4"/><rect width="30" height="30" x="60" y="90" fill="#7f97b0"/><rect width="30" height="30" x="90" y="90" fill="#2c3e50"/><rect width="30" height="30" x="120" y="90" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="150" y="90" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="0" y="120" fill="#eff3f5"/><rect width="30" height="30" x="30" y="120" fill="#dfe5ea"/><rect width="30" height="30" x="60" y="120" fill="#b9c7d4"/><rect width="30" height="30" x="90" y="120" fill="#7f97b0"/><rect width="30" height="30" x="120" y="120" fill="#2c3e50"/><rect width="30" height="30" x="150" y="120" fill="#fff" stroke="#ccc"/><rect width="30" height="30" x="0" y="150" fill="#f5f7f9"/><rect width="30" height="30" x="30" y="150" fill="#eff3f5"/><rect width="30" height="30" x="60" y="150" fill="#dfe5ea"/><rect width="30" height="30" x="90" y="150" fill="#b9c7d4"/><rect width="30" height="30" x="120" y="150" fill="#7f97b0"/><rect width="30" height="30" x="150" y="150" fill="#2c3e50"/></g><text x="735" y="335" class="content" text-anchor="middle">score -= m · |i − j|</text><text x="735" y="360" class="caption" text-anchor="middle">darker = smaller penalty</text><text x="735" y="385" class="caption" text-anchor="middle">extrapolates cleanly</text><text x="735" y="410" class="caption" text-anchor="middle">BLOOM, MPT,</text><text x="735" y="427" class="caption" text-anchor="middle">long-context ablations</text><text x="450" y="472" class="caption" text-anchor="middle">attention is permutation-invariant; pick the injection that matches your context length strategy</text></svg>