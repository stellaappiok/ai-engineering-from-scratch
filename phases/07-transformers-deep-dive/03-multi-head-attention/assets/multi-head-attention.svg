<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 520"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.head1{fill:#fbe9d7}.head1,.head2,.head3,.head4{stroke:#1a1a1a;stroke-width:1}.head2{fill:#d8e6f0}.head3{fill:#e4eadb}.head4{fill:#efdce2}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">multi-head attention — split, attend in parallel, concatenate</text><rect width="160" height="36" x="370" y="55" class="hot"/><text x="450" y="79" class="content" text-anchor="middle">X (N, d_model)</text><line x1="450" x2="450" y1="91" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="90" height="30" x="260" y="110" class="box"/><text x="305" y="130" class="content" text-anchor="middle">@ W_q</text><rect width="90" height="30" x="405" y="110" class="box"/><text x="450" y="130" class="content" text-anchor="middle">@ W_k</text><rect width="90" height="30" x="550" y="110" class="box"/><text x="595" y="130" class="content" text-anchor="middle">@ W_v</text><line x1="450" x2="305" y1="110" y2="140" stroke="#1a1a1a" stroke-width="1"/><line x1="450" x2="595" y1="110" y2="140" stroke="#1a1a1a" stroke-width="1"/><text x="100" y="175" class="label">split into 4 heads</text><text x="305" y="170" class="caption" text-anchor="middle">Q (N, d_model) → reshape (4, N, d_head)</text><rect width="45" height="26" x="210" y="180" class="head1"/><text x="232" y="198" class="content" text-anchor="middle">Q_1</text><rect width="45" height="26" x="260" y="180" class="head2"/><text x="282" y="198" class="content" text-anchor="middle">Q_2</text><rect width="45" height="26" x="310" y="180" class="head3"/><text x="332" y="198" class="content" text-anchor="middle">Q_3</text><rect width="45" height="26" x="360" y="180" class="head4"/><text x="382" y="198" class="content" text-anchor="middle">Q_4</text><rect width="45" height="26" x="440" y="180" class="head1"/><text x="462" y="198" class="content" text-anchor="middle">K_1</text><rect width="45" height="26" x="490" y="180" class="head2"/><text x="512" y="198" class="content" text-anchor="middle">K_2</text><rect width="45" height="26" x="540" y="180" class="head3"/><text x="562" y="198" class="content" text-anchor="middle">K_3</text><rect width="45" height="26" x="590" y="180" class="head4"/><text x="612" y="198" class="content" text-anchor="middle">K_4</text><rect width="45" height="26" x="670" y="180" class="head1"/><text x="692" y="198" class="content" text-anchor="middle">V_1</text><rect width="45" height="26" x="720" y="180" class="head2"/><text x="742" y="198" class="content" text-anchor="middle">V_2</text><rect width="45" height="26" x="770" y="180" class="head3"/><text x="792" y="198" class="content" text-anchor="middle">V_3</text><rect width="45" height="26" x="820" y="180" class="head4"/><text x="842" y="198" class="content" text-anchor="middle">V_4</text><text x="450" y="240" class="caption" text-anchor="middle">softmax(Q_h K_h^T / √d_head) V_h — batched matmul, one op</text><rect width="110" height="44" x="180" y="260" class="head1"/><text x="235" y="280" class="content" text-anchor="middle">head 1</text><text x="235" y="295" class="caption" text-anchor="middle">subject-verb</text><rect width="110" height="44" x="310" y="260" class="head2"/><text x="365" y="280" class="content" text-anchor="middle">head 2</text><text x="365" y="295" class="caption" text-anchor="middle">positional</text><rect width="110" height="44" x="440" y="260" class="head3"/><text x="495" y="280" class="content" text-anchor="middle">head 3</text><text x="495" y="295" class="caption" text-anchor="middle">copy / induction</text><rect width="110" height="44" x="570" y="260" class="head4"/><text x="625" y="280" class="content" text-anchor="middle">head 4</text><text x="625" y="295" class="caption" text-anchor="middle">named entities</text><line x1="235" x2="450" y1="304" y2="340" stroke="#1a1a1a" stroke-width="1"/><line x1="365" x2="450" y1="304" y2="340" stroke="#1a1a1a" stroke-width="1"/><line x1="495" x2="450" y1="304" y2="340" stroke="#1a1a1a" stroke-width="1"/><line x1="625" x2="450" y1="304" y2="340" stroke="#1a1a1a" stroke-width="1"/><rect width="240" height="36" x="330" y="340" class="hot"/><text x="450" y="362" class="content" text-anchor="middle">concat → (N, d_model)</text><line x1="450" x2="450" y1="376" y2="395" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="160" height="30" x="370" y="395" class="box"/><text x="450" y="415" class="content" text-anchor="middle">@ W_o (d_model, d_model)</text><line x1="450" x2="450" y1="425" y2="444" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="160" height="36" x="370" y="444" class="hot"/><text x="450" y="468" class="content" text-anchor="middle">output (N, d_model)</text><text x="450" y="503" class="caption" text-anchor="middle">W_o is where the heads mix. until W_o, every head lives in its own subspace.</text></svg>