<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 900 540"><defs><marker id="arrow" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box,.hot{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cls{fill:#2c3e50}.cls-text{fill:#fff}.patch{fill:#e7edd9;stroke:#1a1a1a;stroke-width:.6}.label{font-size:14px;font-weight:600;fill:#1a1a1a}.content{font-size:12px;fill:#333;font-family:&apos;Menlo&apos;,monospace}.caption{font-size:11px;fill:#555;font-style:italic}.title{font-size:16px;font-weight:700;fill:#1a1a1a}</style></defs><text x="450" y="30" class="title" text-anchor="middle">an image is a grid of patches — nothing else changes</text><text x="130" y="70" class="label" text-anchor="middle">image (224x224x3)</text><g><g class="patch" transform="translate(60 85)"><rect width="36" height="36" x="0" y="0"/><rect width="36" height="36" x="36" y="0"/><rect width="36" height="36" x="72" y="0"/><rect width="36" height="36" x="108" y="0"/><rect width="36" height="36" x="0" y="36"/><rect width="36" height="36" x="36" y="36"/><rect width="36" height="36" x="72" y="36"/><rect width="36" height="36" x="108" y="36"/><rect width="36" height="36" x="0" y="72"/><rect width="36" height="36" x="36" y="72"/><rect width="36" height="36" x="72" y="72"/><rect width="36" height="36" x="108" y="72"/><rect width="36" height="36" x="0" y="108"/><rect width="36" height="36" x="36" y="108"/><rect width="36" height="36" x="72" y="108"/><rect width="36" height="36" x="108" y="108"/></g></g><text x="130" y="250" class="caption" text-anchor="middle">sliced into a 14 × 14 grid of 16-pixel patches</text><line x1="230" x2="270" y1="160" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400" y="70" class="label" text-anchor="middle">flatten each patch → embed</text><g transform="translate(280 90)"><rect width="26" height="40" x="0" y="0" class="cls"/><text x="13" y="25" class="content cls-text" text-anchor="middle">CLS</text><rect width="26" height="40" x="30" y="0" class="patch"/><text x="43" y="25" class="content" text-anchor="middle">p_1</text><rect width="26" height="40" x="60" y="0" class="patch"/><text x="73" y="25" class="content" text-anchor="middle">p_2</text><rect width="26" height="40" x="90" y="0" class="patch"/><text x="103" y="25" class="content" text-anchor="middle">p_3</text><rect width="26" height="40" x="120" y="0" class="patch"/><text x="133" y="25" class="content" text-anchor="middle">p_4</text><text x="160" y="25" class="content">...</text><rect width="36" height="40" x="180" y="0" class="patch"/><text x="198" y="25" class="content" text-anchor="middle">p_196</text></g><text x="400" y="155" class="caption" text-anchor="middle">sequence of 197 d-dim tokens (CLS + 196 patches)</text><line x1="400" x2="400" y1="170" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="320" height="190" x="240" y="200" class="box"/><text x="400" y="225" class="label" text-anchor="middle">transformer encoder (same as BERT)</text><rect width="260" height="28" x="270" y="245" class="box"/><text x="400" y="264" class="content" text-anchor="middle">block 1: self-attn + MLP</text><rect width="260" height="28" x="270" y="280" class="box"/><text x="400" y="299" class="content" text-anchor="middle">block 2: self-attn + MLP</text><text x="400" y="325" class="caption" text-anchor="middle">× 12 for ViT-Base, × 24 for ViT-Large</text><rect width="260" height="32" x="270" y="340" class="hot"/><text x="400" y="361" class="content" text-anchor="middle">197 × d_model hidden states</text><line x1="400" x2="400" y1="390" y2="415" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="250" height="30" x="275" y="415" class="box"/><text x="400" y="435" class="content" text-anchor="middle">take CLS → Linear(d, num_classes)</text><line x1="400" x2="400" y1="445" y2="465" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/><rect width="190" height="30" x="305" y="465" class="hot"/><text x="400" y="485" class="content" text-anchor="middle">softmax → class</text><rect width="240" height="120" x="620" y="90" class="box"/><text x="740" y="112" class="label" text-anchor="middle">variants</text><text x="740" y="134" class="caption" text-anchor="middle">DeiT (2021): distill from CNN</text><text x="740" y="152" class="caption" text-anchor="middle">Swin: shifted-window local attn</text><text x="740" y="170" class="caption" text-anchor="middle">DINOv2: self-supervised</text><text x="740" y="188" class="caption" text-anchor="middle">SigLIP: + text encoder</text><text x="740" y="206" class="caption" text-anchor="middle">SAM 3: + mask decoder</text><rect width="240" height="160" x="620" y="230" class="box"/><text x="740" y="252" class="label" text-anchor="middle">scale table</text><text x="740" y="274" class="content" text-anchor="middle">ViT-B/16 86M</text><text x="740" y="294" class="content" text-anchor="middle">ViT-L/16 304M</text><text x="740" y="314" class="content" text-anchor="middle">ViT-H/14 632M</text><text x="740" y="334" class="content" text-anchor="middle">ViT-22B 22,000M</text><text x="740" y="362" class="caption" text-anchor="middle">data hunger: ≥ImageNet-21k</text><text x="740" y="378" class="caption" text-anchor="middle">needed to beat ResNet</text><text x="450" y="528" class="caption" text-anchor="middle">one architecture, many modalities — patchify the input and attention does the rest.</text></svg>