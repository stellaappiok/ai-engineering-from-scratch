<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.heavy{stroke-width:1.5}.layer{fill:#dfe9ff;stroke:#2c5ea9}.layer,.light{stroke-width:1.5}.heavy{fill:#ffe1e1;stroke:#b71c1c}.light{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Cold start mitigation — five layers on a 70B model</text><rect width="880" height="80" x="40" y="50" class="heavy"/><text x="480" y="72" class="head" text-anchor="middle">raw cold start — ~328 s total (5.5 min)</text><text x="120" y="95" class="step" text-anchor="middle">node provision</text><text x="120" y="112" class="small" text-anchor="middle">50 s</text><text x="320" y="95" class="step" text-anchor="middle">image pull</text><text x="320" y="112" class="small" text-anchor="middle">180 s</text><text x="520" y="95" class="step" text-anchor="middle">weights to HBM</text><text x="520" y="112" class="small" text-anchor="middle">75 s</text><text x="720" y="95" class="step" text-anchor="middle">engine init</text><text x="720" y="112" class="small" text-anchor="middle">20 s</text><text x="870" y="95" class="step" text-anchor="middle">1st fwd</text><text x="870" y="112" class="small" text-anchor="middle">3 s</text><rect width="280" height="110" x="40" y="150" class="layer"/><text x="180" y="172" class="head" text-anchor="middle">L1 — pre-seeded image</text><text x="180" y="192" class="step" text-anchor="middle">Bottlerocket dual volume</text><text x="180" y="210" class="small" text-anchor="middle">snapshot data volume with image</text><text x="180" y="226" class="small" text-anchor="middle">EC2NodeClass references snapshot</text><text x="180" y="244" class="small" text-anchor="middle">eliminates 180s image pull</text><rect width="280" height="110" x="340" y="150" class="layer"/><text x="480" y="172" class="head" text-anchor="middle">L2 — Model Streamer</text><text x="480" y="192" class="step" text-anchor="middle">Run:ai / native vLLM 2026</text><text x="480" y="210" class="small" text-anchor="middle">stream weights layer-by-layer</text><text x="480" y="226" class="small" text-anchor="middle">overlap I/O with compute setup</text><text x="480" y="244" class="small" text-anchor="middle">~2x weights-load speedup</text><rect width="280" height="110" x="640" y="150" class="layer"/><text x="780" y="172" class="head" text-anchor="middle">L3 — GPU snapshot</text><text x="780" y="192" class="step" text-anchor="middle">Modal checkpoints</text><text x="780" y="210" class="small" text-anchor="middle">serialize post-load HBM state</text><text x="780" y="226" class="small" text-anchor="middle">up to 10x faster restart</text><text x="780" y="244" class="small" text-anchor="middle">per-GPU-topology</text><rect width="280" height="110" x="40" y="280" class="layer"/><text x="180" y="302" class="head" text-anchor="middle">L4 — warm pool</text><text x="180" y="322" class="step" text-anchor="middle">min_workers ≥ 1</text><text x="180" y="340" class="small" text-anchor="middle">eliminates cold path entirely</text><text x="180" y="356" class="small" text-anchor="middle">cost: 24x7 GPU rental</text><text x="180" y="374" class="small" text-anchor="middle">mandatory at P99 TTFT &lt; 60s</text><rect width="280" height="110" x="340" y="280" class="layer"/><text x="480" y="302" class="head" text-anchor="middle">L5 — tiered loading</text><text x="480" y="322" class="step" text-anchor="middle">ServerlessLLM pattern</text><text x="480" y="340" class="small" text-anchor="middle">NVMe → DRAM → HBM pipeline</text><text x="480" y="356" class="small" text-anchor="middle">10-200x latency reduction</text><text x="480" y="374" class="small" text-anchor="middle">early production adoption</text><rect width="280" height="110" x="640" y="280" class="layer"/><text x="780" y="302" class="head" text-anchor="middle">bonus — live migration</text><text x="780" y="322" class="step" text-anchor="middle">move tokens, not cache</text><text x="780" y="340" class="small" text-anchor="middle">send input (KB) to warm dest</text><text x="780" y="356" class="small" text-anchor="middle">recompute KV on destination</text><text x="780" y="374" class="small" text-anchor="middle">useful for disaggregated</text><rect width="880" height="100" x="40" y="410" class="light"/><text x="480" y="432" class="head" text-anchor="middle">stack result — ~15 s with L1+L2+L3 or full warm via L4</text><text x="480" y="454" class="step" text-anchor="middle">Modal published: 2-4 s · Baseten default: 5-10 s, sub-s with pre-warming</text><text x="480" y="476" class="small" text-anchor="middle">the right answer depends on SLA shape and warm-pool budget</text><text x="480" y="494" class="caption" text-anchor="middle">measure before optimizing — never add layers without data</text></svg>