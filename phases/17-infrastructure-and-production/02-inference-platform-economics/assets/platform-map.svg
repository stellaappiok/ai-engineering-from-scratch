<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.api,.box,.gpu,.silicon{stroke-width:1.5}.silicon{fill:#ffe1e1;stroke:#c0392b}.gpu{fill:#dfe9ff;stroke:#2c5ea9}.api{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Inference platform map — three segments, six vendors</text><rect width="280" height="460" x="40" y="50" class="box"/><text x="180" y="72" class="head" text-anchor="middle">custom silicon</text><rect width="240" height="60" x="60" y="90" class="silicon"/><text x="180" y="110" class="step" text-anchor="middle">Groq (LPU)</text><text x="180" y="128" class="small" text-anchor="middle">voice agents, real-time translation</text><text x="180" y="144" class="small" text-anchor="middle">5-10x faster decode than GPU</text><rect width="240" height="60" x="60" y="160" class="silicon"/><text x="180" y="180" class="step" text-anchor="middle">Cerebras (WSE)</text><text x="180" y="198" class="small" text-anchor="middle">wafer-scale engine</text><text x="180" y="214" class="small" text-anchor="middle">very large context decode</text><rect width="240" height="60" x="60" y="230" class="silicon"/><text x="180" y="250" class="step" text-anchor="middle">SambaNova (RDU)</text><text x="180" y="268" class="small" text-anchor="middle">reconfigurable dataflow</text><text x="180" y="284" class="small" text-anchor="middle">enterprise regulated</text><text x="180" y="330" class="caption" text-anchor="middle">pay premium per-token</text><text x="180" y="346" class="caption" text-anchor="middle">win on latency SLAs</text><rect width="280" height="460" x="340" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">GPU platforms</text><rect width="240" height="60" x="360" y="90" class="gpu"/><text x="480" y="110" class="step" text-anchor="middle">Fireworks — latency</text><text x="480" y="128" class="small" text-anchor="middle">FireAttention, $4B valn</text><text x="480" y="144" class="small" text-anchor="middle">$1/hr GPU raise May 2026</text><rect width="240" height="60" x="360" y="160" class="gpu"/><text x="480" y="180" class="step" text-anchor="middle">Together — breadth</text><text x="480" y="198" class="small" text-anchor="middle">200+ models, 50-70% under Replicate</text><text x="480" y="214" class="small" text-anchor="middle">&quot;AI Native Cloud&quot;</text><rect width="240" height="60" x="360" y="230" class="gpu"/><text x="480" y="250" class="step" text-anchor="middle">Baseten — enterprise</text><text x="480" y="268" class="small" text-anchor="middle">$5B valn Jan 2026, SOC2+HIPAA</text><text x="480" y="284" class="small" text-anchor="middle">Truss, per-min billing</text><rect width="240" height="60" x="360" y="300" class="gpu"/><text x="480" y="320" class="step" text-anchor="middle">Modal — Python DX</text><text x="480" y="338" class="small" text-anchor="middle">$1.1B valn, per-sec billing</text><text x="480" y="354" class="small" text-anchor="middle">infrastructure-as-Python</text><rect width="240" height="60" x="360" y="370" class="gpu"/><text x="480" y="390" class="step" text-anchor="middle">Anyscale — Ray-native</text><text x="480" y="408" class="small" text-anchor="middle">RayTurbo inference engine</text><text x="480" y="424" class="small" text-anchor="middle">managed Ray clusters</text><rect width="280" height="460" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">API-first marketplaces</text><rect width="240" height="60" x="660" y="90" class="api"/><text x="780" y="110" class="step" text-anchor="middle">Replicate</text><text x="780" y="128" class="small" text-anchor="middle">pay-per-prediction</text><text x="780" y="144" class="small" text-anchor="middle">multimodal breadth default</text><rect width="240" height="60" x="660" y="160" class="api"/><text x="780" y="180" class="step" text-anchor="middle">DeepInfra</text><text x="780" y="198" class="small" text-anchor="middle">aggressive per-token pricing</text><text x="780" y="214" class="small" text-anchor="middle">hobbyist and prototyping</text><rect width="240" height="60" x="660" y="230" class="api"/><text x="780" y="250" class="step" text-anchor="middle">OpenRouter</text><text x="780" y="268" class="small" text-anchor="middle">unified API over 100+ models</text><text x="780" y="284" class="small" text-anchor="middle">single credit for many providers</text><rect width="240" height="60" x="660" y="300" class="api"/><text x="780" y="320" class="step" text-anchor="middle">Fal</text><text x="780" y="338" class="small" text-anchor="middle">image / video focus</text><text x="780" y="354" class="small" text-anchor="middle">serverless per-call</text><text x="780" y="420" class="caption" text-anchor="middle">time-to-first-call optimized</text><text x="780" y="436" class="caption" text-anchor="middle">cheapest for bursty and small-scale</text><rect width="880" height="30" x="40" y="520" class="box"/><text x="480" y="538" class="step" text-anchor="middle">rule: per-minute beats per-token above ~30% sustained utilization of one GPU</text></svg>