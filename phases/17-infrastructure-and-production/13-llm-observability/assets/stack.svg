<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box,.dev{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.dev{fill:#dfe9ff;stroke:#2c5ea9}.gw{fill:#fff1d6;stroke:#c0392b}.gw,.otel,.scale{stroke-width:1.5}.scale{fill:#e6f4ea;stroke:#2e7d32}.otel{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">LLM observability — two categories, one OpenTelemetry glue</text><rect width="280" height="210" x="40" y="50" class="dev"/><text x="180" y="72" class="head" text-anchor="middle">development platforms</text><text x="180" y="92" class="small" text-anchor="middle">traces + evals + prompts + sessions</text><rect width="240" height="35" x="60" y="110" class="box"/><text x="180" y="132" class="step" text-anchor="middle">LangSmith ($39/user/mo)</text><rect width="240" height="35" x="60" y="150" class="box"/><text x="180" y="172" class="step" text-anchor="middle">Langfuse (MIT + 50K free)</text><rect width="240" height="35" x="60" y="190" class="box"/><text x="180" y="212" class="step" text-anchor="middle">Opik (Apache 2.0)</text><text x="180" y="245" class="caption" text-anchor="middle">bundled — best for dev loops</text><rect width="280" height="210" x="340" y="50" class="gw"/><text x="480" y="72" class="head" text-anchor="middle">gateway / telemetry</text><text x="480" y="92" class="small" text-anchor="middle">traces + metrics + gateway features</text><rect width="240" height="35" x="360" y="110" class="box"/><text x="480" y="132" class="step" text-anchor="middle">Helicone (proxy, MIT)</text><rect width="240" height="35" x="360" y="150" class="box"/><text x="480" y="172" class="step" text-anchor="middle">SigNoz (Apache 2.0)</text><rect width="240" height="35" x="360" y="190" class="box"/><text x="480" y="212" class="step" text-anchor="middle">OpenLLMetry (OSS)</text><text x="480" y="245" class="caption" text-anchor="middle">minimalist — pairs with dev platform</text><rect width="280" height="210" x="640" y="50" class="scale"/><text x="780" y="72" class="head" text-anchor="middle">scale / dev / lake</text><text x="780" y="92" class="small" text-anchor="middle">RAG drift, zero-copy, long-term</text><rect width="240" height="35" x="660" y="110" class="box"/><text x="780" y="132" class="step" text-anchor="middle">Phoenix (Elastic L2.0)</text><rect width="240" height="35" x="660" y="150" class="box"/><text x="780" y="172" class="step" text-anchor="middle">Arize AX (zero-copy)</text><rect width="240" height="35" x="660" y="190" class="box"/><text x="780" y="212" class="step" text-anchor="middle">TruLens (OSS evals)</text><text x="780" y="245" class="caption" text-anchor="middle">RAG + long-term analytics</text><rect width="880" height="100" x="40" y="280" class="otel"/><text x="480" y="302" class="head" text-anchor="middle">OpenTelemetry GenAI conventions — the glue</text><text x="480" y="325" class="step" text-anchor="middle">gen_ai.system · gen_ai.request.model · gen_ai.usage.input_tokens · gen_ai.usage.output_tokens</text><text x="480" y="345" class="small" text-anchor="middle">2025 shipped. 2026 production pattern:</text><text x="480" y="363" class="step" text-anchor="middle">gateway (Helicone) + eval (Phoenix) + lake (Iceberg / Arize AX)</text><rect width="880" height="100" x="40" y="400" class="box"/><text x="480" y="422" class="head" text-anchor="middle">sampling at scale — you can&apos;t keep 1M traces/day raw</text><text x="480" y="444" class="step" text-anchor="middle">keep 100% errors · keep 100% high-cost · sample 5% success</text><text x="480" y="462" class="step" text-anchor="middle">aggregates always · raw for long-tail debugging</text><text x="480" y="482" class="caption" text-anchor="middle">Arize AX claims ~100x cheaper than monolithic APM at scale — zero-copy on your own data lake</text></svg>