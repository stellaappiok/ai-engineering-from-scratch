<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 480"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.control{fill:#dfe9ff;stroke:#2c5ea9}.control,.obs,.safety,.target{stroke-width:1.5}.target{fill:#fff1d6;stroke:#c0392b}.safety{fill:#e6f4ea;stroke:#2e7d32}.obs{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">chaos engineering for LLMs — four planes + feedback loop</text><rect width="220" height="180" x="40" y="50" class="control"/><text x="150" y="72" class="head" text-anchor="middle">control plane</text><text x="150" y="92" class="step" text-anchor="middle">experiment scheduler</text><text x="60" y="116" class="small">· LitmusChaos workflow</text><text x="60" y="134" class="small">· Chaos Mesh CRDs</text><text x="60" y="152" class="small">· Harness UI</text><text x="60" y="170" class="small">· AWS FIS / Azure Chaos Studio</text><text x="150" y="200" class="caption" text-anchor="middle">schedules, parameters, cadence</text><rect width="220" height="180" x="280" y="50" class="target"/><text x="390" y="72" class="head" text-anchor="middle">target plane</text><text x="390" y="92" class="step" text-anchor="middle">services + infra + data</text><text x="300" y="116" class="small">· pods, nodes, LB</text><text x="300" y="134" class="small">· data stores, vector DB</text><text x="300" y="152" class="small">· LLM gateways</text><text x="300" y="170" class="small">· upstream providers</text><rect width="220" height="180" x="520" y="50" class="safety"/><text x="630" y="72" class="head" text-anchor="middle">safety plane</text><text x="630" y="92" class="step" text-anchor="middle">guards + abort</text><text x="540" y="116" class="small">· burn-rate gate (&gt; 2x budget)</text><text x="540" y="134" class="small">· blast-radius cap</text><text x="540" y="152" class="small">· suppression windows</text><text x="540" y="170" class="small">· trace-ID tagging</text><text x="540" y="188" class="small">· kill switch</text><rect width="160" height="180" x="760" y="50" class="obs"/><text x="840" y="72" class="head" text-anchor="middle">observability</text><text x="840" y="92" class="step" text-anchor="middle">traces + metrics</text><text x="780" y="116" class="small">· distinguish</text><text x="780" y="134" class="small">chaos-induced from</text><text x="780" y="152" class="small">natural failures</text><text x="780" y="170" class="small">· trace-ID correlation</text><rect width="880" height="100" x="40" y="260" class="box"/><text x="480" y="282" class="head" text-anchor="middle">five LLM-specific experiments</text><text x="60" y="308" class="step">1. memory overload (KV preemption storm)</text><text x="60" y="326" class="step">2. network failure (cut gateway ↔ provider)</text><text x="60" y="344" class="step">3. provider outage (100% 429)</text><text x="500" y="308" class="step">4. malformed prompt (tokenizer bomb)</text><text x="500" y="326" class="step">5. KV eviction storm (force cascading re-prefill)</text><rect width="880" height="80" x="40" y="380" class="box"/><text x="480" y="402" class="head" text-anchor="middle">cadence</text><text x="480" y="424" class="step" text-anchor="middle">weekly canary + SLO review · monthly game day + postmortem · quarterly audit + dep map</text><text x="480" y="444" class="caption" text-anchor="middle">without SLI/SLO + observability + rollback + runbooks + on-call, don&apos;t run in prod</text></svg>