<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><marker id="arr" markerHeight="6" markerWidth="6" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">EAGLE-3 speculative decoding — alpha is the only metric</text><rect width="420" height="240" x="40" y="50" class="box"/><text x="250" y="72" class="head" text-anchor="middle">the flow (K=5)</text><rect width="120" height="40" x="60" y="90" class="cool"/><text x="120" y="114" class="step" text-anchor="middle">draft head</text><rect width="240" height="40" x="200" y="90" class="cold"/><text x="320" y="114" class="step" text-anchor="middle">5 candidate tokens</text><line x1="180" x2="198" y1="110" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="240" height="40" x="200" y="140" class="hot"/><text x="320" y="164" class="step" text-anchor="middle">target verify (1 forward)</text><line x1="320" x2="320" y1="132" y2="139" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="240" height="40" x="200" y="190" class="cool"/><text x="320" y="214" class="step" text-anchor="middle">K * alpha accepted</text><line x1="320" x2="320" y1="182" y2="189" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/><rect width="240" height="40" x="200" y="240" fill="#eee" stroke="#888" class="old"/><text x="320" y="264" class="step" text-anchor="middle">rest rerolled (second pass)</text><rect width="440" height="240" x="480" y="50" class="box"/><text x="700" y="72" class="head" text-anchor="middle">alpha by workload</text><rect width="400" height="30" x="500" y="90" class="cool"/><text x="510" y="110" class="small">general chat + EAGLE-3 trained on ShareGPT : alpha 0.60 - 0.80</text><rect width="400" height="30" x="500" y="125" class="cold"/><text x="510" y="145" class="small">specialized (code, legal, medical) : alpha 0.40 - 0.60</text><rect width="400" height="30" x="500" y="160" class="hot"/><text x="510" y="180" class="small">domain mismatch without retraining draft : alpha 0.30 - 0.45</text><rect width="400" height="30" x="500" y="195" class="dsk"/><text x="510" y="215" class="small">classic draft-model (Llama 3.2 1B for 70B) : alpha 0.30 - 0.50</text><rect width="400" height="50" x="500" y="230" class="box"/><text x="510" y="250" class="small">break-even alpha at 256 concurrent : ~0.55</text><text x="510" y="268" class="small">below that : P99 tail gets worse even if mean improves</text><rect width="880" height="100" x="40" y="310" class="box"/><text x="480" y="332" class="head" text-anchor="middle">generations</text><text x="60" y="356" class="step">classic draft-model</text><text x="60" y="374" class="small">two models loaded; K forwards per target; alpha 0.3-0.5</text><text x="280" y="356" class="step">EAGLE-1</text><text x="280" y="374" class="small">draft head on last target layer; alpha ~0.5-0.6</text><text x="500" y="356" class="step">EAGLE-2</text><text x="500" y="374" class="small">tree drafts, adaptive K; alpha ~0.6-0.7</text><text x="720" y="356" class="step">EAGLE-3 (2025-2026)</text><text x="720" y="374" class="small">multi-layer draft head; alpha ~0.6-0.8</text><text x="60" y="396" class="caption">all EAGLE variants train fast and add small parameter overhead to the target</text><rect width="880" height="110" x="40" y="430" class="hot"/><text x="480" y="452" class="head" text-anchor="middle">production checklist</text><text x="60" y="474" class="small">1. baseline target model plain : TTFT, ITL, throughput at target concurrency</text><text x="60" y="490" class="small">2. enable speculative_config with EAGLE-3 draft ; rerun benchmark</text><text x="60" y="506" class="small">3. log alpha (vLLM V1 reports accepted tokens per request) ; gate on alpha &gt;= 0.55</text><text x="60" y="522" class="small">4. watch P99 ITL, not P50 — rejected-draft two-pass drives tail</text><text x="60" y="538" class="small">5. vLLM v0.18.0 : draft-model spec decode incompatible with chunked prefill ; N-gram in V1 is the exception</text></svg>