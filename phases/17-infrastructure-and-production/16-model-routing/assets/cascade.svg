<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.cheap{fill:#e6f4ea;stroke:#2e7d32}.cheap,.front,.signal{stroke-width:1.5}.front{fill:#fff1d6;stroke:#c0392b}.signal{fill:#dfe9ff;stroke:#2c5ea9}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style><marker id="arr" markerHeight="5" markerWidth="5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="480" y="24" class="title" text-anchor="middle">model routing — four signals, three patterns</text><rect width="280" height="220" x="40" y="50" class="signal"/><text x="180" y="72" class="head" text-anchor="middle">signals</text><rect width="240" height="35" x="60" y="90" class="box"/><text x="180" y="112" class="step" text-anchor="middle">1. task classification</text><rect width="240" height="35" x="60" y="130" class="box"/><text x="180" y="152" class="step" text-anchor="middle">2. prompt length</text><rect width="240" height="35" x="60" y="170" class="box"/><text x="180" y="192" class="step" text-anchor="middle">3. embedding to known-hard</text><rect width="240" height="35" x="60" y="210" class="box"/><text x="180" y="232" class="step" text-anchor="middle">4. self-confidence (logprobs)</text><text x="180" y="258" class="caption" text-anchor="middle">combine all four; each alone misses</text><rect width="280" height="220" x="340" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">pattern: CASCADE (cheap-first)</text><rect width="240" height="45" x="360" y="90" class="cheap"/><text x="480" y="115" class="step" text-anchor="middle">cheap model (Haiku-class)</text><text x="480" y="130" class="small" text-anchor="middle">$0.25/M input, $1/M output</text><rect width="240" height="35" x="360" y="150" class="signal"/><text x="480" y="172" class="step" text-anchor="middle">confidence check</text><rect width="240" height="60" x="360" y="200" class="front"/><text x="480" y="222" class="step" text-anchor="middle">frontier only if low-confidence</text><text x="480" y="240" class="small" text-anchor="middle">~10% escalated in mixed traffic</text><text x="480" y="254" class="small" text-anchor="middle">~2x latency on escalated</text><rect width="280" height="220" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">pattern: PRE_ROUTE</text><text x="780" y="94" class="small" text-anchor="middle">classifier up front (5-10ms)</text><rect width="240" height="45" x="660" y="110" class="cheap"/><text x="780" y="135" class="step" text-anchor="middle">cheap for simple</text><rect width="240" height="45" x="660" y="170" class="front"/><text x="780" y="195" class="step" text-anchor="middle">frontier for hard</text><text x="780" y="230" class="caption" text-anchor="middle">fastest overall, quality floor depends on classifier accuracy</text><rect width="880" height="100" x="40" y="290" class="box"/><text x="480" y="312" class="head" text-anchor="middle">the 2026 price curve</text><text x="480" y="334" class="step" text-anchor="middle">GPT-4-level quality: $20/M (late 2022) → $0.40/M (2026) ≈ 50x cheaper</text><text x="480" y="352" class="step" text-anchor="middle">aggregate LLM price drop: ~10x per year, mostly serving efficiency (Phase 17 · 04-09)</text><text x="480" y="372" class="caption" text-anchor="middle">routing captures those gains at the app layer</text><rect width="880" height="80" x="40" y="410" class="box"/><text x="480" y="432" class="head" text-anchor="middle">drift is the real risk</text><text x="480" y="454" class="step" text-anchor="middle">monitor: thumbs up/down per route · LLM-judge sample per route · escalation rate · refusal rate</text><text x="480" y="474" class="caption" text-anchor="middle">cheap-model creep is silent until a competitor benchmark surfaces it</text></svg>