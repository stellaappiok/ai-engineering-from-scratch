<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.feat{stroke-width:1.5}.gw{fill:#dfe9ff;stroke:#2c5ea9}.gw,.scale{stroke-width:1.5}.feat{fill:#e6f4ea;stroke:#2e7d32}.scale{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">AI gateways — seven features, four 2026 leaders</text><rect width="280" height="220" x="40" y="50" class="feat"/><text x="180" y="72" class="head" text-anchor="middle">core features</text><text x="60" y="96" class="step">· provider routing</text><text x="60" y="116" class="step">· fallback chains</text><text x="60" y="136" class="step">· retries (backoff)</text><text x="60" y="156" class="step">· rate limits (per-tenant)</text><text x="60" y="176" class="step">· secret references</text><text x="60" y="196" class="step">· observability (OTel)</text><text x="60" y="216" class="step">· guardrails (PII, jailbreak)</text><text x="180" y="250" class="caption" text-anchor="middle">all seven mandatory at enterprise scale</text><rect width="280" height="220" x="340" y="50" class="gw"/><text x="480" y="72" class="head" text-anchor="middle">2026 gateways</text><rect width="240" height="35" x="360" y="90" class="box"/><text x="480" y="112" class="step" text-anchor="middle">LiteLLM — MIT, Python</text><rect width="240" height="35" x="360" y="132" class="box"/><text x="480" y="154" class="step" text-anchor="middle">Portkey — Apache 2.0, guardrails</text><rect width="240" height="35" x="360" y="174" class="box"/><text x="480" y="196" class="step" text-anchor="middle">Kong AI Gateway — enterprise</text><rect width="240" height="35" x="360" y="216" class="box"/><text x="480" y="238" class="step" text-anchor="middle">Cloudflare / Vercel — edge managed</text><rect width="280" height="220" x="640" y="50" class="scale"/><text x="780" y="72" class="head" text-anchor="middle">scale + overhead (Kong benchmark)</text><text x="660" y="96" class="step">Kong: ~5 ms overhead (baseline)</text><text x="660" y="116" class="step">LiteLLM: ~10 ms overhead (breaks &gt;2K RPS)</text><text x="660" y="136" class="step">Portkey: ~30 ms overhead</text><text x="660" y="156" class="step">Cloudflare: ~2 ms (edge)</text><text x="660" y="190" class="small">Kong 228% faster than Portkey</text><text x="660" y="208" class="small">Kong 859% faster than LiteLLM</text><text x="660" y="226" class="small">on same 12 CPUs</text><text x="780" y="258" class="caption" text-anchor="middle">LiteLLM for dev, Kong for prod scale</text><rect width="440" height="130" x="40" y="290" class="box"/><text x="260" y="312" class="head" text-anchor="middle">data residency drives self-host</text><text x="60" y="338" class="step">healthcare / finance → self-hosted</text><text x="60" y="356" class="step">LiteLLM OSS, Portkey OSS, Kong OSS</text><text x="60" y="374" class="step">consumer → managed edge</text><text x="60" y="392" class="step">Cloudflare AI Gateway, Vercel AI</text><text x="60" y="410" class="caption">Portkey Apache 2.0 March 2026 moved middle tier</text><rect width="420" height="130" x="500" y="290" class="box"/><text x="710" y="312" class="head" text-anchor="middle">compose with Phase 17 · 13 + 16</text><text x="520" y="338" class="step">gateway (19) + observability (13) + routing (16)</text><text x="520" y="356" class="step">often the same tool:</text><text x="520" y="374" class="step">Portkey = gateway + observability + guardrails</text><text x="520" y="392" class="step">Helicone = gateway + observability</text><text x="520" y="410" class="caption">pick one, or wire three with OpenTelemetry</text><rect width="880" height="50" x="40" y="440" class="box"/><text x="480" y="462" class="step" text-anchor="middle">fallback arithmetic — OpenAI 3% × Anthropic 2% = 0.06% both-fail</text><text x="480" y="480" class="caption" text-anchor="middle">three-provider chain effectively 99.997% availability</text></svg>