<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.bad{fill:#ffe1e1;stroke:#b71c1c}.bad,.pattern,.tool{stroke-width:1.5}.tool{fill:#dfe9ff;stroke:#2c5ea9}.pattern{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">load testing LLM APIs — two traps, four patterns, five tools</text><rect width="440" height="110" x="40" y="50" class="bad"/><text x="260" y="72" class="head" text-anchor="middle">GIL trap (Locust stock)</text><text x="60" y="96" class="small">· client tokenizes under Python GIL</text><text x="60" y="114" class="small">· competes with request generation</text><text x="60" y="132" class="small">· tokenization backlog inflates reported ITL</text><text x="260" y="152" class="caption" text-anchor="middle">your client is the bottleneck, not the server</text><rect width="420" height="110" x="500" y="50" class="bad"/><text x="710" y="72" class="head" text-anchor="middle">prompt-uniformity trap</text><text x="520" y="96" class="small">· loop with one prompt = 100% prefix cache</text><text x="520" y="114" class="small">· request coalescing serves &quot;N concurrent&quot; as 1</text><text x="520" y="132" class="small">· throughput looks great, production falls over</text><text x="710" y="152" class="caption" text-anchor="middle">fix: LLMPerf --mean + --stddev input tokens</text><rect width="440" height="160" x="40" y="180" class="tool"/><text x="260" y="202" class="head" text-anchor="middle">2026 tools</text><text x="60" y="226" class="step">LLMPerf — Anyscale, Rust tokenizers, streaming</text><text x="60" y="244" class="step">NVIDIA GenAI-Perf — Triton-backed reference</text><text x="60" y="262" class="step">LLM-Locust — Locust + GIL fix</text><text x="60" y="280" class="step">guidellm — large-scale synthetic</text><text x="60" y="298" class="step">k6 v2026.1.0 + Operator 1.0 GA</text><text x="60" y="316" class="small">streaming-aware, CRD-native, best CI gate</text><rect width="420" height="160" x="500" y="180" class="pattern"/><text x="710" y="202" class="head" text-anchor="middle">four load patterns</text><text x="520" y="226" class="step">steady — 30-60 min constant RPS</text><text x="520" y="244" class="small">catches baseline regressions</text><text x="520" y="264" class="step">ramp — 0 to target over 15 min</text><text x="520" y="280" class="small">catches capacity breakpoint + warm-up</text><text x="520" y="300" class="step">spike — 3-10x sudden burst</text><text x="520" y="316" class="small">catches autoscaling + cold-start impact</text><text x="520" y="328" class="step">soak — 4-8h steady</text><rect width="880" height="130" x="40" y="360" class="box"/><text x="480" y="382" class="head" text-anchor="middle">CI gate recipe</text><text x="480" y="406" class="step" text-anchor="middle">k6 on PR with 30-50 iterations at baseline RPS</text><text x="480" y="426" class="step" text-anchor="middle">gate: P50 / P95 TTFT, 5xx &lt; 5%, TPOT threshold</text><text x="480" y="446" class="caption" text-anchor="middle">break the build on breach — treat performance as a compile error</text><text x="480" y="468" class="small" text-anchor="middle">GenAI-Perf ITL excludes TTFT · LLMPerf includes it — same server, different TPOT</text></svg>