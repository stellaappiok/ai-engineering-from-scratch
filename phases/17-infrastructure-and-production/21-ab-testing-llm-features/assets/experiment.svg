<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 480"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.ab,.box{stroke-width:1.5}.eval{fill:#dfe9ff;stroke:#2c5ea9}.eval,.method{stroke-width:1.5}.ab{fill:#fff1d6;stroke:#c0392b}.method{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">A/B testing LLM features — evals + online, not vibes</text><rect width="440" height="120" x="40" y="50" class="eval"/><text x="260" y="72" class="head" text-anchor="middle">evals (offline, labeled)</text><text x="260" y="92" class="step" text-anchor="middle">&quot;can the model do the job?&quot;</text><text x="60" y="116" class="small">· human-labeled or LLM-as-judge</text><text x="60" y="134" class="small">· fixed distribution (not user traffic)</text><text x="60" y="152" class="small">· catches regressions before exposure</text><rect width="440" height="120" x="500" y="50" class="ab"/><text x="720" y="72" class="head" text-anchor="middle">A/B tests (online, random)</text><text x="720" y="92" class="step" text-anchor="middle">&quot;do users care?&quot;</text><text x="520" y="116" class="small">· live traffic, randomized assignment</text><text x="520" y="134" class="small">· user-level metric that matters (retention, CTR)</text><text x="520" y="152" class="small">· confirms product impact</text><rect width="280" height="120" x="40" y="190" class="method"/><text x="180" y="212" class="head" text-anchor="middle">what to test</text><text x="60" y="236" class="step">· prompt wording</text><text x="60" y="254" class="step">· model selection (GPT vs OSS)</text><text x="60" y="272" class="step">· generation params (temp, top-p)</text><text x="60" y="290" class="step">· reward functions / routers</text><rect width="280" height="120" x="340" y="190" class="method"/><text x="480" y="212" class="head" text-anchor="middle">method rigor</text><text x="360" y="236" class="step">· CUPED (30-70% variance cut)</text><text x="360" y="254" class="step">· sequential (always-valid peeks)</text><text x="360" y="272" class="step">· Bonferroni / Benjamini-Hochberg</text><text x="360" y="290" class="step">· SRM check (sample ratio)</text><rect width="280" height="120" x="640" y="190" class="method"/><text x="780" y="212" class="head" text-anchor="middle">platforms</text><text x="660" y="236" class="step">Statsig (OpenAI-owned, $1.1B)</text><text x="660" y="254" class="step">GrowthBook (MIT, warehouse-native)</text><text x="660" y="272" class="step">Eppo, Optimizely Experiments</text><text x="660" y="290" class="step">LaunchDarkly Experiments</text><rect width="880" height="140" x="40" y="330" class="box"/><text x="480" y="352" class="head" text-anchor="middle">LLM non-determinism complicates power</text><text x="480" y="374" class="step" text-anchor="middle">up to 15% run-to-run variance on identical inputs</text><text x="480" y="394" class="step" text-anchor="middle">buffer sample size ×1.3-1.5 beyond traditional power calc</text><text x="480" y="416" class="caption" text-anchor="middle">real cases: chatbot +70% conv length · Nextdoor +1% CTR · Khanmigo latency-vs-accuracy loop</text><text x="480" y="438" class="caption" text-anchor="middle">evals catch regressions; A/B confirms impact; shipping on vibes is over</text></svg>