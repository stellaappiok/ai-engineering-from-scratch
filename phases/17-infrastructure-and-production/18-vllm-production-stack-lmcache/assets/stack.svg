<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 480"><defs><style>.router{fill:#e6f4ea;stroke:#2e7d32}.cache,.disk,.engine,.router{stroke-width:1.5}.engine{fill:#dfe9ff;stroke:#2c5ea9}.cache{fill:#fff1d6;stroke:#c0392b}.disk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">vLLM production-stack + LMCache — cross-engine KV reuse</text><rect width="880" height="60" x="40" y="50" class="router"/><text x="480" y="74" class="head" text-anchor="middle">router (cache-aware)</text><text x="480" y="94" class="small" text-anchor="middle">consumes KV events, hashes prefixes, routes to engine with local OR shared match</text><rect width="200" height="100" x="40" y="130" class="engine"/><text x="140" y="152" class="step" text-anchor="middle">vLLM engine 1</text><text x="140" y="170" class="small" text-anchor="middle">H100 80GB</text><text x="140" y="188" class="small" text-anchor="middle">Connector API v0.9+</text><text x="140" y="206" class="small" text-anchor="middle">0.11.0 async offload</text><rect width="200" height="100" x="260" y="130" class="engine"/><text x="360" y="152" class="step" text-anchor="middle">vLLM engine 2</text><text x="360" y="170" class="small" text-anchor="middle">H100 80GB</text><rect width="200" height="100" x="480" y="130" class="engine"/><text x="580" y="152" class="step" text-anchor="middle">vLLM engine 3</text><text x="580" y="170" class="small" text-anchor="middle">H100 80GB</text><rect width="200" height="100" x="700" y="130" class="engine"/><text x="800" y="152" class="step" text-anchor="middle">vLLM engine 4</text><text x="800" y="170" class="small" text-anchor="middle">H100 80GB</text><rect width="880" height="100" x="40" y="260" class="cache"/><text x="480" y="282" class="head" text-anchor="middle">LMCache — cluster-shared KV cache</text><text x="480" y="306" class="step" text-anchor="middle">CPU DRAM tier (512 GB+ per socket)</text><text x="480" y="324" class="small" text-anchor="middle">asynchronous via Connector API; offload is not user-facing</text><text x="480" y="344" class="small" text-anchor="middle">decisive for: multi-tenant shared prompts, RAG chunk reuse, LoRA on shared base, preemption restore</text><rect width="880" height="80" x="40" y="380" class="disk"/><text x="480" y="402" class="head" text-anchor="middle">durable tier — Ceph / S3 / local NVMe</text><text x="480" y="424" class="step" text-anchor="middle">for blocks evicted from DRAM; slower but infinite</text><text x="480" y="444" class="caption" text-anchor="middle">16x H100 benchmark: LMCache helps when KV footprint exceeds HBM; matches baseline when it does not</text></svg>