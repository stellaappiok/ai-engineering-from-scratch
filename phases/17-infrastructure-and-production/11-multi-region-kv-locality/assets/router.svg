<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.req{fill:#fff1d6;stroke:#c0392b}.arrow,.region,.req,.router{stroke-width:1.5}.router{fill:#dfe9ff;stroke:#2c5ea9}.region{fill:#e6f4ea;stroke:#2e7d32}.arrow{stroke:#1a1a1a;fill:none;marker-end:url(#arr)}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style><marker id="arr" markerHeight="5" markerWidth="5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="480" y="24" class="title" text-anchor="middle">cache-aware multi-region routing — TTFT vs network RTT</text><rect width="180" height="70" x="40" y="50" class="req"/><text x="130" y="75" class="head" text-anchor="middle">incoming request</text><text x="130" y="92" class="step" text-anchor="middle">origin: us-east-1</text><text x="130" y="108" class="small" text-anchor="middle">prefix_hash = 0xabc</text><rect width="400" height="110" x="280" y="50" class="router"/><text x="480" y="75" class="head" text-anchor="middle">cache-aware router (vLLM Router / llm-d)</text><text x="290" y="95" class="step">1. hash prefix → 0xabc</text><text x="290" y="112" class="step">2. lookup replicas holding 0xabc</text><text x="290" y="129" class="step">3. minimize prefill + network RTT</text><text x="290" y="146" class="small">KV events: cache.block_added / cache.block_evicted</text><path d="M220 85 L 275 85" class="arrow"/><path d="M685 85 L 740 85" class="arrow"/><rect width="180" height="110" x="740" y="50" class="router"/><text x="830" y="75" class="head" text-anchor="middle">choice</text><text x="830" y="95" class="step" text-anchor="middle">replica R3 (us-east)</text><text x="830" y="112" class="small" text-anchor="middle">hit=true, local</text><text x="830" y="128" class="step" text-anchor="middle">TTFT ≈ 80 ms</text><text x="830" y="146" class="small" text-anchor="middle">vs ~800 ms cold</text><rect width="280" height="130" x="40" y="190" class="region"/><text x="180" y="212" class="head" text-anchor="middle">us-east-1 (origin)</text><text x="180" y="232" class="step" text-anchor="middle">R1 R2 R3* R4</text><text x="180" y="252" class="small" text-anchor="middle">R3 holds prefix 0xabc</text><text x="180" y="272" class="small" text-anchor="middle">RTT 0 ms</text><text x="180" y="294" class="caption" text-anchor="middle">local cache hit: 80 ms</text><rect width="280" height="130" x="340" y="190" class="region"/><text x="480" y="212" class="head" text-anchor="middle">us-west-2</text><text x="480" y="232" class="step" text-anchor="middle">R5 R6 R7 R8</text><text x="480" y="252" class="small" text-anchor="middle">no match on 0xabc</text><text x="480" y="272" class="small" text-anchor="middle">RTT 65 ms</text><text x="480" y="294" class="caption" text-anchor="middle">cold prefill: 800 + 65 ms</text><rect width="280" height="130" x="640" y="190" class="region"/><text x="780" y="212" class="head" text-anchor="middle">eu-west-1</text><text x="780" y="232" class="step" text-anchor="middle">R9 R10 R11 R12</text><text x="780" y="252" class="small" text-anchor="middle">R11 holds prefix 0xabc</text><text x="780" y="272" class="small" text-anchor="middle">RTT 75 ms</text><text x="780" y="294" class="caption" text-anchor="middle">hit + cross: 80 + 75 ms</text><rect width="440" height="140" x="40" y="350" class="box"/><text x="260" y="372" class="head" text-anchor="middle">routing objective — GORGO (2026)</text><text x="260" y="394" class="step" text-anchor="middle">minimize: prefill_time + network_RTT</text><text x="60" y="418" class="small">· cache hit saves ~720 ms</text><text x="60" y="436" class="small">· cross-region costs ~65-220 ms RTT</text><text x="60" y="454" class="small">· cross-region wins when prefill dominates</text><text x="60" y="472" class="small">· residency boundary beats both — partition first</text><rect width="420" height="140" x="500" y="350" class="box"/><text x="710" y="372" class="head" text-anchor="middle">DR manifest — the 32% failure</text><text x="500" y="394" class="step" text-anchor="middle" style="font-size:11px">weights backed up, tokenizer was not</text><text x="520" y="418" class="small">required files:</text><text x="520" y="436" class="small">· tokenizer.json / tokenizer.model</text><text x="520" y="454" class="small">· quantization_config.json, AWQ scales</text><text x="520" y="472" class="small">· RoPE scaling, chat template, LoRA adapters</text></svg>