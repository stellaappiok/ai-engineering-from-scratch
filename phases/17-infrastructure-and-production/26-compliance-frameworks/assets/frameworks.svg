<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.hipaa,.soc{stroke-width:1.5}.soc{fill:#dfe9ff;stroke:#2c5ea9}.hipaa{fill:#e6f4ea;stroke:#2e7d32}.emerging,.eu,.gdpr{stroke-width:1.5}.gdpr{fill:#fff1d6;stroke:#c0392b}.eu{fill:#e9e6ff;stroke:#5a4fcf}.emerging{fill:#ffe1e1;stroke:#b71c1c}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">LLM compliance — seven frameworks, one matrix</text><rect width="220" height="100" x="40" y="50" class="soc"/><text x="150" y="72" class="head" text-anchor="middle">SOC 2 Type II</text><text x="150" y="92" class="step" text-anchor="middle">B2B SaaS baseline</text><text x="150" y="110" class="small" text-anchor="middle">6-12 months operated controls</text><text x="150" y="128" class="small" text-anchor="middle">Type I is a starter, not a gate</text><rect width="220" height="100" x="280" y="50" class="hipaa"/><text x="390" y="72" class="head" text-anchor="middle">HIPAA</text><text x="390" y="92" class="step" text-anchor="middle">BAA required for PHI</text><text x="390" y="110" class="small" text-anchor="middle">Bedrock, Azure, Vertex, OpenAI, Anthropic</text><text x="390" y="128" class="small" text-anchor="middle">all provide BAA</text><rect width="220" height="100" x="520" y="50" class="gdpr"/><text x="630" y="72" class="head" text-anchor="middle">GDPR</text><text x="630" y="92" class="step" text-anchor="middle">real-time PII redaction</text><text x="630" y="110" class="small" text-anchor="middle">post-processing not defensible</text><text x="630" y="128" class="small" text-anchor="middle">Clearview AI €30.5M (2024); OpenAI €15M (2024, overturned)</text><rect width="160" height="100" x="760" y="50" class="box"/><text x="840" y="72" class="head" text-anchor="middle">PCI-DSS</text><text x="840" y="92" class="step" text-anchor="middle">payment-data scope</text><text x="840" y="110" class="small" text-anchor="middle">config + contracts</text><text x="840" y="128" class="small" text-anchor="middle">for AI-interaction layer</text><rect width="340" height="120" x="40" y="170" class="eu"/><text x="210" y="192" class="head" text-anchor="middle">EU AI Act</text><text x="60" y="216" class="step">· in force August 1, 2024</text><text x="60" y="234" class="step">· high-risk enforcement August 2, 2026</text><text x="60" y="252" class="step">· fines up to €35M or 7% global turnover</text><text x="60" y="270" class="step">· risk tiers: unacceptable / high / limited / minimal</text><text x="210" y="285" class="caption" text-anchor="middle">most B2B LLM SaaS is limited-risk</text><rect width="300" height="120" x="400" y="170" class="box"/><text x="550" y="192" class="head" text-anchor="middle">Colorado AI Act</text><text x="420" y="216" class="step">· effective June 30, 2026 (delayed)</text><text x="420" y="234" class="step">· impact assessments</text><text x="420" y="252" class="step">· right to appeal AI decisions</text><text x="420" y="270" class="step">· Virginia similar for credit / employment</text><rect width="200" height="120" x="720" y="170" class="emerging"/><text x="820" y="192" class="head" text-anchor="middle">ISO 42001</text><text x="820" y="212" class="step" text-anchor="middle">AI governance</text><text x="820" y="230" class="small" text-anchor="middle">risk mgmt</text><text x="820" y="248" class="small" text-anchor="middle">transparency</text><text x="820" y="266" class="small" text-anchor="middle">human oversight</text><text x="820" y="284" class="caption" text-anchor="middle">pairs with ISO 27001</text><rect width="880" height="90" x="40" y="310" class="box"/><text x="480" y="332" class="head" text-anchor="middle">cross-framework mapping — one control satisfies many</text><text x="60" y="358" class="small">access logging: ISO 27001 A.5.15-18 · GDPR Art. 32 · HIPAA §164.312(a) · SOC 2 CC6</text><text x="60" y="376" class="small">encryption in transit: ISO A.8.24 · GDPR Art. 32 · HIPAA §164.312(e) · PCI Req. 4</text><text x="60" y="394" class="small">audit log retention: SOC 2 CC7 · HIPAA §164.312(b) · ISO A.8.15</text><rect width="880" height="80" x="40" y="410" class="box"/><text x="480" y="432" class="head" text-anchor="middle">reference profile — OpenAI 2026</text><text x="480" y="454" class="step" text-anchor="middle">SOC 2 Type 2 · ISO/IEC 27001:2022 · ISO/IEC 27701:2019 · GDPR · CCPA</text><text x="480" y="474" class="step" text-anchor="middle">HIPAA (BAA) · FERPA · PCI-DSS (ChatGPT payments)</text></svg>