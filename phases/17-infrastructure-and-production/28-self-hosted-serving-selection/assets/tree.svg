<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.cpu{fill:#dfe9ff;stroke:#2c5ea9}.agent,.cpu{stroke-width:1.5}.gpu{fill:#e6f4ea;stroke:#2e7d32}.gpu,.maint{stroke-width:1.5}.agent{fill:#fff1d6;stroke:#c0392b}.maint{fill:#ffe1e1;stroke:#b71c1c}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">self-hosted engine decision tree — hardware first, then scale, then workload</text><rect width="280" height="200" x="40" y="50" class="cpu"/><text x="180" y="72" class="head" text-anchor="middle">CPU / edge</text><text x="180" y="96" class="step" text-anchor="middle">llama.cpp (dominant)</text><text x="60" y="124" class="small">· widest model support</text><text x="60" y="142" class="small">· fastest CPU inference</text><text x="60" y="160" class="small">· full control over quant / threads</text><rect width="240" height="60" x="60" y="180" class="box"/><text x="180" y="202" class="step" text-anchor="middle">Ollama = llama.cpp + UX</text><text x="180" y="220" class="small" text-anchor="middle">one command, single user</text><text x="180" y="236" class="small" text-anchor="middle">15-30% slower than llama.cpp</text><rect width="280" height="200" x="340" y="50" class="gpu"/><text x="480" y="72" class="head" text-anchor="middle">NVIDIA GPU</text><rect width="240" height="45" x="360" y="90" class="box"/><text x="480" y="113" class="step" text-anchor="middle">vLLM (broad default)</text><text x="480" y="128" class="small" text-anchor="middle">v0.15.1 Feb 2026, Blackwell SM120</text><rect width="240" height="45" x="360" y="145" class="box"/><text x="480" y="168" class="step" text-anchor="middle">TRT-LLM (Blackwell only)</text><text x="480" y="183" class="small" text-anchor="middle">throughput leader on B200/GB200</text><rect width="240" height="45" x="360" y="200" class="box"/><text x="480" y="222" class="step" text-anchor="middle">Ollama (dev only)</text><text x="480" y="237" class="small" text-anchor="middle">not for shared production</text><rect width="280" height="200" x="640" y="50" class="agent"/><text x="780" y="72" class="head" text-anchor="middle">agentic / prefix-heavy</text><text x="780" y="96" class="step" text-anchor="middle">SGLang (specialist)</text><text x="660" y="124" class="small">· RadixAttention (Phase 17 · 06)</text><text x="660" y="142" class="small">· 400,000+ GPUs in production</text><text x="660" y="160" class="small">· xAI, LinkedIn, Cursor, Oracle</text><text x="660" y="178" class="small">· GCP, Azure, AWS</text><text x="780" y="210" class="caption" text-anchor="middle">RAG heavy prefix reuse → here</text><text x="780" y="228" class="caption" text-anchor="middle">multi-turn agent tools → here</text><rect width="880" height="90" x="40" y="280" class="maint"/><text x="480" y="302" class="head" text-anchor="middle">TGI maintenance mode since December 11, 2025</text><text x="480" y="324" class="step" text-anchor="middle">only bug fixes going forward — do NOT default to TGI for new projects</text><text x="480" y="344" class="caption" text-anchor="middle">existing TGI deployments can continue; migrate to SGLang or vLLM when convenient</text><rect width="880" height="100" x="40" y="390" class="box"/><text x="480" y="412" class="head" text-anchor="middle">2026 pipeline pattern</text><text x="480" y="434" class="step" text-anchor="middle">dev: Ollama → staging: llama.cpp → prod: vLLM (or SGLang)</text><text x="480" y="454" class="step" text-anchor="middle">same GGUF or HF weights across all three tiers</text><text x="480" y="476" class="caption" text-anchor="middle">engineers iterate fast locally; staging mirrors prod quant; prod is the serving target</text></svg>