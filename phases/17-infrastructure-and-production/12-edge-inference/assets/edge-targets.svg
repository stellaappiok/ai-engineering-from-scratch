<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.apple{fill:#dfe9ff;stroke:#2c5ea9}.apple,.jet,.qcom,.web{stroke-width:1.5}.qcom{fill:#fff1d6;stroke:#c0392b}.web{fill:#e6f4ea;stroke:#2e7d32}.jet{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">edge inference — four targets, bandwidth sets the ceiling</text><rect width="220" height="190" x="40" y="50" class="apple"/><text x="150" y="72" class="head" text-anchor="middle">Apple Neural Engine</text><text x="150" y="95" class="step" text-anchor="middle">M4 / A18 — up to 38 TOPS</text><text x="150" y="113" class="small" text-anchor="middle">unified memory, no copy</text><text x="150" y="131" class="small" text-anchor="middle">Core ML for native ANE</text><text x="150" y="149" class="small" text-anchor="middle">MPS via llama.cpp</text><text x="150" y="175" class="step" text-anchor="middle">iPhone 16 ≈ 8 tok/s</text><text x="150" y="193" class="small" text-anchor="middle">60 GB/s DRAM</text><text x="150" y="211" class="small" text-anchor="middle">7B Q4, decode memory-bound</text><rect width="220" height="190" x="280" y="50" class="qcom"/><text x="390" y="72" class="head" text-anchor="middle">Qualcomm Hexagon</text><text x="390" y="95" class="step" text-anchor="middle">SD X Elite — up to 45 TOPS</text><text x="390" y="113" class="small" text-anchor="middle">SD 8 Gen 4 flagship Android</text><text x="390" y="131" class="small" text-anchor="middle">QNN SDK, AI Hub converts</text><text x="390" y="149" class="small" text-anchor="middle">Windows ARM copilots</text><text x="390" y="175" class="step" text-anchor="middle">SD 8 Gen 3 ≈ 7 tok/s</text><text x="390" y="193" class="small" text-anchor="middle">77 GB/s DRAM</text><text x="390" y="211" class="small" text-anchor="middle">7B Q4, typical mid/high</text><rect width="220" height="190" x="520" y="50" class="web"/><text x="630" y="72" class="head" text-anchor="middle">WebGPU + WebLLM</text><text x="630" y="95" class="step" text-anchor="middle">browser, no install</text><text x="630" y="113" class="small" text-anchor="middle">Chrome Android 121+ / Safari iOS 26</text><text x="630" y="131" class="small" text-anchor="middle">Firefox Android catching up</text><text x="630" y="149" class="small" text-anchor="middle">~70-75% mobile coverage</text><text x="630" y="175" class="step" text-anchor="middle">M3 Max ≈ 41 tok/s</text><text x="630" y="193" class="small" text-anchor="middle">~70-80% of native</text><text x="630" y="211" class="small" text-anchor="middle">OpenAI-compatible JS API</text><rect width="160" height="190" x="760" y="50" class="jet"/><text x="840" y="72" class="head" text-anchor="middle">NVIDIA Jetson</text><text x="840" y="95" class="step" text-anchor="middle">Orin / AGX / Thor</text><text x="840" y="113" class="small" text-anchor="middle">TensorRT Edge-LLM</text><text x="840" y="131" class="small" text-anchor="middle">EAGLE-3 + NVFP4</text><text x="840" y="149" class="small" text-anchor="middle">chunked prefill</text><text x="840" y="175" class="step" text-anchor="middle">AGX ≈ 40 tok/s</text><text x="840" y="193" class="small" text-anchor="middle">gpt-oss-20b vLLM</text><text x="840" y="211" class="small" text-anchor="middle">205 GB/s</text><rect width="880" height="110" x="40" y="260" class="box"/><text x="480" y="282" class="head" text-anchor="middle">bandwidth sets the ceiling — decode reads full weights each token</text><text x="480" y="308" class="step" text-anchor="middle">H100 HBM3: 3350 GB/s → Llama 8B Q4 ceiling ≈ 710 tok/s (observed 170)</text><text x="480" y="326" class="step" text-anchor="middle">M3 Max 400 GB/s → ceiling ≈ 85 tok/s (observed 55)</text><text x="480" y="344" class="step" text-anchor="middle">iPhone 16 60 GB/s → ceiling ≈ 12 tok/s (observed 8)</text><text x="480" y="362" class="caption" text-anchor="middle">compute matters only when runtime efficiency drops below this ceiling</text><rect width="880" height="100" x="40" y="390" class="box"/><text x="480" y="412" class="head" text-anchor="middle">quantization picks per target</text><text x="480" y="432" class="step" text-anchor="middle">ANE: INT4 weights + FP16 activations (Core ML path)</text><text x="480" y="450" class="step" text-anchor="middle">Hexagon: QNN INT8/INT4 (AI Hub converters)</text><text x="480" y="468" class="step" text-anchor="middle">WebGPU: Q4 GGUF (browser memory ceiling ~3-4 GB)</text><text x="480" y="486" class="step" text-anchor="middle">Jetson Thor: NVFP4 + FP8 KV (Edge-LLM path)</text></svg>