<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 480"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.batch,.box,.inter,.semi{stroke-width:1.5}.inter,.semi{fill:#fff1d6;stroke:#c0392b}.semi{fill:#dfe9ff;stroke:#2c5ea9}.batch{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}</style></defs><text x="480" y="24" class="title" text-anchor="middle">workload triage — three lanes, one rule</text><rect width="280" height="340" x="40" y="50" class="inter"/><text x="180" y="72" class="head" text-anchor="middle">interactive</text><text x="180" y="94" class="step" text-anchor="middle">user waits for response</text><text x="60" y="122" class="small">· TTFT matters</text><text x="60" y="140" class="small">· sync call with prompt cache</text><text x="60" y="158" class="small">· cannot batch</text><text x="60" y="176" class="small">· examples: chat, voice agent, search</text><text x="60" y="220" class="step">100% of baseline cost</text><text x="60" y="238" class="small">(minus caching savings)</text><rect width="280" height="340" x="340" y="50" class="semi"/><text x="480" y="72" class="head" text-anchor="middle">semi-interactive</text><text x="480" y="94" class="step" text-anchor="middle">user checks back in minutes</text><text x="360" y="122" class="small">· async queue + fallback to sync</text><text x="360" y="140" class="small">· tolerate P99 ~5-10 min</text><text x="360" y="158" class="small">· examples: moderate RAG index,</text><text x="360" y="176" class="small">&quot;refresh&quot; report, semi-live agent</text><text x="360" y="220" class="step">~50% of baseline cost</text><text x="360" y="238" class="small">(with caching + queue amortization)</text><rect width="280" height="340" x="640" y="50" class="batch"/><text x="780" y="72" class="head" text-anchor="middle">batch</text><text x="780" y="94" class="step" text-anchor="middle">result &quot;by morning&quot;</text><text x="660" y="122" class="small">· always batch, always stack cache</text><text x="660" y="140" class="small">· 24h SLA, typical 2-6h P50</text><text x="660" y="158" class="small">· examples: content pipelines,</text><text x="660" y="176" class="small">classification, labeling, reports</text><text x="660" y="220" class="step">~10% of baseline cost</text><text x="660" y="238" class="small">(batch 50% off + cached input 10x)</text><rect width="880" height="60" x="40" y="410" class="box"/><text x="480" y="432" class="head" text-anchor="middle">the rule</text><text x="480" y="454" class="step" text-anchor="middle">if 24h latency is acceptable to the user, the workload belongs on batch</text></svg>