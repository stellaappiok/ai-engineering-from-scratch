<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.old{fill:#eee;stroke:#888;stroke-width:1.2}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">vLLM scheduler — three compounding defaults</text><rect width="280" height="490" x="40" y="50" class="box"/><text x="180" y="72" class="head" text-anchor="middle">PagedAttention allocator</text><rect width="240" height="60" x="60" y="90" class="cool"/><text x="180" y="112" class="step" text-anchor="middle">KV cache = blocks of 16 tokens</text><text x="180" y="130" class="small" text-anchor="middle">block table per sequence;</text><text x="180" y="144" class="small" text-anchor="middle">allocate on demand, release on EOS</text><rect width="240" height="60" x="60" y="160" class="cool"/><text x="180" y="182" class="step" text-anchor="middle">fragmentation &lt; 4%</text><text x="180" y="200" class="small" text-anchor="middle">vs 60-80% contiguous</text><text x="180" y="214" class="small" text-anchor="middle">pay only for tokens used</text><rect width="240" height="70" x="60" y="230" class="cold"/><text x="180" y="252" class="step" text-anchor="middle">--gpu-memory-utilization = 0.9</text><text x="180" y="270" class="small" text-anchor="middle">the knob (not a flag)</text><text x="180" y="286" class="small" text-anchor="middle">PagedAttention is the only</text><text x="180" y="300" class="small" text-anchor="middle">allocator vLLM ships</text><rect width="240" height="100" x="60" y="310" class="box"/><text x="180" y="332" class="step" text-anchor="middle">logical to physical map</text><text x="70" y="352" class="small">seq_A: [tok0..15] to block 37</text><text x="70" y="368" class="small">seq_A: [tok16..31] to block 12</text><text x="70" y="384" class="small">seq_B: [tok0..15] to block 42</text><text x="70" y="400" class="small">... block table grows with seq</text><text x="180" y="430" class="caption" text-anchor="middle">KV is virtual memory for sequences</text><rect width="280" height="490" x="340" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">continuous batching</text><rect width="240" height="50" x="360" y="90" class="hot"/><text x="480" y="110" class="step" text-anchor="middle">iteration-level scheduling</text><text x="480" y="126" class="small" text-anchor="middle">admit / release every decode step</text><rect width="240" height="80" x="360" y="150" class="box"/><text x="480" y="170" class="step" text-anchor="middle">the loop</text><text x="370" y="190" class="small">1. drop finished seqs from RUNNING</text><text x="370" y="206" class="small">2. admit WAITING if KV blocks free</text><text x="370" y="222" class="small">3. one forward across the batch</text><rect width="240" height="70" x="360" y="240" class="cool"/><text x="480" y="262" class="step" text-anchor="middle">batch is always full of real work</text><text x="480" y="280" class="small" text-anchor="middle">no padding to longest seq</text><text x="480" y="296" class="small" text-anchor="middle">fast seqs leave, new seqs join</text><rect width="240" height="90" x="360" y="320" class="cold"/><text x="480" y="342" class="step" text-anchor="middle">V1 scheduler (2026)</text><text x="480" y="360" class="small" text-anchor="middle">scheduler runs per iteration</text><text x="480" y="376" class="small" text-anchor="middle">not per request</text><text x="480" y="394" class="small" text-anchor="middle">N-gram spec decode is the</text><text x="480" y="408" class="small" text-anchor="middle">chunked-prefill-compatible path</text><text x="480" y="430" class="caption" text-anchor="middle">3-4x over naive at 128 concurrent</text><rect width="280" height="490" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">chunked prefill</text><rect width="240" height="60" x="660" y="90" class="hot"/><text x="780" y="112" class="step" text-anchor="middle">slice prefill into 512-tok chunks</text><text x="780" y="130" class="small" text-anchor="middle">interleave with decode</text><text x="780" y="144" class="small" text-anchor="middle">protect TTFT tail, not mean</text><rect width="240" height="70" x="660" y="160" class="cool"/><text x="780" y="182" class="step" text-anchor="middle">P99 ITL under mixed load</text><text x="780" y="200" class="small" text-anchor="middle">without chunking: ~50 ms</text><text x="780" y="216" class="small" text-anchor="middle">with chunking: ~15 ms</text><rect width="240" height="70" x="660" y="240" class="dsk"/><text x="780" y="262" class="step" text-anchor="middle">gotcha — vLLM v0.18.0</text><text x="780" y="280" class="small" text-anchor="middle">--enable-chunked-prefill</text><text x="780" y="296" class="small" text-anchor="middle">incompatible with draft-model spec</text><rect width="240" height="90" x="660" y="320" class="old"/><text x="780" y="342" class="step" text-anchor="middle">exception</text><text x="780" y="360" class="small" text-anchor="middle">N-gram GPU speculative decoding</text><text x="780" y="376" class="small" text-anchor="middle">in V1 scheduler works with</text><text x="780" y="394" class="small" text-anchor="middle">chunked prefill</text><text x="780" y="430" class="caption" text-anchor="middle">read the release notes before flipping flags</text><rect width="880" height="70" x="40" y="470" class="box"/><text x="480" y="492" class="step" text-anchor="middle">all three on together — Llama 3.3 70B FP8, H100 SXM5, 128 concurrent</text><text x="480" y="512" class="small" text-anchor="middle">throughput 2,200-2,400 tok/s · 25% over default vLLM · 3-4x naive PyTorch · &lt; 4% fragmentation</text><text x="480" y="530" class="caption" text-anchor="middle">each default assumes the other two</text></svg>