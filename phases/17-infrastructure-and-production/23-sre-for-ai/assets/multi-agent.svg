<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 520"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.agent,.box,.human,.sup{stroke-width:1.5}.sup{fill:#dfe9ff;stroke:#2c5ea9}.agent{fill:#e6f4ea;stroke:#2e7d32}.human{fill:#fff1d6;stroke:#c0392b}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{fill:#555}.small{font-size:10px}.caption{font-size:11px;font-style:italic}.arrow{stroke:#1a1a1a;stroke-width:1.5;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerHeight="5" markerWidth="5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="480" y="24" class="title" text-anchor="middle">AI SRE — multi-agent triage with human gate</text><rect width="200" height="70" x="380" y="50" class="sup"/><text x="480" y="75" class="head" text-anchor="middle">supervisor</text><text x="480" y="95" class="small" text-anchor="middle">breaks incident into sub-queries</text><text x="480" y="110" class="small" text-anchor="middle">synthesizes hypotheses</text><rect width="240" height="100" x="40" y="160" class="agent"/><text x="160" y="182" class="head" text-anchor="middle">log agent</text><text x="160" y="204" class="step" text-anchor="middle">tool: log search</text><text x="160" y="222" class="small" text-anchor="middle">pattern detection, frequency</text><text x="160" y="240" class="small" text-anchor="middle">grouping by service + trace</text><rect width="240" height="100" x="360" y="160" class="agent"/><text x="480" y="182" class="head" text-anchor="middle">metric agent</text><text x="480" y="204" class="step" text-anchor="middle">tool: PromQL / DCGM</text><text x="480" y="222" class="small" text-anchor="middle">correlation windows</text><text x="480" y="240" class="small" text-anchor="middle">anomaly + change-point</text><rect width="240" height="100" x="680" y="160" class="agent"/><text x="800" y="182" class="head" text-anchor="middle">runbook agent</text><text x="800" y="204" class="step" text-anchor="middle">tool: vector search</text><text x="800" y="222" class="small" text-anchor="middle">matches to RB-###</text><text x="800" y="240" class="small" text-anchor="middle">proposes safe action</text><path d="M480 125 L 160 155" class="arrow"/><path d="M480 125 L 480 155" class="arrow"/><path d="M480 125 L 800 155" class="arrow"/><rect width="400" height="90" x="280" y="290" class="box"/><text x="480" y="312" class="head" text-anchor="middle">adversarial evaluation (NeuBird pattern)</text><text x="480" y="334" class="step" text-anchor="middle">agents agree → high confidence → present to human</text><text x="480" y="354" class="step" text-anchor="middle">agents disagree → escalate with both hypotheses</text><text x="480" y="372" class="caption" text-anchor="middle">filters against hallucinated root causes</text><path d="M160 260 L 310 290" class="arrow"/><path d="M480 260 L 480 290" class="arrow"/><path d="M800 260 L 650 290" class="arrow"/><rect width="400" height="90" x="280" y="410" class="human"/><text x="480" y="432" class="head" text-anchor="middle">human approval gate</text><text x="480" y="454" class="step" text-anchor="middle">safe actions: restart pod, revert deploy, scale within bounds</text><text x="480" y="472" class="step" text-anchor="middle">broad changes always escalate: topology, code, IAM</text><text x="480" y="490" class="caption" text-anchor="middle">&quot;set and forget&quot; is overselling</text><path d="M480 380 L 480 405" class="arrow"/></svg>