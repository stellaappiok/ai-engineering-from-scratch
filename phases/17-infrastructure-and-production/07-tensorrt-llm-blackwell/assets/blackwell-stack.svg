<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Blackwell + TRT-LLM stack — where the 7x cost gap comes from</text><rect width="440" height="470" x="40" y="50" class="box"/><text x="260" y="72" class="head" text-anchor="middle">precision regime on Blackwell</text><rect width="400" height="60" x="60" y="90" class="cool"/><text x="260" y="112" class="step" text-anchor="middle">weights : NVFP4 (4-bit microscaling)</text><text x="260" y="130" class="small" text-anchor="middle">half the bytes per decoded token vs FP8</text><text x="260" y="144" class="small" text-anchor="middle">day-0 FP4 weights shipped by model providers</text><rect width="400" height="60" x="60" y="160" class="hot"/><text x="260" y="182" class="step" text-anchor="middle">KV cache : FP8 (stays critical)</text><text x="260" y="200" class="small" text-anchor="middle">FP4 KV collapses attention tails</text><text x="260" y="214" class="small" text-anchor="middle">FP8 exponent bits preserve dynamic range</text><rect width="400" height="60" x="60" y="230" class="cold"/><text x="260" y="252" class="step" text-anchor="middle">activations : NVFP4</text><text x="260" y="270" class="small" text-anchor="middle">small-range within a layer; FP4 holds up</text><text x="260" y="284" class="small" text-anchor="middle">MXFP8 variant available on Tensor Cores</text><rect width="400" height="60" x="60" y="300" class="dsk"/><text x="260" y="322" class="step" text-anchor="middle">attention accumulator : FP32</text><text x="260" y="340" class="small" text-anchor="middle">softmax stability requires higher precision</text><text x="260" y="354" class="small" text-anchor="middle">no negotiation on this tier</text><rect width="400" height="140" x="60" y="370" class="box"/><text x="260" y="392" class="head" text-anchor="middle">the quality caveat</text><text x="260" y="414" class="small" text-anchor="middle">NVFP4 weights on reasoning workloads :</text><text x="260" y="430" class="small" text-anchor="middle">math, chain-of-thought, long-context code :</text><text x="260" y="446" class="small" text-anchor="middle">visible quality drop without per-block calib</text><text x="260" y="466" class="small" text-anchor="middle">recovery : FP8 weights + FP4 activations</text><text x="260" y="482" class="small" text-anchor="middle">or stay on H200 with FP8 throughout</text><text x="260" y="502" class="caption" text-anchor="middle">always validate eval quality pre-migration</text><rect width="420" height="470" x="500" y="50" class="box"/><text x="710" y="72" class="head" text-anchor="middle">stack layers that stack the gap</text><rect width="380" height="60" x="520" y="90" class="cool"/><text x="710" y="112" class="step" text-anchor="middle">1 / hardware bandwidth</text><text x="710" y="130" class="small" text-anchor="middle">H100 3.35 TB/s vs B200 8.0 TB/s : ~2.4x</text><text x="710" y="144" class="small" text-anchor="middle">decode is memory-bound; this is the floor</text><rect width="380" height="60" x="520" y="160" class="hot"/><text x="710" y="182" class="step" text-anchor="middle">2 / NVFP4 weights</text><text x="710" y="200" class="small" text-anchor="middle">halve bytes per token : ~2.0x</text><text x="710" y="214" class="small" text-anchor="middle">NVFP4 is the only weight precision that matters now</text><rect width="380" height="60" x="520" y="230" class="cold"/><text x="710" y="252" class="step" text-anchor="middle">3 / MTP draft</text><text x="710" y="270" class="small" text-anchor="middle">multi-token prediction head : ~1.8x on accepted tokens</text><text x="710" y="284" class="small" text-anchor="middle">integrated in the TRT-LLM build</text><rect width="380" height="60" x="520" y="300" class="dsk"/><text x="710" y="322" class="step" text-anchor="middle">4 / disaggregated prefill/decode</text><text x="710" y="340" class="small" text-anchor="middle">Dynamo orchestrates separate GPU pools : ~1.6-2.5x</text><text x="710" y="354" class="small" text-anchor="middle">NVLink 5 for KV cache transfer</text><rect width="380" height="60" x="520" y="370" class="box"/><text x="710" y="392" class="step" text-anchor="middle">5 / NVLink 5 all-to-all</text><text x="710" y="410" class="small" text-anchor="middle">MoE expert comm latency cut 3x vs Hopper</text><text x="710" y="424" class="small" text-anchor="middle">MoE-heavy models get extra multiplier</text><rect width="380" height="70" x="520" y="440" class="hot"/><text x="710" y="462" class="step" text-anchor="middle">headline numbers (2026)</text><text x="710" y="480" class="small" text-anchor="middle">HGX B200 : $0.02/M tok GPT-OSS-120B</text><text x="710" y="496" class="small" text-anchor="middle">GB200 NVL72 + Dynamo : $0.012/M tok</text><text x="710" y="510" class="small" text-anchor="middle">H100 + vLLM : $0.09/M tok</text></svg>