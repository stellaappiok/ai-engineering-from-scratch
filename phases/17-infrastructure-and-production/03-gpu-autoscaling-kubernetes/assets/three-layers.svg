<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 580"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.node{fill:#dfe9ff;stroke:#2c5ea9}.app,.bad,.node,.sched{stroke-width:1.5}.sched{fill:#fff1d6;stroke:#c0392b}.app{fill:#e6f4ea;stroke:#2e7d32}.bad{fill:#ffe1e1;stroke:#b71c1c}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">GPU autoscaling — three layers, not one</text><rect width="280" height="480" x="40" y="50" class="box"/><text x="180" y="72" class="head" text-anchor="middle">layer 1 — node provisioning</text><rect width="240" height="70" x="60" y="90" class="node"/><text x="180" y="112" class="step" text-anchor="middle">Karpenter</text><text x="180" y="130" class="small" text-anchor="middle">provisions nodes on pending pods</text><text x="180" y="146" class="small" text-anchor="middle">45-60s (vs CA 90-120s)</text><rect width="240" height="90" x="60" y="170" class="bad"/><text x="180" y="192" class="step" text-anchor="middle">consolidation trap</text><text x="180" y="210" class="small" text-anchor="middle">WhenEmptyOrUnderutilized</text><text x="180" y="226" class="small" text-anchor="middle">evicts running GPU jobs</text><text x="180" y="244" class="small" text-anchor="middle">loses minutes of capacity</text><rect width="240" height="100" x="60" y="270" class="node"/><text x="180" y="292" class="step" text-anchor="middle">safe setting</text><text x="180" y="310" class="small" text-anchor="middle">consolidationPolicy:</text><text x="180" y="326" class="small" text-anchor="middle">WhenEmpty</text><text x="180" y="342" class="small" text-anchor="middle">consolidateAfter: 1h</text><text x="180" y="358" class="small" text-anchor="middle">taint GPU nodes</text><text x="180" y="400" class="caption" text-anchor="middle">picks instance type dynamically</text><rect width="280" height="480" x="340" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">layer 2 — gang scheduling</text><rect width="240" height="70" x="360" y="90" class="sched"/><text x="480" y="112" class="step" text-anchor="middle">KAI Scheduler</text><text x="480" y="130" class="small" text-anchor="middle">secondary to kube-scheduler</text><text x="480" y="146" class="small" text-anchor="middle">annotate workloads to opt in</text><rect width="240" height="100" x="360" y="170" class="sched"/><text x="480" y="192" class="step" text-anchor="middle">gang scheduling</text><text x="480" y="210" class="small" text-anchor="middle">all-or-nothing placement</text><text x="480" y="226" class="small" text-anchor="middle">prevents 7-of-8 idle trap</text><text x="480" y="244" class="small" text-anchor="middle">defer all if can&apos;t fit all</text><rect width="240" height="80" x="360" y="280" class="sched"/><text x="480" y="302" class="step" text-anchor="middle">topology awareness</text><text x="480" y="320" class="small" text-anchor="middle">NVLink / IB / rack placement</text><text x="480" y="336" class="small" text-anchor="middle">TP-8 stays on one NVLink domain</text><rect width="240" height="90" x="360" y="370" class="sched"/><text x="480" y="392" class="step" text-anchor="middle">hierarchical queues</text><text x="480" y="410" class="small" text-anchor="middle">multi-team priority + quota</text><text x="480" y="426" class="small" text-anchor="middle">preemption rules per queue</text><text x="480" y="442" class="small" text-anchor="middle">Ray + vLLM production-stack integrate</text><rect width="280" height="480" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">layer 3 — application signals</text><rect width="240" height="80" x="660" y="90" class="bad"/><text x="780" y="112" class="step" text-anchor="middle">HPA trap</text><text x="780" y="130" class="small" text-anchor="middle">DCGM_FI_DEV_GPU_UTIL</text><text x="780" y="146" class="small" text-anchor="middle">duty-cycle, NOT load</text><text x="780" y="162" class="small" text-anchor="middle">100% = 10 or 100 requests</text><rect width="240" height="100" x="660" y="180" class="app"/><text x="780" y="202" class="step" text-anchor="middle">correct signals</text><text x="780" y="220" class="small" text-anchor="middle">queue depth</text><text x="780" y="236" class="small" text-anchor="middle">KV cache utilization</text><text x="780" y="252" class="small" text-anchor="middle">per-replica P99 TTFT</text><text x="780" y="268" class="small" text-anchor="middle">goodput (SLO-meeting RPS)</text><rect width="240" height="90" x="660" y="290" class="app"/><text x="780" y="312" class="step" text-anchor="middle">Dynamo Planner</text><text x="780" y="330" class="small" text-anchor="middle">scales on inference signals</text><text x="780" y="346" class="small" text-anchor="middle">rate-matches prefill:decode ratio</text><text x="780" y="362" class="small" text-anchor="middle">meets SLOs, not duty cycle</text><rect width="240" height="90" x="660" y="390" class="app"/><text x="780" y="412" class="step" text-anchor="middle">llm-d WVA</text><text x="780" y="430" class="small" text-anchor="middle">Workload Variant Autoscaler</text><text x="780" y="446" class="small" text-anchor="middle">disaggregated prefill + decode</text><text x="780" y="462" class="small" text-anchor="middle">per-role HPA</text><rect width="880" height="30" x="40" y="540" class="box"/><text x="480" y="558" class="step" text-anchor="middle">compose all three — each alone is insufficient on a real GPU cluster</text></svg>