<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 560"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.aws{fill:#fff1d6;stroke:#c0392b}.aws,.az,.dsk,.gcp{stroke-width:1.5}.az{fill:#dfe9ff;stroke:#2c5ea9}.gcp{fill:#e6f4ea;stroke:#2e7d32}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Managed LLM platforms — three strategies</text><rect width="280" height="440" x="40" y="50" class="box"/><text x="180" y="72" class="head" text-anchor="middle">AWS Bedrock — marketplace</text><rect width="240" height="60" x="60" y="90" class="aws"/><text x="180" y="110" class="step" text-anchor="middle">Claude · Llama · Titan · Cohere</text><text x="180" y="128" class="small" text-anchor="middle">Mistral · Stability · AI21</text><text x="180" y="144" class="small" text-anchor="middle">one IAM, one CloudWatch surface</text><rect width="240" height="80" x="60" y="160" class="aws"/><text x="180" y="182" class="step" text-anchor="middle">Application Inference Profiles</text><text x="180" y="200" class="small" text-anchor="middle">cleanest FinOps attribution</text><text x="180" y="216" class="small" text-anchor="middle">tag team / product / feature</text><text x="180" y="232" class="small" text-anchor="middle">per-profile cost without post-proc</text><rect width="240" height="70" x="60" y="250" class="box"/><text x="180" y="272" class="step" text-anchor="middle">TTFT P50 ≈ 75 ms</text><text x="180" y="290" class="small" text-anchor="middle">on-demand shared capacity</text><text x="180" y="306" class="small" text-anchor="middle">PT available $21-$50/hr</text><rect width="240" height="90" x="60" y="330" class="dsk"/><text x="180" y="352" class="step" text-anchor="middle">bet: optionality over any one model</text><text x="180" y="370" class="small" text-anchor="middle">frontier rotates — keep the door open</text><text x="180" y="390" class="small" text-anchor="middle">BAA in most regions, VPC endpoints</text><text x="180" y="410" class="small" text-anchor="middle">guardrails built-in</text><rect width="280" height="440" x="340" y="50" class="box"/><text x="480" y="72" class="head" text-anchor="middle">Azure OpenAI — exclusive + PTU</text><rect width="240" height="60" x="360" y="90" class="az"/><text x="480" y="110" class="step" text-anchor="middle">GPT-4 / 4o / 5 / o-series</text><text x="480" y="128" class="small" text-anchor="middle">DALL-E, Whisper, fine-tuning</text><text x="480" y="144" class="small" text-anchor="middle">no non-OpenAI models</text><rect width="240" height="80" x="360" y="160" class="az"/><text x="480" y="182" class="step" text-anchor="middle">Provisioned Throughput Units</text><text x="480" y="200" class="small" text-anchor="middle">dedicated capacity, hourly billed</text><text x="480" y="216" class="small" text-anchor="middle">up to 70% savings at high util</text><text x="480" y="232" class="small" text-anchor="middle">break-even ≈ 40-60% utilization</text><rect width="240" height="70" x="360" y="250" class="box"/><text x="480" y="272" class="step" text-anchor="middle">TTFT P50 ≈ 50 ms (PTU)</text><text x="480" y="290" class="small" text-anchor="middle">25 ms better than Bedrock</text><text x="480" y="306" class="small" text-anchor="middle">gap shrinks on on-demand</text><rect width="240" height="90" x="360" y="330" class="dsk"/><text x="480" y="352" class="step" text-anchor="middle">bet: OpenAI stays the frontier</text><text x="480" y="370" class="small" text-anchor="middle">regulated-industry default</text><text x="480" y="390" class="small" text-anchor="middle">HIPAA, SOC 2, ISO 27001</text><text x="480" y="410" class="small" text-anchor="middle">EU data residency available</text><rect width="280" height="440" x="640" y="50" class="box"/><text x="780" y="72" class="head" text-anchor="middle">Vertex AI — Gemini-first</text><rect width="240" height="60" x="660" y="90" class="gcp"/><text x="780" y="110" class="step" text-anchor="middle">Gemini 2.5 Pro / Flash / Nano</text><text x="780" y="128" class="small" text-anchor="middle">1M-token context window</text><text x="780" y="144" class="small" text-anchor="middle">Model Garden for 3rd-party</text><rect width="240" height="80" x="660" y="160" class="gcp"/><text x="780" y="182" class="step" text-anchor="middle">BigQuery billing export</text><text x="780" y="200" class="small" text-anchor="middle">project-per-team + labels</text><text x="780" y="216" class="small" text-anchor="middle">arbitrary SQL on cost data</text><text x="780" y="232" class="small" text-anchor="middle">more work, more flexibility</text><rect width="240" height="70" x="660" y="250" class="box"/><text x="780" y="272" class="step" text-anchor="middle">TTFT P50 ≈ 60 ms</text><text x="780" y="290" class="small" text-anchor="middle">on-demand, shared</text><text x="780" y="306" class="small" text-anchor="middle">provisioned per-SKU, less public</text><rect width="240" height="90" x="660" y="330" class="dsk"/><text x="780" y="352" class="step" text-anchor="middle">bet: multimodal long-context</text><text x="780" y="370" class="small" text-anchor="middle">1M context is the differentiator</text><text x="780" y="390" class="small" text-anchor="middle">Model Garden hedges third-party</text><text x="780" y="410" class="small" text-anchor="middle">GCP compliance inherits</text><rect width="880" height="50" x="40" y="500" class="box"/><text x="480" y="520" class="step" text-anchor="middle">two-provider minimum — Claude from one, GPT from another, gateway failover between</text><text x="480" y="540" class="small" text-anchor="middle">single-vendor lock-in is the expensive mistake in 2026 — frontier rotates monthly</text></svg>