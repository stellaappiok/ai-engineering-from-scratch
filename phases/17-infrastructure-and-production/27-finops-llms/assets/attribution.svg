<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 500"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.dim{fill:#dfe9ff;stroke:#2c5ea9}.dim,.enforce,.kill,.layer{stroke-width:1.5}.layer{fill:#e6f4ea;stroke:#2e7d32}.enforce{fill:#fff1d6;stroke:#c0392b}.kill{fill:#ffe1e1;stroke:#b71c1c}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}</style></defs><text x="480" y="24" class="title" text-anchor="middle">FinOps for LLMs — three dimensions, four layers, three-tier enforcement</text><rect width="280" height="180" x="40" y="50" class="dim"/><text x="180" y="72" class="head" text-anchor="middle">three attribution dimensions</text><rect width="240" height="35" x="60" y="90" class="box"/><text x="180" y="112" class="step" text-anchor="middle">per-user (user_id)</text><rect width="240" height="35" x="60" y="130" class="box"/><text x="180" y="152" class="step" text-anchor="middle">per-task (task_id + route)</text><rect width="240" height="35" x="60" y="170" class="box"/><text x="180" y="192" class="step" text-anchor="middle">per-tenant (tenant_id)</text><text x="180" y="222" class="caption" text-anchor="middle">instrument all three on day 1</text><rect width="280" height="180" x="340" y="50" class="layer"/><text x="480" y="72" class="head" text-anchor="middle">four token layers</text><text x="360" y="96" class="step">· prompt (40-60%)</text><text x="360" y="116" class="step">· tool (20-40%, agent-heavy)</text><text x="360" y="136" class="step">· memory (10-30%, RAG)</text><text x="360" y="156" class="step">· response (10-30%)</text><text x="480" y="200" class="caption" text-anchor="middle">bucketing all four hides the optimization lever</text><rect width="280" height="180" x="640" y="50" class="enforce"/><text x="780" y="72" class="head" text-anchor="middle">three-tier enforcement</text><text x="660" y="96" class="step">1. rate limit per tenant</text><text x="660" y="114" class="small">2-3x peak, 429 + Retry-After</text><text x="660" y="138" class="step">2. daily spend cap per tenant</text><text x="660" y="156" class="small">1.5-3x contract; tighten rate + alert CS</text><text x="660" y="180" class="step">3. kill switch on z-score &gt; 4</text><text x="660" y="198" class="small">auto-pause + page on-call</text><rect width="880" height="100" x="40" y="260" class="box"/><text x="480" y="282" class="head" text-anchor="middle">unit metric — cost per product outcome, not $/M tokens</text><text x="60" y="308" class="step">cost per resolved support ticket</text><text x="60" y="326" class="step">cost per generated article</text><text x="60" y="344" class="step">cost per successful agent task</text><text x="500" y="308" class="step">cost per user-session-minute</text><text x="500" y="326" class="step">cost per index refresh</text><text x="500" y="344" class="caption">tie cost to a product outcome, else optimization is unanchored</text><rect width="880" height="110" x="40" y="380" class="kill"/><text x="480" y="402" class="head" text-anchor="middle">stacked optimization ceiling — ~5-10% of naive baseline</text><text x="480" y="424" class="step" text-anchor="middle">cache (14) + batch (15) + route (16) + gateway (19)</text><text x="480" y="444" class="step" text-anchor="middle">each halves or 10xs; compound multiplies</text><text x="480" y="464" class="caption" text-anchor="middle">most teams run 2-3 levers; few stack all four</text><text x="480" y="484" class="small" text-anchor="middle">leaked spend = gap between best-case stack and current</text></svg>