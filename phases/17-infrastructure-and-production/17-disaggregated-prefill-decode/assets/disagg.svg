<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 460"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a}.box,.dec{stroke-width:1.5}.pre{fill:#fff1d6;stroke:#c0392b}.pre,.router{stroke-width:1.5}.dec{fill:#dfe9ff;stroke:#2c5ea9}.router{fill:#e6f4ea;stroke:#2e7d32}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.caption,.small{font-size:10px;fill:#555}.caption{font-size:11px;font-style:italic}.arrow{stroke:#1a1a1a;stroke-width:1.5;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerHeight="5" markerWidth="5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1a1a1a" d="M0,0 L10,5 L0,10 z"/></marker></defs><text x="480" y="24" class="title" text-anchor="middle">disaggregated prefill + decode — NVIDIA Dynamo / llm-d</text><rect width="140" height="70" x="40" y="60" class="router"/><text x="110" y="82" class="head" text-anchor="middle">router</text><text x="110" y="100" class="small" text-anchor="middle">cache-aware</text><text x="110" y="116" class="small" text-anchor="middle">+ SLA planner</text><rect width="260" height="120" x="240" y="60" class="pre"/><text x="370" y="82" class="head" text-anchor="middle">prefill pool — compute-bound</text><text x="370" y="102" class="step" text-anchor="middle">H100 / B200</text><text x="250" y="122" class="small">· matmul-heavy forward</text><text x="250" y="138" class="small">· FLOPs-limited</text><text x="250" y="154" class="small">· scale on queue depth</text><text x="370" y="174" class="caption" text-anchor="middle">~2000 TFLOPS FP8 useful</text><rect width="260" height="120" x="640" y="60" class="dec"/><text x="770" y="82" class="head" text-anchor="middle">decode pool — memory-bound</text><text x="770" y="102" class="step" text-anchor="middle">H200 or aggressive quant</text><text x="650" y="122" class="small">· one token per iter, all weights</text><text x="650" y="138" class="small">· HBM-bandwidth-limited</text><text x="650" y="154" class="small">· scale on KV utilization</text><text x="770" y="174" class="caption" text-anchor="middle">~3 TB/s HBM3 ceiling</text><path d="M180 95 L 235 95" class="arrow"/><text x="210" y="88" class="small" text-anchor="middle">prompt</text><path d="M500 95 L 635 95" class="arrow"/><text x="568" y="78" class="step" text-anchor="middle">NIXL</text><text x="568" y="108" class="small" text-anchor="middle">KV transfer</text><text x="568" y="125" class="small" text-anchor="middle">RDMA or TCP</text><rect width="440" height="110" x="40" y="210" class="box"/><text x="260" y="232" class="head" text-anchor="middle">NVIDIA Dynamo</text><text x="60" y="256" class="small">· sits above vLLM / SGLang / TRT-LLM</text><text x="60" y="274" class="small">· Planner Profiler + SLA Planner auto-configs</text><text x="60" y="292" class="small">· Rust core, Python extensibility</text><text x="60" y="310" class="small">· 30x on DeepSeek-R1; 50x MoE on GB300 NVL72</text><rect width="420" height="110" x="500" y="210" class="box"/><text x="710" y="232" class="head" text-anchor="middle">llm-d (Red Hat + AWS)</text><text x="520" y="256" class="small">· Kubernetes-native Services per role</text><text x="520" y="274" class="small">· packDomain: rack for KV locality</text><text x="520" y="292" class="small">· per-role HPA (queue / KV util)</text><text x="520" y="310" class="small">· 0.5: hierarchical KV, LoRA routing, UCCL</text><rect width="880" height="110" x="40" y="340" class="box"/><text x="480" y="362" class="head" text-anchor="middle">when it pays off</text><text x="480" y="386" class="step" text-anchor="middle">prompts &gt; 512 tokens AND outputs &gt; 200 tokens</text><text x="480" y="404" class="step" text-anchor="middle">MoE serving (DeepSeek-V3, future GPT-5 variants) — double win on expert routing</text><text x="480" y="424" class="step" text-anchor="middle">real case: $2M → $1.2M/yr on same workload, same SLA, no new hardware</text><text x="480" y="444" class="caption" text-anchor="middle">short prompts: transfer tax dominates, do not disaggregate</text></svg>