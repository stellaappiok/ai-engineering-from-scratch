<svg xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" viewBox="0 0 960 540"><defs><style>.box{fill:#faf6ef;stroke:#1a1a1a;stroke-width:1.5}.hot{fill:#fff1d6;stroke:#c0392b}.cold,.hot{stroke-width:1.5}.cool{fill:#e6f4ea;stroke:#2e7d32}.cool,.dsk{stroke-width:1.5}.cold{fill:#dfe9ff;stroke:#2c5ea9}.dsk{fill:#e9e6ff;stroke:#5a4fcf}.head,.title{font-weight:700;fill:#1a1a1a}.title{font-size:16px}.head{font-size:12px}.small,.step{font-family:&apos;Menlo&apos;,monospace}.step{font-size:12px;fill:#222}.small{font-size:10px;fill:#555}</style></defs><text x="480" y="24" class="title" text-anchor="middle">Quantization formats — pick by hardware, engine, workload</text><rect width="440" height="240" x="40" y="50" class="box"/><text x="260" y="72" class="head" text-anchor="middle">the picking tree</text><rect width="400" height="35" x="60" y="90" class="cool"/><text x="260" y="112" class="step" text-anchor="middle">CPU / edge ? → GGUF Q4_K_M (llama.cpp)</text><rect width="400" height="35" x="60" y="130" class="cold"/><text x="260" y="152" class="step" text-anchor="middle">Reasoning workload ? → FP8 (vLLM or TRT-LLM)</text><rect width="400" height="35" x="60" y="170" class="dsk"/><text x="260" y="192" class="step" text-anchor="middle">Multi-LoRA on vLLM ? → GPTQ-Int4 + Marlin</text><rect width="400" height="35" x="60" y="210" class="hot"/><text x="260" y="232" class="step" text-anchor="middle">Routine chat, GPU ? → AWQ-Int4 + Marlin</text><rect width="400" height="35" x="60" y="250" class="box"/><text x="260" y="272" class="step" text-anchor="middle">Blackwell, quality validated ? → NVFP4 + FP8 KV</text><rect width="420" height="240" x="500" y="50" class="box"/><text x="710" y="72" class="head" text-anchor="middle">trap #1 — the KV cache</text><rect width="380" height="70" x="520" y="90" class="hot"/><text x="710" y="112" class="step" text-anchor="middle">AWQ shrinks weights, not KV</text><text x="710" y="130" class="small" text-anchor="middle">70B AWQ weights : ~35 GB</text><text x="710" y="144" class="small" text-anchor="middle">KV at 128 conc / 2k ctx : ~20-30 GB</text><rect width="380" height="60" x="520" y="170" class="cool"/><text x="710" y="192" class="step" text-anchor="middle">budget HBM holistically</text><text x="710" y="210" class="small" text-anchor="middle">weights + KV + activations</text><text x="710" y="226" class="small" text-anchor="middle">FP8 KV buys equivalent savings to AWQ weights</text><rect width="380" height="50" x="520" y="240" class="cold"/><text x="710" y="262" class="step" text-anchor="middle">KV quantization is a separate choice</text><text x="710" y="280" class="small" text-anchor="middle">affects attention accuracy directly</text><rect width="440" height="220" x="40" y="310" class="box"/><text x="260" y="332" class="head" text-anchor="middle">trap #2 — calibration dataset</text><rect width="400" height="60" x="60" y="350" class="hot"/><text x="260" y="372" class="step" text-anchor="middle">AWQ and GPTQ calibrate on C4/Wiki by default</text><text x="260" y="390" class="small" text-anchor="middle">for domain models : wrong weights get protected</text><text x="260" y="404" class="small" text-anchor="middle">Pass@1 on HumanEval can drop 3-5 points</text><rect width="400" height="60" x="60" y="420" class="cool"/><text x="260" y="442" class="step" text-anchor="middle">fix : calibrate on in-domain data</text><text x="260" y="460" class="small" text-anchor="middle">few hundred samples usually enough</text><text x="260" y="474" class="small" text-anchor="middle">always test on eval set before shipping</text><rect width="400" height="35" x="60" y="490" class="dsk"/><text x="260" y="512" class="step" text-anchor="middle">AWQ INT4 is hazardous for reasoning : use FP8</text><rect width="420" height="220" x="500" y="310" class="box"/><text x="710" y="332" class="head" text-anchor="middle">numbers (2026)</text><rect width="380" height="30" x="520" y="350" class="cool"/><text x="710" y="370" class="small" text-anchor="middle">GGUF Q4_K_M on vLLM : ~93 tok/s (wrong engine)</text><rect width="380" height="30" x="520" y="385" class="cold"/><text x="710" y="405" class="small" text-anchor="middle">GPTQ-Int4 + Marlin on vLLM : ~712 tok/s</text><rect width="380" height="30" x="520" y="420" class="dsk"/><text x="710" y="440" class="small" text-anchor="middle">AWQ-Int4 + Marlin : ~741 tok/s ; best Pass@1 INT4</text><rect width="380" height="30" x="520" y="455" class="hot"/><text x="710" y="475" class="small" text-anchor="middle">FP8 on H100 : ~2x BF16 throughput</text><rect width="380" height="30" x="520" y="490" class="box"/><text x="710" y="510" class="small" text-anchor="middle">NVFP4 on Blackwell : ~4x BF16 ; reasoning risk</text></svg>